Name: "🏗️ MASTER Build"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}

      # ====================================================
      # STEP 1: BUILD STRUCTURE (6 folders)
      # ====================================================
      - name: Build Structure
        run: |
          set -e
          mkdir -p social_media/facebook social_media/instagram social_media/youtube
          touch social_media/__init__.py
          touch social_media/facebook/__init__.py
          touch social_media/instagram/__init__.py
          touch social_media/youtube/__init__.py

          build_folder() {
            BASE="$1"; TYPE="$2"; EXTRA="$3"
            mkdir -p "$BASE/A_core" "$BASE/B_graphics" "$BASE/C_content"
            mkdir -p "$BASE/D_video" "$BASE/E_audio" "$BASE/F_upload"
            mkdir -p "$BASE/G_entry" "$BASE/H_tests"
            mkdir -p "$BASE/output/temp" "$BASE/output/final"

            touch "$BASE/__init__.py" "$BASE/requirements.txt" "$BASE/env.example"
            touch "$BASE/.gitignore" "$BASE/README.md" "$BASE/Makefile" "$BASE/pyproject.toml"

            touch "$BASE/A_core/__init__.py"
            for f in A1_config A2_logger A3_telegram A4_utils A5_base_pipeline; do
              touch "$BASE/A_core/$f.py"; done

            touch "$BASE/B_graphics/__init__.py"
            for f in B1_fonts B2_text_wrap B3_sparkles B4_progress_bar B5_badge B6_bullets B7_watermark B8_arabesque B9_god_rays B10_star_field B11_ember B12_vignette; do
              touch "$BASE/B_graphics/$f.py"; done

            touch "$BASE/C_content/__init__.py"
            for f in C1_hadith C2_ai_provider C3_translator C4_tts C5_music C6_background C7_logo_processor C8_thumbnail; do
              touch "$BASE/C_content/$f.py"; done
            for f in $EXTRA; do touch "$BASE/C_content/$f.py"; done

            touch "$BASE/D_video/__init__.py"
            for f in D1_intro D2_main_content D3_outro D4_frames D5_transition D6_composer; do
              touch "$BASE/D_video/$f.py"; done

            touch "$BASE/E_audio/__init__.py"
            for f in E1_voice_ducking E2_sfx E3_mastering; do
              touch "$BASE/E_audio/$f.py"; done

            touch "$BASE/F_upload/__init__.py" "$BASE/F_upload/F1_drive.py"
            touch "$BASE/F_upload/F2_upload_${TYPE}.py"

            touch "$BASE/G_entry/__init__.py"
            touch "$BASE/G_entry/G1_${TYPE}_pipeline.py"
            touch "$BASE/G_entry/G2_run_${TYPE}.py"

            touch "$BASE/H_tests/__init__.py"
            for f in H1_conftest H2_test_${TYPE} H3_test_media H4_test_render; do
              touch "$BASE/H_tests/$f.py"; done

            touch "$BASE/output/temp/.gitkeep" "$BASE/output/final/.gitkeep"
          }

          build_folder "social_media/facebook/short_video" "short" "C9_hashtags C10_cover"
          build_folder "social_media/facebook/long_video" "long" "C9_chapters C10_playlist"
          build_folder "social_media/instagram/story_video" "story" "C9_stickers"
          build_folder "social_media/instagram/short_video" "short" "C9_hashtags C10_cover"
          build_folder "social_media/youtube/short_video" "short" "C9_hashtags"
          build_folder "social_media/youtube/long_video" "long" "C9_thumbnail_yt C10_seo C11_playlist C12_chapters"

          echo "Structure built"

      # ====================================================
      # STEP 2: COPY COMPLETE SOURCE CODE & LOGO PHOTO
      # ====================================================
      - name: Copy All Source Files and Logo
        run: |
          set -e
          SRC="social_media/facebook/story_video"

          DESTS="social_media/facebook/short_video social_media/facebook/long_video social_media/instagram/story_video social_media/instagram/short_video social_media/youtube/short_video social_media/youtube/long_video"

          for DST in $DESTS; do
            echo "Copying source code to $DST"

            # Copy all subdirectories and contents
            cp -r "$SRC/A_core/." "$DST/A_core/" 2>/dev/null || true
            cp -r "$SRC/B_graphics/." "$DST/B_graphics/" 2>/dev/null || true
            cp -r "$SRC/C_content/." "$DST/C_content/" 2>/dev/null || true
            cp -r "$SRC/D_video/." "$DST/D_video/" 2>/dev/null || true
            cp -r "$SRC/E_audio/." "$DST/E_audio/" 2>/dev/null || true
            cp -r "$SRC/F_upload/." "$DST/F_upload/" 2>/dev/null || true
            cp -r "$SRC/H_tests/." "$DST/H_tests/" 2>/dev/null || true

            # Copy Root config files if present in source
            for f in requirements.txt .gitignore Makefile env.example README.md pyproject.toml; do
              [ -f "$SRC/$f" ] && cp "$SRC/$f" "$DST/$f" || true
            done

            # Copy logo.png to each main folder and C_content subfolder
            if [ -f "logo.png" ]; then
              cp logo.png "$DST/logo.png"
              cp logo.png "$DST/C_content/logo.png"
            fi
          done

          # Map G_entry scripts
          for pair in "facebook/short_video:short" "facebook/long_video:long" "instagram/story_video:story" "instagram/short_video:short" "youtube/short_video:short" "youtube/long_video:long"; do
            DIR="${pair%%:*}"; TYPE="${pair##*:}"
            [ -f "$SRC/G_entry/G1_story_pipeline.py" ] && cp "$SRC/G_entry/G1_story_pipeline.py" "social_media/$DIR/G_entry/G1_${TYPE}_pipeline.py" || true
            [ -f "$SRC/G_entry/G2_run_story.py" ] && cp "$SRC/G_entry/G2_run_story.py" "social_media/$DIR/G_entry/G2_run_${TYPE}.py" || true
          done

          # Map H2 Test scripts
          for pair in "facebook/short_video:short" "facebook/long_video:long" "instagram/story_video:story" "instagram/short_video:short" "youtube/short_video:short" "youtube/long_video:long"; do
            DIR="${pair%%:*}"; TYPE="${pair##*:}"
            [ -f "$SRC/H_tests/H2_test_story.py" ] && cp "$SRC/H_tests/H2_test_story.py" "social_media/$DIR/H_tests/H2_test_${TYPE}.py" || true
          done

          echo "Source files and logo copied"

      # ====================================================
      # STEP 3: FILL A1_config.py (FB)
      # ====================================================
      - name: Fill FB A1_config
        run: |
          cat > /tmp/a1_fb.txt << 'XEOF'
          import os

          class Config:
              TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
              TG_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")
              META_TOKEN = os.environ.get("FACEBOOK_META_TOKEN", "").strip()
              PAGE_ID = os.environ.get("FACEBOOK_PAGE_ID", "").strip()
              DRIVE_CLIENT_ID = os.environ.get("GOOGLE_DRIVE_CLIENT_ID")
              DRIVE_CLIENT_SECRET = os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET")
              DRIVE_REFRESH_TOKEN = os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN")
              DRIVE_FOLDER_ID = os.environ.get("DRIVE_FOLDER_ID")
              OPENROUTER_API_KEY = os.environ.get("OPENROUTER_API_KEY")
              GROQ_API_KEY = os.environ.get("GROQ_API_KEY")
              GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY")
              MISTRAL_API_KEY = os.environ.get("MISTRAL_API_KEY")
              CEREBRAS_API_KEY = os.environ.get("CEREBRAS_API_KEY")
              COHERE_API_KEY = os.environ.get("COHERE_API_KEY")
              HUGGINGFACE_API_KEY = os.environ.get("HUGGINGFACE_API_KEY")
              ELEVENLABS_API_KEY = os.environ.get("ELEVENLABS_API_KEY")
              DEEPL_API_KEY = os.environ.get("DEEPL_API_KEY")
              PEXELS_API_KEY = os.environ.get("PEXELS_API_KEY")
              PIXABAY_API_KEY = os.environ.get("PIXABAY_API_KEY")
              FREESOUND_API_KEY = os.environ.get("FREESOUND_API_KEY")
              HADITH_API_URL = os.environ.get("HADITH_API_URL")
              EVENT_NAME = os.environ.get("GITHUB_EVENT_NAME", "")
              UPLOAD_TO_SOCIAL = str(os.environ.get("UPLOAD_TO_SOCIAL", "")).lower() == "true"

              @property
              def should_post_social(self):
                  return (self.EVENT_NAME == "schedule") or self.UPLOAD_TO_SOCIAL
          XEOF
          sed 's/^          //' /tmp/a1_fb.txt > social_media/facebook/short_video/A_core/A1_config.py
          cp social_media/facebook/short_video/A_core/A1_config.py social_media/facebook/long_video/A_core/A1_config.py
          echo "FB A1 done"

      # ====================================================
      # STEP 4: FILL A1_config.py (IG)
      # ====================================================
      - name: Fill IG A1_config
        run: |
          cat > /tmp/a1_ig.txt << 'XEOF'
          import os

          class Config:
              TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
              TG_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")
              META_TOKEN = os.environ.get("FACEBOOK_INSTAGRAM_META_TOKEN", "").strip()
              IG_BUSINESS_ID = os.environ.get("INSTAGRAM_BUSINESS_ACCOUNT_ID", "").strip()
              DRIVE_CLIENT_ID = os.environ.get("GOOGLE_DRIVE_CLIENT_ID")
              DRIVE_CLIENT_SECRET = os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET")
              DRIVE_REFRESH_TOKEN = os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN")
              DRIVE_STORY_FOLDER_ID = os.environ.get("GDRIVE_STORY_VIDEO_FOLDER_ID")
              DRIVE_FOLDER_ID = os.environ.get("GDRIVE_SHORT_VIDEO_FOLDER_ID")
              OPENROUTER_API_KEY = os.environ.get("OPENROUTER_API_KEY")
              GROQ_API_KEY = os.environ.get("GROQ_API_KEY")
              GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY")
              MISTRAL_API_KEY = os.environ.get("MISTRAL_API_KEY")
              CEREBRAS_API_KEY = os.environ.get("CEREBRAS_API_KEY")
              COHERE_API_KEY = os.environ.get("COHERE_API_KEY")
              HUGGINGFACE_API_KEY = os.environ.get("HUGGINGFACE_API_KEY")
              ELEVENLABS_API_KEY = os.environ.get("ELEVENLABS_API_KEY")
              DEEPL_API_KEY = os.environ.get("DEEPL_API_KEY")
              PEXELS_API_KEY = os.environ.get("PEXELS_API_KEY")
              PIXABAY_API_KEY = os.environ.get("PIXABAY_API_KEY")
              FREESOUND_API_KEY = os.environ.get("FREESOUND_API_KEY")
              HADITH_API_URL = os.environ.get("HADITH_API_URL")
              EVENT_NAME = os.environ.get("GITHUB_EVENT_NAME", "")
              UPLOAD_TO_SOCIAL = str(os.environ.get("UPLOAD_TO_SOCIAL", "")).lower() == "true"

              @property
              def should_post_social(self):
                  return (self.EVENT_NAME == "schedule") or self.UPLOAD_TO_SOCIAL
          XEOF
          sed 's/^          //' /tmp/a1_ig.txt > social_media/instagram/story_video/A_core/A1_config.py
          cp social_media/instagram/story_video/A_core/A1_config.py social_media/instagram/short_video/A_core/A1_config.py
          echo "IG A1 done"

      # ====================================================
      # STEP 5: FILL A1_config.py (YT)
      # ====================================================
      - name: Fill YT A1_config
        run: |
          cat > /tmp/a1_yt.txt << 'XEOF'
          import os

          class Config:
              TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
              TG_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")
              YT_CLIENT_ID = os.environ.get("YOUTUBE_CLIENT_ID")
              YT_CLIENT_SECRET = os.environ.get("YOUTUBE_CLIENT_SECRET")
              YT_REFRESH_TOKEN = os.environ.get("YOUTUBE_REFRESH_TOKEN")
              YT_PLAYLIST_ID = os.environ.get("DAILY_HADEES_YT_PLAYLIST_ID")
              DRIVE_CLIENT_ID = os.environ.get("GOOGLE_DRIVE_CLIENT_ID")
              DRIVE_CLIENT_SECRET = os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET")
              DRIVE_REFRESH_TOKEN = os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN")
              DRIVE_FOLDER_ID = os.environ.get("GDRIVE_SHORT_VIDEO_FOLDER_ID")
              OPENROUTER_API_KEY = os.environ.get("OPENROUTER_API_KEY")
              GROQ_API_KEY = os.environ.get("GROQ_API_KEY")
              GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY")
              MISTRAL_API_KEY = os.environ.get("MISTRAL_API_KEY")
              CEREBRAS_API_KEY = os.environ.get("CEREBRAS_API_KEY")
              COHERE_API_KEY = os.environ.get("COHERE_API_KEY")
              HUGGINGFACE_API_KEY = os.environ.get("HUGGINGFACE_API_KEY")
              ELEVENLABS_API_KEY = os.environ.get("ELEVENLABS_API_KEY")
              DEEPL_API_KEY = os.environ.get("DEEPL_API_KEY")
              PEXELS_API_KEY = os.environ.get("PEXELS_API_KEY")
              PIXABAY_API_KEY = os.environ.get("PIXABAY_API_KEY")
              FREESOUND_API_KEY = os.environ.get("FREESOUND_API_KEY")
              HADITH_API_URL = os.environ.get("HADITH_API_URL")
              EVENT_NAME = os.environ.get("GITHUB_EVENT_NAME", "")
              UPLOAD_TO_SOCIAL = str(os.environ.get("UPLOAD_TO_SOCIAL", "")).lower() == "true"

              @property
              def should_post_social(self):
                  return (self.EVENT_NAME == "schedule") or self.UPLOAD_TO_SOCIAL
          XEOF
          sed 's/^          //' /tmp/a1_yt.txt > social_media/youtube/short_video/A_core/A1_config.py
          cp social_media/youtube/short_video/A_core/A1_config.py social_media/youtube/long_video/A_core/A1_config.py
          echo "YT A1 done"

      # ====================================================
      # STEP 6: FILL FB UPLOAD
      # ====================================================
      - name: Fill FB Upload
        run: |
          cat > /tmp/fb_up.txt << 'XEOF'
          import os
          from A_core.A2_logger import log_file_start, log_file_end, log_step, log_api


          class ShortUploader:
              def __init__(self, base):
                  log_file_start("F2_upload_short.py", "FB upload")
                  self.base = base
                  log_file_end("F2_upload_short.py", "success", "Ready")

              def upload(self, video_path, caption=""):
                  log_step("F2_upload_short.py", "upload()", "ok")
                  token = os.environ.get("FACEBOOK_META_TOKEN", "").strip()
                  page_id = os.environ.get("FACEBOOK_PAGE_ID", "").strip()
                  if not token or not page_id:
                      log_step("F2_upload_short.py", "Missing creds", "fail")
                      return False
                  try:
                      with open(video_path, "rb") as f:
                          res = self.base.session.post(
                              f"https://graph.facebook.com/v21.0/{page_id}/videos",
                              data={"access_token": token, "description": caption, "published": "true"},
                              files={"source": f}, timeout=400).json()
                      if res.get("id"):
                          self.base.api_status["Facebook"]["Upload"] = "success"
                          log_api("F2_upload_short.py", "FB", "success", res["id"])
                          return True
                      log_api("F2_upload_short.py", "FB", "failed", str(res)[:100])
                      return False
                  except Exception as e:
                      log_api("F2_upload_short.py", "FB", "failed", str(e)[:100])
                      return False
          XEOF
          sed 's/^          //' /tmp/fb_up.txt > social_media/facebook/short_video/F_upload/F2_upload_short.py
          cp social_media/facebook/short_video/F_upload/F2_upload_short.py social_media/facebook/long_video/F_upload/F2_upload_long.py
          echo "FB Upload done"

      # ====================================================
      # STEP 7: FILL IG STORY UPLOAD
      # ====================================================
      - name: Fill IG Story Upload
        run: |
          cat > /tmp/ig_story.txt << 'XEOF'
          import os
          import time
          from A_core.A2_logger import log_file_start, log_file_end, log_step, log_api


          class StoryUploader:
              def __init__(self, base):
                  log_file_start("F2_upload_story.py", "IG Story upload")
                  self.base = base
                  log_file_end("F2_upload_story.py", "success", "Ready")

              def upload(self, video_path):
                  log_step("F2_upload_story.py", "upload()", "ok")
                  token = os.environ.get("FACEBOOK_INSTAGRAM_META_TOKEN", "").strip()
                  ig_id = os.environ.get("INSTAGRAM_BUSINESS_ACCOUNT_ID", "").strip()
                  if not token or not ig_id:
                      log_step("F2_upload_story.py", "Missing creds", "fail")
                      return False
                  try:
                      cont = self.base.session.post(
                          f"https://graph.facebook.com/v21.0/{ig_id}/media",
                          data={"media_type": "STORIES", "upload_type": "resumable", "access_token": token},
                          timeout=40).json()
                      c_id = cont.get("id")
                      if not c_id:
                          log_api("F2_upload_story.py", "IG-Container", "failed")
                          return False
                      upload_url = cont.get("uri") or f"https://rupload.facebook.com/ig-api-upload/v21.0/{c_id}"
                      f_size = os.path.getsize(video_path)
                      with open(video_path, "rb") as f:
                          vbytes = f.read()
                      headers = {"Authorization": f"OAuth {token}", "offset": "0", "file_size": str(f_size), "Content-Type": "application/octet-stream"}
                      self.base.session.post(upload_url, headers=headers, data=vbytes, timeout=180)
                      for _ in range(40):
                          time.sleep(5)
                          st = self.base.session.get(
                              f"https://graph.facebook.com/v21.0/{c_id}",
                              params={"fields": "status_code", "access_token": token}, timeout=15).json()
                          if st.get("status_code") == "FINISHED":
                              pub = self.base.session.post(
                                  f"https://graph.facebook.com/v21.0/{ig_id}/media_publish",
                                  data={"creation_id": c_id, "access_token": token}, timeout=20).json()
                              if pub.get("id"):
                                  self.base.api_status["Instagram Story"]["Upload"] = "success"
                                  log_api("F2_upload_story.py", "IG-Story", "success", pub["id"])
                                  return True
                              break
                          if st.get("status_code") == "ERROR":
                              break
                      log_api("F2_upload_story.py", "IG-Story", "failed")
                      return False
                  except Exception as e:
                      log_api("F2_upload_story.py", "IG-Story", "failed", str(e)[:100])
                      return False
          XEOF
          sed 's/^          //' /tmp/ig_story.txt > social_media/instagram/story_video/F_upload/F2_upload_story.py
          echo "IG Story Upload done"
