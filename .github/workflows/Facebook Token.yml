# ============================================================
# 📄 FILE:      test_facebook_token.yml
# 📁 PATH:      .github/workflows/test_facebook_token.yml
# 🎯 PURPOSE:   Test Facebook token — check all permissions
# ⚡ TRIGGER:   Manual only (workflow_dispatch)
# ============================================================

name: "🔍 Test Facebook Token"


# ─────────────────────────────────────────────────────────────
# ① TRIGGER — Manual only
# ─────────────────────────────────────────────────────────────
on:
  workflow_dispatch:


# ─────────────────────────────────────────────────────────────
# ② PERMISSIONS
# ─────────────────────────────────────────────────────────────
permissions:
  contents: read


# ─────────────────────────────────────────────────────────────
# ③ JOBS
# ─────────────────────────────────────────────────────────────
jobs:
  test-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ───────── Step 1: Checkout ─────────
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ───────── Step 2: Install Python ─────────
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ───────── Step 3: Install requests ─────────
      - name: 📚 Install Requests
        run: pip install requests

      # ───────── Step 4: Run token test ─────────
      - name: 🔍 Test Token
        env:
          FACEBOOK_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import os
          import requests
          import json

          session = requests.Session()

          # ────────────────────────────────────────────
          # CREDENTIALS
          # ────────────────────────────────────────────
          TOKEN = os.environ.get("FACEBOOK_META_TOKEN", "").strip()
          PAGE_ID = os.environ.get("FACEBOOK_PAGE_ID", "").strip()
          TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          TG_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")

          # ────────────────────────────────────────────
          # TELEGRAM SENDER
          # ────────────────────────────────────────────
          def send_tg(msg):
              if TG_TOKEN and TG_CHAT_ID:
                  try:
                      session.post(
                          f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                          json={
                              "chat_id": TG_CHAT_ID,
                              "text": msg[:4000],
                              "parse_mode": "HTML",
                              "disable_web_page_preview": True,
                          },
                          timeout=15)
                  except Exception:
                      pass
              print(msg)

          send_tg("🔍 <b>FACEBOOK TOKEN TEST STARTED</b>")

          # ────────────────────────────────────────────
          # BASIC CHECKS
          # ────────────────────────────────────────────
          if not TOKEN:
              send_tg("❌ <b>FACEBOOK_META_TOKEN missing</b>")
              exit(1)

          if not PAGE_ID:
              send_tg("⚠️ <b>FACEBOOK_PAGE_ID missing</b> — testing /me only")

          results = []

          # ════════════════════════════════════════════
          # TEST 1: Token Info
          # ════════════════════════════════════════════
          try:
              r = session.get(
                  "https://graph.facebook.com/v21.0/me",
                  params={"access_token": TOKEN},
                  timeout=15).json()

              if r.get("error"):
                  results.append(f"❌ <b>Test 1 — Token Info</b>\n<code>{str(r['error'])[:200]}</code>")
              else:
                  results.append(
                      f"✅ <b>Test 1 — Token Info</b>\n"
                      f"├─ Name: {r.get('name', '?')}\n"
                      f"├─ ID: {r.get('id', '?')}\n"
                      f"└─ Type: User/Page Token OK")
          except Exception as e:
              results.append(f"❌ <b>Test 1</b>: <code>{str(e)[:150]}</code>")

          # ════════════════════════════════════════════
          # TEST 2: Page Info
          # ════════════════════════════════════════════
          if PAGE_ID:
              try:
                  r = session.get(
                      f"https://graph.facebook.com/v21.0/{PAGE_ID}",
                      params={"fields": "name,id,category,access_token", "access_token": TOKEN},
                      timeout=15).json()

                  if r.get("error"):
                      results.append(f"❌ <b>Test 2 — Page Info</b>\n<code>{str(r['error'])[:200]}</code>")
                  else:
                      page_token = r.get("access_token", "")
                      has_page_token = "✅ YES" if page_token else "❌ NO"
                      results.append(
                          f"✅ <b>Test 2 — Page Info</b>\n"
                          f"├─ Name: {r.get('name', '?')}\n"
                          f"├─ ID: {r.get('id', '?')}\n"
                          f"├─ Category: {r.get('category', '?')}\n"
                          f"└─ Page Token available: {has_page_token}")
              except Exception as e:
                  results.append(f"❌ <b>Test 2</b>: <code>{str(e)[:150]}</code>")

          # ════════════════════════════════════════════
          # TEST 3: Permissions (/me/permissions)
          # ════════════════════════════════════════════
          try:
              r = session.get(
                  "https://graph.facebook.com/v21.0/me/permissions",
                  params={"access_token": TOKEN},
                  timeout=15).json()

              if r.get("error"):
                  results.append(f"❌ <b>Test 3 — Permissions</b>\n<code>{str(r['error'])[:200]}</code>")
              else:
                  perms = r.get("data", [])
                  granted = [p["permission"] for p in perms if p.get("status") == "granted"]
                  declined = [p["permission"] for p in perms if p.get("status") == "declined"]

                  # Check critical permissions
                  CRITICAL = [
                      "pages_manage_posts",
                      "pages_read_engagement",
                      "pages_show_list",
                      "publish_video",
                      "pages_manage_engagement",
                      "pages_read_user_content",
                  ]

                  perm_lines = [f"✅ <b>Test 3 — Permissions</b>"]
                  perm_lines.append(f"├─ Granted: {len(granted)}")
                  perm_lines.append(f"├─ Declined: {len(declined)}")
                  perm_lines.append(f"└─ <b>Critical check:</b>")
                  for cp in CRITICAL:
                      icon = "✅" if cp in granted else "❌"
                      perm_lines.append(f"    {icon} {cp}")

                  results.append("\n".join(perm_lines))
          except Exception as e:
              results.append(f"❌ <b>Test 3</b>: <code>{str(e)[:150]}</code>")

          # ════════════════════════════════════════════
          # TEST 4: me/accounts (Page list)
          # ════════════════════════════════════════════
          try:
              r = session.get(
                  "https://graph.facebook.com/v21.0/me/accounts",
                  params={"access_token": TOKEN, "limit": 5},
                  timeout=15).json()

              if r.get("error"):
                  results.append(f"❌ <b>Test 4 — me/accounts</b>\n<code>{str(r['error'])[:200]}</code>")
              else:
                  pages = r.get("data", [])
                  if pages:
                      page_names = [f"  • {p.get('name', '?')} ({p.get('id', '?')})" for p in pages[:3]]
                      results.append(
                          f"✅ <b>Test 4 — me/accounts</b>\n"
                          f"├─ Total pages: {len(pages)}\n"
                          + "\n".join(page_names))
                  else:
                      results.append(f"⚠️ <b>Test 4 — me/accounts</b>: No pages found")
          except Exception as e:
              results.append(f"❌ <b>Test 4</b>: <code>{str(e)[:150]}</code>")

          # ════════════════════════════════════════════
          # TEST 5: Debug Token (Token Type + Scopes)
          # ════════════════════════════════════════════
          try:
              r = session.get(
                  "https://graph.facebook.com/debug_token",
                  params={"input_token": TOKEN, "access_token": TOKEN},
                  timeout=15).json()

              if r.get("error"):
                  results.append(f"⚠️ <b>Test 5 — Debug Token</b>: <code>{str(r['error'])[:150]}</code>")
              else:
                  data = r.get("data", {})
                  token_type = data.get("type", "?")
                  app_id = data.get("app_id", "?")
                  is_valid = data.get("is_valid", False)
                  expires = data.get("expires_at", 0)
                  scopes = data.get("scopes", [])

                  # Expires check
                  if expires == 0:
                      exp_str = "Never (permanent)"
                  else:
                      import datetime
                      try:
                          exp_str = datetime.datetime.fromtimestamp(expires).strftime("%Y-%m-%d %H:%M")
                      except Exception:
                          exp_str = str(expires)

                  results.append(
                      f"✅ <b>Test 5 — Debug Token</b>\n"
                      f"├─ Type: <b>{token_type}</b>\n"
                      f"├─ App ID: {app_id}\n"
                      f"├─ Valid: {is_valid}\n"
                      f"├─ Expires: {exp_str}\n"
                      f"├─ Scopes count: {len(scopes)}\n"
                      f"└─ <b>Scopes:</b>\n" +
                      "\n".join([f"    • {s}" for s in scopes[:15]]) +
                      (f"\n    ... +{len(scopes)-15} more" if len(scopes) > 15 else ""))
          except Exception as e:
              results.append(f"⚠️ <b>Test 5</b>: <code>{str(e)[:150]}</code>")

          # ════════════════════════════════════════════
          # TEST 6: Try Video Publish (dry-run)
          # ════════════════════════════════════════════
          if PAGE_ID:
              try:
                  # Test: try to create a video container (without uploading bytes)
                  r = session.post(
                      f"https://graph.facebook.com/v21.0/{PAGE_ID}/videos",
                      data={
                          "access_token": TOKEN,
                          "description": "Permission test — DO NOT PUBLISH",
                          "published": "false",
                      },
                      files={"source": ("test.mp4", b"fake_video_data", "video/mp4")},
                      timeout=15).json()

                  if r.get("error"):
                      err = r["error"]
                      results.append(
                          f"⚠️ <b>Test 6 — Video Publish</b>\n"
                          f"├─ Code: {err.get('code', '?')}\n"
                          f"├─ Subcode: {err.get('error_subcode', '?')}\n"
                          f"└─ Message: <code>{err.get('message', '?')[:120]}</code>")
                  else:
                      vid = r.get("id", "?")
                      results.append(f"✅ <b>Test 6 — Video Publish</b>: Allowed (Video ID: {vid})")
                      # Cleanup: delete the test video
                      try:
                          session.delete(
                              f"https://graph.facebook.com/v21.0/{vid}",
                              params={"access_token": TOKEN},
                              timeout=10)
                      except Exception:
                          pass
              except Exception as e:
                  results.append(f"⚠️ <b>Test 6</b>: <code>{str(e)[:150]}</code>")

          # ════════════════════════════════════════════
          # SEND RESULTS
          # ════════════════════════════════════════════
          full_report = "🔍 <b>FACEBOOK TOKEN TEST REPORT</b>\n\n" + "\n\n".join(results)

          # Split into chunks
          chunks = []
          current = ""
          for line in full_report.split("\n"):
              if len(current) + len(line) + 1 > 3800:
                  chunks.append(current)
                  current = line
              else:
                  current += ("\n" if current else "") + line
          if current:
              chunks.append(current)

          for i, chunk in enumerate(chunks, 1):
              prefix = f"📄 <b>Report {i}/{len(chunks)}</b>\n" if len(chunks) > 1 else ""
              send_tg(prefix + chunk)

          send_tg("✅ <b>Facebook Token Test Complete</b>")
          PYEOF
