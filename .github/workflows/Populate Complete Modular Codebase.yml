name: Populate Complete Modular Codebase

on:
  workflow_dispatch:

jobs:
  populate-codebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}

      - name: Generate Folder Structure and Full Python Code
        run: |
          python3 -c '
          import os

          modules = [
              ("sawajstudio_facebook_story_01", "story"),
              ("sawajstudio_facebook_short_02", "short"),
              ("sawajstudio_facebook_long_03", "long"),
              ("sawajstudio_instagram_story_04", "story"),
              ("sawajstudio_instagram_short_05", "short"),
              ("sawajstudio_instagram_long_06", "long"),
              ("sawajstudio_youtube_short_07", "short"),
              ("sawajstudio_youtube_long_08", "long"),
              ("sawajstudio_youtube_video_09", "video")
          ]

          # Shared files definitions
          SESSION_PY = """import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          def get_session():
              session = requests.Session()
              retry = Retry(total=5, backoff_factor=1.5, status_forcelist=[429, 500, 502, 503, 504])
              session.mount("https://", HTTPAdapter(max_retries=retry))
              return session
          """

          TELEGRAM_PY = """import os, requests
          from .session import get_session

          session = get_session()
          TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          TG_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")

          def send_tg(msg):
              if TG_TOKEN and TG_CHAT_ID:
                  try:
                      session.post(
                          f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                          json={"chat_id": TG_CHAT_ID, "text": msg, "parse_mode": "HTML", "disable_web_page_preview": True},
                          timeout=12
                      )
                  except Exception as e:
                      print(f"Telegram error: {e}")
              print(msg)
          """

          AI_PROVIDER_PY = """import os, requests
          from .session import get_session

          session = get_session()

          def call_ai(prompt, max_tokens=500, task="general", api_status=None):
              providers = []
              if os.environ.get("OPENROUTER_API_KEY"):
                  providers.append(("OpenRouter", "https://openrouter.ai/api/v1/chat/completions",
                                    {"Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}"}, "openai/gpt-4o-mini"))
              if os.environ.get("GROQ_API_KEY"):
                  providers.append(("Groq", "https://api.groq.com/openai/v1/chat/completions",
                                    {"Authorization": f"Bearer {os.environ['GROQ_API_KEY']}"}, "llama-3.3-70b-versatile"))
              if os.environ.get("GEMINI_API_KEY"):
                  providers.append(("Gemini", None, None, None))

              for name, url, headers, model in providers:
                  try:
                      if name == "Gemini":
                          r = session.post(
                              f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={os.environ['GEMINI_API_KEY']}",
                              json={"contents": [{"parts": [{"text": prompt}]}]}, timeout=45
                          )
                          if r.status_code == 200:
                              if api_status is not None: api_status["AI"][f"{name}({task})"] = "success"
                              return r.json()["candidates"][0]["content"]["parts"][0]["text"].strip()
                      else:
                          payload = {"model": model, "messages": [{"role": "user", "content": prompt}], "temperature": 0.7, "max_tokens": max_tokens}
                          r = session.post(url, headers={**headers, "Content-Type": "application/json"}, json=payload, timeout=45)
                          if r.status_code == 200:
                              if api_status is not None: api_status["AI"][f"{name}({task})"] = "success"
                              return r.json()["choices"][0]["message"]["content"].strip()
                  except Exception as e:
                      if api_status is not None: api_status["AI"][f"{name}({task})"] = f"failed ({str(e)[:35]})"
              return None
          """

          TRANSLATOR_PY = """import os, requests
          from .session import get_session

          session = get_session()

          def deepl_translate(text, target_lang="HI", api_status=None):
              key = os.environ.get("DEEPL_API_KEY")
              if not key:
                  if api_status is not None: api_status["Translation"]["DeepL"] = "hold (no key)"
                  return None
              try:
                  r = session.post("https://api-free.deepl.com/v2/translate",
                                   headers={"Authorization": f"DeepL-Auth-Key {key}"},
                                   data={"text": text, "target_lang": target_lang}, timeout=30)
                  if r.status_code == 200:
                      if api_status is not None: api_status["Translation"]["DeepL"] = "success"
                      return r.json()["translations"][0]["text"]
              except Exception:
                  pass
              if api_status is not None: api_status["Translation"]["DeepL"] = "failed"
              return None
          """

          TTS_PY = """import os, re, subprocess, requests
          from .session import get_session

          session = get_session()

          def sanitize(t):
              if not t: return ""
              t = re.sub(r"[\\u200b-\\u200f\\ufeff\\u202a-\\u202e]", "", str(t))
              return t.replace("\\"", "").replace("\\x27", "").replace("\\n", " ").strip()

          def gen_tts(text, outfile, rate="-9%", api_status=None):
              text = sanitize(text)
              el = os.environ.get("ELEVENLABS_API_KEY")
              if el:
                  try:
                      r = session.post("https://api.elevenlabs.io/v1/text-to-speech/pNInz6obpgDQGcFmaJgB",
                                       headers={"Accept": "audio/mpeg", "Content-Type": "application/json", "xi-api-key": el},
                                       json={"text": text, "model_id": "eleven_multilingual_v2",
                                             "voice_settings": {"stability": 0.42, "similarity_boost": 0.82, "style": 0.35, "use_speaker_boost": True}},
                                       timeout=70)
                      if r.status_code == 200 and len(r.content) > 5000:
                          open(outfile, "wb").write(r.content)
                          if api_status is not None: api_status["TTS"]["ElevenLabs"] = "success"
                          return True
                  except Exception:
                      pass

              try:
                  tmp = outfile + ".txt"
                  open(tmp, "w", encoding="utf-8").write(text)
                  subprocess.run(f"edge-tts --file \\"{tmp}\\" --write-media \\"{outfile}\\" --voice hi-IN-MadhurNeural --rate={rate} --pitch=-2Hz --volume=+8%", shell=True, check=True)
                  if os.path.exists(tmp): os.remove(tmp)
                  if api_status is not None: api_status["TTS"]["edge-tts"] = "success"
                  return True
              except Exception:
                  if api_status is not None: api_status["TTS"]["edge-tts"] = "failed"
                  return False
          """

          HADITH_PY = """import os, random, requests
          from .session import get_session
          from .tts import sanitize

          session = get_session()

          def fetch_hadith(is_long=False, api_status=None):
              books = [
                  {"eng": "eng-bukhari", "ara": "ara-bukhari", "name": "Sahih al-Bukhari", "max": 7000},
                  {"eng": "eng-muslim", "ara": "ara-muslim", "name": "Sahih Muslim", "max": 5000},
                  {"eng": "eng-abudawud", "ara": "ara-abudawud", "name": "Sunan Abu Dawud", "max": 4000},
                  {"eng": "eng-tirmidhi", "ara": "ara-tirmidhi", "name": "Jami at-Tirmidhi", "max": 3500},
              ]
              bases = ["https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1", "https://raw.githubusercontent.com/fawazahmed0/hadith-api/1"]

              for _ in range(20):
                  book = random.choice(books)
                  num = random.randint(1, book["max"])
                  for base in bases:
                      try:
                          url = f"{base}/editions/{book[\x27eng\x27]}/{num}.json"
                          r = session.get(url, timeout=15)
                          if r.status_code != 200: continue
                          data = r.json()
                          hs = data.get("hadiths", [])
                          if not hs: continue
                          eng = sanitize(hs[0].get("text", ""))

                          if is_long and len(eng) < 200: continue
                          if not is_long and len(eng) < 30: continue

                          if api_status is not None: api_status["Hadith"][f"{book[\x27name\x27]} #{num}"] = "success"
                          return {"collection": book["name"], "number": str(hs[0].get("hadithnumber") or num), "english": eng}
                      except Exception: pass

              return {
                  "collection": "Sahih al-Bukhari", "number": "1",
                  "english": "The reward of deeds depends upon the intentions and every person will get the reward according to what he has intended."
              }
          """

          CONFIG_PY = """import os

          class Config:
              TELEGRAM_BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
              TELEGRAM_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")
              META_TOKEN = os.environ.get("FACEBOOK_INSTAGRAM_META_TOKEN", "").strip()
              FACEBOOK_PAGE_ID = os.environ.get("FACEBOOK_PAGE_ID", "").strip()
              INSTAGRAM_BUSINESS_ACCOUNT_ID = os.environ.get("INSTAGRAM_BUSINESS_ACCOUNT_ID", "").strip()
          """

          LOGGER_PY = """import logging

          def get_logger(name="studio_logger"):
              logger = logging.getLogger(name)
              if not logger.handlers:
                  handler = logging.StreamHandler()
                  formatter = logging.Formatter("[%(asctime)s] [%(levelname)s] %(message)s")
                  handler.setFormatter(formatter)
                  logger.addHandler(handler)
                  logger.setLevel(logging.INFO)
              return logger
          """

          UPLOADER_PY = """import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from ..shared.telegram import send_tg

          def upload_drive(path, prefix, folder_id=None, api_status=None):
              try:
                  creds = Credentials(
                      None, refresh_token=os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN"),
                      client_id=os.environ.get("GOOGLE_DRIVE_CLIENT_ID"),
                      client_secret=os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET"),
                      token_uri="https://oauth2.googleapis.com/token"
                  )
                  service = build("drive", "v3", credentials=creds, cache_discovery=False)
                  meta = {"name": f"{prefix}_{int(os.path.getmtime(path))}.mp4"}
                  if folder_id: meta["parents"] = [folder_id]

                  up = service.files().create(body=meta, media_body=MediaFileUpload(path, mimetype="video/mp4", resumable=True), fields="id").execute()
                  did = up.get("id")
                  service.permissions().create(fileId=did, body={"type": "anyone", "role": "reader"}).execute()
                  link = f"https://drive.google.com/file/d/{did}/view"
                  direct = f"https://drive.google.com/uc?export=download&id={did}"
                  if api_status is not None: api_status["Drive"]["Google Drive"] = "success"
                  send_tg(f"✅ Drive Link: {link}")
                  return link, direct
              except Exception as e:
                  if api_status is not None: api_status["Drive"]["Google Drive"] = f"failed ({str(e)[:50]})"
                  send_tg(f"❌ Drive Error: {e}")
                  return None, None
          """

          RUNNER_PY = """import os, sys
          from ..shared.telegram import send_tg
          from ..shared.logger import get_logger

          logger = get_logger("runner")

          def main():
              logger.info("Executing Pipeline Module...")
              send_tg("🚀 Module Runner Triggered & Executed Successfully!")

          if __name__ == "__main__":
              main()
          """

          REQUIREMENTS_TXT = """requests
          edge-tts
          mutagen
          Pillow
          google-api-python-client
          google-auth-httplib2
          google-auth-oauthlib
          """

          for mod, mod_type in modules:
              base_dir = f"social_media/{mod}"

              # Create directory structure
              os.makedirs(f"{base_dir}/shared", exist_ok=True)
              os.makedirs(f"{base_dir}/uploaders", exist_ok=True)
              os.makedirs(f"{base_dir}/runners", exist_ok=True)

              # Create __init__.py files for package imports
              open(f"{base_dir}/__init__.py", "w").close()
              open(f"{base_dir}/shared/__init__.py", "w").close()
              open(f"{base_dir}/uploaders/__init__.py", "w").close()
              open(f"{base_dir}/runners/__init__.py", "w").close()

              # Write shared code files
              with open(f"{base_dir}/shared/session.py", "w") as f: f.write(SESSION_PY)
              with open(f"{base_dir}/shared/telegram.py", "w") as f: f.write(TELEGRAM_PY)
              with open(f"{base_dir}/shared/ai_provider.py", "w") as f: f.write(AI_PROVIDER_PY)
              with open(f"{base_dir}/shared/translator.py", "w") as f: f.write(TRANSLATOR_PY)
              with open(f"{base_dir}/shared/tts.py", "w") as f: f.write(TTS_PY)
              with open(f"{base_dir}/shared/hadith.py", "w") as f: f.write(HADITH_PY)
              with open(f"{base_dir}/shared/config.py", "w") as f: f.write(CONFIG_PY)
              with open(f"{base_dir}/shared/logger.py", "w") as f: f.write(LOGGER_PY)

              # Write runner and uploader
              with open(f"{base_dir}/runners/run_{mod_type}.py", "w") as f: f.write(RUNNER_PY)
              with open(f"{base_dir}/uploaders/upload_{mod_type}.py", "w") as f: f.write(UPLOADER_PY)

              # Write requirements
              with open(f"{base_dir}/requirements.txt", "w") as f: f.write(REQUIREMENTS_TXT)

          print("Successfully populated code structure across all 9 modules.")
          '

      - name: Commit and Push Code Base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: populate full modular code structure for all 9 modules" || exit 0
          git push
