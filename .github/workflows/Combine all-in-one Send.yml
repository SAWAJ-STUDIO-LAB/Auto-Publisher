Name: Combine all-in-one Send

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  bundle-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Combine All .py Files into Single File
        run: |
          python -c '
          import os

          output_file = "all_code_combined.py"

          with open(output_file, "w", encoding="utf-8") as outfile:
              outfile.write("# ==============================================\n")
              outfile.write("# CONSOLIDATED SINGLE PYTHON FILE\n")
              outfile.write("# ALL REPOSITORY .PY FILES COMBINED TOGETHER\n")
              outfile.write("# ==============================================\n\n")

              py_files = []
              for root, dirs, files in os.walk("."):
                  # Ignore hidden folders like .git, .github, __pycache__, etc.
                  dirs[:] = [d for d in dirs if not d.startswith(".")]
                  for file in sorted(files):
                      if file.endswith(".py") and file != output_file:
                          py_files.append(os.path.join(root, file))

              py_files.sort()

              for filepath in py_files:
                  relative_path = os.path.relpath(filepath, ".")
                  outfile.write(f"\n# " + "="*70 + "\n")
                  outfile.write(f"# ORIGINAL FILE: {relative_path}\n")
                  outfile.write(f"# " + "="*70 + "\n\n")
                  try:
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as infile:
                          outfile.write(infile.read())
                          outfile.write("\n\n")
                  except Exception as e:
                      outfile.write(f"# Error reading file {relative_path}: {e}\n\n")

          print(f"Successfully combined {len(py_files)} Python files into {output_file}")
          '

      - name: Send Combined File to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Error: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is missing!"
            exit 1
          fi

          curl -s -F chat_id="$TELEGRAM_CHAT_ID" \
               -F document=@all_code_combined.py \
               -F caption="📦 All Python files combined into a single file" \
               https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument
