# ═══════════════════════════════════════════════════════════════════════════
# 🔵 FACEBOOK STORY AUTOMATION — PRODUCTION READY (Single File)
# ═══════════════════════════════════════════════════════════════════════════
# ✅ Fully self-contained
# ✅ Vertical 3-line stack (no box / no chakor)
# ✅ Smart caching (FFmpeg, fonts, Piper, Python packages)
# ✅ Multi-AI fallback + robust TTS chain
# ✅ Clean, readable, production-grade
# ═══════════════════════════════════════════════════════════════════════════

name: "🔵 FACEBOOK STORY"

on:
  workflow_dispatch:
    inputs:
      upload_to_social:
        description: 'Upload to Facebook Story?'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '30 23 * * *'   # 11:30 PM UTC daily

permissions:
  contents: read
  actions: write

concurrency:
  group: facebook-story
  cancel-in-progress: false

jobs:
  fb-story:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CACHE_VERSION: v10
      DEPS_DIR: ${{ github.workspace }}/.dependencies

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────
      # 2. RESTORE MASTER CACHE
      # ─────────────────────────────────────────────────────────────────────
      - name: 🗂️ Restore Master Cache
        id: master-cache
        uses: actions/cache@v4
        with:
          path: |
            .dependencies
            \~/.cache/pip
            \~/.local/share/piper
          key: \( {{ runner.os }}-fb-story-master- \){{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements.txt') || 'default' }}
          restore-keys: |
            \( {{ runner.os }}-fb-story-master- \){{ env.CACHE_VERSION }}-
            ${{ runner.os }}-fb-story-master-

      # ─────────────────────────────────────────────────────────────────────
      # 3. PREPARE FOLDERS
      # ─────────────────────────────────────────────────────────────────────
      - name: 📁 Prepare Dependencies Folder
        run: |
          mkdir -p "$DEPS_DIR"/{bin,fonts,models,system-fonts,python-venv,piper,logs}
          echo "DEPS_DIR=$DEPS_DIR" >> $GITHUB_ENV
          echo "✅ Deps folder ready: $DEPS_DIR"

      # ─────────────────────────────────────────────────────────────────────
      # 4. PYTHON SETUP
      # ─────────────────────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ─────────────────────────────────────────────────────────────────────
      # 5. FFmpeg + SoX + espeak-ng + System Fonts
      # ─────────────────────────────────────────────────────────────────────
      - name: 🎬 FFmpeg + System Tools (Cache-Aware)
        run: |
          MARKER="$DEPS_DIR/.ffmpeg_ok"
          if [ -f "$MARKER" ] && [ -f "$DEPS_DIR/bin/ffmpeg" ] && [ -f "$DEPS_DIR/bin/ffprobe" ] && [ -f "$DEPS_DIR/bin/sox" ]; then
            echo "⚡ FFmpeg + SoX CACHED"
            sudo mkdir -p /usr/local/bin
            sudo cp "$DEPS_DIR/bin/ffmpeg" /usr/local/bin/ffmpeg
            sudo cp "$DEPS_DIR/bin/ffprobe" /usr/local/bin/ffprobe
            sudo cp "$DEPS_DIR/bin/sox" /usr/local/bin/sox
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe /usr/local/bin/sox
            if [ -d "$DEPS_DIR/system-fonts/truetype" ]; then
              sudo cp -r "$DEPS_DIR/system-fonts/truetype/"* /usr/share/fonts/truetype/ 2>/dev/null || true
              sudo fc-cache -f > /dev/null 2>&1 || true
            fi
            if [ -f "$DEPS_DIR/bin/espeak-ng" ]; then
              sudo cp "$DEPS_DIR/bin/espeak-ng" /usr/local/bin/espeak-ng
              sudo chmod +x /usr/local/bin/espeak-ng
            fi
          else
            echo "📥 Installing FFmpeg + SoX + espeak-ng + fonts"
            sudo apt-get update -q
            sudo apt-get install -y -q ffmpeg sox espeak-ng libsox-fmt-all \
              fonts-noto fonts-noto-core fonts-noto-extra \
              fonts-noto-ui-core fonts-noto-color-emoji fonts-dejavu-core fontconfig
            cp "$(which ffmpeg)" "$DEPS_DIR/bin/ffmpeg"
            cp "$(which ffprobe)" "$DEPS_DIR/bin/ffprobe"
            cp "$(which sox)" "$DEPS_DIR/bin/sox"
            cp "$(which espeak-ng)" "$DEPS_DIR/bin/espeak-ng" || true
            mkdir -p "$DEPS_DIR/system-fonts/truetype"
            cp -r /usr/share/fonts/truetype/* "$DEPS_DIR/system-fonts/truetype/" 2>/dev/null || true
            touch "$MARKER"
          fi
          ffmpeg -version | head -1
          sox --version

      # ─────────────────────────────────────────────────────────────────────
      # 6. CUSTOM FONTS
      # ─────────────────────────────────────────────────────────────────────
      - name: 🔤 Custom Fonts (Cache-Aware)
        run: |
          if [ -f "\( DEPS_DIR/.fonts_ok" ] && [ " \)(ls -A $DEPS_DIR/fonts 2>/dev/null | wc -l)" -ge 6 ]; then
            echo "⚡ Custom fonts CACHED"
          else
            echo "📥 Downloading custom fonts"
            mkdir -p "$DEPS_DIR/fonts"
            declare -A FONTS=(
              ["NotoSans-Regular.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf"
              ["NotoSans-Bold.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf"
              ["NotoSansDevanagari-Regular.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf"
              ["NotoSansDevanagari-Bold.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf"
              ["NotoNaskhArabic-Regular.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf"
              ["NotoNaskhArabic-Bold.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf"
            )
            for name in "${!FONTS[@]}"; do
              wget -q --timeout=30 "${FONTS[$name]}" -O "$DEPS_DIR/fonts/$name" || true
            done
            touch "$DEPS_DIR/.fonts_ok"
          fi
          mkdir -p \~/.fonts
          cp "$DEPS_DIR/fonts/"*.ttf \~/.fonts/ 2>/dev/null || true
          fc-cache -f > /dev/null 2>&1 || true

      # ─────────────────────────────────────────────────────────────────────
      # 7. PYTHON PACKAGES
      # ─────────────────────────────────────────────────────────────────────
      - name: 🐍 Python Packages (Cache-Aware)
        run: |
          VENV="$DEPS_DIR/python-venv"
          if [ -f "$VENV/.installed" ] && "$VENV/bin/python" -c "import edge_tts, PIL, mutagen" 2>/dev/null; then
            echo "⚡ Python packages CACHED"
          else
            echo "📥 Installing Python packages"
            rm -rf "$VENV"
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --upgrade pip --quiet
            "$VENV/bin/pip" install --no-cache-dir \
              requests edge-tts mutagen Pillow \
              google-api-python-client google-auth-httplib2 google-auth-oauthlib
            touch "$VENV/.installed"
          fi
          echo "$VENV/bin" >> $GITHUB_PATH

      # ─────────────────────────────────────────────────────────────────────
      # 8. PIPER MODELS
      # ─────────────────────────────────────────────────────────────────────
      - name: 🎙️ Piper Models (Cache-Aware)
        run: |
          P="$DEPS_DIR/piper"
          if [ -f "$P/.installed" ] && [ -f "$P/hi_IN-pratham-medium.onnx" ]; then
            echo "⚡ Piper models CACHED"
          else
            echo "📥 Downloading Piper models"
            rm -rf "$P" && mkdir -p "$P"
            cd "$P"
            BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main"
            wget -q --timeout=90 "$BASE/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx"      -O hi_IN-pratham-medium.onnx || true
            wget -q --timeout=90 "$BASE/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx.json" -O hi_IN-pratham-medium.onnx.json || true
            wget -q --timeout=90 "$BASE/hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium.onnx"      -O hi_IN-priyamvada-medium.onnx || true
            wget -q --timeout=90 "$BASE/hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium.onnx.json" -O hi_IN-priyamvada-medium.onnx.json || true
            touch "$P/.installed"
            cd "$GITHUB_WORKSPACE"
          fi
          echo "PIPER_DIR=$P" >> $GITHUB_ENV

      # ─────────────────────────────────────────────────────────────────────
      # 9. TOOL HEALTH CHECK
      # ─────────────────────────────────────────────────────────────────────
      - name: 🔍 Master Tool Health Check
        id: health
        run: |
          REPORT_FILE="$DEPS_DIR/tools_status.json"
          echo "{" > "$REPORT_FILE"
          echo "  \"checked_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"," >> "$REPORT_FILE"
          echo "  \"tools\": {" >> "$REPORT_FILE"
          FIRST=1
          add_entry() {
            local name="$1"; local status="$2"; local detail="$3"
            if [ $FIRST -eq 0 ]; then echo "," >> "$REPORT_FILE"; fi
            FIRST=0
            printf '    "%s": {"status": "%s", "detail": "%s"}' "$name" "$status" "$detail" >> "$REPORT_FILE"
          }
          if command -v ffmpeg >/dev/null 2>&1; then add_entry "ffmpeg" "ok" "present"; else add_entry "ffmpeg" "fail" "missing"; fi
          if command -v sox >/dev/null 2>&1; then add_entry "sox" "ok" "present"; else add_entry "sox" "fail" "missing"; fi
          if command -v espeak-ng >/dev/null 2>&1; then add_entry "espeak-ng" "ok" "present"; else add_entry "espeak-ng" "fail" "missing"; fi
          if command -v edge-tts >/dev/null 2>&1; then add_entry "edge-tts" "ok" "present"; else add_entry "edge-tts" "fail" "missing"; fi
          FC=$(ls "$DEPS_DIR/fonts" 2>/dev/null | wc -l)
          add_entry "custom-fonts" "ok" "$FC files"
          echo "  }" >> "$REPORT_FILE"
          echo "}" >> "$REPORT_FILE"
          echo "TOOLS_STATUS_FILE=$REPORT_FILE" >> $GITHUB_ENV
          cat "$REPORT_FILE"

      # ─────────────────────────────────────────────────────────────────────
      # 10. CREATE PYTHON SCRIPT
      # ─────────────────────────────────────────────────────────────────────
      - name: 📝 Create Python Script
        run: |
          mkdir -p "scripts"
          cat > "scripts/story_video.py" << 'PYEOF'
          #!/usr/bin/env python3
          # ═══════════════════════════════════════════════════════════════
          # ISLAMIC HADITH STORY — VERTICAL 3-LINE STACK (FINAL)
          # ═══════════════════════════════════════════════════════════════
          import os, re, time, random, subprocess, requests, shutil, sys, json, math, traceback
          from datetime import datetime
          from mutagen.mp3 import MP3
          from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageEnhance
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          # ─── Session with retry ───
          session = requests.Session()
          session.mount("https://", HTTPAdapter(max_retries=Retry(
              total=5, backoff_factor=1.5,
              status_forcelist=[429, 500, 502, 503, 504])))

          # ─── Environment ───
          TG_TOKEN     = os.environ.get("TELEGRAM_BOT_TOKEN")
          TG_CHAT_ID   = os.environ.get("TELEGRAM_CHAT_ID")
          META_TOKEN   = os.environ.get("FACEBOOK_INSTAGRAM_META_TOKEN", "").strip()
          DEPS_DIR     = os.environ.get("DEPS_DIR", os.path.expanduser("\~/.dependencies"))
          PIPER_DIR    = os.environ.get("PIPER_DIR", os.path.join(DEPS_DIR, "piper"))
          TOOLS_STATUS = os.environ.get("TOOLS_STATUS_FILE", "")

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          should_post_social = (event_name == "schedule") or \
                               (str(os.environ.get("UPLOAD_TO_SOCIAL", "")).lower() == "true")

          # ─── Constants ───
          RUN_START     = time.time()
          RUN_START_STR = datetime.utcnow().strftime("%d-%b-%Y %H:%M:%S UTC")
          FPS, INTRO_SEC, OUTRO_SEC, W, H = 25, 3.5, 5.0, 1080, 1920
          VIDEO_MIN, VIDEO_MAX = 35.0, 62.0
          VOICE_MIN, VOICE_MAX = VIDEO_MIN - 3.2, VIDEO_MAX - 3.2

          BRAND_NAME   = "SAWAJ STUDIO"
          BRAND_HANDLE = "@SawajStudio"
          BISMILLAH    = "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ"
          AMEEN        = "آمین ثم آمین"

          BOOKS = [
              {"eng": "eng-bukhari",  "ara": "ara-bukhari",  "name": "सहीह अल-बुख़ारी",    "max": 7563, "grade": "Sahih"},
              {"eng": "eng-muslim",   "ara": "ara-muslim",   "name": "सहीह मुस्लिम",       "max": 3032, "grade": "Sahih"},
              {"eng": "eng-abudawud", "ara": "ara-abudawud", "name": "सुनन अबू दाऊद",      "max": 5274, "grade": "Hasan"},
              {"eng": "eng-tirmidhi", "ara": "ara-tirmidhi", "name": "जामी अत-तिर्मिज़ी",  "max": 3956, "grade": "Mixed"},
              {"eng": "eng-nasai",    "ara": "ara-nasai",    "name": "सुनन अन-नसाई",       "max": 5758, "grade": "Sahih"},
              {"eng": "eng-ibnmajah", "ara": "ara-ibnmajah", "name": "सुनन इब्न माजा",     "max": 4341, "grade": "Mixed"},
              {"eng": "eng-malik",    "ara": "ara-malik",    "name": "मुवत्ता मलिक",       "max": 1858, "grade": "Sahih"},
          ]

          FB_PALETTE = {
              "name": "Royal Gold",
              "primary": [212, 175, 55], "secondary": [255, 220, 120],
              "text": [255, 245, 220], "accent": [255, 200, 80], "glow": [255, 220, 120],
          }

          COLOR_POOL = [
              (255, 100, 150), (80, 180, 255), (100, 220, 100),
              (255, 200, 60),  (200, 140, 240), (255, 150, 80),
              (140, 200, 255), (255, 130, 200), (150, 220, 180),
              (255, 180, 100),
          ]

          MUSIC_BLOCK = ["piano","guitar","violin","drum","tabla","flute","oud","ney",
                         "harp","melody","song","music","instrument","beat","hip hop",
                         "edm","jazz","rock","saxophone","trumpet","orchestra",
                         "symphony","tune","jingle","rap","pop"]
          NON_ISLAMIC_BLOCK = ["girl","boy","woman","man","people","dance","dancing",
                               "wine","alcohol","dog","pig","cross","church","temple",
                               "idol","nude","sexy","bikini","bar","party","crowd"]
          NATURE_WORDS = ["rain","wind","bird","water","forest","thunder","ocean",
                          "river","stream","leaves","desert","night","crickets",
                          "waterfall","storm","waves","fire","nature","ambient",
                          "soft","gentle","quiet","calm","flowing","drizzle","breeze"]
          BG_ALLOW = ["mosque","masjid","kaaba","mecca","medina","islamic",
                      "arabic","calligraphy","night sky","stars","desert","mountain",
                      "sea","ocean","clouds","sunrise","sunset","moon","lantern",
                      "architecture","pattern","geometric","minaret","dome","quran",
                      "book","prayer","meditation","peaceful","spiritual","silhouette",
                      "twilight","nature","sky","cloud","star","empty","arch","column"]
          SAFE_BG_QUERIES = [
              "mosque exterior night empty", "desert landscape sunrise",
              "islamic architecture pattern", "night sky stars time lapse",
              "arabic calligraphy closeup", "kaaba empty night",
              "mountain landscape sunset", "ocean waves calm",
              "clouds sky timelapse", "islamic geometric pattern",
          ]

          # ─── Helpers ───
          def _hash(s):
              h = 0
              for c in str(s):
                  h = (h * 31 + ord(c)) & 0xFFFFFFFF
              return h

          def color_for_word(word):
              return COLOR_POOL[_hash(word) % len(COLOR_POOL)]

          def s_rgb(v):
              try: return max(0, min(255, int(v)))
              except: return 128

          def val_palette(p):
              if not isinstance(p, dict): return dict(FB_PALETTE)
              try:
                  r = {"name": str(p.get("name", "Custom"))[:40]}
                  for k in ["primary", "secondary", "text", "accent", "glow"]:
                      rgb = p.get(k, FB_PALETTE[k])
                      if not isinstance(rgb, list) or len(rgb) != 3:
                          return dict(FB_PALETTE)
                      r[k] = [s_rgb(rgb[0]), s_rgb(rgb[1]), s_rgb(rgb[2])]
                  if sum(r["text"]) < 300: r["text"] = [255, 245, 220]
                  return r
              except:
                  return dict(FB_PALETTE)

          def val_bg(q):
              if not q or not isinstance(q, str): return None
              ql = q.lower()
              for b in NON_ISLAMIC_BLOCK + MUSIC_BLOCK:
                  if b in ql: return None
              for g in BG_ALLOW:
                  if g in ql: return q.strip()[:80]
              return None

          def val_amb(q):
              if not q or not isinstance(q, str): return None
              ql = q.lower()
              for b in MUSIC_BLOCK:
                  if b in ql: return None
              for g in NATURE_WORDS:
                  if g in ql: return q.strip()[:60]
              return None

          def val_text(t, mx=200, mn=1):
              if not t or not isinstance(t, str): return ""
              t = str(t).strip()
              if len(t) < mn or len(t) > mx: return ""
              tl = t.lower()
              for b in MUSIC_BLOCK:
                  if b in tl: return ""
              return t

          def val_tags(tags):
              if not isinstance(tags, list): return []
              c = [t for t in tags if isinstance(t, str) and t.startswith("#") and len(t) < 40]
              return c[:8] if len(c) >= 3 else []

          # ─── Report state ───
          R = {
              "steps": [], "errors": [], "warnings": [],
              "hadith": {}, "ai": [], "tts": {}, "audio": [],
              "trans": {}, "amb": {}, "bg": {}, "logo": {},
              "video": {}, "drive": {}, "fb": {}, "tools": {},
              "enh": [], "aic": {},
              "es": {"font": False, "palette": "none"},
              "wc": {"hook": [], "hindi": [], "english": [], "arabic": [], "cta": []},
              "plat": {"hadith": "-", "ambience": "-", "bg": "-", "tts": "-", "trans": "-"},
              "ai_gen": {}, "hadith_tier": "-",
          }

          def log(step, status="ok", detail=""):
              icons = {"ok": "✅", "fail": "❌", "warn": "⚠️", "info": "ℹ️", "skip": "⏸️"}
              line = f"{icons.get(status, '•')} <b>{step}</b>"
              if detail: line += f" — {detail}"
              R["steps"].append(line)
              print(f"[{status.upper()}] {step} — {detail}")

          def log_err(m): R["errors"].append(str(m)[:200]); print(f"[ERR] {m}")
          def log_warn(m): R["warnings"].append(str(m)[:200]); print(f"[WARN] {m}")
          def log_enh(m): R["enh"].append(m); print(f"[FEATURE] {m}")

          def load_tools():
              try:
                  if TOOLS_STATUS and os.path.exists(TOOLS_STATUS):
                      with open(TOOLS_STATUS) as f:
                          R["tools"] = json.load(f).get("tools", {})
              except Exception as e:
                  print(f"[TOOLS] {e}")

          def sanitize(t):
              if not t: return ""
              t = re.sub(r'[\u200b-\u200f\ufeff\u202a-\u202e]', '', str(t))
              t = re.sub(r'[\U0001F000-\U0001FFFF\u2600-\u27BF\u2B00-\u2BFF\uFE00-\uFE0F]', '', t)
              return t.replace('"', '').replace("'", '').replace('\n', ' ').strip()

          def sanitize_ar(t):
              if not t: return ""
              return re.sub(r'[\u200b-\u200e\ufeff\u202a-\u202e]', '', str(t)).replace('\n', ' ').strip()

          def run(cmd, timeout=None):
              print(f"[CMD] {cmd[:120]}...")
              subprocess.run(cmd, shell=True, check=True, timeout=timeout)

          def dl(url, path, minsize=12000):
              try:
                  r = session.get(url, timeout=35)
                  if r.status_code == 200 and len(r.content) > minsize:
                      with open(path, "wb") as f:
                          f.write(r.content)
                      return True
              except Exception:
                  pass
              return False

          def conf_words(section, text):
              if not text: return
              for i, w in enumerate(sanitize(text).split(), 1):
                  R["wc"][section].append(f"✅ {i}. {w}")

          def add_respect_prophet(t):
              if not t: return t
              for p, r in [
                  (r'\b(Prophet|Rasul|Rasool|Messenger of Allah|Nabi)\b(?!\s*ﷺ)', r'\1 ﷺ'),
                  (r'पैगंबर(?!\s*ﷺ)', 'पैगंबर ﷺ'),
                  (r'नबी(?!\s*ﷺ)', 'नबी ﷺ'),
                  (r'रसूल(?!\s*ﷺ)', 'रसूल ﷺ'),
              ]:
                  t = re.sub(p, r, t)
              return t

          def add_respect_allah(t):
              if not t: return t
              t = re.sub(r'अल्लाह(?!\s*(तआला|SWT|ﷻ))', 'अल्लाह तआला', t)
              t = re.sub(r'\bAllah\b(?!\s*(SWT|ﷻ|\(SWT\)))', 'Allah (SWT)', t)
              return t

          def hijri():
              try:
                  d = datetime.utcnow()
                  gy, gm, gd = d.year, d.month, d.day
                  a = (14 - gm) // 12
                  y = gy + 4800 - a
                  m = gm + 12 * a - 3
                  jdn = gd + (153 * m + 2) // 5 + 365 * y + y // 4 - y // 100 + y // 400 - 32045
                  l = jdn - 1948440 + 10632
                  n = (l - 1) // 10631
                  l = l - 10631 * n + 354
                  j = ((10985 - l) // 5316) * ((50 * l) // 17719) + (l // 5670) * ((43 * l) // 15238)
                  l = l - ((30 - j) // 15) * ((17719 * j) // 50) - (j // 16) * ((15238 * j) // 43) + 29
                  hm = (24 * l) // 709
                  hd = l - (709 * hm) // 24
                  hy = 30 * n + j - 30
                  months = ["Muharram","Safar","Rabi al-Awwal","Rabi al-Thani",
                            "Jumada al-Awwal","Jumada al-Thani","Rajab","Shaban",
                            "Ramadan","Shawwal","Dhul Qadah","Dhul Hijjah"]
                  mn = months[hm - 1] if 1 <= hm <= 12 else "?"
                  return f"{hd} {mn} {hy} AH"
              except Exception:
                  return ""

          # ═══════════════════════════════════════════════════════════════
          # AI CALL (Multi-provider fallback)
          # ═══════════════════════════════════════════════════════════════
          def call_ai(prompt, mx=1000, task="gen", jm=True):
              providers = []
              if os.environ.get("OPENROUTER_API_KEY"):
                  providers.append(("OpenRouter", "https://openrouter.ai/api/v1/chat/completions",
                      {"Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}"}, "openai/gpt-4o-mini"))
              if os.environ.get("GROQ_API_KEY"):
                  providers.append(("Groq", "https://api.groq.com/openai/v1/chat/completions",
                      {"Authorization": f"Bearer {os.environ['GROQ_API_KEY']}"}, "llama-3.3-70b-versatile"))
