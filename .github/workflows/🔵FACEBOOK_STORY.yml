name: "🏢 SAWAJ STUDIO — Ghatak Company"

on:
  workflow_dispatch:
    inputs:
      upload_to_social:
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '30 23 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: fb-story-${{ github.ref }}
  cancel-in-progress: false

jobs:
  company-run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CACHE_VERSION: v29
      DEPS_DIR: ${{ github.workspace }}/.dependencies

    steps:
      # ═══════════════════════════════════════════════════════════════
      # 01 | 🚪 DARWAAN — Repo Checkout
      # ═══════════════════════════════════════════════════════════════
      - name: "01|Checkout"
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────────────────────
      # 02 | 🚪 DARWAAN — Cache (public-safe)
      # ───────────────────────────────────────────────────────────────
      - name: "02|Cache"
        id: master-cache
        uses: actions/cache@v4
        with:
          path: |
            .dependencies
            ~/.cache/pip
            ~/.local/share/piper
          key: ${{ runner.os }}-fb-${{ env.CACHE_VERSION }}-${{ github.ref_name }}-${{ hashFiles('**/requirements.txt') || 'default' }}
          restore-keys: |
            ${{ runner.os }}-fb-${{ env.CACHE_VERSION }}-${{ github.ref_name }}-
            ${{ runner.os }}-fb-${{ env.CACHE_VERSION }}-

      # ───────────────────────────────────────────────────────────────
      # 03 | 🚪 DARWAAN — Folder Create (Company Godown)
      # ───────────────────────────────────────────────────────────────
      - name: "03|Setup Folders"
        run: |
          mkdir -p "$DEPS_DIR"/{bin,fonts,models,system-fonts,python-venv,piper,libs}
          mkdir -p src/fetchers src/ai src/voice src/video src/uploaders src/utils
          mkdir -p assets
          echo "DEPS_DIR=$DEPS_DIR" >> $GITHUB_ENV
          echo "📁 Company structure ready:"
          find . -maxdepth 2 -type d | sort

      # ───────────────────────────────────────────────────────────────
      # 04 | 🚪 DARWAAN — Python Setup
      # ───────────────────────────────────────────────────────────────
      - name: "04|Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ───────────────────────────────────────────────────────────────
      # 05 | 🚪 DARWAAN — FFmpeg + System Tools
      # ───────────────────────────────────────────────────────────────
      - name: "05|SystemTools"
        run: |
          MARKER="$DEPS_DIR/.ffmpeg_ok";LIB_DIR="$DEPS_DIR/libs"
          if [ -f "$MARKER" ]&&[ -f "$DEPS_DIR/bin/ffmpeg" ]&&[ -f "$DEPS_DIR/bin/sox" ];then
            echo "📦 CACHED"
            if [ -d "$LIB_DIR" ];then sudo mkdir -p /usr/lib/x86_64-linux-gnu;sudo cp -n "$LIB_DIR"/*.so* /usr/lib/x86_64-linux-gnu/ 2>/dev/null||true;sudo ldconfig;fi
            sudo cp "$DEPS_DIR/bin/ffmpeg" /usr/local/bin/ffmpeg 2>/dev/null||true
            sudo cp "$DEPS_DIR/bin/ffprobe" /usr/local/bin/ffprobe 2>/dev/null||true
            sudo cp "$DEPS_DIR/bin/sox" /usr/local/bin/sox 2>/dev/null||true
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe /usr/local/bin/sox 2>/dev/null||true
            [ -f "$DEPS_DIR/bin/espeak-ng" ]&&sudo cp "$DEPS_DIR/bin/espeak-ng" /usr/local/bin/espeak-ng&&sudo chmod +x /usr/local/bin/espeak-ng||true
            if [ -d "$DEPS_DIR/system-fonts/truetype" ];then sudo cp -rn "$DEPS_DIR/system-fonts/truetype/"* /usr/share/fonts/truetype/ 2>/dev/null||true;sudo fc-cache -f>/dev/null 2>&1||true;fi
          else
            echo "📥 Installing fresh..."
            sudo apt-get update -q
            sudo apt-get install -y -q ffmpeg sox espeak-ng libsox-fmt-all fonts-noto fonts-noto-core fonts-noto-extra fonts-noto-ui-core fonts-dejavu-core fontconfig
            sudo ldconfig
          fi
          mkdir -p "$DEPS_DIR/bin" "$LIB_DIR" "$DEPS_DIR/system-fonts/truetype"
          cp "$(which ffmpeg)" "$DEPS_DIR/bin/ffmpeg" 2>/dev/null||true
          cp "$(which ffprobe)" "$DEPS_DIR/bin/ffprobe" 2>/dev/null||true
          cp "$(which sox)" "$DEPS_DIR/bin/sox" 2>/dev/null||true
          cp "$(which espeak-ng)" "$DEPS_DIR/bin/espeak-ng" 2>/dev/null||true
          for bin in ffmpeg ffprobe sox;do LDD=$(ldd "$(which $bin)" 2>/dev/null|grep "=> /"|awk '{print $3}');for lib in $LDD;do [ -f "$lib" ]&&cp -n "$lib" "$LIB_DIR/" 2>/dev/null||true;done;done
          cp -rn /usr/share/fonts/truetype/* "$DEPS_DIR/system-fonts/truetype/" 2>/dev/null||true
          touch "$MARKER"

      # ───────────────────────────────────────────────────────────────
      # 06 | 🚪 DARWAAN — Fonts (Hindi/Arabic/Emoji)
      # ───────────────────────────────────────────────────────────────
      - name: "06|Fonts"
        run: |
          mkdir -p "$DEPS_DIR/fonts"
          declare -A F=(
            ["NotoSans-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSans/NotoSans-Regular.ttf"
            ["NotoSans-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSans/NotoSans-Bold.ttf"
            ["NotoSansDevanagari-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf"
            ["NotoSansDevanagari-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf"
            ["NotoNaskhArabic-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf"
            ["NotoNaskhArabic-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf"
            ["NotoEmoji-Regular.ttf"]="https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoEmoji-Regular.ttf"
          )
          for n in "${!F[@]}";do P="$DEPS_DIR/fonts/$n";if [ ! -f "$P" ]||[ "$(stat -c%s "$P" 2>/dev/null||echo 0)" -lt 50000 ];then wget -q --timeout=90 "${F[$n]}" -O "$P"||true;fi;done
          mkdir -p ~/.fonts;cp "$DEPS_DIR/fonts/"*.ttf ~/.fonts/ 2>/dev/null||true
          fc-cache -fv ~/.fonts/>/dev/null 2>&1||true
          echo "✅ Fonts:";ls ~/.fonts/

      # ───────────────────────────────────────────────────────────────
      # 07 | 🚪 DARWAAN — Python Packages
      # ───────────────────────────────────────────────────────────────
      - name: "07|PipPackages"
        run: |
          VENV="$DEPS_DIR/python-venv"
          if [ -f "$VENV/.installed" ];then echo "📦 CACHED";else
            rm -rf "$VENV";python3 -m venv "$VENV"
            "$VENV/bin/pip" install --upgrade pip --quiet
            "$VENV/bin/pip" install --no-cache-dir requests edge-tts mutagen Pillow google-api-python-client google-auth-httplib2 google-auth-oauthlib gTTS piper-tts numpy scipy soundfile
            touch "$VENV/.installed"
          fi
          echo "$VENV/bin">>$GITHUB_PATH

      # ───────────────────────────────────────────────────────────────
      # 08 | 🚪 DARWAAN — Piper Voice Model
      # ───────────────────────────────────────────────────────────────
      - name: "08|PiperVoice"
        run: |
          P="$DEPS_DIR/piper"
          if [ -f "$P/.installed" ];then echo "📦 CACHED";else
            rm -rf "$P";mkdir -p "$P";cd "$P"
            B="https://huggingface.co/rhasspy/piper-voices/resolve/main"
            wget -q --timeout=120 "$B/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx" -O hi_IN-pratham-medium.onnx||true
            wget -q --timeout=120 "$B/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx.json" -O hi_IN-pratham-medium.onnx.json||true
            touch "$P/.installed";cd "$GITHUB_WORKSPACE"
          fi
          echo "PIPER_DIR=$P">>$GITHUB_ENV

      # ═══════════════════════════════════════════════════════════════
      # 09 | 🏭 COMPANY FACTORY — Build All 29 Files
      # ═══════════════════════════════════════════════════════════════
      - name: "09|BuildCompany"
        run: |
          # ═══════════════════════════════════════════════════════════
          # FILE 01 | 📒 ACCOUNTANT — src/02_config.py
          # ═══════════════════════════════════════════════════════════
          cat > src/02_config.py << 'EOF_CONFIG'
          import os
          
          # Video settings
          FPS = 25
          INTRO_SEC = 3.5
          OUTRO_SEC = 5.0
          W, H = 1080, 1920
          VIDEO_MIN, VIDEO_MAX = 35.0, 62.0
          VOICE_MIN = VIDEO_MIN - 3.2
          VOICE_MAX = VIDEO_MAX - 3.2
          
          # Brand
          BRAND_NAME = "SAWAJ STUDIO"
          BRAND_HANDLE = "@SawajStudio"
          BISMILLAH_ARABIC = "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ"
          AMEEN_ARABIC = "آمین ثم آمین"
          
          # Paths
          DEPS_DIR = os.environ.get("DEPS_DIR", os.path.expanduser("~/.dependencies"))
          FONTS_DIR = os.environ.get("FONTS_DIR", os.path.join(DEPS_DIR, "fonts"))
          PIPER_DIR = os.environ.get("PIPER_DIR", os.path.join(DEPS_DIR, "piper"))
          
          # Secrets
          TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          TG_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")
          META_TOKEN = os.environ.get("FACEBOOK_INSTAGRAM_META_TOKEN", "").strip()
          EVENT_NAME = os.environ.get("GITHUB_EVENT_NAME", "")
          SHOULD_POST_SOCIAL = (EVENT_NAME == "schedule") or (str(os.environ.get("UPLOAD_TO_SOCIAL", "")).lower() == "true")
          
          # 7 Hadith Books
          BOOKS = [
              {"eng": "eng-bukhari",  "ara": "ara-bukhari",  "name": "सहीह अल-बुख़ारी",    "max": 7563, "grade": "Sahih"},
              {"eng": "eng-muslim",   "ara": "ara-muslim",   "name": "सहीह मुस्लिम",       "max": 3032, "grade": "Sahih"},
              {"eng": "eng-abudawud", "ara": "ara-abudawud", "name": "सुनन अबू दाऊद",      "max": 5274, "grade": "Hasan"},
              {"eng": "eng-tirmidhi", "ara": "ara-tirmidhi", "name": "जामी अत-तिर्मिज़ी",  "max": 3956, "grade": "Mixed"},
              {"eng": "eng-nasai",    "ara": "ara-nasai",    "name": "सुनन अन-नसाई",       "max": 5758, "grade": "Sahih"},
              {"eng": "eng-ibnmajah", "ara": "ara-ibnmajah", "name": "सुनन इब्न माजा",     "max": 4341, "grade": "Mixed"},
              {"eng": "eng-malik",    "ara": "ara-malik",    "name": "मुवत्ता मलिक",       "max": 1858, "grade": "Sahih"},
          ]
          
          # Colors
          COLOR_POOL = [
              (170, 100, 255), (255, 220, 60), (255, 150, 50), (80, 180, 255),
              (100, 220, 100), (255, 100, 100), (255, 150, 200), (200, 150, 100),
              (240, 240, 240), (100, 220, 200), (200, 140, 240), (255, 200, 100),
              (150, 200, 100), (255, 180, 80), (140, 180, 220), (220, 150, 180),
          ]
          
          FB_PALETTE = {
              "name": "Royal Gold",
              "primary": [212, 175, 55], "secondary": [255, 220, 120],
              "text": [255, 245, 220], "accent": [255, 200, 80], "glow": [255, 220, 120],
          }
          
          # Blocklists
          MUSIC_BLOCK = ["piano","guitar","violin","drum","tabla","flute","oud","ney",
                         "harp","melody","song","music","instrument","beat","hip hop",
                         "edm","jazz","rock","saxophone","trumpet","orchestra",
                         "symphony","tune","jingle","rap","pop"]
          NON_ISLAMIC_BLOCK = ["girl","boy","woman","man","people","dance","dancing",
                               "wine","alcohol","dog","pig","cross","church","temple",
                               "idol","nude","sexy","bikini","bar","party","crowd",
                               "pilgrim","worshipper","person","child","kid"]
          NATURE_WORDS = ["rain","wind","bird","water","forest","thunder","ocean",
                          "river","stream","leaves","desert","night","crickets",
                          "waterfall","storm","waves","fire","nature","ambient",
                          "soft","gentle","quiet","calm","flowing","drizzle","breeze"]
          BG_ALLOW = ["mosque","masjid","kaaba","mecca","medina","islamic",
                      "arabic","calligraphy","night sky","stars","desert","mountain",
                      "sea","ocean","clouds","sunrise","sunset","moon","lantern",
                      "architecture","pattern","geometric","minaret","dome","quran",
                      "book","prayer","meditation","peaceful","spiritual","silhouette",
                      "twilight","nature","sky","cloud","star","empty","arch","column"]
          SAFE_BG_QUERIES = [
              "mosque exterior night empty", "desert landscape sunrise",
              "islamic architecture pattern", "night sky stars time lapse",
              "arabic calligraphy closeup", "kaaba empty night",
              "mountain landscape sunset", "ocean waves calm",
              "clouds sky timelapse", "islamic geometric pattern",
          ]
          
          SAHABA = ["Abu Huraira","Abu Hurairah","Aisha","Ibn Umar","Ibn Abbas","Anas",
                    "Abu Bakr","Umar","Uthman","Ali","Ibn Masud","Abu Dharr","Abu Said",
                    "Jabir","Abdullah","Zaid","Bilal","Salman","Abu Musa","Imran",
                    "Hudhaifa","Umm Salama","Maymunah","Hafsa","Muadh","Anas bin Malik",
                    "Ubadah bin Samit","Ubadah","Yahya","Malik","Nafi"]
          EOF_CONFIG
          echo "✅ 01 | 📒 Accountant ready"

          # ═══════════════════════════════════════════════════════════
          # FILE 02 | 🔧 HATHIYAAR — src/utils/19_helpers.py
          # ═══════════════════════════════════════════════════════════
          cat > src/utils/19_helpers.py << 'EOF_HELPERS'
          import os, re, subprocess, requests, time
          from datetime import datetime
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          
          session = requests.Session()
          session.mount("https://", HTTPAdapter(max_retries=Retry(
              total=5, backoff_factor=1.5, status_forcelist=[429, 500, 502, 503, 504])))
          
          def run(cmd, timeout=None):
              print(f"[CMD] {cmd[:120]}...")
              subprocess.run(cmd, shell=True, check=True, timeout=timeout)
          
          def dl(url, path, minsize=12000):
              try:
                  r = session.get(url, timeout=35)
                  if r.status_code == 200 and len(r.content) > minsize:
                      with open(path, "wb") as f: f.write(r.content)
                      return True
              except: pass
              return False
          
          def ck_a(p, m=3000):
              return os.path.exists(p) and os.path.getsize(p) > m
          
          def hijri():
              try:
                  d = datetime.utcnow()
                  gy, gm, gd = d.year, d.month, d.day
                  a = (14 - gm) // 12; y = gy + 4800 - a; m = gm + 12 * a - 3
                  jdn = gd + (153 * m + 2) // 5 + 365 * y + y // 4 - y // 100 + y // 400 - 32045
                  l = jdn - 1948440 + 10632; n = (l - 1) // 10631; l = l - 10631 * n + 354
                  j = ((10985 - l) // 5316) * ((50 * l) // 17719) + (l // 5670) * ((43 * l) // 15238)
                  l = l - ((30 - j) // 15) * ((17719 * j) // 50) - (j // 16) * ((15238 * j) // 43) + 29
                  hm = (24 * l) // 709; hd = l - (709 * hm) // 24; hy = 30 * n + j - 30
                  months = ["Muharram","Safar","Rabi al-Awwal","Rabi al-Thani",
                            "Jumada al-Awwal","Jumada al-Thani","Rajab","Shaban",
                            "Ramadan","Shawwal","Dhul Qadah","Dhul Hijjah"]
                  mn = months[hm - 1] if 1 <= hm <= 12 else "?"
                  return f"{hd} {mn} {hy} AH"
              except: return ""
          EOF_HELPERS
          echo "✅ 02 | 🔧 Hathiyaar ready"

          # ═══════════════════════════════════════════════════════════
          # FILE 03 | 🧹 SAFAI WALA — src/utils/15_sanitizer.py
          # ═══════════════════════════════════════════════════════════
          cat > src/utils/15_sanitizer.py << 'EOF_SANITIZER'
          import re
          import sys
          sys.path.insert(0, "src")
          from config import SAHABA
          
          def sanitize(t):
              if not t: return ""
              t = re.sub(r'[\u200b-\u200f\ufeff\u202a-\u202e]', '', str(t))
              t = re.sub(r'[\U0001F000-\U0001FFFF\u2600-\u27BF\u2B00-\u2BFF\uFE00-\uFE0F]', '', t)
              return t.replace('"', '').replace("'", '').replace('\n', ' ').strip()
          
          def sanitize_ar(t):
              if not t: return ""
              return re.sub(r'[\u200b-\u200e\ufeff\u202a-\u202e]', '', str(t)).replace('\n', ' ').strip()
          
          def add_respect_prophet(t):
              if not t: return t
              for p, r in [
                  (r'\b(Prophet|Rasul|Rasool|Messenger of Allah|Nabi)\b(?!\s*ﷺ)', r'\1 ﷺ'),
                  (r'पैगंबर(?!\s*ﷺ)', 'पैगंबर ﷺ'),
                  (r'नबी(?!\s*ﷺ)', 'नबी ﷺ'),
                  (r'रसूल(?!\s*ﷺ)', 'रसूल ﷺ'),
              ]: t = re.sub(p, r, t)
              return t
          
          def add_respect_allah(t):
              if not t: return t
              t = re.sub(r'अल्लाह(?!\s*(तआला|SWT|ﷻ))', 'अल्लाह तआला', t)
              t = re.sub(r'\bAllah\b(?!\s*(SWT|ﷻ|\(SWT\)))', 'Allah (SWT)', t)
              return t
          
          def add_ra(n):
              if not n: return n
              for s in SAHABA:
                  if s.lower() in n.lower() and "(RA)" not in n:
                      return f"{n} (RA)"
              return n
          EOF_SANITIZER
          echo "✅ 03 | 🧹 Safai wala ready"

          # ═══════════════════════════════════════════════════════════
          # FILE 04 | 📝 KHABRI — src/utils/16_logger.py
          # ═══════════════════════════════════════════════════════════
          cat > src/utils/16_logger.py << 'EOF_LOGGER'
          import time, sys
          sys.path.insert(0, "src")
          from config import TG_TOKEN, TG_CHAT_ID, EVENT_NAME
          from helpers_import import session
          
          RUN_START = time.time()
          
          R = {
              "steps": [], "errors": [], "warnings": [], "hadith": {}, "ai": [],
              "tts": {}, "audio": [], "trans": {}, "amb": {}, "bg": {}, "logo": {},
              "video": {}, "drive": {}, "fb": {}, "tools": {}, "enh": [], "aic": {},
              "es": {"font": False, "words": 0, "dots": 0, "palette": "none", "emoji_path": "-"},
              "wc": {"hook": [], "hindi": [], "english": [], "arabic": [], "cta": [], "tags": []},
              "plat": {"hadith": "-", "quran": "-", "ambience": "-", "bg": "-", "tts": "-", "trans": "-"},
              "ai_gen": {}, "hadith_tier": "-",
          }
          
          def log(step, status="ok", detail=""):
              icons = {"ok": "✅", "fail": "❌", "warn": "⚠️", "info": "ℹ️", "skip": "⏸️"}
              line = f"{icons.get(status, '•')} <b>{step}</b>"
              if detail: line += f" — {detail}"
              R["steps"].append(line)
              print(f"[{status.upper()}] {step} — {detail}")
          
          def log_err(m): R["errors"].append(str(m)[:200]); print(f"[ERR] {m}")
          def log_warn(m): R["warnings"].append(str(m)[:200]); print(f"[WARN] {m}")
          def log_enh(m): R["enh"].append(m); print(f"[FEATURE] {m}")
          
          def conf_words(section, text, status="ok"):
              if not text: return
              for i, w in enumerate(str(text).split(), 1):
                  icon = "✅" if status == "ok" else "⚠️"
                  R["wc"][section].append(f"{icon} {i}. {w}")
          
          def conf_list(section, lst):
              for i, w in enumerate(lst, 1):
                  R["wc"][section].append(f"✅ {i}. {w}")
          
          def _ic(s):
              s = str(s).lower()
              return "✅" if ("ok" in s or "success" in s) else "❌" if "fail" in s else "⏸️" if any(k in s for k in ["hold","skip","not set"]) else "⚠️" if "warn" in s else "•"
          
          def build_msg(status="COMPLETED", note=""):
              dur = int(time.time() - RUN_START)
              L = ["🕌 <b>ISLAMIC HADITH STORY</b>", "━━━━━━━━━━━━━━━"]
              L.append(f"{'🎉' if status=='COMPLETED' else '⚠️' if status=='PARTIAL' else '❌'} <b>{status}</b>")
              if note: L.append(f"📝 {note}")
              L.append(f"⏱️ {dur//60}m {dur%60}s | ⚙️ {EVENT_NAME or 'manual'}")
              L.append("\n🌐 <b>PLATFORMS</b>")
              for k, v in R["plat"].items(): L.append(f"  • {k.title()}: <b>{v}</b>")
              es = R["es"]
              L.append("\n😊 <b>EMOJI & COLOR</b>")
              L.append(f"  ✅ Font: {'loaded' if es['font'] else 'dots'}")
              L.append(f"  ✅ Emojis: {es['words']} | Dots: {es['dots']}")
              L.append(f"  ✅ Palette: <b>{es['palette']}</b>")
              if R["aic"]:
                  L.append("\n🤖 <b>AI CONTENT</b>")
                  for k in ["hook", "intro", "title", "emotion", "narrator", "outro_cta"]:
                      if R["aic"].get(k): L.append(f"  ✅ {k}: <b>{R['aic'][k]}</b>")
              h = R["hadith"]
              if h: L.append(f"\n📖 <b>{h.get('collection','-')}</b> #{h.get('number','-')}")
              if R["video"]: L.append(f"\n🎬 <b>VIDEO</b>: {R['video'].get('duration','-')}s")
              if R["drive"]:
                  L.append(f"\n☁️ <b>DRIVE</b>: {_ic(R['drive'].get('status',''))}")
                  if R["drive"].get("link"): L.append(f"  {R['drive']['link']}")
              if R["fb"]: L.append(f"\n📱 <b>FB</b>: {_ic(R['fb'].get('status',''))}")
              if R["warnings"]:
                  L.append("\n⚠️ <b>WARN</b>")
                  for w in R["warnings"][:5]: L.append(f"  • {w}")
              if R["errors"]:
                  L.append("\n❌ <b>ERR</b>")
                  for e in R["errors"][:5]: L.append(f"  • {e}")
              m = "\n".join(L)
