          def fetch_hadith():
              bases = ["https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1",
                       "https://raw.githubusercontent.com/fawazahmed0/hadith-api/1"]
              env_url = os.environ.get("HADITH_API_URL", "").strip()
              if env_url and "fawazahmed0" in env_url:
                  bases.insert(0, env_url.rstrip("/"))
              recent = []
              try:
                  if os.path.exists("recent_hadiths.json"):
                      with open("recent_hadiths.json") as f:
                          recent = json.load(f)
              except Exception:
                  pass
              for attempt in range(50):
                  book = random.choice(BOOKS)
                  num = random.randint(1, max(1, book["max"] - 50))
                  key = f"{book['eng']}:{num}"
                  if key in recent[-30:]:
                      continue
                  for base in bases:
                      try:
                          url = f"{base}/editions/{book['eng']}/{num}.json"
                          r = session.get(url, timeout=12)
                          if r.status_code != 200:
                              continue
                          hs = r.json().get("hadiths", [])
                          if not hs:
                              continue
                          eng = sanitize(hs[0].get("text", ""))
                          if not (150 <= len(eng) <= 700):
                              continue
                          ara = ""
                          try:
                              ar = session.get(f"{base}/editions/{book['ara']}/{num}.json", timeout=10)
                              if ar.status_code == 200:
                                  ad = ar.json().get("hadiths", [])
                                  if ad:
                                      ara = sanitize(ad[0].get("text",""))
                          except Exception:
                              pass
                          recent.append(key)
                          recent = recent[-50:]
                          try:
                              with open("recent_hadiths.json","w") as f:
                                  json.dump(recent, f)
                          except Exception:
                              pass
                          R["hadith"] = {
                              "collection": book["name"],
                              "number": str(hs[0].get("hadithnumber") or num),
                              "english": eng, "arabic": ara,
                              "source": "fawazahmed0",
                              "grade": book.get("grade", ""),
                          }
                          R["hadith_tier"] = "Tier 1 (fawazahmed0)"
                          R["plat"]["hadith"] = f"fawazahmed0/{book['eng']}"
                          return R["hadith"]
                      except Exception:
                          continue
              R["hadith"] = {
                  "collection": "Sahih al-Bukhari", "number": "1",
                  "english": "The reward of deeds depends upon the intentions.",
                  "arabic": "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ",
                  "source": "hardcoded", "grade": "Sahih",
              }
              R["hadith_tier"] = "Tier 2 (hardcoded)"
              return R["hadith"]

          # ═══════════════════════════════════════════════════════════════
          # DECORATIVE EFFECTS
          # ═══════════════════════════════════════════════════════════════
          def islamic_pattern(img, op=0.03):
              try:
                  p = Image.new("RGBA", (W, H), (0, 0, 0, 0))
                  pd = ImageDraw.Draw(p)
                  gold = (212, 175, 55, int(255*op))
                  for x in range(0, W, 160):
                      for y in range(0, H, 160):
                          s = 20
                          pd.polygon([(x, y-s), (x+s, y), (x, y+s), (x-s, y)], outline=gold)
                  return Image.alpha_composite(img, p)
              except Exception:
                  return img

          def particles(img, fi, cnt, pal):
              try:
                  p = Image.new("RGBA", (W, H), (0, 0, 0, 0))
                  pd = ImageDraw.Draw(p)
                  random.seed(42)
                  for i in range(cnt):
                      px = (random.randint(0, W) + fi*random.choice([1,2,-1,-2])) % W
                      py = (random.randint(0, H) - fi*random.choice([1,2,3])) % H
                      sz = random.randint(2, 5)
                      a = random.randint(60, 160)
                      c = tuple(pal["primary"]) if i % 2 == 0 else tuple(pal["glow"])
                      pd.ellipse([px, py, px+sz, py+sz], fill=c+(a,))
                  return Image.alpha_composite(img, p)
              except Exception:
                  return img

          def apply_emotion(img, em):
              try:
                  oa = img.split()[3]
                  rgb = img.convert("RGB")
                  if em == "tawbah":
                      rgb = ImageEnhance.Color(rgb).enhance(0.88)
                      rgb = Image.blend(rgb, Image.new("RGB", rgb.size, (0,0,40)), 0.10)
                  elif em == "shukr":
                      rgb = ImageEnhance.Color(rgb).enhance(1.10)
                  elif em == "khushu":
                      rgb = ImageEnhance.Color(rgb).enhance(0.92)
                      rgb = Image.blend(rgb, Image.new("RGB", rgb.size, (30,20,40)), 0.08)
                  r = rgb.convert("RGBA")
                  r.putalpha(oa)
                  return r
              except Exception:
                  return img

          # ═══════════════════════════════════════════════════════════════
          # ⭐ VERTICAL 3-LINE STACK — NO BOX
          # ═══════════════════════════════════════════════════════════════
          def draw_trilingual_vertical(img, hindi_word, arabic_word, english_word,
                                        palette, fonts, alpha=255):
              """
              3 lines stacked vertically on LEFT side.
              Colored dot + White bold text with dark shadow.
              NO box, NO rectangle, NO chakor.
              """
              try:
                  d = ImageDraw.Draw(img)
                  x_dot  = int(W * 0.08)
                  x_text = int(W * 0.13)
                  base_y = int(H * 0.48)
                  line_gap = 110

                  lines = [
                      (hindi_word,   fonts["hi"], base_y - line_gap, 16),
                      (arabic_word,  fonts["ar"], base_y,             18),
                      (english_word, fonts["en"], base_y + line_gap, 14),
                  ]

                  for word, font, y, dot_r in lines:
                      if not word:
                          continue
                      color = color_for_word(word)

                      # Colored dot
                      d.ellipse(
                          [x_dot - dot_r, y - dot_r, x_dot + dot_r, y + dot_r],
                          fill=color + (alpha,)
                      )

                      # Dark shadow (8 directions)
                      for dx, dy in [(-3,-3),(3,-3),(-3,3),(3,3),(0,-3),(0,3),(-3,0),(3,0)]:
                          d.text(
                              (x_text + dx, y + dy),
                              word,
                              fill=(0, 0, 0, int(200 * alpha / 255)),
                              font=font,
                              anchor="lm"
                          )

                      # Main white text
                      d.text(
                          (x_text, y),
                          word,
                          fill=tuple(palette["text"]) + (alpha,),
                          font=font,
                          anchor="lm"
                      )
                  return img
              except Exception as e:
                  print(f"[TRI-VERTICAL] {str(e)[:80]}")
                  return img

          # ═══════════════════════════════════════════════════════════════
          # REPORT
          # ═══════════════════════════════════════════════════════════════
          def _ic(s):
              s = str(s).lower()
              return "✅" if ("ok" in s or "success" in s) else \
                     "❌" if "fail" in s else \
                     "⏸️" if any(k in s for k in ["hold","skip","not set"]) else \
                     "⚠️" if "warn" in s else "•"

          def build_msg(status="COMPLETED", note=""):
              dur = int(time.time() - RUN_START)
              L = ["🕌 <b>ISLAMIC HADITH STORY</b>", "━━━━━━━━━━━━━━━"]
              L.append(f"{'🎉' if status=='COMPLETED' else '⚠️' if status=='PARTIAL' else '❌'} <b>{status}</b>")
              if note: L.append(f"📝 {note}")
              L.append(f"⏱️ {dur//60}m {dur%60}s | ⚙️ {event_name or 'manual'}")
              L.append("\n🌐 <b>PLATFORMS</b>")
              for k, v in R["plat"].items():
                  L.append(f"  • {k.title()}: <b>{v}</b>")
              if R["hadith_tier"]:
                  L.append(f"\n📚 <b>TIER</b>: {R['hadith_tier']}")
              if R["aic"]:
                  L.append("\n🤖 <b>AI CONTENT</b>")
                  for k in ["hook","intro","title","emotion","narrator","outro_cta"]:
                      if R["aic"].get(k):
                          L.append(f"  ✅ {k}: <b>{R['aic'][k]}</b>")
              h = R["hadith"]
              if h:
                  L.append(f"\n📖 <b>{h.get('collection','-')}</b> #{h.get('number','-')}")
              if R["video"]:
                  L.append(f"\n🎬 <b>VIDEO</b>: {R['video'].get('duration','-')}s | {R['video'].get('size','-')}MB")
              if R["drive"]:
                  L.append(f"\n☁️ <b>DRIVE</b>: {_ic(R['drive'].get('status',''))}")
                  if R["drive"].get("link"):
                      L.append(f"  {R['drive']['link']}")
              if R["fb"]:
                  L.append(f"\n📱 <b>FB</b>: {_ic(R['fb'].get('status',''))}")
              if R["warnings"]:
                  L.append("\n⚠️ <b>WARN</b>")
                  for w in R["warnings"][:5]:
                      L.append(f"  • {w}")
              if R["errors"]:
                  L.append("\n❌ <b>ERR</b>")
                  for e in R["errors"][:5]:
                      L.append(f"  • {e}")
              m = "\n".join(L)
              return m[:3950] + "…" if len(m) > 4000 else m

          def send_report(status="COMPLETED", note=""):
              msg = build_msg(status, note)
              print("=" * 60)
              print(msg[:2000])
              print("=" * 60)
              if TG_TOKEN and TG_CHAT_ID:
                  try:
                      session.post(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                          json={"chat_id": TG_CHAT_ID, "text": msg,
                                "parse_mode": "HTML", "disable_web_page_preview": True},
                          timeout=20)
                  except Exception as e:
                      print(f"[TG] {e}")

          # ═══════════════════════════════════════════════════════════════
          # MAIN
          # ═══════════════════════════════════════════════════════════════
          def main():
              print("🕌 Islamic Hadith Story — VERTICAL STACK FINAL...")
              load_tools()
              log("Start", "info", RUN_START_STR)

              hj = hijri()
              if hj:
                  log_enh(f"Hijri: {hj}")

              # Fetch hadith
              h = fetch_hadith()
              if not h.get("english"):
                  log("Hadith", "fail")
                  send_report("FAILED", "Hadith empty")
                  sys.exit(1)
              log("Hadith", "ok", f"{h['collection']} #{h['number']}")

              # Hindi translation
              hindi = deepl(h["english"]) or call_ai(
                  f"Is English Hadith ka natural Hindi tarjuma likho. Complete.\n\n{h['english']}",
                  task="hindi") or ""
              hindi = sanitize(re.sub(r"^```.*?```", "", hindi, flags=re.DOTALL))
              hindi = add_respect_prophet(add_respect_allah(hindi))
              h["hindi"] = hindi

              # AI content
              aic = ai_gen_everything(h["english"], h.get("arabic", ""))
              R["aic"] = aic
              for k in ["hook","intro","title","category","emotion","narrator",
                        "quran_ref","quran_arabic","outro_main","outro_cta","hashtags"]:
                  h[k] = aic.get(k, "")

              palette = aic["palette"]
              R["es"]["palette"] = palette.get("name", "custom")
              log("Palette (AI)", "ok", palette.get("name", "-"))

              conf_words("hook", h.get("hook", ""))
              conf_words("hindi", hindi)
              conf_words("english", h.get("english", ""))
              conf_words("arabic", h.get("arabic", ""))
              conf_words("cta", h.get("outro_cta", ""))

              # TTS
              tts_text = f"{h['intro']} {hindi}".strip() or h["english"]
              if not gen_tts(tts_text, "s_raw.mp3"):
                  log("TTS", "fail")
                  send_report("FAILED", "TTS failed")
                  sys.exit(1)
              log("TTS", "ok", R["tts"].get("provider"))

              # Voice processing
              process_voice("s_raw.mp3", "s_clean.mp3")
              vdur = MP3("s_clean.mp3").info.length
              if vdur < VOICE_MIN:
                  pad = VOICE_MIN - vdur
                  run(f'ffmpeg -y -i s_clean.mp3 -af "apad=pad_dur={pad:.2f}" s_v.mp3')
                  vdur = MP3("s_v.mp3").info.length
              elif vdur > VOICE_MAX:
                  ex = min(vdur/VOICE_MAX, 1.15)
                  run(f'ffmpeg -y -i s_clean.mp3 -af "atempo={ex:.4f}" s_v.mp3')
                  vdur = MP3("s_v.mp3").info.length
              else:
                  os.replace("s_clean.mp3", "s_v.mp3")
              log("Audio", "ok", f"{vdur:.2f}s")

              # Ambience
              get_ambience(aic.get("ambience_query", "rain nature"))

              # Mix
              fade = max(vdur - 3.0, 1.0)
              mix = (f"[0:a]volume=1.6,acompressor=threshold=-20dB:ratio=4:attack=5:"
                     f"release=150,dynaudnorm=f=200:g=15:p=0.9,"
                     f"loudnorm=I=-14:TP=-1.0:LRA=9[v];"
                     f"[1:a]volume=0.14,afade=t=in:st=0:d=3,"
                     f"afade=t=out:st={fade:.2f}:d=4[a];"
                     f"[v]asplit=2[vm][vs];"
                     f"[a][vs]sidechaincompress=threshold=0.05:ratio=8:attack=10:"
                     f"release=400[ad];"
                     f"[vm][ad]amix=inputs=2:duration=first:normalize=0[o]")
              run(f'ffmpeg -y -i s_v.mp3 -i ambience.mp3 -filter_complex "{mix}" '
                  f'-map "[o]" -c:a libmp3lame -b:a 192k s_voice.mp3')
              log("Mix", "ok")

              # Background
              bg = get_bg(aic.get("bg_queries", SAFE_BG_QUERIES[:3]),
                          vdur + INTRO_SEC + OUTRO_SEC)
              log("BG", "ok", R["bg"].get("source"))

              # Logo
              has_logo = make_logo()
              log("Logo", "ok" if has_logo else "skip")

              # Fonts
              fonts_dir = os.path.expanduser("\~/.fonts")
              intro, outro = INTRO_SEC, OUTRO_SEC
              total = min(intro + vdur + outro, 65.0)
              os.makedirs("story_frames", exist_ok=True)

              try:
                  F = {
                      "big":  ImageFont.truetype(f"{fonts_dir}/NotoSans-Bold.ttf", 72),
                      "s":    ImageFont.truetype(f"{fonts_dir}/NotoSans-Bold.ttf", 46),
                      "tiny": ImageFont.truetype(f"{fonts_dir}/NotoSans-Regular.ttf", 30),
                      "hook": ImageFont.truetype(f"{fonts_dir}/NotoSansDevanagari-Bold.ttf", 76),
                      "hi":   ImageFont.truetype(f"{fonts_dir}/NotoSansDevanagari-Bold.ttf", 52),
                      "ar":   ImageFont.truetype(f"{fonts_dir}/NotoNaskhArabic-Bold.ttf", 60),
                      "en":   ImageFont.truetype(f"{fonts_dir}/NotoSans-Bold.ttf", 40),
                      "bism": ImageFont.truetype(f"{fonts_dir}/NotoNaskhArabic-Bold.ttf", 54),
                      "ameen":ImageFont.truetype(f"{fonts_dir}/NotoNaskhArabic-Bold.ttf", 68),
                  }
              except Exception:
                  d = ImageFont.load_default()
                  F = {k: d for k in ["big","s","tiny","hook","hi","ar","en","bism","ameen"]}

              lw, lh = 180, 78
              mx_x, mx_y = W - lw, H - lh
              fps = FPS
              tf = int(total * fps)
              print(f"[FRAMES] {tf}...")

              # Word timing
              hindi_words   = sanitize(hindi).split()
              arabic_words  = sanitize_ar(h.get("arabic","")).split()
              english_words = sanitize(h.get("english","")).split()
              max_words = max(len(hindi_words), len(arabic_words), len(english_words))
              word_dur = vdur / max(1, max_words)

              # ═══════════════════════════════════════════════════════════
              # FRAME RENDER LOOP
              # ═══════════════════════════════════════════════════════════
              for fi in range(tf):
                  t = fi / fps
                  img = Image.new("RGBA", (W, H), (0, 0, 0, 0))
                  draw = ImageDraw.Draw(img)

                  # ─── INTRO ───
                  if t < intro:
                      mt = t
                      if mt < 0.8:
                          ba = int(255 * min(1.0, mt/0.3))
                          try:
                              bb = draw.textbbox((0,0), BISMILLAH, font=F["bism"])
                              draw.text((W//2 - (bb[2]-bb[0])//2, int(H*0.18)),
                                        BISMILLAH,
                                        fill=tuple(palette["glow"]) + (ba,),
                                        font=F["bism"])
                          except Exception:
                              pass
                      if h["hook"]:
                          hook_words = sanitize(h["hook"]).split()
                          n_show = max(0, min(len(hook_words), int((mt-0.3)/0.25) + 1))
                          partial = " ".join(hook_words[:n_show])
                          if partial:
                              try:
                                  for dx, dy in [(-3,-3),(3,-3),(-3,3),(3,3)]:
                                      draw.text((W//2+dx, int(H*0.45)+dy), partial,
                                                fill=(0,0,0,180), font=F["hook"], anchor="mm")
                                  draw.text((W//2, int(H*0.45)), partial,
                                            fill=tuple(palette["text"]) + (255,),
                                            font=F["hook"], anchor="mm")
                              except Exception:
                                  pass
                      ba = int(220 * min(1.0, mt/0.5))
                      draw.text((W//2, int(H*0.68)), BRAND_NAME,
                                fill=tuple(palette["primary"]) + (ba,),
                                font=F["s"], anchor="mm")

                  # ─── MAIN — VERTICAL 3-LINE STACK ───
                  elif t < intro + vdur:
                      mt = t - intro

                      if has_logo:
                          try:
                              lg = Image.open("avatar.png").convert("RGBA").resize(
                                  (lw, lh), Image.Resampling.LANCZOS)
                              x = abs((int(mt*200) + 60) % (2*mx_x) - mx_x)
                              y = abs((int(mt*150) + 120) % (2*mx_y) - mx_y)
                              img.paste(lg, (x, y), lg)
                              draw = ImageDraw.Draw(img)
                          except Exception:
                              pass

                      word_idx = int(mt / word_dur)
                      cur_hi = hindi_words[word_idx] if word_idx < len(hindi_words) else ""
                      cur_ar = arabic_words[word_idx] if word_idx < len(arabic_words) else ""
                      cur_en = english_words[word_idx] if word_idx < len(english_words) else ""

                      local_t = mt - (word_idx * word_dur)
                      fa = min(1.0, local_t / 0.25)
                      alpha_val = int(255 * fa)

                      img = draw_trilingual_vertical(
                          img, cur_hi, cur_ar, cur_en,
                          palette, F, alpha=alpha_val
                      )
                      draw = ImageDraw.Draw(img)

                  # ─── OUTRO ───
                  else:
                      ot = t - (intro + vdur)
                      if h["outro_main"]:
                          try:
                              gl = Image.new("RGBA", (W, H), (0, 0, 0, 0))
                              ImageDraw.Draw(gl).text((W//2, int(H*0.34)), h["outro_main"],
                                  fill=tuple(palette["primary"]) + (100,),
                                  font=F["big"], anchor="mm")
                              gl = gl.filter(ImageFilter.GaussianBlur(18))
                              img = Image.alpha_composite(img, gl)
                              draw = ImageDraw.Draw(img)
                              draw.text((W//2, int(H*0.34)), h["outro_main"],
                                        fill=tuple(palette["text"]) + (255,),
                                        font=F["big"], anchor="mm")
                          except Exception:
                              pass
                      if h["outro_cta"]:
                          try:
                              for dx, dy in [(-2,-2),(2,-2),(-2,2),(2,2)]:
                                  draw.text((W//2+dx, int(H*0.46)+dy), h["outro_cta"],
                                            fill=(0,0,0,180), font=F["s"], anchor="mm")
                              draw.text((W//2, int(H*0.46)), h["outro_cta"],
                                        fill=tuple(palette["text"]) + (255,),
                                        font=F["s"], anchor="mm")
                          except Exception:
                              pass
                      draw.text((W//2, int(H*0.56)), BRAND_HANDLE,
                                fill=tuple(palette["primary"]) + (255,),
                                font=F["tiny"], anchor="mm")
                      draw.text((W//2, int(H*0.64)), aic.get("sadaqah_cta", "सदक़ा जारिया है"),
                                fill=tuple(palette["secondary"]) + (240,),
                                font=F["tiny"], anchor="mm")
                      tags_t = "  ".join(h["hashtags"][:4])
                      if tags_t:
                          draw.text((W//2, int(H*0.82)), tags_t,
                                    fill=tuple(palette["secondary"]) + (220,),
                                    font=F["tiny"], anchor="mm")
                      if ot >= outro - 1.2:
                          aa = int(255 * min(1.0, (ot - (outro-1.2)) / 0.6))
                          try:
                              bb = draw.textbbox((0,0), AMEEN, font=F["ameen"])
                              draw.text((W//2 - (bb[2]-bb[0])//2, int(H*0.90)),
                                        AMEEN,
                                        fill=tuple(palette["glow"]) + (aa,),
                                        font=F["ameen"])
                          except Exception:
                              pass

                  # Universal effects
                  img = islamic_pattern(img, 0.03)
                  if intro <= t < intro + vdur:
                      cnt = int(20 + 15*abs(math.sin((t-intro)*2)))
                      img = particles(img, fi, cnt, palette)
                  img = apply_emotion(img, h["emotion"])
                  img.save(f"story_frames/frame_{fi:05d}.png")

              log("Frames", "ok", f"{tf}")
              log_enh("Vertical 3-Line Stack (No Box)")

              # Final Render
              final = "Final_FB_Story.mp4"
              run(f'ffmpeg -y -i {bg} -framerate {fps} '
                  f'-i story_frames/frame_%05d.png -i s_voice.mp3 '
                  f'-filter_complex "[0:v][1:v]overlay=0:0:shortest=1,'
                  f'eq=contrast=1.08:brightness=0.02:saturation=1.12,'
                  f'vignette=PI/6,format=yuv420p[outv]" '
                  f'-map "[outv]" -map 2:a '
                  f'-c:v libx264 -preset veryfast -crf 17 -b:v 7M '
                  f'-c:a aac -b:a 192k -t {total:.2f} -movflags +faststart {final}')
              sz = os.path.getsize(final) / 1024 / 1024
              R["video"] = {"file": final, "duration": f"{total:.2f}", "size": f"{sz:.2f}"}
              log("Video", "ok", f"{total:.2f}s | {sz:.2f}MB")

              # Upload Drive
              drive_link = upload_drive(final, "Hadith_Story")
              log("Drive", "ok" if drive_link else "fail", drive_link or "-")

              # Facebook Story
              if META_TOKEN and should_post_social:
                  pt = META_TOKEN
                  pid = os.environ.get("FACEBOOK_PAGE_ID", "").strip()
                  r = {"page_id": pid or "-", "status": "initiated"}
                  try:
                      if pid:
                          pt_resp = session.get(f"https://graph.facebook.com/v21.0/{pid}",
                              params={"fields": "access_token", "access_token": pt},
                              timeout=15).json()
                          page_token_actual = pt_resp.get("access_token", pt)
                          fs = os.path.getsize(final)
                          s = session.post(
                              f"https://graph.facebook.com/v21.0/{pid}/video_stories",
                              data={"upload_phase": "start", "file_size": fs,
                                    "access_token": page_token_actual},
                              timeout=30).json()
                          if s.get("error"):
                              r["status"] = f"fail: {s['error'].get('message','')[:80]}"
                          else:
                              vid, vurl = s.get("video_id"), s.get("upload_url")
                              if vid and vurl:
                                  with open(final, "rb") as f:
                                      u = session.post(vurl,
                                          headers={"Authorization": f"OAuth {page_token_actual}",
                                                   "offset": "0", "file_size": str(fs)},
                                          data=f.read(), timeout=180)
                                  if u.status_code in (200, 201):
                                      fin = session.post(
                                          f"https://graph.facebook.com/v21.0/{pid}/video_stories",
                                          data={"upload_phase": "finish", "video_id": vid,
                                                "access_token": page_token_actual},
                                          timeout=30).json()
                                      if fin.get("success") or fin.get("post_id"):
                                          r["status"] = "ok"
                                          r["post_id"] = fin.get("post_id", "-")
                                      else:
                                          r["status"] = "fail (finish)"
                                  else:
                                      r["status"] = f"fail (up {u.status_code})"
                              else:
                                  r["status"] = "fail (no video_id)"
                      else:
                          r["status"] = "fail (no page)"
                  except Exception as e:
                      r["status"] = f"fail ({str(e)[:60]})"
                  R["fb"] = r
                  log("FB Story", "ok" if r["status"] == "ok" else "fail", r["status"])
              else:
                  R["fb"] = {"status": "skipped"}
                  log("FB", "skip", "manual")

              # Cleanup
              for f in ["s_raw.mp3", "s_clean.mp3", "s_v.mp3", "s_voice.mp3",
                        "amb_raw.mp3", "bgl.txt"]:
                  if os.path.exists(f):
                      try: os.remove(f)
                      except: pass
              for i in range(5):
                  for f in [f"tmp_{i}.mp4", f"bg_{i}.mp4", f"tmp_mix_{i}.mp4"]:
                      if os.path.exists(f):
                          try: os.remove(f)
                          except: pass
              shutil.rmtree("story_frames", ignore_errors=True)
              log("Cleanup", "ok")

              status = "COMPLETED" if not R["errors"] else "PARTIAL"
              send_report(status)
              print("🕌 Alhamdulillah. Done.")

          if __name__ == "__main__":
              try:
                  main()
              except SystemExit:
                  raise
              except Exception as e:
                  print(traceback.format_exc())
                  log_err(f"Fatal: {str(e)[:150]}")
                  try:
                      send_report("FAILED", f"Uncaught: {str(e)[:120]}")
                  except Exception:
                      pass
                  sys.exit(1)
          PYEOF
          echo "✅ Python script created"
          wc -l scripts/story_video.py

      # ─────────────────────────────────────────────────────────────────────
      # 11. RUN MAIN PIPELINE
      # ─────────────────────────────────────────────────────────────────────
      - name: 🚀 Run Facebook Story Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          DRIVE_STORY_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          UPLOAD_TO_SOCIAL: ${{ inputs.upload_to_social || github.event.inputs.upload_to_social }}
          FONTS_DIR: ${{ env.DEPS_DIR }}/fonts
          DEPS_DIR: ${{ env.DEPS_DIR }}
          PIPER_DIR: ${{ env.DEPS_DIR }}/piper
          TOOLS_STATUS_FILE: ${{ env.DEPS_DIR }}/tools_status.json
        run: python3 "scripts/story_video.py"

      # ─────────────────────────────────────────────────────────────────────
      # 12. UPLOAD ARTIFACT
      # ─────────────────────────────────────────────────────────────────────
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fb-story-video
          path: Final_FB_Story.mp4
          retention-days: 5
          if-no-files-found: ignore

      # ─────────────────────────────────────────────────────────────────────
      # 13. CACHE STATUS
      # ─────────────────────────────────────────────────────────────────────
      - name: 📊 Cache Status
        if: always()
        run: |
          echo "Master Cache Hit: ${{ steps.master-cache.outputs.cache-hit }}"
          du -sh $DEPS_DIR 2>/dev/null || echo "no cache"
