          # TTS ENGINE (Edge → Piper → espeak)
          # ═══════════════════════════════════════════════════════════════
          def ck_a(p, m=3000): return os.path.exists(p) and os.path.getsize(p) > m

          def tts_edge(text, out):
              voices = ["hi-IN-MadhurNeural", "ur-IN-SalmanNeural",
                        "ur-PK-AsadNeural", "en-IN-PrabhatNeural"]
              for v in voices:
                  try:
                      tmp = out + ".txt"
                      with open(tmp, "w", encoding="utf-8") as f:
                          f.write(text)
                      if os.path.exists(out): os.remove(out)
                      cmd = (f'edge-tts --file "{tmp}" --write-media "{out}" '
                             f'--voice {v} --rate=-10% --pitch=-2Hz')
                      subprocess.run(cmd, shell=True, check=True, timeout=120)
                      if os.path.exists(tmp): os.remove(tmp)
                      if ck_a(out): return True, v
                  except Exception:
                      continue
              return False, "edge failed"

          def tts_piper(text, out):
              m = os.path.join(PIPER_DIR, "hi_IN-pratham-medium.onnx")
              if not os.path.exists(m): return False, "no model"
              try:
                  tmp = out + ".wav"
                  cmd = (f'echo "{text}" | piper --model "{m}" '
                         f'--output_file "{tmp}" --length_scale 1.08')
                  subprocess.run(cmd, shell=True, check=True, timeout=90)
                  if os.path.exists(tmp) and os.path.getsize(tmp) > 5000:
                      run(f'ffmpeg -y -i "{tmp}" -c:a libmp3lame -b:a 128k "{out}"')
                      os.remove(tmp)
                      if ck_a(out): return True, "piper (male)"
              except Exception:
                  pass
              return False, "piper failed"

          def tts_espeak(text, out):
              try:
                  tmp = out + ".wav"
                  cmd = f'espeak-ng -v hi+m3 -s 140 -p 40 -a 180 -w "{tmp}" "{text}"'
                  subprocess.run(cmd, shell=True, check=True, timeout=60)
                  if os.path.exists(tmp) and os.path.getsize(tmp) > 3000:
                      run(f'ffmpeg -y -i "{tmp}" -c:a libmp3lame -b:a 128k "{out}"')
                      os.remove(tmp)
                      if ck_a(out): return True, "espeak (male)"
              except Exception:
                  pass
              return False, "espeak failed"

          def gen_tts(text, out):
              text = sanitize(text)
              if not text:
                  R["tts"] = {"provider":"-","status":"empty"}
                  return False
              engines = [("2.edge", tts_edge), ("5.Piper", tts_piper), ("6.espeak", tts_espeak)]
              for name, fn in engines:
                  if os.path.exists(out):
                      try: os.remove(out)
                      except: pass
                  try:
                      ok, detail = fn(text, out)
                      if ok and ck_a(out):
                          R["audio"].append({"name": name, "status": "ok", "detail": detail})
                          R["tts"] = {"provider": name, "voice": detail, "status": "ok"}
                          R["plat"]["tts"] = name
                          return True
                      else:
                          R["audio"].append({"name": name, "status": "fail", "detail": detail})
                  except Exception as e:
                      R["audio"].append({"name": name, "status": "fail", "detail": str(e)[:40]})
              R["tts"] = {"provider":"-","status":"ALL FAILED"}
              return False

          def process_voice(inp, out):
              filters = ",".join([
                  "highpass=f=100", "lowpass=f=11000",
                  "equalizer=f=250:width_type=h:width=150:g=2",
                  "equalizer=f=3000:width_type=h:width=600:g=2",
                  "equalizer=f=7000:width_type=h:width=1500:g=-3",
                  "acompressor=threshold=-20dB:ratio=4:attack=5:release=150",
                  "dynaudnorm=f=200:g=15:p=0.9",
                  "loudnorm=I=-14:TP=-1.0:LRA=9", "volume=1.30",
              ])
              run(f'ffmpeg -y -i "{inp}" -af "{filters}" "{out}"')
              log_enh("Voice Processing")

