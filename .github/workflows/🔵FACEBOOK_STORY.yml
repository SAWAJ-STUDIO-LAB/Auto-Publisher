                  send_report("FAILED","TTS"); sys.exit(1)

              proc_voice("s_raw.mp3", "s_clean.mp3")
              vdur = MP3("s_clean.mp3").info.length
              print(f"[AUDIO] voice = {vdur:.2f}s")

              # ✅ Words निकालो
              hi_words = sanitize(hindi).split()
              ar_words = sanitize_ar(h.get("arabic","")).split()
              en_words = sanitize(h.get("english","")).split()

              n_hi, n_ar, n_en = max(1,len(hi_words)), max(1,len(ar_words)), max(1,len(en_words))

              # ✅ हर language की speed word-length के हिसाब से
              # Hindi = ज़्यादा words (translation), English = कम (original)
              # सब को voice के साथ finish होना चाहिए

              # Hindi rate = voice duration / Hindi word count
              # लेकिन minimum 0.55s प्रति word (readability के लिए)
              MIN_DUR = 0.55
              dur_hi = max(vdur / n_hi, MIN_DUR)
              dur_ar = max(vdur / n_ar, MIN_DUR)
              dur_en = max(vdur / n_en, MIN_DUR)

              # जो सबसे slow layer है उसकी speed के हिसाब से पूरा video length
              slowest_needed = max(n_hi * dur_hi, n_ar * dur_ar, n_en * dur_en)
              print(f"[SYNC] hi:{n_hi}@{dur_hi:.3f}s | ar:{n_ar}@{dur_ar:.3f}s | "
                    f"en:{n_en}@{dur_en:.3f}s | slowest={slowest_needed:.2f}s | voice={vdur:.2f}s")

              # अगर voice बहुत छोटी है → voice को extend करो silence से
              if slowest_needed > vdur + 0.3:
                  extra = slowest_needed - vdur + 0.3
                  print(f"[SYNC] Extending voice by {extra:.2f}s")
                  run(f'ffmpeg -y -i s_clean.mp3 -af "apad=pad_dur={extra:.2f}" s_v.mp3')
                  vdur = MP3("s_v.mp3").info.length
              else:
                  os.replace("s_clean.mp3", "s_v.mp3")

              R["sync"] = {
                  "hi_words": n_hi, "ar_words": n_ar, "en_words": n_en,
                  "dur_hi": f"{dur_hi:.3f}s", "dur_ar": f"{dur_ar:.3f}s", "dur_en": f"{dur_en:.3f}s",
                  "voice_final": f"{vdur:.2f}s",
              }

              get_amb(aic.get("ambience_query","rain nature"))
              fade = max(vdur - 3.0, 1.0)
              mix = (f"[0:a]volume=1.6,acompressor=threshold=-20dB:ratio=4:attack=5:release=150,"
                     f"dynaudnorm=f=200:g=15:p=0.9,loudnorm=I=-14:TP=-1.0:LRA=9[v];"
                     f"[1:a]volume=0.14,afade=t=in:st=0:d=3,afade=t=out:st={fade:.2f}:d=4[a];"
                     f"[v]asplit=2[vm][vs];"
                     f"[a][vs]sidechaincompress=threshold=0.05:ratio=8:attack=10:release=400[ad];"
                     f"[vm][ad]amix=inputs=2:duration=first:dropout_transition=2[o]")
              run(f'ffmpeg -y -i s_v.mp3 -i ambience.mp3 -filter_complex "{mix}" -map "[o]" -c:a libmp3lame -b:a 192k s_voice.mp3')

              bg = get_bg(aic.get("bg_queries", SAFE_BG[:3]), vdur + INTRO_SEC + OUTRO_SEC)
              hj = hijri()
              intro, outro = INTRO_SEC, OUTRO_SEC
              total = min(intro + vdur + outro, 75.0)
              os.makedirs("story_frames", exist_ok=True)

              F = {"big": get_font("NotoSans-Bold.ttf", 78), "s": get_font("NotoSans-Bold.ttf", 48),
                   "tiny": get_font("NotoSans-Regular.ttf", 32),
                   "hook": get_font("NotoSansDevanagari-Bold.ttf", 82),
                   "hi": get_font("NotoSansDevanagari-Bold.ttf", 68),
                   "ar": get_font("NotoNaskhArabic-Bold.ttf", 72),
                   "en": get_font("NotoSans-Bold.ttf", 58),
                   "bism": get_font("NotoNaskhArabic-Bold.ttf", 54),
                   "ameen": get_font("NotoNaskhArabic-Bold.ttf", 68)}

              fps = FPS
              tf = int(total * fps)
              GS = {"dots": 0}

              # ═══════════════════════════════════════════════════════════
              # ✅ FRAME LOOP — independent index
              # ═══════════════════════════════════════════════════════════
              for fi in range(tf):
                  t = fi / fps
                  prog = fi / tf
                  img = Image.new("RGBA",(W,H),(0,0,0,0))
                  d = ImageDraw.Draw(img)
                  if t < intro:
                      mt = t
                      if mt < 0.8:
                          ba = int(255*min(1.0,mt/0.3))
                          try:
                              bb = d.textbbox((0,0), BISMILLAH_ARABIC, font=F["bism"])
                              d.text((W//2-(bb[2]-bb[0])//2, int(H*0.18)), BISMILLAH_ARABIC,
                                     fill=tuple(palette["glow"])+(ba,), font=F["bism"])
                          except: pass
                      if aic["hook"]:
                          part = reveal(aic["hook"], mt-0.3, 0.30)
                          if part:
                              try: d.text((W//2, int(H*0.45)), part,
                                          fill=tuple(palette["text"])+(255,), font=F["hook"], anchor="mm")
                              except: pass
                      ba = int(220*min(1.0,mt/0.5))
                      d.text((W//2, int(H*0.68)), BRAND_NAME, fill=tuple(palette["primary"])+(ba,), font=F["s"], anchor="mm")
                  elif t < intro + vdur:
                      mt = t - intro
                      hi_i = min(int(mt / dur_hi), n_hi - 1) if mt > 0 else 0
                      ar_i = min(int(mt / dur_ar), n_ar - 1) if mt > 0 else 0
                      en_i = min(int(mt / dur_en), n_en - 1) if mt > 0 else 0
                      for wl, idx in [(hi_words,hi_i),(ar_words,ar_i),(en_words,en_i)]:
                          if idx < len(wl): GS["dots"] += 1
                      img = draw_vstack(img, hi_words, ar_words, en_words, hi_i, ar_i, en_i, palette, F)
                      d = ImageDraw.Draw(img)
                  else:
                      ot = t - (intro + vdur)
                      if aic["outro_main"]:
                          try: d.text((W//2, int(H*0.34)), aic["outro_main"],
                                      fill=tuple(palette["text"])+(255,), font=F["big"], anchor="mm")
                          except: pass
                      if aic["outro_cta"]:
                          try: d.text((W//2, int(H*0.44)), aic["outro_cta"],
                                      fill=tuple(palette["text"])+(255,), font=F["s"], anchor="mm")
                          except: pass
                      d.text((W//2, int(H*0.52)), BRAND_HANDLE, fill=tuple(palette["primary"])+(255,), font=F["tiny"], anchor="mm")
                      tg = "  ".join(aic["hashtags"][:4])
                      if tg: d.text((W//2, int(H*0.78)), tg, fill=tuple(palette["secondary"])+(220,), font=F["tiny"], anchor="mm")
                      if ot >= outro - 1.2:
                          aa = int(255*min(1.0,(ot-(outro-1.2))/0.6))
                          try:
                              bb = d.textbbox((0,0), AMEEN_ARABIC, font=F["ameen"])
                              d.text((W//2-(bb[2]-bb[0])//2, int(H*0.90)), AMEEN_ARABIC,
                                     fill=tuple(palette["glow"])+(aa,), font=F["ameen"])
                          except: pass
                  img = islamic_pattern(img, 0.05)
                  if t >= intro*0.5:
                      img = ref_card(img, h["collection"], h["number"], hj, palette)
                  if intro <= t < intro + vdur and aic["title"]:
                      img = title_chip(img, aic["title"], palette)
                  if 2.0 < t < 3.0:
                      ha = min(1.0, (t-2.0)/0.3) * (1 - (t-2.0)/1.0)
                      img = sound_hint(img, ha, palette, aic["sound_hint_text"])
                  img = prog_dots(img, prog, palette)
                  img = border(img, palette)
                  img = apply_emotion(img, aic["emotion"])
                  img.save(f"story_frames/frame_{fi:05d}.png")

              R["es"]["dots"] = GS["dots"]
              final = "Final_FB_Story.mp4"
              run(f'ffmpeg -y -i {bg} -framerate {fps} -i story_frames/frame_%05d.png -i s_voice.mp3 '
                  f'-filter_complex "[0:v][1:v]overlay=0:0:shortest=1,eq=contrast=1.08:brightness=0.02:'
                  f'saturation=1.12,vignette=PI/6,format=yuv420p[outv]" -map "[outv]" -map 2:a '
                  f'-c:v libx264 -preset veryfast -crf 17 -b:v 7M -c:a aac -b:a 192k '
                  f'-t {total:.2f} -movflags +faststart {final}')
              sz = os.path.getsize(final)/1024/1024
              R["video"] = {"duration": f"{total:.2f}", "size": f"{sz:.2f}"}

              drive_link = upload_drive(final, "Hadith_Story")

              if META_TOKEN and should_post_social:
                  pt = META_TOKEN
                  pid = os.environ.get("FACEBOOK_PAGE_ID","").strip()
                  r = {"status": "initiated"}
                  try:
                      if pid:
                          pt_resp = session.get(f"https://graph.facebook.com/v21.0/{pid}",
                              params={"fields":"access_token","access_token":pt}, timeout=15).json()
                          pta = pt_resp.get("access_token", pt)
                          fs = os.path.getsize(final)
                          s = session.post(f"https://graph.facebook.com/v21.0/{pid}/video_stories",
                              data={"upload_phase":"start","file_size":fs,"access_token":pta}, timeout=30).json()
                          if not s.get("error"):
                              vid, vurl = s.get("video_id"), s.get("upload_url")
                              if vid and vurl:
                                  with open(final,"rb") as f:
                                      session.post(vurl, headers={"Authorization":f"OAuth {pta}",
                                          "offset":"0","file_size":str(fs)}, data=f.read(), timeout=180)
                                  fin = session.post(f"https://graph.facebook.com/v21.0/{pid}/video_stories",
                                      data={"upload_phase":"finish","video_id":vid,"access_token":pta}, timeout=30).json()
                                  r["status"] = "ok" if (fin.get("success") or fin.get("post_id")) else "fail"
                      else: r["status"] = "no page id"
                  except Exception as e: r["status"] = f"fail: {str(e)[:60]}"
                  R["fb"] = r
              else:
                  R["fb"] = {"status": "skipped"}

              for f in ["s_raw.mp3","s_clean.mp3","s_v.mp3","s_voice.mp3","amb_raw.mp3","bgl.txt"]:
                  if os.path.exists(f):
                      try: os.remove(f)
                      except: pass
              for i in range(5):
                  for f in [f"tmp_{i}.mp4", f"bg_{i}.mp4", f"tmp_mix_{i}.mp4"]:
                      if os.path.exists(f):
                          try: os.remove(f)
                          except: pass
              shutil.rmtree("story_frames", ignore_errors=True)

              status = "COMPLETED" if not R["errors"] else "PARTIAL"
              send_report(status)
              print("Done.")

          if __name__ == "__main__":
              try:
                  main()
              except SystemExit:
                  raise
              except Exception as e:
                  print(traceback.format_exc())
                  log_err(f"Fatal: {str(e)[:150]}")
                  try: send_report("FAILED", f"{str(e)[:120]}")
                  except: pass
                  sys.exit(1)
          PYEOF

          echo "Script: $(wc -l < $DEPS_DIR/scripts/story.py) lines"
          python3 "$DEPS_DIR/scripts/story.py"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fb-story-video
          path: Final_FB_Story.mp4
          retention-days: 5
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          rm -f Final_FB_Story.mp4
          echo "Cache Hit: ${{ steps.master-cache.outputs.cache-hit }}"
