def sound_hint(img, alpha, pal, text="🔊 TURN SOUND ON"):
    try:
        overlay = Image.new("RGBA", img.size, (0, 0, 0, 0))
        d = ImageDraw.Draw(overlay)
        a = int(255 * alpha)
        font = get_font("NotoSans-Bold.ttf", 32)
        d.text((W // 2, int(H * 0.22)), text, fill=tuple(pal["glow"]) + (a,), font=font, anchor="mm")
        return Image.alpha_composite(img, overlay)
    except:
        return img

def prog_dots(img, progress, pal):
    try:
        d = ImageDraw.Draw(img)
        y = int(H * 0.96)
        bar_w = int(W * 0.8)
        x_start = (W - bar_w) // 2
        x_end = x_start + int(bar_w * progress)
        d.line([(x_start, y), (x_start + bar_w, y)], fill=(255, 255, 255, 60), width=6)
        if x_end > x_start:
            d.line([(x_start, y), (x_end, y)], fill=tuple(pal["primary"]) + (255,), width=6)
        return img
    except:
        return img

def border(img, pal):
    try:
        d = ImageDraw.Draw(img)
        m = 20
        d.rectangle([m, m, W - m, H - m], outline=tuple(pal["primary"]) + (180,), width=4)
        return img
    except:
        return img

