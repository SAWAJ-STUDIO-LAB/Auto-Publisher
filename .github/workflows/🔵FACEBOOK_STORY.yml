name: "Facebook Story"

on:
  workflow_dispatch:
    inputs:
      upload_to_social:
        description: "Upload to Facebook Story?"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "30 23 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: facebook-story
  cancel-in-progress: false

jobs:
  generate-story:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CACHE_VERSION: v12
      DEPS_DIR: ${{ github.workspace }}/.dependencies

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            .dependencies
            \~/.cache/pip
          key: \( {{ runner.os }}-fb-story- \){{ env.CACHE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-fb-story-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Tools
        run: |
          mkdir -p "$DEPS_DIR"/{bin,fonts,piper,python-venv}

          if [ -f "$DEPS_DIR/.ffmpeg_ok" ]; then
            echo "Using cached tools"
            sudo cp "$DEPS_DIR/bin/"* /usr/local/bin/ 2>/dev/null || true
            sudo chmod +x /usr/local/bin/* 2>/dev/null || true
          else
            sudo apt-get update -q
            sudo apt-get install -y -q ffmpeg sox espeak-ng libsox-fmt-all \
              fonts-noto fonts-noto-core fonts-dejavu-core fontconfig
            cp $(which ffmpeg) $(which ffprobe) $(which sox) "$DEPS_DIR/bin/" || true
            cp $(which espeak-ng) "$DEPS_DIR/bin/" || true
            touch "$DEPS_DIR/.ffmpeg_ok"
          fi
          ffmpeg -version | head -1

      - name: Setup Python Packages
        run: |
          VENV="$DEPS_DIR/python-venv"
          if [ ! -f "$VENV/.installed" ]; then
            python -m venv "$VENV"
            "$VENV/bin/pip" install --upgrade pip --quiet
            "$VENV/bin/pip" install --no-cache-dir \
              requests edge-tts mutagen Pillow \
              google-api-python-client google-auth-httplib2 google-auth-oauthlib
            touch "$VENV/.installed"
          fi
          echo "$VENV/bin" >> $GITHUB_PATH

      - name: Download Fonts
        run: |
          if [ ! -f "$DEPS_DIR/.fonts_ok" ]; then
            mkdir -p "$DEPS_DIR/fonts"
            BASE="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf"
            wget -q "$BASE/NotoSans/NotoSans-Regular.ttf" -O "$DEPS_DIR/fonts/NotoSans-Regular.ttf" || true
            wget -q "$BASE/NotoSans/NotoSans-Bold.ttf" -O "$DEPS_DIR/fonts/NotoSans-Bold.ttf" || true
            wget -q "$BASE/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf" -O "$DEPS_DIR/fonts/NotoSansDevanagari-Bold.ttf" || true
            wget -q "$BASE/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf" -O "$DEPS_DIR/fonts/NotoNaskhArabic-Bold.ttf" || true
            touch "$DEPS_DIR/.fonts_ok"
          fi
          mkdir -p \~/.fonts
          cp "$DEPS_DIR/fonts/"*.ttf \~/.fonts/ 2>/dev/null || true
          fc-cache -f > /dev/null 2>&1 || true

      - name: Download Piper
        run: |
          P="$DEPS_DIR/piper"
          if [ ! -f "$P/.installed" ]; then
            mkdir -p "$P"
            BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main"
            wget -q "$BASE/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx" -O "$P/hi_IN-pratham-medium.onnx" || true
            wget -q "$BASE/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx.json" -O "$P/hi_IN-pratham-medium.onnx.json" || true
            touch "$P/.installed"
          fi
          echo "PIPER_DIR=$P" >> $GITHUB_ENV

      - name: Create Script
        run: |
          mkdir -p scripts
          cat > scripts/story_video.py << 'PYEOF'
          #!/usr/bin/env python3
          import os, re, time, random, subprocess, requests, shutil, sys, json, traceback
          from datetime import datetime
          from mutagen.mp3 import MP3
          from PIL import Image, ImageDraw, ImageFont
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          session = requests.Session()
          session.mount("https://", HTTPAdapter(max_retries=Retry(total=4, backoff_factor=1.2, status_forcelist=[429,500,502,503,504])))

          TG_TOKEN   = os.environ.get("TELEGRAM_BOT_TOKEN")
          TG_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")
          DEPS_DIR   = os.environ.get("DEPS_DIR", ".")
          PIPER_DIR  = os.environ.get("PIPER_DIR", os.path.join(DEPS_DIR, "piper"))
          RUN_START  = time.time()

          FPS, INTRO, OUTRO = 25, 3.5, 5.0
          W, H = 1080, 1920
          BRAND = "SAWAJ STUDIO"
          HANDLE = "@SawajStudio"
          BISMILLAH = "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ"
          AMEEN = "آمین ثم آمین"

          BOOKS = [
              {"eng":"eng-bukhari","ara":"ara-bukhari","name":"सहीह अल-बुख़ारी","max":7563},
              {"eng":"eng-muslim","ara":"ara-muslim","name":"सहीह मुस्लिम","max":3032},
              {"eng":"eng-abudawud","ara":"ara-abudawud","name":"सुनन अबू दाऊद","max":5274},
              {"eng":"eng-tirmidhi","ara":"ara-tirmidhi","name":"जामी अत-तिर्मिज़ी","max":3956},
              {"eng":"eng-nasai","ara":"ara-nasai","name":"सुनन अन-नसाई","max":5758},
              {"eng":"eng-ibnmajah","ara":"ara-ibnmajah","name":"सुनन इब्न माजा","max":4341},
          ]

          PALETTE = {
              "primary":[212,175,55], "secondary":[255,220,120],
              "text":[255,245,220], "glow":[255,220,120]
          }

          COLORS = [(255,100,150),(80,180,255),(100,220,100),(255,200,60),(200,140,240),
                    (255,150,80),(140,200,255),(255,130,200),(150,220,180),(255,180,100)]

          R = {"errors":[], "hadith":{}, "tts":{}, "video":{}, "drive":{}}

          def log(msg, status="ok"):
              icons = {"ok":"✅","fail":"❌","warn":"⚠️","info":"ℹ️"}
              print(f"{icons.get(status,'•')} {msg}")

          def err(msg):
              R["errors"].append(str(msg)[:180])
              print(f"[ERR] {msg}")

          def sanitize(t):
              if not t: return ""
              t = re.sub(r'[\u200b-\u200f\ufeff\u202a-\u202e]', '', str(t))
              return t.replace('"','').replace("'",'').replace('\n',' ').strip()

          def run(cmd):
              print(f"[CMD] {cmd[:90]}...")
              subprocess.run(cmd, shell=True, check=True)

          def safe_run(cmd):
              try:
                  subprocess.run(cmd, shell=True, check=True)
                  return True
              except Exception as e:
                  print(f"[SAFE] {e}")
                  return False

          def color_for(word):
              h = 0
              for c in str(word): h = (h*31 + ord(c)) & 0xFFFFFFFF
              return COLORS[h % len(COLORS)]

          def send_report(status="COMPLETED", note=""):
              dur = int(time.time() - RUN_START)
              lines = ["🕌 <b>ISLAMIC HADITH STORY</b>", "━━━━━━━━━━━━━━━",
                       f"{'🎉' if status=='COMPLETED' else '❌'} <b>{status}</b>"]
              if note: lines.append(f"📝 {note}")
              lines.append(f"⏱️ {dur//60}m {dur%60}s")
              if R.get("hadith"):
                  h = R["hadith"]
                  lines.append(f"\n📖 <b>{h.get('collection','-')}</b> #{h.get('number','-')}")
              if R.get("video"):
                  v = R["video"]
                  lines.append(f"\n🎬 {v.get('duration','-')}s | {v.get('size','-')}MB")
              if R.get("drive",{}).get("link"):
                  lines.append(f"\n☁️ {R['drive']['link']}")
              if R["errors"]:
                  lines.append("\n❌ Errors:")
                  for e in R["errors"][:3]: lines.append(f"  • {e}")
              msg = "\n".join(lines)[:3900]
              print("="*50); print(msg); print("="*50)
              if TG_TOKEN and TG_CHAT_ID:
                  try:
                      session.post(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                          json={"chat_id":TG_CHAT_ID,"text":msg,"parse_mode":"HTML"}, timeout=15)
                  except: pass

          def call_ai(prompt):
              keys = [
                  ("OPENROUTER_API_KEY", "https://openrouter.ai/api/v1/chat/completions", "openai/gpt-4o-mini"),
                  ("GROQ_API_KEY", "https://api.groq.com/openai/v1/chat/completions", "llama-3.3-70b-versatile"),
              ]
              for env, url, model in keys:
                  key = os.environ.get(env)
                  if not key: continue
                  try:
                      r = session.post(url, headers={"Authorization":f"Bearer {key}","Content-Type":"application/json"},
                          json={"model":model,"messages":[{"role":"user","content":prompt}],"temperature":0.85,"max_tokens":900},
                          timeout=50)
                      if r.status_code == 200:
                          return r.json()["choices"][0]["message"]["content"].strip()
                  except Exception as e:
                      print(f"[AI] {env} failed: {e}")
              # Gemini fallback
              gkey = os.environ.get("GEMINI_API_KEY")
              if gkey:
                  try:
                      r = session.post(f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={gkey}",
                          json={"contents":[{"parts":[{"text":prompt}]}]}, timeout=50)
                      if r.status_code == 200:
                          return r.json()["candidates"][0]["content"]["parts"][0]["text"].strip()
                  except: pass
              return None

          def tts_edge(text, out):
              for voice in ["hi-IN-MadhurNeural", "ur-IN-SalmanNeural", "en-IN-PrabhatNeural"]:
                  try:
                      tmp = out + ".txt"
                      with open(tmp,"w",encoding="utf-8") as f: f.write(text)
                      if os.path.exists(out): os.remove(out)
                      subprocess.run(f'edge-tts --file "{tmp}" --write-media "{out}" --voice {voice} --rate=-8%',
                                     shell=True, check=True, timeout=100)
                      if os.path.exists(tmp): os.remove(tmp)
                      if os.path.exists(out) and os.path.getsize(out) > 4000:
                          return True
                  except: continue
              return False

          def tts_piper(text, out):
              model = os.path.join(PIPER_DIR, "hi_IN-pratham-medium.onnx")
              if not os.path.exists(model): return False
              try:
                  tmp = out + ".wav"
                  subprocess.run(f'echo "{text}" | piper --model "{model}" --output_file "{tmp}" --length_scale 1.05',
                                 shell=True, check=True, timeout=80)
                  if os.path.exists(tmp) and os.path.getsize(tmp) > 5000:
                      safe_run(f'ffmpeg -y -i "{tmp}" -c:a libmp3lame -b:a 128k "{out}"')
                      os.remove(tmp)
                      return os.path.exists(out) and os.path.getsize(out) > 4000
              except: pass
              return False

          def generate_tts(text, out):
              text = sanitize(text)
              if not text: return False
              if tts_edge(text, out):
                  R["tts"] = {"provider":"edge"}
                  return True
              if tts_piper(text, out):
                  R["tts"] = {"provider":"piper"}
                  return True
              return False

          def fetch_hadith():
              bases = ["https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1",
                       "https://raw.githubusercontent.com/fawazahmed0/hadith-api/1"]
              recent = []
              try:
                  if os.path.exists("recent_hadiths.json"):
                      with open("recent_hadiths.json") as f: recent = json.load(f)
              except: pass

              for _ in range(35):
                  book = random.choice(BOOKS)
                  num = random.randint(1, max(1, book["max"]-40))
                  key = f"{book['eng']}:{num}"
                  if key in recent[-20:]: continue
                  for base in bases:
                      try:
                          r = session.get(f"{base}/editions/{book['eng']}/{num}.json", timeout=11)
                          if r.status_code != 200: continue
                          data = r.json().get("hadiths", [])
                          if not data: continue
                          eng = sanitize(data[0].get("text",""))
                          if not (140 <= len(eng) <= 680): continue
                          ara = ""
                          try:
                              ar = session.get(f"{base}/editions/{book['ara']}/{num}.json", timeout=9)
                              if ar.status_code == 200:
                                  ad = ar.json().get("hadiths",[])
                                  if ad: ara = sanitize(ad[0].get("text",""))
                          except: pass
                          recent.append(key)
                          recent = recent[-35:]
                          try:
                              with open("recent_hadiths.json","w") as f: json.dump(recent,f)
                          except: pass
                          res = {"collection":book["name"],"number":str(data[0].get("hadithnumber") or num),
                                 "english":eng,"arabic":ara}
                          R["hadith"] = res
                          return res
                      except: continue
              res = {"collection":"Sahih al-Bukhari","number":"1",
                     "english":"The reward of deeds depends upon the intentions.",
                     "arabic":"إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ"}
              R["hadith"] = res
              return res

          def draw_stack(img, hi, ar, en, fonts, alpha=255):
              try:
                  d = ImageDraw.Draw(img)
                  x_dot, x_txt = int(W*0.08), int(W*0.13)
                  base = int(H*0.48)
                  gap = 110
                  for word, font, y, rad in [(hi,fonts["hi"],base-gap,16),(ar,fonts["ar"],base,18),(en,fonts["en"],base+gap,14)]:
                      if not word: continue
                      col = color_for(word)
                      d.ellipse([x_dot-rad,y-rad,x_dot+rad,y+rad], fill=col+(alpha,))
                      for dx,dy in [(-3,-3),(3,-3),(-3,3),(3,3),(0,-3),(0,3),(-3,0),(3,0)]:
                          d.text((x_txt+dx,y+dy), word, fill=(0,0,0,int(190*alpha/255)), font=font, anchor="lm")
                      d.text((x_txt,y), word, fill=tuple(PALETTE["text"])+(alpha,), font=font, anchor="lm")
              except Exception as e:
                  print(f"[DRAW] {e}")
              return img

          def main():
              print("🕌 Islamic Hadith Story Generator")
              log("Start", "info")

              # Hadith
              h = fetch_hadith()
              log(f"Hadith: {h['collection']} #{h['number']}")

              # Hindi
              hindi = call_ai(f"Is English Hadith ka natural Hindi tarjuma likho. Sirf tarjuma do.\n\n{h['english']}") or h["english"]
              hindi = sanitize(hindi)
              h["hindi"] = hindi

              # Simple AI content
              hook = "क्या आप जानते हैं?"
              intro = ""
              cta = "इस हदीस को 3 दोस्तों को भेजें।"
              ai_raw = call_ai(f'''Return only JSON: {{"hook":"Hindi 4-6 words","intro":"Hindi 3-5 words","cta":"Hindi CTA"}}
          Hadith: {h["english"][:250]}''')
              if ai_raw:
                  try:
                      m = re.search(r'\{.*\}', ai_raw, re.DOTALL)
                      if m:
                          data = json.loads(m.group(0))
                          hook = sanitize(data.get("hook", hook)) or hook
                          intro = sanitize(data.get("intro", ""))
                          cta = sanitize(data.get("cta", cta)) or cta
                  except: pass

              # TTS
              tts_text = f"{intro} {hindi}".strip() or h["english"]
              if not generate_tts(tts_text, "s_raw.mp3"):
                  err("TTS completely failed")
                  send_report("FAILED", "TTS failed")
                  sys.exit(1)
              log(f"TTS: {R['tts'].get('provider')}")

              # Check TTS file
              if not os.path.exists("s_raw.mp3") or os.path.getsize("s_raw.mp3") < 4000:
                  err("s_raw.mp3 missing or too small")
                  send_report("FAILED", "TTS file invalid")
                  sys.exit(1)

              # Voice process (safe)
              if not safe_run('ffmpeg -y -i s_raw.mp3 -af "highpass=f=80,lowpass=f=10000,volume=1.25" s_clean.mp3'):
                  # fallback: just copy
                  shutil.copy("s_raw.mp3", "s_clean.mp3")

              if not os.path.exists("s_clean.mp3"):
                  err("Voice processing failed")
                  send_report("FAILED", "Audio process failed")
                  sys.exit(1)

              vdur = MP3("s_clean.mp3").info.length
              if vdur < 8:
                  err(f"Audio too short: {vdur:.1f}s")
                  send_report("FAILED", "Audio too short")
                  sys.exit(1)

              # Limit duration
              if vdur > 55:
                  safe_run(f'ffmpeg -y -i s_clean.mp3 -af "atempo=1.12" s_v.mp3')
              else:
                  shutil.copy("s_clean.mp3", "s_v.mp3")
              vdur = MP3("s_v.mp3").info.length
              log(f"Audio duration: {vdur:.1f}s")

              # Silent ambience + mix
              safe_run('ffmpeg -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 80 -c:a libmp3lame ambience.mp3')
              safe_run(f'ffmpeg -y -i s_v.mp3 -i ambience.mp3 -filter_complex "[0:a]volume=1.4[a0];[1:a]volume=0.08[a1];[a0][a1]amix=inputs=2:duration=first[a]" -map "[a]" -c:a libmp3lame -b:a 192k s_voice.mp3')

              if not os.path.exists("s_voice.mp3"):
                  shutil.copy("s_v.mp3", "s_voice.mp3")

              total = min(INTRO + vdur + OUTRO, 62)

              # Simple background
              safe_run(f'ffmpeg -y -f lavfi -i "color=c=0x1a1208:s=1080x1920:d={total}" -c:v libx264 -preset veryfast -crf 20 bg.mp4')

              # Fonts
              fd = os.path.expanduser("\~/.fonts")
              try:
                  fonts = {
                      "big": ImageFont.truetype(f"{fd}/NotoSans-Bold.ttf", 70),
                      "s": ImageFont.truetype(f"{fd}/NotoSans-Bold.ttf", 44),
                      "tiny": ImageFont.truetype(f"{fd}/NotoSans-Regular.ttf", 28),
                      "hook": ImageFont.truetype(f"{fd}/NotoSansDevanagari-Bold.ttf", 72),
                      "hi": ImageFont.truetype(f"{fd}/NotoSansDevanagari-Bold.ttf", 50),
                      "ar": ImageFont.truetype(f"{fd}/NotoNaskhArabic-Bold.ttf", 56),
                      "en": ImageFont.truetype(f"{fd}/NotoSans-Bold.ttf", 38),
                      "bism": ImageFont.truetype(f"{fd}/NotoNaskhArabic-Bold.ttf", 52),
                      "ameen": ImageFont.truetype(f"{fd}/NotoNaskhArabic-Bold.ttf", 64),
                  }
              except:
                  d = ImageFont.load_default()
                  fonts = {k:d for k in ["big","s","tiny","hook","hi","ar","en","bism","ameen"]}

              # Render frames
              os.makedirs("story_frames", exist_ok=True)
              tf = int(total * FPS)
              hi_w = sanitize(hindi).split()
              ar_w = sanitize(h.get("arabic","")).split()
              en_w = sanitize(h["english"]).split()
              mw = max(len(hi_w), len(ar_w), len(en_w), 1)
              wd = vdur / mw

              print(f"Rendering {tf} frames...")
              for i in range(tf):
                  t = i / FPS
                  img = Image.new("RGBA", (W,H), (0,0,0,0))
                  draw = ImageDraw.Draw(img)

                  if t < INTRO:
                      mt = t
                      if mt < 0.85:
                          a = int(255 * min(1, mt/0.3))
                          try:
                              bb = draw.textbbox((0,0), BISMILLAH, font=fonts["bism"])
                              draw.text(((W-(bb[2]-bb[0]))//2, int(H*0.17)), BISMILLAH,
                                        fill=tuple(PALETTE["glow"])+(a,), font=fonts["bism"])
                          except: pass
                      words = sanitize(hook).split()
                      show = max(0, min(len(words), int((mt-0.25)/0.22)+1))
                      part = " ".join(words[:show])
                      if part:
                          for dx,dy in [(-2,-2),(2,-2),(-2,2),(2,2)]:
                              draw.text((W//2+dx, int(H*0.44)+dy), part, fill=(0,0,0,170), font=fonts["hook"], anchor="mm")
                          draw.text((W//2, int(H*0.44)), part, fill=tuple(PALETTE["text"])+(255,), font=fonts["hook"], anchor="mm")
                      a = int(210 * min(1, mt/0.45))
                      draw.text((W//2, int(H*0.67)), BRAND, fill=tuple(PALETTE["primary"])+(a,), font=fonts["s"], anchor="mm")

                  elif t < INTRO + vdur:
                      mt = t - INTRO
                      idx = int(mt / wd)
                      chi = hi_w[idx] if idx < len(hi_w) else ""
                      car = ar_w[idx] if idx < len(ar_w) else ""
                      cen = en_w[idx] if idx < len(en_w) else ""
                      local = mt - idx*wd
                      fade = min(1.0, local/0.22)
                      img = draw_stack(img, chi, car, cen, fonts, int(255*fade))

                  else:
                      try:
                          draw.text((W//2, int(H*0.33)), "Fi Amanillah", fill=tuple(PALETTE["text"])+(255,), font=fonts["big"], anchor="mm")
                          draw.text((W//2, int(H*0.45)), cta, fill=tuple(PALETTE["text"])+(255,), font=fonts["s"], anchor="mm")
                          draw.text((W//2, int(H*0.55)), HANDLE, fill=tuple(PALETTE["primary"])+(255,), font=fonts["tiny"], anchor="mm")
                          draw.text((W//2, int(H*0.80)), "#Hadith  #Sunnah  #Islam", fill=tuple(PALETTE["secondary"])+(210,), font=fonts["tiny"], anchor="mm")
                      except: pass
                      ot = t - (INTRO+vdur)
                      if ot > OUTRO-1.3:
                          aa = int(255 * min(1, (ot-(OUTRO-1.3))/0.5))
                          try:
                              bb = draw.textbbox((0,0), AMEEN, font=fonts["ameen"])
                              draw.text(((W-(bb[2]-bb[0]))//2, int(H*0.89)), AMEEN,
                                        fill=tuple(PALETTE["glow"])+(aa,), font=fonts["ameen"])
                          except: pass

                  img.save(f"story_frames/frame_{i:05d}.png")

              log(f"Frames done: {tf}")

              # Final video
              final = "Final_FB_Story.mp4"
              ok = safe_run(f'ffmpeg -y -i bg.mp4 -framerate {FPS} -i story_frames/frame_%05d.png -i s_voice.mp3 '
                            f'-filter_complex "[0:v][1:v]overlay=0:0:shortest=1,format=yuv420p[v]" '
                            f'-map "[v]" -map 2:a -c:v libx264 -preset veryfast -crf 18 -c:a aac -b:a 192k '
                            f'-t {total:.1f} -movflags +faststart {final}')

              if not ok or not os.path.exists(final):
                  err("Final render failed")
                  send_report("FAILED", "Video render failed")
                  sys.exit(1)

              size = os.path.getsize(final)/1024/1024
              R["video"] = {"duration":f"{total:.1f}", "size":f"{size:.1f}"}
              log(f"Video ready: {total:.1f}s | {size:.1f}MB")

              # Drive upload
              try:
                  if os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN"):
                      creds = Credentials(None,
                          refresh_token=os.environ["GOOGLE_DRIVE_REFRESH_TOKEN"],
                          client_id=os.environ.get("GOOGLE_DRIVE_CLIENT_ID"),
                          client_secret=os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET"),
                          token_uri="https://oauth2.googleapis.com/token")
                      svc = build("drive","v3",credentials=creds,cache_discovery=False)
                      meta = {"name":f"Hadith_{int(time.time())}.mp4"}
                      fid = os.environ.get("DRIVE_STORY_FOLDER_ID")
                      if fid: meta["parents"] = [fid]
                      up = svc.files().create(body=meta,
                          media_body=MediaFileUpload(final,mimetype="video/mp4",resumable=True),
                          fields="id").execute()
                      did = up.get("id")
                      svc.permissions().create(fileId=did,body={"type":"anyone","role":"reader"}).execute()
                      R["drive"] = {"link":f"https://drive.google.com/file/d/{did}/view"}
                      log("Uploaded to Drive")
              except Exception as e:
                  print(f"[Drive] {e}")

              # Cleanup
              for f in ["s_raw.mp3","s_clean.mp3","s_v.mp3","s_voice.mp3","ambience.mp3","bg.mp4"]:
                  if os.path.exists(f):
                      try: os.remove(f)
                      except: pass
              shutil.rmtree("story_frames", ignore_errors=True)

              send_report("COMPLETED")
              print("🕌 Alhamdulillah")

          if __name__ == "__main__":
              try:
                  main()
              except SystemExit: raise
              except Exception as e:
                  print(traceback.format_exc())
                  err(f"Fatal: {str(e)[:140]}")
                  send_report("FAILED", str(e)[:100])
                  sys.exit(1)
          PYEOF
          echo "Script created"

      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          DRIVE_STORY_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          DEPS_DIR: ${{ env.DEPS_DIR }}
          PIPER_DIR: ${{ env.DEPS_DIR }}/piper
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          UPLOAD_TO_SOCIAL: ${{ inputs.upload_to_social }}
        run: python scripts/story_video.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fb-story-video
          path: Final_FB_Story.mp4
          retention-days: 4
          if-no-files-found: ignore
