name: "🔵FACEBOOK STORY"

on:
  workflow_dispatch:
    inputs:
      upload_to_social:
        description: 'Upload to Facebook Story?'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '30 23 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: facebook-story
  cancel-in-progress: false

jobs:
  fb-story:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CACHE_VERSION: v16
      DEPS_DIR: ${{ github.workspace }}/.dependencies
      PYTHON_VERSION: '3.11'

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore Master Dependencies Cache
        id: master-cache
        uses: actions/cache@v4
        with:
          path: |
            .dependencies
            \~/.cache/pip
            \~/.local/share/piper
          key: \( {{ runner.os }}-fb-story-master- \){{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements.txt') || 'default' }}
          restore-keys: |
            \( {{ runner.os }}-fb-story-master- \){{ env.CACHE_VERSION }}-
            ${{ runner.os }}-fb-story-master-

      - name: Prepare Dependencies Folder
        run: |
          mkdir -p "$DEPS_DIR"/{bin,fonts,models,system-fonts,python-venv,piper,coqui,logs,libs,tmp}
          echo "DEPS_DIR=$DEPS_DIR" >> $GITHUB_ENV
          echo "TMPDIR=$DEPS_DIR/tmp" >> $GITHUB_ENV

      - name: Fetch Code from Private Repository
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
        run: |
          set -euo pipefail
          PRIVATE_REPO="SAWAJ-STUDIO-LAB/admin"
          if [ -z "${TOKEN_GITHUB:-}" ]; then
            echo "TOKEN_GITHUB missing"
            exit 1
          fi
          rm -rf temp_private_repo
          git clone --depth 1 --single-branch https://x-access-token:\( {TOKEN_GITHUB}@github.com/ \){PRIVATE_REPO}.git temp_private_repo
          mkdir -p "Social media/Facebook"
          if [ ! -f "temp_private_repo/Social media/Facebook/Story_video.py" ]; then
            echo "Story_video.py not found in private repo"
            ls -la temp_private_repo/ || true
            exit 1
          fi
          cp "temp_private_repo/Social media/Facebook/Story_video.py" "Social media/Facebook/Story_video.py"
          chmod +x "Social media/Facebook/Story_video.py" || true
          rm -rf temp_private_repo
          ls -la "Social media/Facebook/"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: FFmpeg + System Fonts Cache-Aware
        run: |
          set -euo pipefail
          MARKER="$DEPS_DIR/.ffmpeg_ok"
          LIB_DIR="$DEPS_DIR/libs"
          BIN_DIR="$DEPS_DIR/bin"

          install_fresh() {
            echo "Fresh install of ffmpeg sox espeak-ng fonts"
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              ffmpeg sox espeak-ng libsox-fmt-all \
              fonts-noto fonts-noto-core fonts-noto-extra fonts-noto-ui-core \
              fonts-noto-color-emoji fonts-dejavu-core fontconfig \
              libavcodec-extra libavformat-dev libswscale-dev
            sudo ldconfig
          }

          restore_from_cache() {
            echo "Restoring FFmpeg + SoX from cache"
            if [ -d "$LIB_DIR" ]; then
              sudo mkdir -p /usr/lib/x86_64-linux-gnu
              sudo cp -n "$LIB_DIR"/*.so* /usr/lib/x86_64-linux-gnu/ 2>/dev/null || true
              sudo ldconfig
            fi
            sudo mkdir -p /usr/local/bin
            for b in ffmpeg ffprobe sox espeak-ng; do
              if [ -f "$BIN_DIR/$b" ]; then
                sudo cp "$BIN_DIR/$b" /usr/local/bin/$b
                sudo chmod +x /usr/local/bin/$b
              fi
            done
            if [ -d "$DEPS_DIR/system-fonts/truetype" ]; then
              sudo mkdir -p /usr/share/fonts/truetype
              sudo cp -rn "$DEPS_DIR/system-fonts/truetype/"* /usr/share/fonts/truetype/ 2>/dev/null || true
              sudo fc-cache -f >/dev/null 2>&1 || true
            fi
          }

          if [ -f "$MARKER" ] && [ -f "$BIN_DIR/ffmpeg" ] && [ -f "$BIN_DIR/sox" ]; then
            restore_from_cache
            if ffmpeg -version >/dev/null 2>&1 && sox --version >/dev/null 2>&1; then
              echo "Cache verified"
            else
              echo "Cache broken - reinstalling"
              rm -f "$MARKER"
              install_fresh
            fi
          else
            install_fresh
          fi

          mkdir -p "$BIN_DIR" "$LIB_DIR" "$DEPS_DIR/system-fonts/truetype"
          for b in ffmpeg ffprobe sox espeak-ng; do
            if command -v $b >/dev/null 2>&1; then
              cp "$(which $b)" "$BIN_DIR/$b" 2>/dev/null || true
            fi
          done

          for bin in ffmpeg ffprobe sox; do
            if command -v $bin >/dev/null 2>&1; then
              ldd "$(which $bin)" 2>/dev/null | grep "=> /" | awk '{print $3}' | while read -r lib; do
                [ -f "$lib" ] && cp -n "$lib" "$LIB_DIR/" 2>/dev/null || true
              done
            fi
          done
          for libglob in /usr/lib/x86_64-linux-gnu/libav*.so* \
                          /usr/lib/x86_64-linux-gnu/libsw*.so* \
                          /usr/lib/x86_64-linux-gnu/libpostproc*.so* \
                          /usr/lib/x86_64-linux-gnu/libsox*.so* \
                          /usr/lib/x86_64-linux-gnu/libespeak*.so*; do
            [ -f "$libglob" ] && cp -n "$libglob" "$LIB_DIR/" 2>/dev/null || true
          done

          cp -rn /usr/share/fonts/truetype/* "$DEPS_DIR/system-fonts/truetype/" 2>/dev/null || true
          touch "$MARKER"
          ffmpeg -version 2>&1 | head -1
          sox --version 2>&1 | head -1
          espeak-ng --version 2>&1 | head -1 || true

      - name: Custom Fonts Cache-Aware
        run: |
          set -euo pipefail
          FORCE_DOWNLOAD=0
          FONTS_DIR="$DEPS_DIR/fonts"
          mkdir -p "$FONTS_DIR"

          REQUIRED_FONTS=(
            "NotoEmoji-Regular.ttf"
            "NotoSansDevanagari-Bold.ttf"
            "NotoNaskhArabic-Bold.ttf"
            "NotoSans-Bold.ttf"
            "NotoSans-Regular.ttf"
            "NotoSansDevanagari-Regular.ttf"
            "NotoNaskhArabic-Regular.ttf"
            "NotoEmoji-Bold.ttf"
            "NotoColorEmoji.ttf"
          )

          for f in "${REQUIRED_FONTS[@]}"; do
            if [ ! -f "$FONTS_DIR/$f" ]; then
              FORCE_DOWNLOAD=1
              break
            fi
          done

          if [ -f "$FONTS_DIR/NotoSansDevanagari-Bold.ttf" ]; then
            SZ=$(stat -c%s "$FONTS_DIR/NotoSansDevanagari-Bold.ttf" 2>/dev/null || echo 0)
            if [ "$SZ" -lt 50000 ]; then
              FORCE_DOWNLOAD=1
            fi
          fi

          if [ $FORCE_DOWNLOAD -eq 0 ] && [ -f "\( DEPS_DIR/.fonts_ok" ] && [ " \)(ls -A $FONTS_DIR 2>/dev/null | wc -l)" -ge 9 ]; then
            echo "Custom fonts CACHED"
          else
            echo "Downloading fonts"
            rm -rf "$FONTS_DIR"
            mkdir -p "$FONTS_DIR"

            declare -A FONTS=(
              ["NotoSans-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSans/NotoSans-Regular.ttf"
              ["NotoSans-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSans/NotoSans-Bold.ttf"
              ["NotoSansDevanagari-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf"
              ["NotoSansDevanagari-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf"
              ["NotoNaskhArabic-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf"
              ["NotoNaskhArabic-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf"
              ["NotoEmoji-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-emoji@main/fonts/NotoEmoji-Regular.ttf"
              ["NotoEmoji-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-emoji@main/fonts/NotoEmoji-Bold.ttf"
              ["NotoColorEmoji.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-emoji@main/fonts/NotoColorEmoji.ttf"
            )

            for name in "${!FONTS[@]}"; do
              echo "Downloading $name"
              for attempt in 1 2 3; do
                if wget -q --timeout=90 --tries=2 "${FONTS[$name]}" -O "$FONTS_DIR/$name"; then
                  break
                fi
                sleep 2
              done
            done

            ls -la "$FONTS_DIR/"

            for font in "$FONTS_DIR/"*.ttf; do
              if [ -f "$font" ]; then
                MAGIC=$(xxd -p -l 4 "$font" 2>/dev/null | tr 'a-f' 'A-F' || echo "")
                SZ=$(stat -c%s "$font" 2>/dev/null || echo 0)
                if [[ "$MAGIC" == "00010000" || "$MAGIC" == "74727565" || "$MAGIC" == "4F54544F" ]] && [ "$SZ" -gt 1000 ]; then
                  echo "VALID: $(basename $font) - $SZ bytes"
                else
                  echo "CORRUPT: $(basename $font) - $SZ bytes"
                  rm -f "$font"
                fi
              fi
            done

            touch "$DEPS_DIR/.fonts_ok"
          fi

          mkdir -p \~/.fonts
          cp "$FONTS_DIR/"*.ttf \~/.fonts/ 2>/dev/null || true
          fc-cache -f >/dev/null 2>&1 || true
          ls -la \~/.fonts/ || true

      - name: Python Packages Cache-Aware
        run: |
          set -euo pipefail
          VENV="$DEPS_DIR/python-venv"
          REQUIRED_IMPORTS="edge_tts PIL mutagen gtts requests numpy scipy soundfile"

          if [ -f "$VENV/.installed" ] && "$VENV/bin/python" -c "import edge_tts, PIL, mutagen, gtts, requests, numpy, scipy, soundfile" 2>/dev/null; then
            echo "Python packages CACHED"
          else
            echo "Python packages install"
            rm -rf "$VENV"
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --upgrade pip setuptools wheel --quiet
            "$VENV/bin/pip" install --no-cache-dir \
              requests \
              edge-tts \
              mutagen \
              Pillow \
              google-api-python-client \
              google-auth-httplib2 \
              google-auth-oauthlib \
              gTTS \
              piper-tts \
              numpy \
              scipy \
              soundfile \
              httpx \
              aiohttp \
              tenacity \
              python-dotenv
            touch "$VENV/.installed"
          fi
          echo "$VENV/bin" >> $GITHUB_PATH
          "$VENV/bin/python" -c "import sys; print(sys.version)"
          "$VENV/bin/pip" list | head -30

      - name: Piper Models Cache-Aware
        run: |
          set -euo pipefail
          P="$DEPS_DIR/piper"
          mkdir -p "$P"

          if [ -f "$P/.installed" ] && [ -f "$P/hi_IN-pratham-medium.onnx" ] && [ -f "$P/hi_IN-priyamvada-medium.onnx" ]; then
            echo "Piper models CACHED"
          else
            echo "Piper models download"
            rm -rf "$P"
            mkdir -p "$P"
            cd "$P"
            BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main"
            for attempt in 1 2 3; do
              wget -q --timeout=120 --tries=2 "$BASE/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx" -O hi_IN-pratham-medium.onnx && break
              sleep 3
            done
            for attempt in 1 2 3; do
              wget -q --timeout=120 --tries=2 "$BASE/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx.json" -O hi_IN-pratham-medium.onnx.json && break
              sleep 3
            done
            for attempt in 1 2 3; do
              wget -q --timeout=120 --tries=2 "$BASE/hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium.onnx" -O hi_IN-priyamvada-medium.onnx && break
              sleep 3
            done
            for attempt in 1 2 3; do
              wget -q --timeout=120 --tries=2 "$BASE/hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium.onnx.json" -O hi_IN-priyamvada-medium.onnx.json && break
              sleep 3
            done
            touch "$P/.installed"
            cd "$GITHUB_WORKSPACE"
          fi
          echo "PIPER_DIR=$P" >> $GITHUB_ENV
          ls -la "$P/" || true

      - name: Master Tool Health Check
        id: health
        run: |
          set -euo pipefail
          REPORT_FILE="$DEPS_DIR/tools_status.json"
          {
            echo "{"
            echo "  \"checked_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo "  \"tools\": {"
          } > "$REPORT_FILE"

          FIRST=1
          add_entry() {
            local name="$1"
            local status="$2"
            local detail="$3"
            if [ $FIRST -eq 0 ]; then
              echo "," >> "$REPORT_FILE"
            fi
            FIRST=0
            printf '    "%s": {"status": "%s", "detail": "%s"}' "$name" "$status" "$detail" >> "$REPORT_FILE"
            echo "[HEALTH] $name $status $detail"
          }

          command -v ffmpeg >/dev/null 2>&1 && add_entry "ffmpeg" "ok" "present" || add_entry "ffmpeg" "fail" "not found"
          command -v ffprobe >/dev/null 2>&1 && add_entry "ffprobe" "ok" "present" || add_entry "ffprobe" "fail" "not found"
          command -v sox >/dev/null 2>&1 && add_entry "sox" "ok" "present" || add_entry "sox" "fail" "not found"
          command -v espeak-ng >/dev/null 2>&1 && add_entry "espeak-ng" "ok" "present" || add_entry "espeak-ng" "fail" "not found"
          command -v edge-tts >/dev/null 2>&1 && add_entry "edge-tts" "ok" "present" || add_entry "edge-tts" "fail" "not found"
          command -v gtts-cli >/dev/null 2>&1 && add_entry "gtts" "ok" "present" || add_entry "gtts" "fail" "not found"
          command -v piper >/dev/null 2>&1 && add_entry "piper-cli" "ok" "present" || add_entry "piper-cli" "fail" "not found"

          [ -f "$DEPS_DIR/piper/hi_IN-pratham-medium.onnx" ] && add_entry "piper-pratham" "ok" "present" || add_entry "piper-pratham" "fail" "missing"
          [ -f "$DEPS_DIR/piper/hi_IN-priyamvada-medium.onnx" ] && add_entry "piper-priyamvada" "ok" "present" || add_entry "piper-priyamvada" "fail" "missing"

          FC=$(ls "$DEPS_DIR/fonts" 2>/dev/null | wc -l)
          add_entry "custom-fonts" "ok" "$FC files"

          for f in NotoSans-Bold.ttf NotoSansDevanagari-Bold.ttf NotoNaskhArabic-Bold.ttf NotoEmoji-Regular.ttf NotoColorEmoji.ttf; do
            if [ -f "$DEPS_DIR/fonts/$f" ]; then
              SZ=$(stat -c%s "$DEPS_DIR/fonts/$f")
              add_entry "font-$f" "ok" "$SZ bytes"
            else
              add_entry "font-$f" "fail" "missing"
            fi
          done

          [ -f "$DEPS_DIR/python-venv/.installed" ] && add_entry "python-venv" "ok" "installed" || add_entry "python-venv" "fail" "missing"
          LIBS=$(ls -1 "$DEPS_DIR/libs" 2>/dev/null | wc -l)
          add_entry "cached-libs" "ok" "$LIBS files"

          for key in OPENROUTER_API_KEY GROQ_API_KEY GEMINI_API_KEY MISTRAL_API_KEY CEREBRAS_API_KEY COHERE_API_KEY HUGGINGFACE_API_KEY ELEVENLABS_API_KEY DEEPL_API_KEY FREESOUND_API_KEY PEXELS_API_KEY PIXABAY_API_KEY COVERR_API_KEY TELEGRAM_BOT_TOKEN FACEBOOK_INSTAGRAM_META_TOKEN TOKEN_GITHUB GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET GOOGLE_DRIVE_REFRESH_TOKEN; do
            if [ -n "${!key:-}" ]; then
              add_entry "key:$key" "ok" "configured"
            else
              add_entry "key:$key" "hold" "not set"
            fi
          done

          {
            echo ""
            echo "  }"
            echo "}"
          } >> "$REPORT_FILE"

          echo "TOOLS_STATUS_FILE=$REPORT_FILE" >> $GITHUB_ENV
          cat "$REPORT_FILE"

      - name: Run Facebook Story Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          DRIVE_STORY_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_AI }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          UPLOAD_TO_SOCIAL: ${{ inputs.upload_to_social || github.event.inputs.upload_to_social }}
          FONTS_DIR: ${{ env.DEPS_DIR }}/fonts
          DEPS_DIR: ${{ env.DEPS_DIR }}
          PIPER_DIR: ${{ env.DEPS_DIR }}/piper
          TOOLS_STATUS_FILE: ${{ env.DEPS_DIR }}/tools_status.json
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          set -euo pipefail
          if [ ! -f "Social media/Facebook/Story_video.py" ]; then
            echo "Story_video.py missing"
            exit 1
          fi
          python3 "Social media/Facebook/Story_video.py"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fb-story-video
          path: |
            Final_FB_Story.mp4
            *.mp4
            logs/**
          retention-days: 5
          if-no-files-found: ignore
          compression-level: 6

      - name: Cleanup Public Repo
        if: always()
        run: |
          rm -rf "Social media"
          rm -f Final_FB_Story.mp4
          rm -rf temp_private_repo
          find . -name "*.pyc" -delete 2>/dev/null || true
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Cache Status
        if: always()
        run: |
          echo "Cache Hit: ${{ steps.master-cache.outputs.cache-hit }}"
          du -sh $DEPS_DIR 2>/dev/null || echo "no cache"
          df -h . || true
