name: "🔵FACEBOOK STORY"

on:
  workflow_dispatch:
    inputs:
      upload_to_social:
        description: 'Upload to Facebook Story?'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '30 23 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: facebook-story
  cancel-in-progress: false

jobs:
  fb-story:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CACHE_VERSION: v22
      DEPS_DIR: ${{ github.workspace }}/.dependencies

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Master Dependencies Cache
        id: master-cache
        uses: actions/cache@v4
        with:
          path: |
            .dependencies
            ~/.cache/pip
            ~/.local/share/piper
          key: ${{ runner.os }}-fb-story-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements.txt') || 'default' }}
          restore-keys: |
            ${{ runner.os }}-fb-story-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-fb-story-

      - name: Prepare Dependencies Folder
        run: |
          mkdir -p "$DEPS_DIR"/{bin,fonts,models,system-fonts,python-venv,piper,libs,scripts}
          echo "DEPS_DIR=$DEPS_DIR" >> $GITHUB_ENV

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg + System Tools Cache-Aware
        run: |
          MARKER="$DEPS_DIR/.ffmpeg_ok"
          LIB_DIR="$DEPS_DIR/libs"
          if [ -f "$MARKER" ] && [ -f "$DEPS_DIR/bin/ffmpeg" ] && [ -f "$DEPS_DIR/bin/sox" ]; then
            echo "CACHED"
            if [ -d "$LIB_DIR" ]; then
              sudo mkdir -p /usr/lib/x86_64-linux-gnu
              sudo cp -n "$LIB_DIR"/*.so* /usr/lib/x86_64-linux-gnu/ 2>/dev/null || true
              sudo ldconfig
            fi
            sudo cp "$DEPS_DIR/bin/ffmpeg" /usr/local/bin/ffmpeg 2>/dev/null || true
            sudo cp "$DEPS_DIR/bin/ffprobe" /usr/local/bin/ffprobe 2>/dev/null || true
            sudo cp "$DEPS_DIR/bin/sox" /usr/local/bin/sox 2>/dev/null || true
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe /usr/local/bin/sox 2>/dev/null || true
            [ -f "$DEPS_DIR/bin/espeak-ng" ] && sudo cp "$DEPS_DIR/bin/espeak-ng" /usr/local/bin/espeak-ng && sudo chmod +x /usr/local/bin/espeak-ng || true
            if [ -d "$DEPS_DIR/system-fonts/truetype" ]; then
              sudo cp -rn "$DEPS_DIR/system-fonts/truetype/"* /usr/share/fonts/truetype/ 2>/dev/null || true
              sudo fc-cache -f > /dev/null 2>&1 || true
            fi
            if ! (ffmpeg -version >/dev/null 2>&1 && sox --version >/dev/null 2>&1); then
              rm -f "$MARKER"
              sudo apt-get update -q
              sudo apt-get install -y -q --reinstall ffmpeg sox espeak-ng libsox-fmt-all fonts-noto fonts-noto-core fonts-noto-extra fonts-noto-ui-core fonts-dejavu-core fontconfig
              sudo ldconfig
            fi
          else
            sudo apt-get update -q
            sudo apt-get install -y -q ffmpeg sox espeak-ng libsox-fmt-all fonts-noto fonts-noto-core fonts-noto-extra fonts-noto-ui-core fonts-dejavu-core fontconfig
            sudo ldconfig
          fi
          mkdir -p "$DEPS_DIR/bin" "$LIB_DIR" "$DEPS_DIR/system-fonts/truetype"
          cp "$(which ffmpeg)" "$DEPS_DIR/bin/ffmpeg" 2>/dev/null || true
          cp "$(which ffprobe)" "$DEPS_DIR/bin/ffprobe" 2>/dev/null || true
          cp "$(which sox)" "$DEPS_DIR/bin/sox" 2>/dev/null || true
          cp "$(which espeak-ng)" "$DEPS_DIR/bin/espeak-ng" 2>/dev/null || true
          for bin in ffmpeg ffprobe sox; do
            LDD=$(ldd "$(which $bin)" 2>/dev/null | grep "=> /" | awk '{print $3}')
            for lib in $LDD; do [ -f "$lib" ] && cp -n "$lib" "$LIB_DIR/" 2>/dev/null || true; done
          done
          cp -rn /usr/share/fonts/truetype/* "$DEPS_DIR/system-fonts/truetype/" 2>/dev/null || true
          touch "$MARKER"

      - name: Download Custom Fonts (Auto-Heal)
        run: |
          # ✅ हर run पर font integrity check
          NEED_DOWNLOAD=0
          for f in NotoSans-Regular.ttf NotoSans-Bold.ttf \
                   NotoSansDevanagari-Regular.ttf NotoSansDevanagari-Bold.ttf \
                   NotoNaskhArabic-Regular.ttf NotoNaskhArabic-Bold.ttf; do
            P="$DEPS_DIR/fonts/$f"
            if [ ! -f "$P" ] || [ "$(stat -c%s "$P" 2>/dev/null || echo 0)" -lt 50000 ]; then
              echo "MISSING/BAD: $f"
              NEED_DOWNLOAD=1
            fi
          done

          if [ $NEED_DOWNLOAD -eq 1 ]; then
            echo "Re-downloading all fonts"
            rm -rf "$DEPS_DIR/fonts"
            mkdir -p "$DEPS_DIR/fonts"
            declare -A FONTS=(
              ["NotoSans-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSans/NotoSans-Regular.ttf"
              ["NotoSans-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSans/NotoSans-Bold.ttf"
              ["NotoSansDevanagari-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf"
              ["NotoSansDevanagari-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf"
              ["NotoNaskhArabic-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf"
              ["NotoNaskhArabic-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf"
            )
            for name in "${!FONTS[@]}"; do
              for try in 1 2 3; do
                wget -q --timeout=60 "${FONTS[$name]}" -O "$DEPS_DIR/fonts/$name" && break
                sleep 2
              done
            done
          else
            echo "Fonts CACHED and OK"
          fi

          # ✅ Hard verify — कोई भी missing तो रुको
          MISSING=0
          for f in NotoSans-Regular.ttf NotoSans-Bold.ttf \
                   NotoSansDevanagari-Regular.ttf NotoSansDevanagari-Bold.ttf \
                   NotoNaskhArabic-Regular.ttf NotoNaskhArabic-Bold.ttf; do
            P="$DEPS_DIR/fonts/$f"
            SZ=$(stat -c%s "$P" 2>/dev/null || echo 0)
            if [ "$SZ" -gt 50000 ]; then
              echo "OK: $f ($SZ bytes)"
            else
              echo "FAIL: $f"
              MISSING=$((MISSING+1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "CRITICAL: $MISSING fonts missing"
            exit 1
          fi

          mkdir -p ~/.fonts
          cp "$DEPS_DIR/fonts/"*.ttf ~/.fonts/ 2>/dev/null || true
          fc-cache -fv ~/.fonts/ > /dev/null 2>&1 || true
          echo "FONTS READY"

      - name: Python Packages Cache-Aware
        run: |
          VENV="$DEPS_DIR/python-venv"
          if [ -f "$VENV/.installed" ] && "$VENV/bin/python" -c "import edge_tts, PIL, mutagen" 2>/dev/null; then
            echo "CACHED"
          else
            rm -rf "$VENV"
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --upgrade pip --quiet
            "$VENV/bin/pip" install --no-cache-dir requests edge-tts mutagen Pillow google-api-python-client google-auth-httplib2 google-auth-oauthlib gTTS piper-tts numpy scipy soundfile
            touch "$VENV/.installed"
          fi
          echo "$VENV/bin" >> $GITHUB_PATH

      - name: Piper Models Cache-Aware
        run: |
          P="$DEPS_DIR/piper"
          if [ -f "$P/.installed" ] && [ -f "$P/hi_IN-pratham-medium.onnx" ]; then
            echo "CACHED"
          else
            rm -rf "$P" && mkdir -p "$P"
            cd "$P"
            BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main"
            wget -q --timeout=90 "$BASE/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx" -O hi_IN-pratham-medium.onnx || true
            wget -q --timeout=90 "$BASE/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx.json" -O hi_IN-pratham-medium.onnx.json || true
            touch "$P/.installed"
            cd "$GITHUB_WORKSPACE"
          fi
          echo "PIPER_DIR=$P" >> $GITHUB_ENV

      - name: Run Facebook Story Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          DRIVE_STORY_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          UPLOAD_TO_SOCIAL: ${{ inputs.upload_to_social || github.event.inputs.upload_to_social }}
          FONTS_DIR: ${{ env.DEPS_DIR }}/fonts
          DEPS_DIR: ${{ env.DEPS_DIR }}
          PIPER_DIR: ${{ env.DEPS_DIR }}/piper
        run: |
          cat > "$DEPS_DIR/scripts/story.py" << 'PYEOF'
          import os, re, time, random, subprocess, requests, shutil, sys, math
          import traceback, json
          from datetime import datetime
          from mutagen.mp3 import MP3
          from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageEnhance
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          session = requests.Session()
          session.mount("https://", HTTPAdapter(max_retries=Retry(
              total=5, backoff_factor=1.5, status_forcelist=[429,500,502,503,504])))

          TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          TG_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")
          META_TOKEN = os.environ.get("FACEBOOK_INSTAGRAM_META_TOKEN", "").strip()
          DEPS_DIR = os.environ.get("DEPS_DIR", os.path.expanduser("~/.dependencies"))
          FONTS_DIR = os.environ.get("FONTS_DIR", os.path.join(DEPS_DIR, "fonts"))
          PIPER_DIR = os.environ.get("PIPER_DIR", os.path.join(DEPS_DIR, "piper"))
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          should_post_social = (event_name == "schedule") or \
                               (str(os.environ.get("UPLOAD_TO_SOCIAL","")).lower() == "true")
          RUN_START = time.time()
          FPS, INTRO_SEC, OUTRO_SEC, W, H = 25, 3.5, 5.0, 1080, 1920
          VOICE_MIN, VOICE_MAX = 30.0, 60.0
          TEXT_Y_POSITION = 0.75

          BRAND_NAME = "SAWAJ STUDIO"
          BRAND_HANDLE = "@SawajStudio"
          BISMILLAH_ARABIC = "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ"
          AMEEN_ARABIC = "آمین ثم آمین"

          BOOKS = [
              {"eng":"eng-bukhari", "ara":"ara-bukhari", "name":"सहीह अल-बुख़ारी", "max":7563},
              {"eng":"eng-muslim",  "ara":"ara-muslim",  "name":"सहीह मुस्लिम",    "max":3032},
              {"eng":"eng-abudawud","ara":"ara-abudawud","name":"सुनन अबू दाऊद",   "max":5274},
              {"eng":"eng-tirmidhi","ara":"ara-tirmidhi","name":"जामी अत-तिर्मिज़ी","max":3956},
              {"eng":"eng-nasai",   "ara":"ara-nasai",   "name":"सुनन अन-नसाई",    "max":5758},
          ]

          FB_PALETTE = {"name":"Royal Gold","primary":[212,175,55],"secondary":[255,220,120],
                        "text":[255,245,220],"accent":[255,200,80],"glow":[255,220,120]}

          COLOR_POOL = [(170,100,255),(255,220,60),(255,150,50),(80,180,255),(100,220,100),
                        (255,100,100),(255,150,200),(200,150,100),(240,240,240),(100,220,200),
                        (200,140,240),(255,200,100),(150,200,100),(255,180,80),(140,180,220),
                        (220,150,180)]

          def _hash(s):
              h = 0
              for c in str(s): h = (h * 31 + ord(c)) & 0xFFFFFFFF
              return h

          def color_for_word(w): return COLOR_POOL[_hash(w) % len(COLOR_POOL)]

          _FONT_CACHE, _FONT_MISSING, _FONT_LOADED = {}, set(), {}

          def _has_deva(s): return any('\u0900'<=ch<='\u097F' for ch in str(s))
          def _has_arab(s): return any('\u0600'<=ch<='\u06FF' for ch in str(s))

          def _pick_font(text, fb):
              s = str(text)
              if _has_deva(s): return "NotoSansDevanagari-Bold.ttf"
              if _has_arab(s): return "NotoNaskhArabic-Bold.ttf"
              return fb

          def _font_has_glyphs(font, name):
              try:
                  if "Devanagari" in name: tc = "क"
                  elif "Arabic" in name or "Naskh" in name: tc = "ب"
                  else: return True
                  bb = font.getbbox(tc)
                  return bb is not None and (bb[2]-bb[0]) > 0
              except: return False

          def _sys_fallback(name, size):
              pools = {
                  "deva": ["/usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf",
                           "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"],
                  "arab": ["/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf",
                           "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"],
                  "latin": ["/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf",
                            "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"],
              }
              n = name.lower()
              k = "deva" if "devanagari" in n else "arab" if ("arabic" in n or "naskh" in n) else "latin"
              for p in pools[k]:
                  if os.path.exists(p):
                      try:
                          f = ImageFont.truetype(p, size)
                          if _font_has_glyphs(f, name): return f
                      except: pass
              return ImageFont.load_default()

          def get_font(name, size):
              key = f"{name}_{size}"
              if key in _FONT_CACHE: return _FONT_CACHE[key]
              cands = []
              if FONTS_DIR: cands.append(os.path.join(FONTS_DIR, name))
              cands.append(os.path.expanduser(f"~/.fonts/{name}"))
              cands.append(os.path.join(DEPS_DIR, "fonts", name))
              cands += [f"/usr/share/fonts/truetype/noto/{name}",
                        f"/usr/share/fonts/truetype/dejavu/{name}"]
              for p in cands:
                  if not os.path.exists(p): continue
                  try:
                      if os.path.getsize(p) < 1000: continue
                      f = ImageFont.truetype(p, size)
                      if not _font_has_glyphs(f, name): continue
                      _FONT_CACHE[key] = f
                      _FONT_LOADED[name] = p
                      return f
                  except: pass
              _FONT_MISSING.add(name)
              fb = _sys_fallback(name, size)
              _FONT_CACHE[key] = fb
              return fb

          def _trunc(d, text, font, mx, anchor="lm"):
              if not text: return text
              try:
                  bb = d.textbbox((0,0), text, font=font, anchor=anchor)
                  if (bb[2]-bb[0]) <= mx: return text
                  for c in range(len(text)-1, 0, -1):
                      t = text[:c] + ".."
                      b2 = d.textbbox((0,0), t, font=font, anchor=anchor)
                      if (b2[2]-b2[0]) <= mx: return t
                  return text[:1] + ".."
              except: return text

          def sanitize(t):
              if not t: return ""
              t = re.sub(r'[\u200b-\u200f\ufeff\u202a-\u202e]', '', str(t))
              t = re.sub(r'[\U0001F000-\U0001FFFF\u2600-\u27BF\u2B00-\u2BFF\uFE00-\uFE0F]', '', t)
              return t.replace('"','').replace("'",'').replace('\n',' ').strip()

          def sanitize_ar(t):
              if not t: return ""
              return re.sub(r'[\u200b-\u200e\ufeff\u202a-\u202e]', '', str(t)).replace('\n',' ').strip()

          def reveal(full, el, rate=0.28):
              ws = sanitize(full).split()
              if not ws: return ""
              return " ".join(ws[:max(0,min(len(ws),int(el/rate)+1))])

          def draw_vstack(img, hi_w, ar_w, en_w, hi_i, ar_i, en_i, pal, fonts):
              try:
                  d = ImageDraw.Draw(img)
                  ch = hi_w[hi_i] if hi_i < len(hi_w) else ""
                  ca = ar_w[ar_i] if ar_i < len(ar_w) else ""
                  ce = en_w[en_i] if en_i < len(en_w) else ""
                  if not (ch or ca or ce): return img
                  lh = 115
                  sy = int(H*TEXT_Y_POSITION) - (3*lh)//2
                  dr = 16; dx = int(W*0.12); wx = dx + dr + 25
                  mw = W - wx - 40
                  rows = [(ch,fonts["hi"],sy,"hi"),(ca,fonts["ar"],sy+lh,"ar"),
                          (ce,fonts["en"],sy+2*lh,"en")]
                  for word, font, y, lg in rows:
                      if not word: continue
                      try:
                          tb = d.textbbox((0,0), word, font=font)
                          if tb is None or (tb[2]-tb[0]) <= 0: continue
                      except: continue
                      color = color_for_word(word)
                      d.ellipse([dx-dr,y-dr,dx+dr,y+dr], fill=color+(255,))
                      ws = _trunc(d, word, font, mw, "lm")
                      for ax,ay in [(-2,-2),(2,-2),(-2,2),(2,2)]:
                          d.text((wx+ax,y+ay), ws, fill=(0,0,0,200), font=font, anchor="lm")
                      d.text((wx,y), ws, fill=tuple(pal["text"])+(255,), font=font, anchor="lm")
                  return img
              except Exception as e:
                  print(f"[STACK] {e}"); return img

          MUSIC_BLOCK = ["piano","guitar","violin","drum","tabla","flute","oud","ney","harp",
                         "melody","song","music","instrument","beat","edm","jazz","rock",
                         "saxophone","trumpet","orchestra","rap","pop"]
          NON_ISLAMIC_BLOCK = ["girl","boy","woman","man","people","dance","wine","alcohol",
                               "dog","pig","cross","church","idol","nude","bikini","bar","party"]
          NATURE_WORDS = ["rain","wind","bird","water","forest","thunder","ocean","river",
                          "stream","leaves","desert","night","crickets","waterfall","storm",
                          "waves","fire","nature","ambient","soft","quiet","calm","breeze"]
          BG_ALLOW = ["mosque","masjid","kaaba","mecca","medina","islamic","arabic",
                      "calligraphy","night sky","stars","desert","mountain","sea","ocean",
                      "clouds","sunrise","sunset","moon","lantern","architecture","pattern",
                      "geometric","minaret","dome","quran","book","prayer","peaceful","sky","cloud"]
          SAFE_BG = ["mosque exterior night empty","desert landscape sunrise",
                     "islamic architecture pattern","night sky stars time lapse",
                     "arabic calligraphy closeup","mountain landscape sunset"]

          def val_pal(p):
              if not isinstance(p, dict): return dict(FB_PALETTE)
              try:
                  r = {"name": str(p.get("name","Custom"))[:40]}
                  for k in ["primary","secondary","text","accent","glow"]:
                      rgb = p.get(k, FB_PALETTE[k])
                      if not isinstance(rgb,list) or len(rgb)!=3: return dict(FB_PALETTE)
                      r[k] = [max(0,min(255,int(x))) for x in rgb]
                  return r
              except: return dict(FB_PALETTE)

          def val_bg(q):
              if not q or not isinstance(q,str): return None
              ql = q.lower()
              for b in NON_ISLAMIC_BLOCK + MUSIC_BLOCK:
                  if b in ql: return None
              for g in BG_ALLOW:
                  if g in ql: return q.strip()[:80]
              return None

          def val_amb(q):
              if not q or not isinstance(q,str): return None
              ql = q.lower()
              for b in MUSIC_BLOCK:
                  if b in ql: return None
              for g in NATURE_WORDS:
                  if g in ql: return q.strip()[:60]
              return None

          def val_tags(t):
              if not isinstance(t,list): return []
              c = [x for x in t if isinstance(x,str) and x.startswith("#") and len(x)<40]
              return c[:8] if len(c)>=3 else []

          R = {"errors":[],"warnings":[],"hadith":{},"video":{},"drive":{},"fb":{},
               "plat":{"hadith":"-","ambience":"-","bg":"-","tts":"-","trans":"-"},
               "es":{"dots":0,"palette":"none"},"fonts":{},"aic":{},"sync":{}}

          def log_err(m): R["errors"].append(str(m)[:200]); print(f"[ERR] {m}")
          def log_warn(m): R["warnings"].append(str(m)[:200]); print(f"[WARN] {m}")

          def run(cmd, timeout=None):
              print(f"[CMD] {cmd[:100]}")
              subprocess.run(cmd, shell=True, check=True, timeout=timeout)

          def dl(url, path, minsize=12000):
              try:
                  r = session.get(url, timeout=35)
                  if r.status_code == 200 and len(r.content) > minsize:
                      with open(path,"wb") as f: f.write(r.content)
                      return True
              except: pass
              return False

          def add_prophet(t):
              if not t: return t
              for p, r in [(r'\b(Prophet|Rasul|Rasool|Nabi)\b(?!\s*ﷺ)', r'\1 ﷺ'),
                           (r'पैगंबर(?!\s*ﷺ)', 'पैगंबर ﷺ'), (r'नबी(?!\s*ﷺ)', 'नबी ﷺ')]:
                  t = re.sub(p, r, t)
              return t

          def add_allah(t):
              if not t: return t
              t = re.sub(r'अल्लाह(?!\s*(तआला|SWT|ﷻ))', 'अल्लाह तआला', t)
              t = re.sub(r'\bAllah\b(?!\s*(SWT|ﷻ|\(SWT\)))', 'Allah (SWT)', t)
              return t

          def hijri():
              try:
                  d = datetime.utcnow()
                  gy,gm,gd = d.year,d.month,d.day
                  a = (14-gm)//12; y = gy+4800-a; m = gm+12*a-3
                  jdn = gd + (153*m+2)//5 + 365*y + y//4 - y//100 + y//400 - 32045
                  l = jdn - 1948440 + 10632; n = (l-1)//10631; l = l - 10631*n + 354
                  j = ((10985-l)//5316)*((50*l)//17719) + (l//5670)*((43*l)//15238)
                  l = l - ((30-j)//15)*((17719*j)//50) - (j//16)*((15238*j)//43) + 29
                  hm = (24*l)//709; hd = l - (709*hm)//24; hy = 30*n + j - 30
                  mo = ["Muharram","Safar","Rabi al-Awwal","Rabi al-Thani","Jumada al-Awwal",
                        "Jumada al-Thani","Rajab","Shaban","Ramadan","Shawwal","Dhul Qadah","Dhul Hijjah"]
                  return f"{hd} {mo[hm-1] if 1<=hm<=12 else '?'} {hy} AH"
              except: return ""

          def call_ai(prompt, mx=1000, jm=True):
              pv = []
              if os.environ.get("OPENROUTER_API_KEY"):
                  pv.append(("OpenRouter","https://openrouter.ai/api/v1/chat/completions",
                      {"Authorization":f"Bearer {os.environ['OPENROUTER_API_KEY']}"},"openai/gpt-4o-mini"))
              if os.environ.get("GROQ_API_KEY"):
                  pv.append(("Groq","https://api.groq.com/openai/v1/chat/completions",
                      {"Authorization":f"Bearer {os.environ['GROQ_API_KEY']}"},"llama-3.3-70b-versatile"))
              if os.environ.get("GEMINI_API_KEY"):
                  pv.append(("Gemini", None, None, None))
              if os.environ.get("CEREBRAS_API_KEY"):
                  pv.append(("Cerebras","https://api.cerebras.ai/v1/chat/completions",
                      {"Authorization":f"Bearer {os.environ['CEREBRAS_API_KEY']}"},"llama3.1-8b"))
              if not pv: return None
              for name, url, h, model in pv:
                  try:
                      if name == "Gemini":
                          body = {"contents":[{"parts":[{"text":prompt}]}]}
                          if jm: body["generationConfig"] = {"responseMimeType":"application/json"}
                          r = session.post(f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={os.environ['GEMINI_API_KEY']}",
                              json=body, timeout=60)
                          if r.status_code == 200:
                              return r.json()["candidates"][0]["content"]["parts"][0]["text"].strip()
                      else:
                          pl = {"model":model,"messages":[{"role":"user","content":prompt}],
                                "temperature":0.9,"max_tokens":mx}
                          if jm: pl["response_format"] = {"type":"json_object"}
                          r = session.post(url, headers={**h,"Content-Type":"application/json"},
                              json=pl, timeout=60)
                          if r.status_code == 200:
                              return r.json()["choices"][0]["message"]["content"].strip()
                  except: continue
              return None

          def parse_json(t):
              if not t: return None
              t = re.sub(r'^```(?:json)?\s*','',t.strip())
              t = re.sub(r'\s*```$','',t.strip())
              m = re.search(r'\{.*\}', t, re.DOTALL)
              if not m: return None
              try: return json.loads(m.group(0))
              except: return None

          def gen_ai(he):
              pr = f'''Return ONLY valid JSON for Islamic video:
          {{"hook":"Hindi curiosity hook 4-6 words","intro":"3-5 word Hindi",
            "title":"2-3 word English","emotion":"calm|khushu|tawbah|shukr|dhikr",
            "outro_main":"Fi Amanillah","outro_cta":"3-6 word Hindi CTA",
            "hashtags":["#Hadith","#Sunnah","#Islam","#Quran","#SawajStudio"],
            "color_palette":{{"name":"Gold","primary":[212,175,55],"secondary":[255,220,120],
              "text":[255,245,220],"accent":[255,200,80],"glow":[255,220,120]}},
            "bg_queries":["mosque night empty","desert sunrise","islamic pattern"],
            "ambience_query":"gentle rain nature","engagement_text":"याद रखें","sound_hint_text":"सुनिए"}}
          Hadith: {he[:300]}'''
              p = parse_json(call_ai(pr, 1200, True)) or {}
              def sf(k, d=""): return sanitize(p.get(k,"")) or d
              hk = sf("hook","क्या आप जानते हैं?")
              hk = add_prophet(add_allah(hk))
              it = sf("intro"); it = add_prophet(add_allah(it))
              if it and not it.endswith("।") and not it.endswith("?"): it += "।"
              em = str(p.get("emotion","calm")).lower().strip()
              if em not in ["calm","khushu","tawbah","shukr","dhikr"]: em = "calm"
              pal = val_pal(p.get("color_palette",{}))
              bq = []
              for q in p.get("bg_queries",[])[:3]:
                  v = val_bg(q)
                  if v: bq.append(v)
              if not bq: bq = random.sample(SAFE_BG, 3)
              tags = val_tags(p.get("hashtags",[]))
              if not tags: tags = ["#Hadith","#Sunnah","#Islam","#Quran","#SawajStudio"]
              return {"hook":hk,"intro":it,"title":sf("title","Hadith"),
                      "emotion":em,"outro_main":sf("outro_main","Fi Amanillah"),
                      "outro_cta":sf("outro_cta","इस हदीस को शेयर करें।"),
                      "hashtags":tags,"palette":pal,"bg_queries":bq,
                      "ambience_query":val_amb(p.get("ambience_query","")) or "gentle rain nature",
                      "engagement_text":sf("engagement_text","याद रखें"),
                      "sound_hint_text":sf("sound_hint_text","सुनिए")}

          def deepl(text):
              k = os.environ.get("DEEPL_API_KEY")
              if not k: return None
              try:
                  r = session.post("https://api-free.deepl.com/v2/translate",
                      headers={"Authorization":f"DeepL-Auth-Key {k}"},
                      data={"text":text,"target_lang":"HI"}, timeout=25)
                  if r.status_code == 200:
                      R["plat"]["trans"] = "DeepL"
                      return r.json()["translations"][0]["text"]
              except: pass
              return None

          def ck(p, m=3000): return os.path.exists(p) and os.path.getsize(p) > m

          def tts_edge(text, out):
              for v in ["hi-IN-MadhurNeural","ur-IN-SalmanNeural"]:
                  try:
                      tmp = out + ".txt"
                      with open(tmp,"w",encoding="utf-8") as f: f.write(text)
                      if os.path.exists(out): os.remove(out)
                      subprocess.run(f'edge-tts --file "{tmp}" --write-media "{out}" --voice {v} --rate=-15% --pitch=-2Hz',
                                     shell=True, check=True, timeout=120)
                      if os.path.exists(tmp): os.remove(tmp)
                      if ck(out): return True, v
                  except: continue
              return False, "fail"

          def tts_piper(text, out):
              m = os.path.join(PIPER_DIR, "hi_IN-pratham-medium.onnx")
              if not os.path.exists(m): return False, "no model"
              try:
                  tmp = out + ".wav"
                  subprocess.run(f'echo "{text}" | piper --model "{m}" --output_file "{tmp}" --length_scale 1.25',
                                 shell=True, check=True, timeout=90)
                  if os.path.exists(tmp) and os.path.getsize(tmp) > 5000:
                      run(f'ffmpeg -y -i "{tmp}" -c:a libmp3lame -b:a 128k "{out}"')
                      os.remove(tmp)
                      if ck(out): return True, "piper"
              except: pass
              return False, "fail"

          def gen_tts(text, out):
              text = sanitize(text)
              if not text: return False
              for name, fn in [("edge",tts_edge),("piper",tts_piper)]:
                  if os.path.exists(out):
                      try: os.remove(out)
                      except: pass
                  try:
                      ok, det = fn(text, out)
                      if ok and ck(out):
                          R["plat"]["tts"] = name
                          return True
                  except: pass
              return False

          def proc_voice(inp, out):
              f = ",".join(["highpass=f=100","lowpass=f=11000",
                  "equalizer=f=250:width_type=h:width=150:g=2",
                  "equalizer=f=3000:width_type=h:width=600:g=2",
                  "acompressor=threshold=-20dB:ratio=4:attack=5:release=150",
                  "dynaudnorm=f=200:g=15:p=0.9","loudnorm=I=-14:TP=-1.0:LRA=9","volume=1.30"])
              run(f'ffmpeg -y -i "{inp}" -af "{f}" "{out}"')

