name: "Facebook Story v8"
on:
  workflow_dispatch:
    inputs:
      upload_to_social:
        description: "Upload to Facebook Story?"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "30 23 * * *"
permissions:
  contents: read
concurrency:
  group: facebook-story-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fb-story:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      DEPS_DIR: ${{ github.workspace }}/.dependencies
      FONTS_DIR: ${{ github.workspace }}/.dependencies/fonts
      PIPER_DIR: ${{ github.workspace }}/.dependencies/piper
      GRAPH_API_VERSION: "v24.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache fonts and Piper model
        uses: actions/cache@v4
        with:
          path: |
            .dependencies/fonts
            .dependencies/piper
          key: ${{ runner.os }}-fb-story-v8-${{ hashFiles('.github/workflows/facebook-story.yml') }}
          restore-keys: ${{ runner.os }}-fb-story-v8-
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg sox espeak-ng fontconfig fonts-noto-core fonts-noto-extra fonts-noto-color-emoji
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests edge-tts mutagen Pillow google-api-python-client google-auth-httplib2 google-auth-oauthlib piper-tts
      - name: Prepare fonts and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FONTS_DIR" "$PIPER_DIR" "$HOME/.local/share/fonts"
          get() { test -s "$2" || curl -fL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 "$1" -o "$2"; }
          get https://raw.githubusercontent.com/notofonts/latin-greek-cyrillic/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf "$FONTS_DIR/NotoSans-Regular.ttf"
          get https://raw.githubusercontent.com/notofonts/latin-greek-cyrillic/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf "$FONTS_DIR/NotoSans-Bold.ttf"
          get https://raw.githubusercontent.com/notofonts/devanagari/main/fonts/ttf/NotoSansDevanagari-Bold.ttf "$FONTS_DIR/NotoSansDevanagari-Bold.ttf"
          get https://raw.githubusercontent.com/notofonts/arabic/main/fonts/ttf/NotoNaskhArabic-Regular.ttf "$FONTS_DIR/NotoNaskhArabic-Regular.ttf"
          BASE=https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/pratham/medium
          get "$BASE/hi_IN-pratham-medium.onnx" "$PIPER_DIR/hi_IN-pratham-medium.onnx"
          get "$BASE/hi_IN-pratham-medium.onnx.json" "$PIPER_DIR/hi_IN-pratham-medium.onnx.json"
          cp "$FONTS_DIR"/*.ttf "$HOME/.local/share/fonts/"
          fc-cache -f >/dev/null
      - name: Fetch private pipeline
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
        run: |
          set -euo pipefail
          test -n "$TOKEN_GITHUB"
          AUTH=$(printf 'x-access-token:%s' "$TOKEN_GITHUB" | base64 -w0)
          git -c http.extraHeader="AUTHORIZATION: basic $AUTH" clone --depth 1 https://github.com/SAWAJ-STUDIO-LAB/admin.git private-src
          install -D -m 0600 "private-src/Social media/Facebook/Story_video.py" "Social media/Facebook/Story_video.py"
          rm -rf private-src
      - name: Preflight
        env: &secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GDRIVE_STORY_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          OPENROUTER_API_KEY_AI: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY_AI: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY_AI: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY_AI: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY_AI: ${{ secrets.CEREBRAS_API_KEY_AI }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
        run: python "Social media/Facebook/Story_video.py" --preflight
      - name: Run pipeline
        env:
          <<: *secrets
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          UPLOAD_TO_SOCIAL: ${{ inputs.upload_to_social || false }}
        run: python "Social media/Facebook/Story_video.py"
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-story-v8-${{ github.run_number }}
          path: |
            Final_FB_Story.mp4
            run_report.json
          retention-days: 5
          if-no-files-found: warn
      - name: Cleanup
        if: always()
        run: rm -rf "Social media" work Final_FB_Story.mp4
