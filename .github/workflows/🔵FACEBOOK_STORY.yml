              if not providers: return None

              for name, url, headers, model in providers:
                  try:
                      if name == "Gemini":
                          body = {"contents": [{"parts": [{"text": prompt}]}]}
                          if jm: body["generationConfig"] = {"responseMimeType": "application/json"}
                          r = session.post(
