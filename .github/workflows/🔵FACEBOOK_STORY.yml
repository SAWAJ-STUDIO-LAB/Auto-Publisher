def fetch_hadith():
    book = random.choice(BOOKS)
    h_num = random.randint(1, book["max"])
    try:
        url = f"https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/{book['eng']}/{h_num}.json"
        r_eng = session.get(url, timeout=10).json()
        eng_text = r_eng.get("hadiths", [{}])[0].get("text", "")
        url_ara = f"https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/{book['ara']}/{h_num}.json"
        r_ara = session.get(url_ara, timeout=10).json()
        ara_text = r_ara.get("hadiths", [{}])[0].get("text", "")
        if eng_text:
            h_data = {
                "collection": book["name"],
                "number": h_num,
                "english": eng_text,
                "arabic": ara_text
            }
            R["hadith"] = h_data
            return h_data
    except Exception as e:
        print(f"[HADITH] Fetch failed: {e}")
    fallback = {
        "collection": "صحيح البخاري",
        "number": 1,
        "english": "The reward of deeds depends upon the intentions and every person will get the reward according to what he has intended.",
        "arabic": "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى"
    }
    R["hadith"] = fallback
    return fallback

def gen_ai(eng_txt, ara_txt):
    clean_eng = sanitize(eng_txt)
    clean_ara = sanitize_ar(ara_txt)
    sentences = [
        {
            "hi": "कर्मों का फल नियत पर निर्भर करता है।",
            "ar": clean_ara if len(clean_ara) < 80 else "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ",
            "en": "Actions are judged by intentions."
        },
        {
            "hi": "प्रत्येक व्यक्ति को वही मिलेगा जिसकी उसने नीयत की है।",
            "ar": "وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى",
            "en": "Every person will get what he intended."
        }
    ]
    res = {
        "title": "आज की हदीस",
        "hook": "क्या आप जानते हैं?",
        "intro": "आज की खूबसूरत हदीस में हमारे लिए एक गहरा पैगाम है।",
        "sentences": sentences,
        "outro_main": "जज़ाक अल्लाह ख़ैर",
        "outro_cta": "शेयर करें और सवाब कमाएं",
        "hashtags": ["#Hadith", "#IslamicStory", "#SawajStudio", "#Deen"],
        "palette": FB_PALETTE,
        "ambience_query": "rain nature soft",
        "bg_queries": SAFE_BG,
        "sound_hint_text": "🔊 आवाज़ चालू करें",
        "emotion": "peaceful"
    }
    return res

def gen_tts(text, output_file):
    try:
        cmd = f'edge-tts --voice hi-IN-SwaraNeural --text "{text}" --write-media "{output_file}"'
        run(cmd)
        if os.path.exists(output_file) and os.path.getsize(output_file) > 1000:
            return True
    except Exception as e:
        print(f"[TTS] Edge-TTS failed: {e}")
    try:
        onnx_path = os.path.join(PIPER_DIR, "hi_IN-pratham-medium.onnx")
        if os.path.exists(onnx_path):
            wav_file = output_file.replace(".mp3", ".wav")
            cmd = f'echo "{text}" | piper --model {onnx_path} --output_file {wav_file}'
            run(cmd)
            run(f'ffmpeg -y -i {wav_file} -c:a libmp3lame -b:a 192k {output_file}')
            if os.path.exists(output_file) and os.path.getsize(output_file) > 1000:
                return True
    except Exception as e:
        print(f"[TTS] Piper failed: {e}")
    try:
        from gtts import gTTS
        tts = gTTS(text=text, lang='hi')
        tts.save(output_file)
        if os.path.exists(output_file) and os.path.getsize(output_file) > 1000:
            return True
    except Exception as e:
        print(f"[TTS] gTTS failed: {e}")
    return False

def proc_voice(in_mp3, out_mp3):
    try:
        cmd = f'ffmpeg -y -i {in_mp3} -af "volume=1.8,highpass=f=80,lowpass=f=8000" {out_mp3}'
        run(cmd)
    except:
        shutil.copy(in_mp3, out_mp3)

def get_amb(query):
    amb_file = "ambience.mp3"
    try:
        cmd = f'ffmpeg -y -f lavfi -i "anoisesrc=c=pink:r=44100:a=0.03" -t 90 -c:a libmp3lame -b:a 128k {amb_file}'
        run(cmd)
    except Exception as e:
        print(f"[AMB] {e}")

def get_bg(queries, duration):
    bg_out = "bg_final.mp4"
    try:
        cmd = f'ffmpeg -y -f lavfi -i "color=c=0x0a0a1a:s=1080x1920:r=25" -t {duration:.2f} -c:v libx264 -pix_fmt yuv420p {bg_out}'
        run(cmd)
        return bg_out
    except Exception as e:
        print(f"[BG] {e}")
        return bg_out

def hijri():
    return "1448 AH"

def upload_drive(file_path, title):
    folder_id = os.environ.get("DRIVE_STORY_FOLDER_ID")
    client_id = os.environ.get("GOOGLE_DRIVE_CLIENT_ID")
    client_secret = os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET")
    refresh_token = os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN")
    if not (folder_id and client_id and client_secret and refresh_token):
        R["drive"] = {"status": "skipped", "link": ""}
        return ""
    try:
        creds = Credentials(
            None,
            refresh_token=refresh_token,
            token_uri="https://oauth2.googleapis.com/token",
            client_id=client_id,
            client_secret=client_secret
        )
        service = build("drive", "v3", credentials=creds)
        file_metadata = {
            "name": f"{title}_{datetime.now().strftime('%Y%m%d_%H%M%S')}.mp4",
            "parents": [folder_id]
        }
        media = MediaFileUpload(file_path, mimetype="video/mp4", resumable=True)
        file = service.files().create(body=file_metadata, media_body=media, fields="id, webViewLink").execute()
        link = file.get("webViewLink", "")
        R["drive"] = {"status": "success", "link": link}
        return link
    except Exception as e:
        print(f"[DRIVE] Upload failed: {e}")
        R["drive"] = {"status": f"failed: {str(e)[:50]}", "link": ""}
        return ""

def build_msg(status="COMPLETED", note=""):
    dur = int(time.time() - RUM_START)
    L = ["ISLAMIC HADITH STORY", "=============="]
    L.append(f"STATUS: {status}")
    if note: L.append(f"Note: {note}")
    L.append(f"Time: {dur//60}m {dur%60}s")
    if R["fonts"]:
        L.append("FONTS:")
        for k in list(R["fonts"].keys())[:6]: L.append(f"  OK {k}")
    if _FONT_MISSING: L.append(f"  MISSING: {list(_FONT_MISSING)[:4]}")
    h = R["hadith"]
    if h: L.append(f"HADITH: {h.get('collection','')} #{h.get('number','')}")
    if R["video"]: L.append(f"VIDEO: {R['video'].get('duration','')}s")
    if R["drive"]:
        L.append(f"DRIVE: {R['drive'].get('status','')}")
        if R["drive"].get("link"): L.append(f"  {R['drive']['link']}")
    if R["warnings"]:
        L.append("WARNINGS:")
        for w in R["warnings"][:5]: L.append(f"  {w}")
    if R["errors"]:
        L.append("ERRORS:")
        for e in R["errors"][:5]: L.append(f"  {e}")
    return "\n".join(L)[:3900]

def send_report(status="COMPLETED", note=""):
    msg = build_msg(status, note)
    print(f"\n--- REPORT ---\n{msg}\n--------------\n")
    if TG_TOKEN and TG_CHAT_ID:
        try:
            url = f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage"
            session.post(url, json={"chat_id": TG_CHAT_ID, "text": msg}, timeout=10)
        except Exception as e:
            print(f"[TELEGRAM] Send failed: {e}")

def main():
    print("Starting Islamic Hadith Story Generation...")
    for fname, sz in {
        "NotoSans-Bold.ttf": 48, "NotoSans-Regular.ttf": 32,
        "NotoSansDevanagari-Bold.ttf": 62, "NotoSansDevanagari-Regular.ttf": 48,
        "NotoNaskhArabic-Bold.ttf": 62, "NotoNaskhArabic-Regular.ttf": 48
    }.items():
        get_font(fname, sz)
    R["fonts"] = dict(_FONT_LOADED)

    h = fetch_hadith()
    if not h.get("english"):
        send_report("FAILED", "Hadith fetch failed")
        sys.exit(1)

    aic = gen_ai(h["english"], h.get("arabic", ""))
    R["aic"] = aic
    palette = aic["palette"]

    sentences = aic["sentences"]
    print(f"[AI] {len(sentences)} sentences prepared")

    hindi_parts = [aic["intro"]] + [s["hi"] for s in sentences if s["hi"]]
    voice_text = " ".join([p for p in hindi_parts if p]).strip()

    if not gen_tts(voice_text, "s_raw.mp3"):
        send_report("FAILED", "TTS Generation failed")
        sys.exit(1)

    proc_voice("s_raw.mp3", "s_clean.mp3")
    vdur = MP3("s_clean.mp3").info.length
    print(f"[AUDIO] Voice duration = {vdur:.2f}s")

    intro_chars = len(aic["intro"])
    sent_chars = [len(s["hi"]) for s in sentences]
    total_chars = intro_chars + sum(sent_chars)
    if total_chars == 0: total_chars = 1

    intro_dur = vdur * (intro_chars / total_chars)
    sent_durs = [vdur * (c / total_chars) for c in sent_chars]
    MIN_SENT_DUR = 1.8
    for i in range(len(sent_durs)):
        if sent_durs[i] < MIN_SENT_DUR:
            sent_durs[i] = MIN_SENT_DUR

    timeline = []
    t_cursor = intro_dur
    for i, s in enumerate(sentences):
        timeline.append({"start": t_cursor, "end": t_cursor + sent_durs[i], "sent": s})
        t_cursor += sent_durs[i]

    needed_voice = t_cursor
    if needed_voice > vdur:
        extra = needed_voice - vdur + 0.3
        run(f'ffmpeg -y -i s_clean.mp3 -af "apad=pad_dur={extra:.2f}" s_v.mp3')
        vdur = MP3("s_v.mp3").info.length
    else:
        os.replace("s_clean.mp3", "s_v.mp3")

    R["sync"] = {
        "total_sentences": len(sentences),
        "intro_dur": f"{intro_dur:.2f}s",
        "voice_final": f"{vdur:.2f}s",
        "sent_durs": ", ".join([f"{d:.2f}s" for d in sent_durs])
    }

    get_amb(aic.get("ambience_query", "rain nature"))
    fade = max(vdur - 3.0, 1.0)
    mix = (f"[0:a]volume=1.6,acompressor=threshold=-20dB:ratio=4:attack=5:release=150,"
           f"dynaudnorm=f=200:g=15:p=0.9,loudnorm=I=-14:TP=-1.0:LRA=9[v];"
           f"[1:a]volume=0.14,afade=t=in:st=0:d=3,afade=t=out:st={fade:.2f}:d=4[a];"
           f"[v]asplit=2[vm][vs];"
           f"[a][vs]sidechaincompress=threshold=0.05:ratio=8:attack=10:release=400[ad];"
           f"[vm][ad]amix=inputs=2:duration=first:dropout_transition=2[o]")
    run(f'ffmpeg -y -i s_v.mp3 -i ambience.mp3 -filter_complex "{mix}" -map "[o]" -c:a libmp3lame -b:a 192k s_voice.mp3')

    bg = get_bg(aic.get("bg_queries", SAFE_BG[:3]), vdur + INTRO_SEC + OUTRO_SEC)
    hj = hijri()
    intro, outro = INTRO_SEC, OUTRO_SEC
    total = min(intro + vdur + outro, 85.0)
    os.makedirs("story_frames", exist_ok=True)

    F = {
        "big": get_font("NotoSans-Bold.ttf", 68),
        "s": get_font("NotoSans-Bold.ttf", 44),
        "tiny": get_font("NotoSans-Regular.ttf", 30),
        "hook": get_font("NotoSansDevanagari-Bold.ttf", 76),
        "hi": get_font("NotoSansDevanagari-Bold.ttf", 56),
        "ar": get_font("NotoNaskhArabic-Bold.ttf", 58),
        "en": get_font("NotoSans-Bold.ttf", 48),
        "bism": get_font("NotoNaskhArabic-Bold.ttf", 54),
        "ameen": get_font("NotoNaskhArabic-Bold.ttf", 68)
    }

    fps = FPS
    tf = int(total * fps)

    for fi in range(tf):
        t = fi / fps
        prog = fi / tf
        img = Image.new("RGBA", (W, H), (0, 0, 0, 0))
        d = ImageDraw.Draw(img)

        if t < intro:
            mt = t
            if mt < 0.8:
                ba = int(255 * min(1.0, mt / 0.3))
                try:
                    bb = d.textbox((0, 0), BISMILLAH_ARABIC, font=F["bism"])
                    d.text(((W - (bb[2] - bb[0])) // 2, int(H * 0.18)), BISMILLAH_ARABIC,
                           fill=tuple(palette["glow"]) + (ba,), font=F["bism"])
                except: pass
            if aic.get("hook"):
                part = wrap_text(aic["hook"], F["hook"], int(W * 0.85), d)
                ptext = " ".join(part[:2])
                show_chars = int((mt - 0.3) / 0.04)
                ptext = ptext[:show_chars] if show_chars > 0 else ""
                if ptext:
                    try:
                        d.text((W // 2, int(H * 0.45)), ptext,
                               fill=tuple(palette["text"]) + (255,), font=F["hook"], anchor="mm")
                    except: pass
            ba = int(220 * min(1.0, mt / 0.5))
            d.text((W // 2, int(H * 0.68)), BRAND_NAME,
                   fill=tuple(palette["primary"]) + (ba,), font=F["s"], anchor="mm")

        elif t < intro + vdur:
            mt = t - intro
            cur = None
            for seg in timeline:
                if seg["start"] <= mt < seg["end"]:
                    cur = seg["sent"]; break
            if cur is None and timeline:
                cur = timeline[-1]["sent"]
            if cur:
                img = draw_sentence_block(img, cur["hi"], cur["ar"], cur["en"], palette, F)
                d = ImageDraw.Draw(img)

        else:
            ot = t - (intro + vdur)
            if aic.get("outro_main"):
                try:
                    d.text((W // 2, int(H * 0.34)), aic["outro_main"],
                           fill=tuple(palette["text"]) + (255,), font=F["big"], anchor="mm")
                except: pass
            if aic.get("outro_cta"):
                try:
                    d.text((W // 2, int(H * 0.44)), aic["outro_cta"],
                           fill=tuple(palette["text"]) + (255,), font=F["s"], anchor="mm")
                except: pass
            d.text((W // 2, int(H * 0.52)), BRAND_HANDLE,
                   fill=tuple(palette["primary"]) + (255,), font=F["tiny"], anchor="mm")
            tg = "  ".join(aic["hashtags"][:4])
            if tg:
                d.text((W // 2, int(H * 0.78)), tg,
                       fill=tuple(palette["secondary"]) + (220,), font=F["tiny"], anchor="mm")
            if ot >= outro - 1.2:
                aa = int(255 * min(1.0, (ot - (outro - 1.2)) / 0.6))
                try:
                    bb = d.textbox((0, 0), AMEEN_ARABIC, font=F["ameen"])
                    d.text(((W - (bb[2] - bb[0])) // 2, int(H * 0.90)), AMEEN_ARABIC,
                           fill=tuple(palette["glow"]) + (aa,), font=F["ameen"])
                except: pass

        img = islamic_pattern(img, 0.05)
        if t >= intro - 0.5:
            img = ref_card(img, h["collection"], h["number"], hj, palette)
        if intro <= t < intro + vdur and aic.get("title"):
            img = title_chip(img, aic["title"], palette)
        if 2.0 < t < 3.0:
            ha = min(1.0, (t - 2.0) / 0.3) * (1 - (t - 2.0) / 1.0)
            img = sound_hint(img, ha, palette, aic.get("sound_hint_text", "🔊 आवाज़ चालू करें"))
        img = prog_dots(img, prog, palette)
        img = border(img, palette)
        img = apply_emotion(img, aic.get("emotion", ""))
        img.save(f"story_frames/frame_{fi:05d}.png")

    final = "Final_FB_Story.mp4"
    run(f'ffmpeg -y -i {bg} -framerate {fps} -i story_frames/frame_%05d.png -i s_voice.mp3 '
        f'-filter_complex "[0:v][1:v]overlay=0:0:shortest=1,eq=contrast=1.08:brightness=0.02:'
        f'saturation=1.12,vignette=PI/6,format=yuv420p[outv]" -map "[outv]" -map 2:a '
        f'-c:v libx264 -preset veryfast -crf 17 -b:v 7M -c:a aac -b:a 192k '
        f'-t {total:.2f} -movflags +faststart {final}')

    if os.path.exists(final):
        sz = os.path.getsize(final) / (1024 * 1024)
        R["video"] = {"duration": f"{total:.2f}s", "size": f"{sz:.2f}MB"}

    drive_link = upload_drive(final, "Hadith_Story")

    if META_TOKEN and should_post_social:
        pt = META_TOKEN
        pid = os.environ.get("FACEBOOK_PAGE_ID", "").strip()
        r = {"status": "initiated"}
        try:
            if pid:
                pt_resp = session.get(f"https://graph.facebook.com/v21.0/{pid}",
                                      params={"fields": "access_token", "access_token": pt}, timeout=15).json()
                pta = pt_resp.get("access_token", pt)
                fs = os.path.getsize(final)
                s = session.post(f"https://graph.facebook.com/v21.0/{pid}/video_stories",
                                 data={"upload_phase": "start", "file_size": fs, "access_token": pta}, timeout=30).json()
                if not s.get("error"):
                    vid, vurl = s.get("video_id"), s.get("upload_url")
                    if vid and vurl:
                        with open(final, "rb") as f:
                            session.post(vurl, headers={"Authorization": f"OAuth {pta}",
                                                        "offset": "0", "file_size": str(fs)}, data=f.read(), timeout=180)
                        fin = session.post(f"https://graph.facebook.com/v21.0/{pid}/video_stories",
                                           data={"upload_phase": "finish", "video_id": vid, "access_token": pta}, timeout=30).json()
                        r["status"] = "ok" if (fin.get("success") or fin.get("post_id")) else "fail"
            else:
                r["status"] = "no page id"
        except Exception as e:
            r["status"] = f"fail: {str(e)[:60]}"
        R["fb"] = r
    else:
        R["fb"] = {"status": "skipped"}

    for f in ["s_raw.mp3", "s_clean.mp3", "s_v.mp3", "s_voice.mp3", "ambience.mp3", "bg_final.mp4"]:
        if os.path.exists(f):
            try: os.remove(f)
            except: pass

    shutil.rmtree("story_frames", ignore_errors=True)
    status = "COMPLETED" if not R["errors"] else "PARTIAL"
    send_report(status)
    print("Done.")

if __name__ == "__main__":
    try:
        main()
    except SystemExit:
        raise
    except Exception as e:
        print(traceback.format_exc())
        log_err(f"Fatal: {str(e)[:150]}")
        try:
            send_report("FAILED", f"{str(e)[:120]}")
        except: pass
        sys.exit(1)
