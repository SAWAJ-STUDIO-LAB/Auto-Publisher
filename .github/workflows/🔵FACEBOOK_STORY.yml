          def upload_drive(path, prefix):
              try:
                  creds = Credentials(None,
                      refresh_token=os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN"),
                      client_id=os.environ.get("GOOGLE_DRIVE_CLIENT_ID"),
                      client_secret=os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET"),
                      token_uri="https://oauth2.googleapis.com/token")
                  svc = build("drive", "v3", credentials=creds, cache_discovery=False)
                  meta = {"name": f"{prefix}_{int(time.time())}.mp4"}
                  fid = os.environ.get("DRIVE_STORY_FOLDER_ID")
                  if fid: meta["parents"] = [fid]
                  up = svc.files().create(body=meta,
                      media_body=MediaFileUpload(path, mimetype="video/mp4", resumable=True),
                      fields="id").execute()
                  did = up.get("id")
                  svc.permissions().create(fileId=did,
                      body={"type":"anyone","role":"reader"}).execute()
                  link = f"https://drive.google.com/file/d/{did}/view"
                  R["drive"] = {"status": "ok", "link": link}
                  return link
              except Exception as e:
                  R["drive"] = {"status": f"fail ({str(e)[:80]})"}
                  log_err(f"Drive: {str(e)[:100]}")
                  return None

