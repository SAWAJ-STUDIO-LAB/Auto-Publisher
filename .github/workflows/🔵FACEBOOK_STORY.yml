COLOR_POOL = [
    (170,100,255), (255,220,60), (255,150,50), (80,180,255), (100,220,100),
    (255,100,100), (255,150,200), (200,150,100), (240,240,240), (100,220,200),
    (200,140,240), (255,200,100), (150,200,100), (255,180,80), (140,180,220),
    (220,150,180)
]

def log_err(msg):
    R["errors"].append(str(msg))
    print(f"[ERROR] {msg}")

def log_warn(msg):
    R["warnings"].append(str(msg))
    print(f"[WARN] {msg}")

def run(cmd):
    res = subprocess.run(cmd, shell=True, capture_output=True, text=True)
    if res.returncode != 0:
        print(f"[CMD WARN] {cmd}\nSTDERR: {res.stderr}")
    return res

def _hash(s):
    h = 0
    for c in str(s):
        h = (h * 31 + ord(c)) & 0xFFFFFFFF
    return h

def color_for_word(w):
    return COLOR_POOL[_hash(w) % len(COLOR_POOL)]

_FONT_CACHE, _FONT_MISSING, _FONT_LOADED = {}, set(), {}

def _has_deva(s):
    return any('\u0900' <= ch <= '\u097F' for ch in str(s))

def _has_arab(s):
    return any('\u0600' <= ch <= '\u06FF' for ch in str(s))

def _pick_font(text, fb):
    s = str(text)
    if _has_deva(s): return "NotoSansDevanagari-Bold.ttf"
    if _has_arab(s): return "NotoNaskhArabic-Bold.ttf"
    return fb

def _font_has_glyphs(font, name):
    try:
        if "Devanagari" in name: tc = "क"
        elif "Arabic" in name or "Naskh" in name: tc = "ب"
        else: return True
        bb = font.getbbox(tc)
        return bb is not None and (bb[2] - bb[0]) > 0
    except:
        return False

def _sys_fallback(name, size):
    pools = {
        "deva": ["/usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"],
        "arab": ["/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"],
        "latin": ["/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"],
    }
    n = name.lower()
    k = "deva" if "devanagari" in n else "arab" if ("arabic" in n or "naskh" in n) else "latin"
    for p in pools[k]:
        if os.path.exists(p):
            try:
                f = ImageFont.truetype(p, size)
                if _font_has_glyphs(f, name): return f
            except:
                pass
    return ImageFont.load_default()

def get_font(name, size):
    key = f"{name}_{size}"
    if key in _FONT_CACHE: return _FONT_CACHE[key]
    cands = []
    if FONTS_DIR: cands.append(os.path.join(FONTS_DIR, name))
    cands.append(os.path.expanduser(f"~/.fonts/{name}"))
    cands.append(os.path.join(DEPS_DIR, "fonts", name))
    cands += [f"/usr/share/fonts/truetype/noto/{name}", f"/usr/share/fonts/truetype/dejavu/{name}"]
    for p in cands:
        if not os.path.exists(p): continue
        try:
            if os.path.getsize(p) < 1000: continue
            f = ImageFont.truetype(p, size)
            if not _font_has_glyphs(f, name): continue
            _FONT_CACHE[key] = f
            _FONT_LOADED[name] = p
            return f
        except:
            pass
    _FONT_MISSING.add(name)
    fb = _sys_fallback(name, size)
    _FONT_CACHE[key] = fb
    return fb

def sanitize(t):
    if not t: return ""
    t = re.sub(r'[\u200b-\u200f\ufeff\u202a-\u202e]', '', str(t))
    t = re.sub(r'[\U0001F000-\U0001FFFF\u2600-\u27BF\u2B00-\u2BFF\uFE00-\uFE0F]', '', t)
    return t.replace('"', '').replace("'", '').replace('\n', ' ').strip()

def sanitize_ar(t):
    if not t: return ""
    return re.sub(r'[\u200b-\u200f\ufeff\u202a-\u202e]', '', str(t)).replace('\n', ' ').strip()

def wrap_text(text, font, max_t, draw):
    words = text.split()
    lines = []
    cur = ""
    for w in words:
        trial = (cur + " " + w).strip()
        try:
            bb = draw.textbox((0, 0), trial, font=font)
            if (bb[2] - bb[0]) <= max_t:
                cur = trial
            else:
                if cur: lines.append(cur)
                cur = w
        except:
            cur = trial
    if cur: lines.append(cur)
    return lines if lines else [text]

def draw_sentence_block(img, hi_txt, ar_txt, en_txt, pal, fonts, y_center=None):
    try:
        d = ImageDraw.Draw(img)
        if y_center is None:
            y_center = int(H * TEXT_Y_POSITION)
        max_text_w = int(W * 0.85)
        lang_gap = 50
        dot_r = 14
        dot_x = int(W * 0.06)
        text_x = dot_x + dot_r + 22
        hi_lines = wrap_text(hi_txt, fonts["hi"], max_text_w, d) if hi_txt else []
        ar_lines = wrap_text(ar_txt, fonts["ar"], max_text_w, d) if ar_txt else []
        en_lines = wrap_text(en_txt, fonts["en"], max_text_w, d) if en_txt else []
        def line_h(font):
            try:
                bb = d.textbox((0, 0), "A", font=font)
                return bb[3] - bb[1] + 6
            except:
                return 70
        hi_h = line_h(fonts["hi"]) * len(hi_lines) if hi_lines else 0
        ar_h = line_h(fonts["ar"]) * len(ar_lines) if ar_lines else 0
        en_h = line_h(fonts["en"]) * len(en_lines) if en_lines else 0
        gaps = 0
        if hi_lines and ar_lines: gaps += lang_gap
        if ar_lines and en_lines: gaps += lang_gap
        if hi_lines and en_lines and not ar_lines: gaps += lang_gap
        total_h = hi_h + ar_h + en_h + gaps
        y = y_center - total_h // 2
        for i, line in enumerate(hi_lines):
            cy = y + i * line_h(fonts["hi"]) + line_h(fonts["hi"]) // 2
            if i == 0:
                color = color_for_word(hi_txt[:20] if hi_txt else "hi")
                d.ellipse([dot_x - dot_r, cy - dot_r, dot_x + dot_r, cy + dot_r], fill=color + (255,))
            for ax, ay in [(-2, -2), (2, -2), (-2, 2), (2, 2)]:
                d.text((text_x + ax, cy + ay), line, fill=(0, 0, 0, 220), font=fonts["hi"], anchor="lm")
            d.text((text_x, cy), line, fill=tuple(pal["text"]) + (255,), font=fonts["hi"], anchor="lm")
        y += hi_h
        if hi_lines and ar_lines: y += lang_gap
        for i, line in enumerate(ar_lines):
            cy = y + i * line_h(fonts["ar"]) + line_h(fonts["ar"]) // 2
            if i == 0:
                color = color_for_word(ar_txt[:20] if ar_txt else "ar")
                d.ellipse([dot_x - dot_r, cy - dot_r, dot_x + dot_r, cy + dot_r], fill=color + (255,))
            for ax, ay in [(-2, -2), (2, -2), (-2, 2), (2, 2)]:
                d.text((text_x + ax, cy + ay), line, fill=(0, 0, 0, 220), font=fonts["ar"], anchor="lm")
            d.text((text_x, cy), line, fill=tuple(pal["text"]) + (255,), font=fonts["ar"], anchor="lm")
        y += ar_h
        if ar_lines and en_lines: y += lang_gap
        for i, line in enumerate(en_lines):
            cy = y + i * line_h(fonts["en"]) + line_h(fonts["en"]) // 2
            if i == 0:
                color = color_for_word(en_txt[:20] if en_txt else "en")
                d.ellipse([dot_x - dot_r, cy - dot_r, dot_x + dot_r, cy + dot_r], fill=color + (255,))
            for ax, ay in [(-2, -2), (2, -2), (-2, 2), (2, 2)]:
                d.text((text_x + ax, cy + ay), line, fill=(0, 0, 0, 220), font=fonts["en"], anchor="lm")
            d.text((text_x, cy), line, fill=tuple(pal["text"]) + (255,), font=fonts["en"], anchor="lm")
        return img
    except Exception as e:
        print(f"[BLOCK] {e}")
        return img

def islamic_pattern(img, opacity=0.05):
    try:
        overlay = Image.new("RGBA", img.size, (0, 0, 0, 0))
        d = ImageDraw.Draw(overlay)
        alpha = int(255 * opacity)
        color = (255, 220, 120, alpha)
        step = 120
        for x in range(0, W + step, step):
            for y in range(0, H + step, step):
                d.rectangle([x - 10, y - 10, x + 10, y + 10], outline=color, width=2)
                d.line([x - 15, y, x + 15, y], fill=color, width=1)
                d.line([x, y - 15, x, y + 15], fill=color, width=1)
        return Image.alpha_composite(img, overlay)
    except:
        return img

