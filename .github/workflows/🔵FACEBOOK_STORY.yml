name: "🔵FACEBOOK STORY (Public Runner)"

on:
  workflow_dispatch:
    inputs:
      upload_to_social:
        description: 'Upload to Facebook Story?'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '30 23 * * *'   # 5:00 AM IST

permissions:
  contents: write
  actions: write

concurrency:
  group: facebook-story
  cancel-in-progress: false

jobs:
  fb-story:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # 🎯 Cache version — jab bhi dependencies change karo ye badhao (v5, v6...)
      CACHE_VERSION: v5
      DEPS_DIR: ${{ github.workspace }}/.dependencies

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4

      # ============================================================
      # 🧠 MASTER CACHE — Sab kuch ek saath (FFmpeg + Fonts + Python + TTS)
      # ============================================================
      - name: 🗂️ Restore Master Dependencies Cache
        id: master-cache
        uses: actions/cache@v4
        with:
          path: |
            .dependencies
            ~/.cache/pip
            ~/.local/share/piper
          key: ${{ runner.os }}-fb-story-master-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements.txt') || 'default' }}
          restore-keys: |
            ${{ runner.os }}-fb-story-master-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-fb-story-master-

      - name: 📁 Prepare Dependencies Folder
        run: |
          mkdir -p "$DEPS_DIR/bin"
          mkdir -p "$DEPS_DIR/fonts"
          mkdir -p "$DEPS_DIR/python-venv"
          mkdir -p "$DEPS_DIR/piper"
          mkdir -p "$DEPS_DIR/coqui"
          echo "DEPS_DIR=$DEPS_DIR" >> $GITHUB_ENV
          echo "✅ Dependencies folder ready: $DEPS_DIR"

      # ============================================================
      # 📥 Private repo se script fetch
      # ============================================================
      - name: 📥 Fetch Code from Private Repository
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
        run: |
          PRIVATE_REPO="SAWAJ-STUDIO-LAB/admin"
          echo "🔐 Private repository se script laa rahe hain..."
          git clone --depth 1 https://x-access-token:${TOKEN_GITHUB}@github.com/${PRIVATE_REPO}.git temp_private_repo
          mkdir -p "Social media/Facebook"
          cp temp_private_repo/"Social media/Facebook/Story_video.py" "Social media/Facebook/Story_video.py"
          rm -rf temp_private_repo
          echo "✅ Script successfully copy ho gayi!"

      # ============================================================
      # 🐍 Python Setup
      # ============================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============================================================
      # 🎬 FFmpeg + System Fonts (Cache-Aware)
      # ============================================================
      - name: 🎬 Setup FFmpeg & System Fonts (Cache-Aware)
        run: |
          if [ -f "$DEPS_DIR/bin/ffmpeg" ] && [ -f "$DEPS_DIR/.ffmpeg_installed" ]; then
            echo "⚡ FFmpeg cached — restoring from cache..."
            sudo mkdir -p /usr/local/bin
            sudo cp "$DEPS_DIR/bin/ffmpeg" /usr/local/bin/ffmpeg
            sudo cp "$DEPS_DIR/bin/ffprobe" /usr/local/bin/ffprobe 2>/dev/null || true
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe 2>/dev/null || true
            # System fonts bhi restore karo
            if [ -d "$DEPS_DIR/system-fonts" ]; then
              sudo cp -r "$DEPS_DIR/system-fonts/"* /usr/share/fonts/ 2>/dev/null || true
              sudo fc-cache -f > /dev/null 2>&1 || true
            fi
          else
            echo "📥 FFmpeg + system fonts install (pehli baar)..."
            sudo apt-get update -q
            sudo apt-get install -y -q ffmpeg \
              fonts-noto fonts-noto-core fonts-noto-extra \
              fonts-noto-ui-core fonts-dejavu-core \
              fonts-noto-color-emoji fontconfig \
              espeak-ng libsndfile1 portaudio19-dev
            
            # Cache ke liye FFmpeg binaries
            cp "$(which ffmpeg)" "$DEPS_DIR/bin/ffmpeg"
            cp "$(which ffprobe)" "$DEPS_DIR/bin/ffprobe" 2>/dev/null || true
            touch "$DEPS_DIR/.ffmpeg_installed"
            
            # Cache ke liye system fonts
            mkdir -p "$DEPS_DIR/system-fonts"
            cp -r /usr/share/fonts/truetype/noto "$DEPS_DIR/system-fonts/" 2>/dev/null || true
            cp -r /usr/share/fonts/truetype/dejavu "$DEPS_DIR/system-fonts/" 2>/dev/null || true
            echo "✅ FFmpeg + system fonts cached!"
          fi
          ffmpeg -version | head -1

      # ============================================================
      # 🔤 Custom Fonts (Cache-Aware)
      # ============================================================
      - name: 🔤 Download Custom Fonts (only if not cached)
        run: |
          if [ -f "$DEPS_DIR/.fonts_installed" ] && [ "$(ls -A $DEPS_DIR/fonts 2>/dev/null)" ]; then
            echo "⚡ Custom fonts cached — skipping download!"
          else
            echo "📥 Custom fonts download (pehli baar)..."
            mkdir -p "$DEPS_DIR/fonts"
            wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf"      -O "$DEPS_DIR/fonts/NotoSans-Regular.ttf" || true
            wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf"         -O "$DEPS_DIR/fonts/NotoSans-Bold.ttf" || true
            wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf" -O "$DEPS_DIR/fonts/NotoSansDevanagari-Regular.ttf" || true
            wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf"    -O "$DEPS_DIR/fonts/NotoSansDevanagari-Bold.ttf" || true
            wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf"       -O "$DEPS_DIR/fonts/NotoNaskhArabic-Regular.ttf" || true
            wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf"          -O "$DEPS_DIR/fonts/NotoNaskhArabic-Bold.ttf" || true
            touch "$DEPS_DIR/.fonts_installed"
            echo "✅ Custom fonts cached!"
          fi
          mkdir -p ~/.fonts
          cp "$DEPS_DIR/fonts/"*.ttf ~/.fonts/ 2>/dev/null || true
          fc-cache -f > /dev/null 2>&1 || true

      # ============================================================
      # 🐍 Python Packages (Cache-Aware Venv)
      # ============================================================
      - name: 🐍 Install Python Packages (Cache-Aware)
        run: |
          VENV_PATH="$DEPS_DIR/python-venv"
          if [ -f "$VENV_PATH/.installed" ]; then
            echo "⚡ Python packages cached — skipping pip install!"
          else
            echo "📥 Python packages install (pehli baar)..."
            python3 -m venv "$VENV_PATH"
            "$VENV_PATH/bin/pip" install --upgrade pip --quiet
            
            # Core packages
            "$VENV_PATH/bin/pip" install --no-cache-dir \
              requests edge-tts mutagen Pillow \
              google-api-python-client google-auth-httplib2 google-auth-oauthlib
            
            # TTS engines support
            "$VENV_PATH/bin/pip" install --no-cache-dir \
              gTTS boto3 piper-tts \
              numpy scipy soundfile
            
            touch "$VENV_PATH/.installed"
            echo "✅ Python packages cached!"
          fi
          echo "$VENV_PATH/bin" >> $GITHUB_PATH

      # ============================================================
      # 🎙️ Piper TTS Models (Local offline TTS — Cache-Aware)
      # ============================================================
      - name: 🎙️ Setup Piper TTS Models (Cache-Aware)
        run: |
          PIPER_DIR="$DEPS_DIR/piper"
          if [ -f "$PIPER_DIR/.installed" ] && [ -f "$PIPER_DIR/hi_IN-pratham-medium.onnx" ]; then
            echo "⚡ Piper models cached!"
          else
            echo "📥 Piper models download (pehli baar)..."
            mkdir -p "$PIPER_DIR"
            cd "$PIPER_DIR"
            
            # Hindi voice model
            wget -q --timeout=60 "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx" -O hi_IN-pratham-medium.onnx || true
            wget -q --timeout=60 "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx.json" -O hi_IN-pratham-medium.onnx.json || true
            
            # Hindi female voice
            wget -q --timeout=60 "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium.onnx" -O hi_IN-priyamvada-medium.onnx || true
            wget -q --timeout=60 "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium.onnx.json" -O hi_IN-priyamvada-medium.onnx.json || true
            
            touch "$PIPER_DIR/.installed"
            cd "$GITHUB_WORKSPACE"
            echo "✅ Piper models cached!"
          fi
          
          # Piper binary install (cached nahi hota, chhota hai)
          if ! command -v piper &> /dev/null; then
            echo "📥 Piper binary install..."
            pip install piper-tts --quiet 2>/dev/null || true
          fi
          
          # Piper PATH export
          echo "PIPER_DIR=$PIPER_DIR" >> $GITHUB_ENV

      # ============================================================
      # 🎙️ Coqui TTS (Local offline — Cache-Aware)
      # ============================================================
      - name: 🎙️ Setup Coqui TTS (Optional, cache-aware)
        continue-on-error: true
        run: |
          COQUI_DIR="$DEPS_DIR/coqui"
          if [ -f "$COQUI_DIR/.installed" ]; then
            echo "⚡ Coqui TTS cached — skipping!"
          else
            echo "📥 Coqui TTS install (pehli baar, ~2 min)..."
            mkdir -p "$COQUI_DIR"
            # Coqui TTS is heavy — skip actual model download (too big for cache)
            # Sirf marker file rakho, actual use pe download hoga
            touch "$COQUI_DIR/.installed"
            echo "✅ Coqui TTS marker set!"
          fi
          echo "COQUI_DIR=$COQUI_DIR" >> $GITHUB_ENV

      # ============================================================
      # 🔊 Verify All Tools Installed
      # ============================================================
      - name: 🔊 Verify TTS Tools
        run: |
          echo "============================================"
          echo "🔊 TTS TOOLS VERIFICATION"
          echo "============================================"
          echo "FFmpeg:    $(ffmpeg -version 2>&1 | head -1 || echo '❌')"
          echo "edge-tts:  $(which edge-tts || echo '❌')"
          echo "gtts-cli:  $(which gtts-cli || echo '❌')"
          echo "piper:     $(which piper || echo '❌')"
          echo "Python:    $(python3 --version)"
          echo "Fonts:     $(fc-list | wc -l) fonts installed"
          echo "============================================"

      # ============================================================
      # 🚀 Main Script Run
      # ============================================================
      - name: 🚀 Run Facebook Story Pipeline
        env:
          # Core
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          
          # Google Drive
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          DRIVE_STORY_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          
          # Facebook
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          
          # AI Providers
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_AI }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          
          # Media Sources
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          
          # TTS Engines (Priority Order)
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          GOOGLE_CLOUD_TTS_KEY: ${{ secrets.GOOGLE_CLOUD_TTS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          
          # Translation
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          
          # Hadith
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
          
          # Runtime
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          UPLOAD_TO_SOCIAL: ${{ inputs.upload_to_social || github.event.inputs.upload_to_social }}
          FONTS_DIR: ${{ env.DEPS_DIR }}/fonts
          DEPS_DIR: ${{ env.DEPS_DIR }}
        run: python3 "Social media/Facebook/Story_video.py"

      # ============================================================
      # 📤 Artifact Upload
      # ============================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fb-story-video
          path: Final_FB_Story.mp4
          retention-days: 5
          if-no-files-found: ignore

      # ============================================================
      # 🧹 Security Cleanup
      # ============================================================
      - name: 🧹 Clean Up Public Repository (Security)
        if: always()
        run: |
          echo "🔒 Public repo se private files delete kar rahe hain..."
          rm -rf "Social media"
          rm -f Final_FB_Story.mp4
          echo "✅ Repository ekdam clean ho gayi hai!"

      # ============================================================
      # 📊 Final Cache & Tool Status Report
      # ============================================================
      - name: 📊 Cache Status Report
        if: always()
        run: |
          echo "============================================"
          echo "📊 CACHE STATUS REPORT"
          echo "============================================"
          echo "Master Cache Hit:    ${{ steps.master-cache.outputs.cache-hit }}"
          echo "FFmpeg Cached:       $([ -f $DEPS_DIR/bin/ffmpeg ] && echo '✅ Yes' || echo '❌ No')"
          echo "Fonts Cached:        $([ -f $DEPS_DIR/.fonts_installed ] && echo '✅ Yes' || echo '❌ No')"
          echo "Python Venv Cached:  $([ -f $DEPS_DIR/python-venv/.installed ] && echo '✅ Yes' || echo '❌ No')"
          echo "Piper Models Cached: $([ -f $DEPS_DIR/piper/.installed ] && echo '✅ Yes' || echo '❌ No')"
          echo "Coqui Marker:        $([ -f $DEPS_DIR/coqui/.installed ] && echo '✅ Yes' || echo '❌ No')"
          echo "Deps Folder Size:    $(du -sh $DEPS_DIR 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "============================================"
          echo "🎯 TTS Engines Available:"
          echo "  1. ElevenLabs     (paid/free tier)"
          echo "  2. Azure Speech   (500K free/mo)"
          echo "  3. Google Cloud   (1M free/mo)"
          echo "  4. Amazon Polly   (5M free/mo)"
          echo "  5. Edge-TTS       (unlimited, free)"
          echo "  6. gTTS           (unlimited, free)"
          echo "  7. Piper          (local offline)"
          echo "  8. Coqui          (local offline)"
          echo "============================================"
