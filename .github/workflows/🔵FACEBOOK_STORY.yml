name: "🔵FACEBOOK_STORY"

on:
  workflow_dispatch:
    inputs:
      upload_to_social:
        description: 'Upload to Facebook Story?'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '30 23 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: facebook-story
  cancel-in-progress: false

jobs:
  fb-story:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CACHE_VERSION: v24
      DEPS_DIR: ${{ github.workspace }}.dependencies

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Master Dependencies Cache
        id: master-cache
        uses: actions/cache@v4
        with:
          path: |
            .dependencies
            ~/.cache/pip
            ~/.local/share/piper
          key: ${{ runner.os }}-fb-story-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements.txt') || 'default' }}
          restore-keys: |
            ${{ runner.os }}-fb-story-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-fb-story-

      - name: Prepare Dependencies Folder
        run: |
          mkdir -p "$DEPS_DIR"/{bin,fonts,models,system-fonts,python-venv,piper,libs,scripts}
          echo "DEPS_DIR=$DEPS_DIR" >> $GITHUB_ENV

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg + System Tools Cache-Aware
        run: |
          MARKER="$DEPS_DIR/.ffmpeg_ok"
          LIB_DIR="$DEPS_DIR/libs"
          if [ -f "$MARKER" ] && [ -f "$DEPS_DIR/bin/ffmpeg" ] && [ -f "$DEPS_DIR/bin/sox" ]; then
            echo "CACHED"
            if [ -d "$LIB_DIR" ]; then
              sudo mkdir -p /usr/lib/x86_64-linux-gnu
              sudo cp -n "$LIB_DIR"/*.so* /usr/lib/x86_64-linux-gnu/ 2>/dev/null || true
              sudo ldconfig
            fi
            sudo cp "$DEPS_DIR/bin/ffmpeg" /usr/local/bin/ffmpeg 2>/dev/null || true
            sudo cp "$DEPS_DIR/bin/ffprobe" /usr/local/bin/ffprobe 2>/dev/null || true
            sudo cp "$DEPS_DIR/bin/sox" /usr/local/bin/sox 2>/dev/null || true
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe /usr/local/bin/sox 2>/dev/null || true
            [ -f "$DEPS_DIR/bin/espeak-ng" ] && sudo cp "$DEPS_DIR/bin/espeak-ng" /usr/local/bin/espeak-ng && sudo chmod +x /usr/local/bin/espeak-ng || true
            if [ -d "$DEPS_DIR/system-fonts/truetype" ]; then
              sudo cp -rn "$DEPS_DIR/system-fonts/truetype/"* /usr/share/fonts/truetype/ 2>/dev/null || true
              sudo fc-cache -f > /dev/null 2>&1 || true
            fi
            if ! (ffmpeg -version >/dev/null 2>&1 && sox --version >/dev/null 2>&1); then
              rm -f "$MARKER"
              sudo apt-get update -q
              sudo apt-get install -y -q --reinstall ffmpeg sox espeak-ng libsox-fmt-all fonts-noto fonts-noto-core fonts-noto-extra fonts-noto-ui-core fonts-dejavu-core fontconfig
              sudo ldconfig
            fi
          else
            sudo apt-get update -q
            sudo apt-get install -y -q ffmpeg sox espeak-ng libsox-fmt-all fonts-noto fonts-noto-core fonts-noto-extra fonts-noto-ui-core fonts-dejavu-core fontconfig
            sudo ldconfig
          fi
          mkdir -p "$DEPS_DIR/bin" "$LIB_DIR" "$DEPS_DIR/system-fonts/truetype"
          cp "$(which ffmpeg)" "$DEPS_DIR/bin/ffmpeg" 2>/dev/null || true
          cp "$(which ffprobe)" "$DEPS_DIR/bin/ffprobe" 2>/dev/null || true
          cp "$(which sox)" "$DEPS_DIR/bin/sox" 2>/dev/null || true
          cp "$(which espeak-ng)" "$DEPS_DIR/bin/espeak-ng" 2>/dev/null || true
          for bin in ffmpeg ffprobe sox; do
            LDD=$(ldd "$(which $bin)" 2>/dev/null | grep "=> /" | awk '{print $3}')
            for lib in $LDD; do [ -f "$lib" ] && cp -n "$lib" "$LIB_DIR/" 2>/dev/null || true; done
          done
          cp -rn /usr/share/fonts/truetype/* "$DEPS_DIR/system-fonts/truetype/" 2>/dev/null || true
          touch "$MARKER"

      - name: Download Custom Fonts (Auto-Heal)
        run: |
          NEED_DOWNLOAD=0
          for f in NotoSans-Regular.ttf NotoSans-Bold.ttf \
                   NotoSansDevanagari-Regular.ttf NotoSansDevanagari-Bold.ttf \
                   NotoNaskhArabic-Regular.ttf NotoNaskhArabic-Bold.ttf; do
            P="$DEPS_DIR/fonts/$f"
            if [ ! -f "$P" ] || [ "$(stat -c%s "$P" 2>/dev/null || echo 0)" -lt 50000 ]; then
              NEED_DOWNLOAD=1
            fi
          done
          if [ $NEED_DOWNLOAD -eq 1 ]; then
            rm -rf "$DEPS_DIR/fonts"
            mkdir -p "$DEPS_DIR/fonts"
            declare -A FONTS=(
              ["NotoSans-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSans/NotoSans-Regular.ttf"
              ["NotoSans-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSans/NotoSans-Bold.ttf"
              ["NotoSansDevanagari-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf"
              ["NotoSansDevanagari-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf"
              ["NotoNaskhArabic-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf"
              ["NotoNaskhArabic-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf"
            )
            for name in "${!FONTS[@]}"; do
              for try in 1 2 3; do
                wget -q --timeout=60 "${FONTS[$name]}" -O "$DEPS_DIR/fonts/$name" && break
                sleep 2
              done
            done
          fi
          MISSING=0
          for f in NotoSans-Regular.ttf NotoSans-Bold.ttf \
                   NotoSansDevanagari-Regular.ttf NotoSansDevanagari-Bold.ttf \
                   NotoNaskhArabic-Regular.ttf NotoNaskhArabic-Bold.ttf; do
            P="$DEPS_DIR/fonts/$f"
            SZ=$(stat -c%s "$P" 2>/dev/null || echo 0)
            if [ "$SZ" -gt 50000 ]; then
              echo "OK: $f"
            else
              echo "FAIL: $f"
              MISSING=$((MISSING+1))
            fi
          done
          [ $MISSING -gt 0 ] && exit 1
          mkdir -p ~/.fonts
          cp "$DEPS_DIR/fonts/"*.ttf ~/.fonts/ 2>/dev/null || true
          fc-cache -fv ~/.fonts/ > /dev/null 2>&1 || true
          echo "FONTS READY"

      - name: Python Packages Cache-Aware
        run: |
          VENV="$DEPS_DIR/python-venv"
          if [ -f "$VENV/.installed" ] && "$VENV/bin/python" -c "import edge_tts, PIL, mutagen" 2>/dev/null; then
            echo "CACHED"
          else
            rm -rf "$VENV"
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --upgrade pip --quiet
            "$VENV/bin/pip" install --no-cache-dir requests edge-tts mutagen Pillow google-api-python-client google-auth-httplib2 google-auth-oauthlib gTTS piper-tts numpy scipy soundfile
            touch "$VENV/.installed"
          fi
          echo "$VENV/bin" >> $GITHUB_PATH

      - name: Piper Models Cache-Aware
        run: |
          P="$DEPS_DIR/piper"
          if [ -f "$P/.installed" ] && [ -f "$P/hi_IN-pratham-medium.onnx" ]; then
            echo "CACHED"
          else
            rm -rf "$P" && mkdir -p "$P"
            cd "$P"
            BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main"
            wget -q --timeout=90 "$BASE/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx" -O hi_IN-pratham-medium.onnx || true
            wget -q --timeout=90 "$BASE/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx.json" -O hi_IN-pratham-medium.onnx.json || true
            touch "$P/.installed"
            cd "$GITHUB_WORKSPACE"
          fi
          echo "PIPER_DIR=$P" >> $GITHUB_ENV

      - name: Prepare Python Script
        run: |
          mkdir -p "$DEPS_DIR/scripts"
          cat << 'PYEOF' > "$DEPS_DIR/scripts/story.py"
import os, re, time, random, subprocess, requests, shutil, sys, math, json, traceback
