          def make_logo():
              for src in ["logo.png", "logo.jpg", "assets/logo.png", "assets/logo.jpg"]:
                  if os.path.exists(src):
                      try:
                          img = Image.open(src).convert("RGBA")
                          pad = 8
                          c = Image.new("RGBA", (img.width+pad*2, img.height+pad*2), (0,0,0,0))
                          c.paste(img, (pad, pad), img)
                          g = c.filter(ImageFilter.GaussianBlur(6))
                          gd = g.split()
                          a = gd[3].point(lambda p: int(p*0.4))
                          g.putalpha(a)
                          Image.alpha_composite(g, c).save("avatar.png")
                          R["logo"] = {"source": src, "status": "ok"}
                          return True
                      except Exception:
                          pass
              return False

