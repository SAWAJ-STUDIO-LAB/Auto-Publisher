          def get_bg(queries, dur):
              DK = "eq=contrast=1.10:brightness=0.02:saturation=1.12,vignette=PI/5"
              clips = []
              pk = os.environ.get("PEXELS_API_KEY")
              if pk:
                  for q in queries:
                      try:
                          r = session.get(f"https://api.pexels.com/videos/search?query={q}&orientation=portrait&per_page=4",
                              headers={"Authorization":pk}, timeout=14)
                          if r.status_code == 200 and r.json().get("videos"):
                              v = random.choice(r.json()["videos"])
                              fs = sorted(v.get("video_files",[]), key=lambda x: x.get("width",0), reverse=True)
                              if fs and dl(fs[0]["link"], f"tmp_{len(clips)}.mp4"):
                                  clips.append(f"tmp_{len(clips)}.mp4")
                                  if len(clips) >= 2: break
                      except: continue
              if not clips:
                  for i, u in enumerate(MIXKIT):
                      if dl(u, f"tmp_mix_{i}.mp4"): clips.append(f"tmp_mix_{i}.mp4"); break
              if not clips:
                  log_err("BG failed"); send_report("FAILED","BG failed"); sys.exit(1)
              d_e = dur / len(clips)
              for i, c in enumerate(clips):
                  run(f'ffmpeg -y -stream_loop -1 -i {c} -vf "'
                      f'scale=1200:2140:force_original_aspect_ratio=increase,crop=1080:1920,'
                      f"zoompan=z='min(zoom+0.0004,1.06)':d=1:"
                      f"x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1080x1920,"
                      f'setsar=1,{DK}" -t {d_e:.2f} -an -c:v libx264 -preset veryfast -crf 18 bg_{i}.mp4')
              if len(clips) >= 2:
                  with open("bgl.txt","w") as f:
                      for i in range(len(clips)): f.write(f"file 'bg_{i}.mp4'\n")
                  run('ffmpeg -y -f concat -safe 0 -i bgl.txt -c copy bg.mp4')
                  R["plat"]["bg"] = "Multi"
              else:
                  os.rename("bg_0.mp4", "bg.mp4")
                  R["plat"]["bg"] = "Single"
              return "bg.mp4"

          def upload_drive(path, prefix):
              try:
                  creds = Credentials(None,
                      refresh_token=os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN"),
                      client_id=os.environ.get("GOOGLE_DRIVE_CLIENT_ID"),
                      client_secret=os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET"),
                      token_uri="https://oauth2.googleapis.com/token")
                  svc = build("drive","v3",credentials=creds,cache_discovery=False)
                  meta = {"name": f"{prefix}_{int(time.time())}.mp4"}
                  fid = os.environ.get("DRIVE_STORY_FOLDER_ID")
                  if fid: meta["parents"] = [fid]
                  up = svc.files().create(body=meta,
                      media_body=MediaFileUpload(path,mimetype="video/mp4",resumable=True),
                      fields="id").execute()
                  did = up.get("id")
                  svc.permissions().create(fileId=did, body={"type":"anyone","role":"reader"}).execute()
                  link = f"https://drive.google.com/file/d/{did}/view"
                  R["drive"] = {"status":"ok","link":link}
                  return link
              except Exception as e:
                  R["drive"] = {"status": f"fail ({str(e)[:80]})"}
                  return None

          def fetch_hadith():
              bases = ["https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1",
                       "https://raw.githubusercontent.com/fawazahmed0/hadith-api/1"]
              recent = []
              try:
                  if os.path.exists("recent.json"):
                      with open("recent.json") as f: recent = json.load(f)
              except: pass
              for att in range(30):
                  book = random.choice(BOOKS)
                  num = random.randint(1, max(1, book["max"]-50))
                  k = f"{book['eng']}:{num}"
                  if k in recent[-30:]: continue
                  for base in bases:
                      try:
                          r = session.get(f"{base}/editions/{book['eng']}/{num}.json", timeout=12)
                          if r.status_code != 200: continue
                          hs = r.json().get("hadiths", [])
                          if not hs: continue
                          eng = sanitize(hs[0].get("text",""))
                          if not (100 <= len(eng) <= 500): continue
                          ara = ""
                          try:
                              ar = session.get(f"{base}/editions/{book['ara']}/{num}.json", timeout=10)
                              if ar.status_code == 200:
                                  ad = ar.json().get("hadiths", [])
                                  if ad: ara = sanitize(ad[0].get("text",""))
                          except: pass
                          recent.append(k); recent = recent[-50:]
                          try:
                              with open("recent.json","w") as f: json.dump(recent, f)
                          except: pass
                          R["hadith"] = {"collection":book["name"],"number":str(hs[0].get("hadithnumber") or num),
                                         "english":eng,"arabic":ara,"chars":len(eng)}
                          R["plat"]["hadith"] = f"fawazahmed0/{book['eng']}"
                          return R["hadith"]
                      except: continue
              R["hadith"] = {"collection":"Sahih al-Bukhari","number":"1",
                             "english":"The reward of deeds depends upon the intentions.",
                             "arabic":"إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ","chars":60}
              return R["hadith"]

          def islamic_pattern(img, op=0.05):
              try:
                  p = Image.new("RGBA",(W,H),(0,0,0,0)); pd = ImageDraw.Draw(p)
                  gold = (212,175,55,int(255*op))
                  for x in range(0,W,120):
                      for y in range(0,H,120):
                          pd.polygon([(x,y-30),(x+30,y),(x,y+30),(x-30,y)], outline=gold)
                  return Image.alpha_composite(img,p)
              except: return img

          def border(img, pal):
              try:
                  b = Image.new("RGBA",(W,H),(0,0,0,0)); bd = ImageDraw.Draw(b)
                  bd.rectangle([6,6,W-6,H-6], outline=tuple(pal["primary"])+(200,), width=4)
                  bd.rectangle([14,14,W-14,H-14], outline=tuple(pal["glow"])+(80,), width=1)
                  return Image.alpha_composite(img,b)
              except: return img

          def prog_dots(img, prog, pal, cnt=9):
              try:
                  l = Image.new("RGBA",(W,H),(0,0,0,0)); ld = ImageDraw.Draw(l)
                  tw = cnt*22; sx = (W-tw)//2; y = H-42
                  for i in range(cnt):
                      cx = sx+i*22+8
                      if (i/cnt) < prog:
                          ld.ellipse([cx-7,y-7,cx+7,y+7], fill=tuple(pal["accent"])+(255,))
                      else:
                          ld.ellipse([cx-5,y-5,cx+5,y+5], fill=(80,65,40,160))
                  return Image.alpha_composite(img,l)
              except: return img

          def ref_card(img, coll, num, hj, pal):
              try:
                  if not coll and not num: return img
                  c = Image.new("RGBA",(W,H),(0,0,0,0)); cd = ImageDraw.Draw(c)
                  fn = _pick_font(coll, "NotoSans-Bold.ttf")
                  fs = get_font(fn, 22); fxs = get_font("NotoSans-Regular.ttf", 18)
                  cw, ch, cx, cy = 400, 88, W-430, 30
                  cd.rounded_rectangle([cx,cy,cx+cw,cy+ch], radius=12, fill=(15,10,5,235),
                                        outline=tuple(pal["primary"])+(255,), width=2)
                  cd.text((cx+15,cy+12), _trunc(cd,coll,fs,cw-30,"la"), fill=tuple(pal["glow"])+(255,), font=fs)
                  cd.text((cx+15,cy+42), f"#{num}", fill=tuple(pal["text"])+(220,), font=fxs)
                  if hj: cd.text((cx+15,cy+64), _trunc(cd,hj,fxs,cw-30,"la"), fill=tuple(pal["secondary"])+(220,), font=fxs)
                  return Image.alpha_composite(img,c)
              except: return img

          def title_chip(img, title, pal):
              try:
                  if not title: return img
                  c = Image.new("RGBA",(W,H),(0,0,0,0)); cd = ImageDraw.Draw(c)
                  fn = _pick_font(title, "NotoSans-Bold.ttf")
                  fnt = get_font(fn, 26)
                  text = f"* {title}"
                  bb = cd.textbbox((0,0), text, font=fnt)
                  cw = min((bb[2]-bb[0])+40, W-400)
                  cd.rounded_rectangle([30,30,30+cw,82], radius=26, fill=(15,10,5,235),
                                        outline=tuple(pal["primary"])+(255,), width=2)
                  cd.text((50,43), text, fill=tuple(pal["glow"])+(255,), font=fnt)
                  return Image.alpha_composite(img,c)
              except: return img

          def sound_hint(img, a, pal, txt):
              try:
                  if a <= 0: return img
                  l = Image.new("RGBA",(W,H),(0,0,0,0)); ld = ImageDraw.Draw(l)
                  fn = _pick_font(txt, "NotoSans-Bold.ttf")
                  font = get_font(fn, 32)
                  cx, cy = W-150, 240
                  for dx,dy in [(-2,-2),(2,-2),(-2,2),(2,2)]:
                      ld.text((cx+dx,cy+dy), txt, fill=(0,0,0,int(180*a)), font=font, anchor="mm")
                  ld.text((cx,cy), txt, fill=tuple(pal["glow"])+(int(240*a),), font=font, anchor="mm")
                  r,g,b,al = l.split(); al = al.point(lambda p: int(p*a)); l.putalpha(al)
                  return Image.alpha_composite(img,l)
              except: return img

          def apply_emotion(img, em):
              try:
                  oa = img.split()[3]; rgb = img.convert("RGB")
                  if em == "tawbah":
                      rgb = ImageEnhance.Color(rgb).enhance(0.88)
                      rgb = Image.blend(rgb, Image.new("RGB",rgb.size,(0,0,40)), 0.10)
                  elif em == "shukr":
                      rgb = ImageEnhance.Color(rgb).enhance(1.10)
                  elif em == "khushu":
                      rgb = ImageEnhance.Color(rgb).enhance(0.92)
                      rgb = Image.blend(rgb, Image.new("RGB",rgb.size,(30,20,40)), 0.08)
                  r = rgb.convert("RGBA"); r.putalpha(oa); return r
              except: return img

          def build_msg(status="COMPLETED", note=""):
              dur = int(time.time()-RUN_START)
              L = ["ISLAMIC HADITH STORY","=============="]
              L.append(f"STATUS: {status}")
              if note: L.append(f"Note: {note}")
              L.append(f"Time: {dur//60}m {dur%60}s")
              L.append("PLATFORMS:")
              for k,v in R["plat"].items(): L.append(f"  {k}: {v}")
              if R["sync"]:
                  L.append("SYNC:")
                  for k,v in R["sync"].items(): L.append(f"  {k}: {v}")
              if R["fonts"]:
                  L.append("FONTS:")
                  for k in list(R["fonts"].keys())[:6]: L.append(f"  OK {k}")
              if _FONT_MISSING: L.append(f"  MISSING: {list(_FONT_MISSING)[:4]}")
              h = R["hadith"]
              if h: L.append(f"HADITH: {h.get('collection','')} #{h.get('number','')}")
              if R["video"]: L.append(f"VIDEO: {R['video'].get('duration','')}s")
              if R["drive"]:
                  L.append(f"DRIVE: {R['drive'].get('status','')}")
                  if R["drive"].get("link"): L.append(f"  {R['drive']['link']}")
              if R["warnings"]:
                  L.append("WARNINGS:")
                  for w in R["warnings"][:5]: L.append(f"  {w}")
              if R["errors"]:
                  L.append("ERRORS:")
                  for e in R["errors"][:5]: L.append(f"  {e}")
              return "\n".join(L)[:3900]

          def send_report(status="COMPLETED", note=""):
              msg = build_msg(status, note)
              print("="*60); print(msg); print("="*60)
              if TG_TOKEN and TG_CHAT_ID:
                  try:
                      session.post(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                          json={"chat_id":TG_CHAT_ID,"text":msg}, timeout=20)
                  except: pass

