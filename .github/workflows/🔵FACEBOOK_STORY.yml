name: "🔵FACEBOOK STORY"

on:
  workflow_dispatch:
    inputs:
      upload_to_social:
        description: 'Upload to Facebook Story?'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '30 23 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: facebook-story
  cancel-in-progress: false

jobs:
  fb-story:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CACHE_VERSION: v13
      DEPS_DIR: ${{ github.workspace }}/.dependencies

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4

      - name: Restore Master Dependencies Cache
        id: master-cache
        uses: actions/cache@v4
        with:
          path: |
            .dependencies
            ~/.cache/pip
            ~/.local/share/piper
          key: ${{ runner.os }}-fb-story-master-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements.txt') || 'default' }}
          restore-keys: |
            ${{ runner.os }}-fb-story-master-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-fb-story-master-

      - name: Prepare Dependencies Folder
        run: |
          mkdir -p "$DEPS_DIR"/{bin,fonts,models,system-fonts,python-venv,piper,coqui,logs,libs}
          echo "DEPS_DIR=$DEPS_DIR" >> $GITHUB_ENV

      - name: Fetch Code from Private Repository
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
        run: |
          PRIVATE_REPO="SAWAJ-STUDIO-LAB/admin"
          git clone --depth 1 https://x-access-token:${TOKEN_GITHUB}@github.com/${PRIVATE_REPO}.git temp_private_repo
          mkdir -p "Social media/Facebook"
          cp temp_private_repo/"Social media/Facebook/Story_video.py" "Social media/Facebook/Story_video.py"
          rm -rf temp_private_repo

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg + System Fonts Cache-Aware
        run: |
          MARKER="$DEPS_DIR/.ffmpeg_ok"
          LIB_DIR="$DEPS_DIR/libs"

          if [ -f "$MARKER" ] && [ -f "$DEPS_DIR/bin/ffmpeg" ] && [ -f "$DEPS_DIR/bin/sox" ]; then
            echo "FFmpeg + SoX CACHED - restoring"
            if [ -d "$LIB_DIR" ]; then
              sudo mkdir -p /usr/lib/x86_64-linux-gnu
              sudo cp -n "$LIB_DIR"/*.so* /usr/lib/x86_64-linux-gnu/ 2>/dev/null || true
              sudo ldconfig
            fi
            sudo mkdir -p /usr/local/bin
            sudo cp "$DEPS_DIR/bin/ffmpeg" /usr/local/bin/ffmpeg 2>/dev/null || true
            sudo cp "$DEPS_DIR/bin/ffprobe" /usr/local/bin/ffprobe 2>/dev/null || true
            sudo cp "$DEPS_DIR/bin/sox" /usr/local/bin/sox 2>/dev/null || true
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe /usr/local/bin/sox 2>/dev/null || true
            [ -f "$DEPS_DIR/bin/espeak-ng" ] && sudo cp "$DEPS_DIR/bin/espeak-ng" /usr/local/bin/espeak-ng && sudo chmod +x /usr/local/bin/espeak-ng || true
            if [ -d "$DEPS_DIR/system-fonts/truetype" ]; then
              sudo mkdir -p /usr/share/fonts/truetype
              sudo cp -rn "$DEPS_DIR/system-fonts/truetype/"* /usr/share/fonts/truetype/ 2>/dev/null || true
              sudo fc-cache -f > /dev/null 2>&1 || true
            fi
            if ffmpeg -version >/dev/null 2>&1 && sox --version >/dev/null 2>&1; then
              echo "Cache verified"
            else
              echo "Cache broken - reinstalling"
              rm -f "$MARKER"
              sudo apt-get update -q
              sudo apt-get install -y -q --reinstall ffmpeg sox espeak-ng libsox-fmt-all fonts-noto fonts-noto-core fonts-noto-extra fonts-noto-ui-core fonts-noto-color-emoji fonts-dejavu-core fontconfig
              sudo ldconfig
            fi
          else
            echo "Fresh install of FFmpeg + SoX + espeak-ng"
            sudo apt-get update -q
            sudo apt-get install -y -q ffmpeg sox espeak-ng libsox-fmt-all fonts-noto fonts-noto-core fonts-noto-extra fonts-noto-ui-core fonts-noto-color-emoji fonts-dejavu-core fontconfig
            sudo ldconfig
          fi

          mkdir -p "$DEPS_DIR/bin" "$LIB_DIR" "$DEPS_DIR/system-fonts/truetype"
          cp "$(which ffmpeg)" "$DEPS_DIR/bin/ffmpeg" 2>/dev/null || true
          cp "$(which ffprobe)" "$DEPS_DIR/bin/ffprobe" 2>/dev/null || true
          cp "$(which sox)" "$DEPS_DIR/bin/sox" 2>/dev/null || true
          cp "$(which espeak-ng)" "$DEPS_DIR/bin/espeak-ng" 2>/dev/null || true

          for bin in ffmpeg ffprobe sox; do
            LDD=$(ldd "$(which $bin)" 2>/dev/null | grep "=> /" | awk '{print $3}')
            for lib in $LDD; do
              [ -f "$lib" ] && cp -n "$lib" "$LIB_DIR/" 2>/dev/null || true
            done
          done
          for libglob in /usr/lib/x86_64-linux-gnu/libav*.so* /usr/lib/x86_64-linux-gnu/libsw*.so* /usr/lib/x86_64-linux-gnu/libpostproc*.so* /usr/lib/x86_64-linux-gnu/libsox*.so*; do
            [ -f "$libglob" ] && cp -n "$libglob" "$LIB_DIR/" 2>/dev/null || true
          done

          cp -rn /usr/share/fonts/truetype/* "$DEPS_DIR/system-fonts/truetype/" 2>/dev/null || true
          touch "$MARKER"
          ffmpeg -version 2>&1 | head -1
          sox --version 2>&1 | head -1
          echo "Libs cached: $(ls -1 $LIB_DIR 2>/dev/null | wc -l)"

      - name: Custom Fonts Cache-Aware
        run: |
          FORCE_DOWNLOAD=0
          [ ! -f "$DEPS_DIR/fonts/NotoEmoji-Regular.ttf" ] && FORCE_DOWNLOAD=1
          [ ! -f "$DEPS_DIR/fonts/NotoEmoji-Bold.ttf" ] && FORCE_DOWNLOAD=1

          if [ -f "$DEPS_DIR/fonts/NotoEmoji-Regular.ttf" ]; then
            SZ=$(stat -c%s "$DEPS_DIR/fonts/NotoEmoji-Regular.ttf" 2>/dev/null || echo 0)
            if [ "$SZ" -lt 100000 ]; then
              echo "NotoEmoji-Regular.ttf too small - forcing re-download"
              FORCE_DOWNLOAD=1
            fi
          fi

          if [ $FORCE_DOWNLOAD -eq 0 ] && [ -f "$DEPS_DIR/.fonts_ok" ] && [ "$(ls -A $DEPS_DIR/fonts 2>/dev/null | wc -l)" -ge 9 ]; then
            echo "Custom fonts CACHED"
          else
            echo "Downloading fonts"
            rm -rf "$DEPS_DIR/fonts"
            mkdir -p "$DEPS_DIR/fonts"

            declare -A FONTS=(
              ["NotoSans-Regular.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf"
              ["NotoSans-Bold.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf"
              ["NotoSansDevanagari-Regular.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf"
              ["NotoSansDevanagari-Bold.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf"
              ["NotoNaskhArabic-Regular.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf"
              ["NotoNaskhArabic-Bold.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf"
              ["NotoEmoji-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-emoji@main/fonts/NotoEmoji-Regular.ttf"
              ["NotoEmoji-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-emoji@main/fonts/NotoEmoji-Bold.ttf"
              ["NotoColorEmoji.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-emoji@main/fonts/NotoColorEmoji.ttf"
            )

            for name in "${!FONTS[@]}"; do
              echo "Downloading $name"
              wget -q --timeout=45 --tries=3 "${FONTS[$name]}" -O "$DEPS_DIR/fonts/$name" || true
            done

            echo "Downloaded files"
            ls -la "$DEPS_DIR/fonts/"

            for f in NotoEmoji-Regular.ttf NotoEmoji-Bold.ttf NotoSans-Bold.ttf; do
              if [ -f "$DEPS_DIR/fonts/$f" ]; then
                SZ=$(stat -c%s "$DEPS_DIR/fonts/$f")
                echo "$f $SZ bytes"
                if [ "$SZ" -lt 50000 ]; then
                  echo "Too small - alternate download"
                  if [ "$f" = "NotoEmoji-Regular.ttf" ]; then
                    wget -q --timeout=60 "https://raw.githubusercontent.com/googlefonts/noto-emoji/main/fonts/NotoEmoji-Regular.ttf" -O "$DEPS_DIR/fonts/$f" || true
                  fi
                fi
              fi
            done

            touch "$DEPS_DIR/.fonts_ok"
          fi

          mkdir -p ~/.fonts
          cp "$DEPS_DIR/fonts/"*.ttf ~/.fonts/ 2>/dev/null || true
          fc-cache -f > /dev/null 2>&1 || true

          echo "~/.fonts contents"
          ls -la ~/.fonts/

          echo "Emoji fonts found"
          find ~/.fonts -name "*Emoji*.ttf" 2>/dev/null || true

          echo "FONT VALIDITY TEST"
          if [ -f "$HOME/.fonts/NotoEmoji-Regular.ttf" ]; then
            SZ=$(stat -c%s "$HOME/.fonts/NotoEmoji-Regular.ttf")
            echo "NotoEmoji-Regular.ttf found in HOME size $SZ"
          else
            echo "NotoEmoji-Regular.ttf not in HOME"
          fi

          if [ -f "$DEPS_DIR/fonts/NotoEmoji-Regular.ttf" ]; then
            SZ=$(stat -c%s "$DEPS_DIR/fonts/NotoEmoji-Regular.ttf")
            echo "NotoEmoji-Regular.ttf found in DEPS size $SZ"
          else
            echo "NotoEmoji-Regular.ttf not in DEPS"
          fi

      - name: Python Packages Cache-Aware
        run: |
          VENV="$DEPS_DIR/python-venv"
          if [ -f "$VENV/.installed" ] && "$VENV/bin/python" -c "import edge_tts, PIL, mutagen, gtts" 2>/dev/null; then
            echo "Python packages CACHED"
          else
            echo "Python packages install"
            rm -rf "$VENV"
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --upgrade pip --quiet
            "$VENV/bin/pip" install --no-cache-dir requests edge-tts mutagen Pillow google-api-python-client google-auth-httplib2 google-auth-oauthlib gTTS piper-tts numpy scipy soundfile
            touch "$VENV/.installed"
          fi
          echo "$VENV/bin" >> $GITHUB_PATH

      - name: Piper Models Cache-Aware
        run: |
          P="$DEPS_DIR/piper"
          if [ -f "$P/.installed" ] && [ -f "$P/hi_IN-pratham-medium.onnx" ]; then
            echo "Piper models CACHED"
          else
            echo "Piper models download"
            rm -rf "$P" && mkdir -p "$P"
            cd "$P"
            BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main"
            wget -q --timeout=90 "$BASE/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx" -O hi_IN-pratham-medium.onnx || true
            wget -q --timeout=90 "$BASE/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx.json" -O hi_IN-pratham-medium.onnx.json || true
            wget -q --timeout=90 "$BASE/hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium.onnx" -O hi_IN-priyamvada-medium.onnx || true
            wget -q --timeout=90 "$BASE/hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium.onnx.json" -O hi_IN-priyamvada-medium.onnx.json || true
            touch "$P/.installed"
            cd "$GITHUB_WORKSPACE"
          fi
          echo "PIPER_DIR=$P" >> $GITHUB_ENV

      - name: Master Tool Health Check
        id: health
        run: |
          REPORT_FILE="$DEPS_DIR/tools_status.json"
          echo "{" > "$REPORT_FILE"
          echo "  \"checked_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"," >> "$REPORT_FILE"
          echo "  \"tools\": {" >> "$REPORT_FILE"
          FIRST=1
          add_entry() {
            local name="$1"
            local status="$2"
            local detail="$3"
            if [ $FIRST -eq 0 ]; then echo "," >> "$REPORT_FILE"; fi
            FIRST=0
            printf '    "%s": {"status": "%s", "detail": "%s"}' "$name" "$status" "$detail" >> "$REPORT_FILE"
            echo "[HEALTH] $name $status $detail"
          }

          command -v ffmpeg >/dev/null 2>&1 && add_entry "ffmpeg" "ok" "present" || add_entry "ffmpeg" "fail" "not found"
          command -v ffprobe >/dev/null 2>&1 && add_entry "ffprobe" "ok" "present" || add_entry "ffprobe" "fail" "not found"
          command -v sox >/dev/null 2>&1 && add_entry "sox" "ok" "present" || add_entry "sox" "fail" "not found"
          command -v espeak-ng >/dev/null 2>&1 && add_entry "espeak-ng" "ok" "present" || add_entry "espeak-ng" "fail" "not found"
          command -v edge-tts >/dev/null 2>&1 && add_entry "edge-tts" "ok" "present" || add_entry "edge-tts" "fail" "not found"
          command -v gtts-cli >/dev/null 2>&1 && add_entry "gtts" "ok" "present" || add_entry "gtts" "fail" "not found"
          command -v piper >/dev/null 2>&1 && add_entry "piper-cli" "ok" "present" || add_entry "piper-cli" "fail" "not found"

          [ -f "$DEPS_DIR/piper/hi_IN-pratham-medium.onnx" ] && add_entry "piper-model-pratham" "ok" "present" || add_entry "piper-model-pratham" "fail" "missing"
          [ -f "$DEPS_DIR/piper/hi_IN-priyamvada-medium.onnx" ] && add_entry "piper-model-priyamvada" "ok" "present" || add_entry "piper-model-priyamvada" "fail" "missing"

          FC=$(ls "$DEPS_DIR/fonts" 2>/dev/null | wc -l)
          add_entry "custom-fonts" "ok" "$FC files"

          for f in NotoEmoji-Regular.ttf NotoEmoji-Bold.ttf NotoColorEmoji.ttf; do
            if [ -f "$DEPS_DIR/fonts/$f" ]; then
              SZ=$(stat -c%s "$DEPS_DIR/fonts/$f")
              add_entry "font-$f" "ok" "$SZ bytes"
            else
              add_entry "font-$f" "fail" "missing"
            fi
          done

          [ -f "$DEPS_DIR/python-venv/.installed" ] && add_entry "python-venv" "ok" "installed" || add_entry "python-venv" "fail" "missing"
          LIBS=$(ls -1 "$DEPS_DIR/libs" 2>/dev/null | wc -l)
          add_entry "cached-libs" "ok" "$LIBS files"

          for key in OPENROUTER_API_KEY GROQ_API_KEY GEMINI_API_KEY MISTRAL_API_KEY CEREBRAS_API_KEY COHERE_API_KEY HUGGINGFACE_API_KEY ELEVENLABS_API_KEY DEEPL_API_KEY FREESOUND_API_KEY PEXELS_API_KEY PIXABAY_API_KEY COVERR_API_KEY TELEGRAM_BOT_TOKEN FACEBOOK_INSTAGRAM_META_TOKEN; do
            if [ -n "${!key:-}" ]; then
              add_entry "key:$key" "ok" "configured"
            else
              add_entry "key:$key" "hold" "not set"
            fi
          done

          echo "  }" >> "$REPORT_FILE"
          echo "}" >> "$REPORT_FILE"
          echo "TOOLS_STATUS_FILE=$REPORT_FILE" >> $GITHUB_ENV
          cat "$REPORT_FILE"

      - name: Run Facebook Story Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          DRIVE_STORY_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_AI }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          UPLOAD_TO_SOCIAL: ${{ inputs.upload_to_social || github.event.inputs.upload_to_social }}
          FONTS_DIR: ${{ env.DEPS_DIR }}/fonts
          DEPS_DIR: ${{ env.DEPS_DIR }}
          PIPER_DIR: ${{ env.DEPS_DIR }}/piper
          TOOLS_STATUS_FILE: ${{ env.DEPS_DIR }}/tools_status.json
        run: python3 "Social media/Facebook/Story_video.py"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fb-story-video
          path: Final_FB_Story.mp4
          retention-days: 5
          if-no-files-found: ignore

      - name: Cleanup Public Repo
        if: always()
        run: |
          rm -rf "Social media"
          rm -f Final_FB_Story.mp4

      - name: Cache Status
        if: always()
        run: |
          echo "Cache Hit: ${{ steps.master-cache.outputs.cache-hit }}"
          du -sh $DEPS_DIR 2>/dev/null || echo "no cache"
          ls -1 $DEPS_DIR/libs 2>/dev/null | wc -l
