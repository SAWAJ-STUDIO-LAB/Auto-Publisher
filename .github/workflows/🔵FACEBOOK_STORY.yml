name: "🔵FACEBOOK_STORY"

on:
  workflow_dispatch:
    inputs:
      upload_to_social:
        description: 'Upload to Facebook Story?'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '30 23 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: facebook-story
  cancel-in-progress: false

jobs:
  fb-story:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CACHE_VERSION: v24
      DEPS_DIR: ${{ github.workspace }}/.dependencies

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Master Dependencies Cache
        id: master-cache
        uses: actions/cache@v4
        with:
          path: |
            .dependencies
            ~/.cache/pip
            ~/.local/share/piper
          key: ${{ runner.os }}-fb-story-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements.txt') || 'default' }}
          restore-keys: |
            ${{ runner.os }}-fb-story-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-fb-story-

      - name: Prepare Dependencies Folder
        run: |
          mkdir -p "$DEPS_DIR"/{bin,fonts,models,system-fonts,python-venv,piper,libs}
          echo "DEPS_DIR=$DEPS_DIR" >> $GITHUB_ENV

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg + System Tools Cache-Aware
        run: |
          MARKER="$DEPS_DIR/.ffmpeg_ok"
          LIB_DIR="$DEPS_DIR/libs"
          if [ -f "$MARKER" ] && [ -f "$DEPS_DIR/bin/ffmpeg" ] && [ -f "$DEPS_DIR/bin/sox" ]; then
            echo "CACHED"
            if [ -d "$LIB_DIR" ]; then
              sudo mkdir -p /usr/lib/x86_64-linux-gnu
              sudo cp -n "$LIB_DIR"/*.so* /usr/lib/x86_64-linux-gnu/ 2>/dev/null || true
              sudo ldconfig
            fi
            sudo cp "$DEPS_DIR/bin/ffmpeg" /usr/local/bin/ffmpeg 2>/dev/null || true
            sudo cp "$DEPS_DIR/bin/ffprobe" /usr/local/bin/ffprobe 2>/dev/null || true
            sudo cp "$DEPS_DIR/bin/sox" /usr/local/bin/sox 2>/dev/null || true
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe /usr/local/bin/sox 2>/dev/null || true
            [ -f "$DEPS_DIR/bin/espeak-ng" ] && sudo cp "$DEPS_DIR/bin/espeak-ng" /usr/local/bin/espeak-ng && sudo chmod +x /usr/local/bin/espeak-ng || true
            if [ -d "$DEPS_DIR/system-fonts/truetype" ]; then
              sudo cp -rn "$DEPS_DIR/system-fonts/truetype/"* /usr/share/fonts/truetype/ 2>/dev/null || true
              sudo fc-cache -f > /dev/null 2>&1 || true
            fi
          else
            sudo apt-get update -q
            sudo apt-get install -y -q ffmpeg sox espeak-ng libsox-fmt-all fonts-noto fonts-noto-core fonts-noto-extra fonts-noto-ui-core fonts-dejavu-core fontconfig
            sudo ldconfig
          fi
          mkdir -p "$DEPS_DIR/bin" "$LIB_DIR" "$DEPS_DIR/system-fonts/truetype"
          cp "$(which ffmpeg)" "$DEPS_DIR/bin/ffmpeg" 2>/dev/null || true
          cp "$(which ffprobe)" "$DEPS_DIR/bin/ffprobe" 2>/dev/null || true
          cp "$(which sox)" "$DEPS_DIR/bin/sox" 2>/dev/null || true
          cp "$(which espeak-ng)" "$DEPS_DIR/bin/espeak-ng" 2>/dev/null || true
          for bin in ffmpeg ffprobe sox; do
            LDD=$(ldd "$(which $bin)" 2>/dev/null | grep "=> /" | awk '{print $3}')
            for lib in $LDD; do [ -f "$lib" ] && cp -n "$lib" "$LIB_DIR/" 2>/dev/null || true; done
          done
          cp -rn /usr/share/fonts/truetype/* "$DEPS_DIR/system-fonts/truetype/" 2>/dev/null || true
          touch "$MARKER"

      - name: Download Custom Fonts
        run: |
          mkdir -p "$DEPS_DIR/fonts"
          declare -A FONTS=(
            ["NotoSans-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSans/NotoSans-Regular.ttf"
            ["NotoSans-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSans/NotoSans-Bold.ttf"
            ["NotoSansDevanagari-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf"
            ["NotoSansDevanagari-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf"
            ["NotoNaskhArabic-Regular.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf"
            ["NotoNaskhArabic-Bold.ttf"]="https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf"
          )
          for name in "${!FONTS[@]}"; do
            P="$DEPS_DIR/fonts/$name"
            if [ ! -f "$P" ] || [ "$(stat -c%s "$P" 2>/dev/null || echo 0)" -lt 50000 ]; then
              wget -q --timeout=60 "${FONTS[$name]}" -O "$P" || true
            fi
          done
          mkdir -p ~/.fonts
          cp "$DEPS_DIR/fonts/"*.ttf ~/.fonts/ 2>/dev/null || true
          fc-cache -fv ~/.fonts/ > /dev/null 2>&1 || true

      - name: Python Packages Cache-Aware
        run: |
          VENV="$DEPS_DIR/python-venv"
          if [ -f "$VENV/.installed" ]; then
            echo "CACHED"
          else
            rm -rf "$VENV"
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --upgrade pip --quiet
            "$VENV/bin/pip" install --no-cache-dir requests edge-tts mutagen Pillow google-api-python-client google-auth-httplib2 google-auth-oauthlib gTTS piper-tts numpy scipy soundfile
            touch "$VENV/.installed"
          fi
          echo "$VENV/bin" >> $GITHUB_PATH

      - name: Piper Models Cache-Aware
        run: |
          P="$DEPS_DIR/piper"
          if [ -f "$P/.installed" ]; then
            echo "CACHED"
          else
            rm -rf "$P" && mkdir -p "$P"
            cd "$P"
            BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main"
            wget -q --timeout=90 "$BASE/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx" -O hi_IN-pratham-medium.onnx || true
            wget -q --timeout=90 "$BASE/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx.json" -O hi_IN-pratham-medium.onnx.json || true
            touch "$P/.installed"
            cd "$GITHUB_WORKSPACE"
          fi
          echo "PIPER_DIR=$P" >> $GITHUB_ENV

      - name: Create Python Script & Run Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          DRIVE_STORY_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          UPLOAD_TO_SOCIAL: '${{ inputs.upload_to_social || github.event.inputs.upload_to_social }}'
          FONTS_DIR: ${{ env.DEPS_DIR }}/fonts
          DEPS_DIR: ${{ env.DEPS_DIR }}
          PIPER_DIR: ${{ env.DEPS_DIR }}/piper
        run: |
          cat << 'PYEOF' > story.py
          import os
          import re
          import time
          import random
          import subprocess
          import requests
          import shutil
          import sys
          import json
          import traceback
          from datetime import datetime
          from mutagen.mp3 import MP3
          from PIL import Image, ImageDraw, ImageFont
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          
          session = requests.Session()
          session.mount("https://", HTTPAdapter(max_retries=Retry(total=5, backoff_factor=1.5)))
          
          TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          TG_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")
          META_TOKEN = os.environ.get("FACEBOOK_INSTAGRAM_META_TOKEN", "").strip()
          DEPS_DIR = os.environ.get("DEPS_DIR", os.path.expanduser("~/.dependencies"))
          FONTS_DIR = os.environ.get("FONTS_DIR", os.path.join(DEPS_DIR, "fonts"))
          PIPER_DIR = os.environ.get("PIPER_DIR", os.path.join(DEPS_DIR, "piper"))
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          should_post_social = (event_name == "schedule") or (str(os.environ.get("UPLOAD_TO_SOCIAL", "")).lower() == "true")
          
          GEMINI_KEY = os.environ.get("GEMINI_API_KEY")
          
          RUM_START = time.time()
          FPS, INTRO_SEC, OUTRO_SEC, W, H = 25, 3.5, 5.0, 1080, 1920
          
          BRAND_NAME = "SAWAJ STUDIO"
          BRAND_HANDLE = "@SawajStudio"
          
          FB_PALETTE = {
              "name": "Royal Gold",
              "primary": [212, 175, 55],
              "secondary": [255, 220, 120],
              "text": [255, 245, 220],
              "accent": [255, 200, 80],
              "glow": [255, 220, 120]
          }
          
          def run(cmd):
              return subprocess.run(cmd, shell=True, capture_output=True, text=True)
          
          def get_font(name, size):
              p = os.path.join(FONTS_DIR, name)
              if os.path.exists(p):
                  try: return ImageFont.truetype(p, size)
                  except: pass
              return ImageFont.load_default()
          
          def sanitize(t):
              if not t: return ""
              return re.sub(r'[\n\r]+', ' ', str(t)).replace('"', '').replace("'", '').strip()
          
          def wrap_text(text, font, max_t, draw):
              words = text.split()
              lines, cur = [], ""
              for w in words:
                  trial = (cur + " " + w).strip()
                  try:
                      bb = draw.textbox((0, 0), trial, font=font)
                      if (bb[2] - bb[0]) <= max_t: cur = trial
                      else:
                          if cur: lines.append(cur)
                          cur = w
                  except: cur = trial
              if cur: lines.append(cur)
              return lines if lines else [text]
          
          def fetch_hadith():
              books = [
                  {"eng": "eng-bukhari", "ara": "ara-bukhari", "name": "صحيح البخاري", "max": 7563},
                  {"eng": "eng-muslim",  "ara": "ara-muslim",  "name": "صحيح مسلم", "max": 3032},
              ]
              book = random.choice(books)
              h_num = random.randint(1, book["max"])
              try:
                  url = f"https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/{book['eng']}/{h_num}.json"
                  r_eng = session.get(url, timeout=10).json()
                  eng_text = r_eng.get("hadiths", [{}])[0].get("text", "")
                  url_ar = f"https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/{book['ara']}/{h_num}.json"
                  r_ar = session.get(url_ar, timeout=10).json()
                  ar_text = r_ar.get("hadiths", [{}])[0].get("text", "")
                  if eng_text:
                      return {"collection": book["name"], "number": h_num, "english": eng_text, "arabic": ar_text}
              except: pass
              return {"collection": "صحيح البخاري", "number": 1, "english": "Actions are judged by intentions.", "arabic": "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ"}
          
          def gen_ai_response(eng_txt, ara_txt):
              if GEMINI_KEY:
                  try:
                      url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={GEMINI_KEY}"
                      prompt = f'Translate this Hadith into 2 short Hindi sentences for video narration. Format JSON: {{"intro":"...","sentences":[{{"hi":"...","ar":"...","en":"..."}}]}}\nEnglish: {eng_txt}'
                      resp = session.post(url, json={"contents": [{"parts": [{"text": prompt}]}]}, timeout=15).json()
                      txt = resp["candidates"][0]["content"]["parts"][0]["text"].replace("```json", "").replace("```", "")
                      data = json.loads(txt)
                      data["palette"] = FB_PALETTE
                      return data
                  except: pass
              return {
                  "intro": "आज की खूबसूरत हदीस में हमारे लिए एक गहरा पैगाम है।",
                  "sentences": [{"hi": "कर्मों का फल नीयत पर निर्भर करता है।", "ar": "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ", "en": "Actions are judged by intentions."}],
                  "outro_main": "जज़ाक अल्लाह ख़ैर",
                  "palette": FB_PALETTE
              }
          
          def gen_tts(text, out_file):
              if run(f'edge-tts --voice hi-IN-SwaraNeural --text "{text}" --write-media "{out_file}"').returncode == 0:
                  if os.path.exists(out_file) and os.path.getsize(out_file) > 1000: return True
              from gtts import gTTS
              try:
                  gTTS(text=text, lang='hi').save(out_file)
                  return True
              except: return False
          
          def upload_drive(file_path):
              folder_id = os.environ.get("DRIVE_STORY_FOLDER_ID")
              if not folder_id: return ""
              try:
                  creds = Credentials(None, refresh_token=os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN"), token_uri="https://oauth2.googleapis.com/token", client_id=os.environ.get("GOOGLE_DRIVE_CLIENT_ID"), client_secret=os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET"))
                  service = build("drive", "v3", credentials=creds)
                  media = MediaFileUpload(file_path, mimetype="video/mp4", resumable=True)
                  f = service.files().create(body={"name": f"Story_{time.time()}.mp4", "parents": [folder_id]}, media_body=media, fields="webViewLink").execute()
                  return f.get("webViewLink", "")
              except: return ""
          
          def main():
              h = fetch_hadith()
              aic = gen_ai_response(h["english"], h["arabic"])
              parts = [aic.get("intro", "")] + [s["hi"] for s in aic.get("sentences", [])]
              voice_text = " ".join([p for p in parts if p])
              
              if not gen_tts(voice_text, "s_clean.mp3"): sys.exit(1)
              vdur = MP3("s_clean.mp3").info.length
              
              run(f'ffmpeg -y -f lavfi -i "color=c=0x0a0a1a:s=1080x1920:r=25" -t {vdur + INTRO_SEC + OUTRO_SEC} -c:v libx264 bg_final.mp4')
              
              os.makedirs("story_frames", exist_ok=True)
              F = {"hi": get_font("NotoSansDevanagari-Bold.ttf", 56), "big": get_font("NotoSans-Bold.ttf", 68)}
              
              tf = int((vdur + INTRO_SEC + OUTRO_SEC) * FPS)
              for fi in range(tf):
                  t = fi / FPS
                  img = Image.new("RGBA", (W, H), (0, 0, 0, 0))
                  d = ImageDraw.Draw(img)
                  d.rectangle([20, 20, W-20, H-20], outline=tuple(FB_PALETTE["primary"])+(180,), width=4)
                  if t < INTRO_SEC:
                      d.text((W//2, int(H*0.5)), BRAND_NAME, fill=(212,175,55,255), font=F["big"], anchor="mm")
                  elif t < INTRO_SEC + vdur:
                      d.text((W//2, int(H*0.5)), aic["sentences"][0]["hi"] if aic["sentences"] else "Hadith", fill=(255,255,255,255), font=F["hi"], anchor="mm")
                  else:
                      d.text((W//2, int(H*0.5)), aic.get("outro_main", "Jazakallah"), fill=(212,175,55,255), font=F["big"], anchor="mm")
                  img.save(f"story_frames/frame_{fi:05d}.png")
                  
              run(f'ffmpeg -y -i bg_final.mp4 -framerate {FPS} -i story_frames/frame_%05d.png -i s_clean.mp3 -filter_complex "[0:v][1:v]overlay=0:0" -c:v libx264 -preset veryfast -crf 17 -c:a aac -b:a 192k Final_FB_Story.mp4')
              
              link = upload_drive("Final_FB_Story.mp4")
              
              if META_TOKEN and should_post_social:
                  pid = os.environ.get("FACEBOOK_PAGE_ID", "").strip()
                  if pid:
                      fs = os.path.getsize("Final_FB_Story.mp4")
                      s = session.post(f"https://graph.facebook.com/v21.0/{pid}/video_stories", data={"upload_phase": "start", "file_size": fs, "access_token": META_TOKEN}).json()
                      vid, vurl = s.get("video_id"), s.get("upload_url")
                      if vid and vurl:
                          with open("Final_FB_Story.mp4", "rb") as f: session.post(vurl, headers={"Authorization": f"OAuth {META_TOKEN}", "offset": "0", "file_size": str(fs)}, data=f.read())
                          session.post(f"https://graph.facebook.com/v21.0/{pid}/video_stories", data={"upload_phase": "finish", "video_id": vid, "access_token": META_TOKEN})
                          
              if TG_TOKEN and TG_CHAT_ID:
                  msg = f"✅ Video Generated!\nDuration: {vdur:.1f}s\nDrive: {link}"
                  session.post(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage", json={"chat_id": TG_CHAT_ID, "text": msg})
                  
          if __name__ == "__main__": main()
          PYEOF
          
          python3 story.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fb-story-video
          path: Final_FB_Story.mp4
          retention-days: 5
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          rm -f Final_FB_Story.mp4
          echo "Cache Hit: ${{ steps.master-cache.outputs.cache-hit }}"
