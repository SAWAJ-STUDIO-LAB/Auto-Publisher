              for fi in range(tf):
                  t = fi / FPS; prog = fi / tf
                  img = Image.new("RGBA", (W, H), (0, 0, 0, 0))
                  draw = ImageDraw.Draw(img)
                  
                  if t < intro:
                      mt = t
                      if mt < 0.8:
                          ba = int(255 * min(1.0, mt / 0.3))
                          try:
                              bb = draw.textbbox((0, 0), BISMILLAH_ARABIC, font=F["bism"])
                              draw.text((W//2 - (bb[2] - bb[0])//2, int(H*0.18)), BISMILLAH_ARABIC,
                                        fill=tuple(palette["glow"]) + (ba,), font=F["bism"])
                          except: pass
                      if ai_data.get("hook"):
                          partial = reveal(ai_data["hook"], mt - 0.3, 0.25)
                          if partial:
                              try:
                                  draw.text((W//2, int(H*0.45)), partial,
                                            fill=tuple(palette["text"]) + (255,),
                                            font=F["hook"], anchor="mm")
                              except: pass
                      draw.text((W//2, int(H*0.68)), BRAND_NAME,
                                fill=tuple(palette["primary"]) + (220,), font=F["s"], anchor="mm")
                  
                  elif t < intro + vdur:
                      mt = t - intro
                      word_idx = int(mt / word_dur)
                      cur_hi = hindi_words[word_idx] if word_idx < len(hindi_words) else ""
                      cur_ar = arabic_words[word_idx] if word_idx < len(arabic_words) else ""
                      cur_en = english_words[word_idx] if word_idx < len(english_words) else ""
                      local_t = mt - (word_idx * word_dur)
                      fa = min(1.0, local_t / 0.3)
                      alpha_val = int(255 * fa)
                      img = draw_tri_line(img, cur_hi, cur_ar, cur_en, palette, F, alpha_val)
                      draw = ImageDraw.Draw(img)
                  
                  else:
                      ot = t - (intro + vdur)
                      if ai_data.get("outro_main"):
                          try:
                              gl = Image.new("RGBA", (W, H), (0, 0, 0, 0))
                              ImageDraw.Draw(gl).text((W//2, int(H*0.34)), ai_data["outro_main"],
                                  fill=tuple(palette["primary"]) + (100,), font=F["big"], anchor="mm")
                              gl = gl.filter(ImageFilter.GaussianBlur(18))
                              img = Image.alpha_composite(img, gl)
                              draw = ImageDraw.Draw(img)
                              draw.text((W//2, int(H*0.34)), ai_data["outro_main"],
                                        fill=tuple(palette["text"]) + (255,), font=F["big"], anchor="mm")
                          except: pass
                      if ai_data.get("outro_cta"):
                          try:
                              draw.text((W//2, int(H*0.44)), ai_data["outro_cta"],
                                        fill=tuple(palette["text"]) + (255,), font=F["s"], anchor="mm")
                          except: pass
                      draw.text((W//2, int(H*0.52)), BRAND_HANDLE,
                                fill=tuple(palette["primary"]) + (255,), font=F["tiny"], anchor="mm")
                      draw.text((W//2, int(H*0.60)), ai_data.get("sadaqah_cta", ""),
                                fill=tuple(palette["secondary"]) + (240,), font=F["tiny"], anchor="mm")
                      tags_t = "  ".join(ai_data.get("hashtags", [])[:4])
                      if tags_t:
                          draw.text((W//2, int(H*0.78)), tags_t,
                                    fill=tuple(palette["secondary"]) + (220,), font=F["tiny"], anchor="mm")
                      if ot >= outro - 1.2:
                          aa = int(255 * min(1.0, (ot - (outro - 1.2)) / 0.6))
                          try:
                              bb = draw.textbbox((0, 0), AMEEN_ARABIC, font=F["ameen"])
                              draw.text((W//2 - (bb[2] - bb[0])//2, int(H*0.90)), AMEEN_ARABIC,
                                        fill=tuple(palette["glow"]) + (aa,), font=F["ameen"])
                          except: pass
                  
                  img = _d.islamic_pattern(img, 0.05)
                  if intro <= t < intro + vdur:
                      cnt = int(20 + 15 * abs(math.sin((t - intro) * 2)))
                      img = _d.particles(img, fi, cnt, palette)
                  if t >= intro * 0.5:
                      img = _d.ref_card(img, hadith["collection"], hadith["number"], hj, palette)
                  if intro <= t < intro + vdur and ai_data.get("title"):
                      img = _d.title_chip(img, ai_data["title"], palette)
                  wp = mt / vdur if intro <= t < intro + vdur else prog
                  img = _d.progress_dots(img, wp, palette)
                  img = _d.border(img, palette)
                  img = _d.apply_emotion(img, ai_data.get("emotion", "calm"))
                  img.save(f"story_frames/frame_{fi:05d}.png")
              
              return tf, total
          EOF_FRAMES
          echo "✅ 15 | 🖼️ Chitrakaar ready"

          # ═══════════════════════════════════════════════════════════
          # FILE 16 | 🎞️ VIDEO BUILDER — src/video/11_video_builder.py
          # ═══════════════════════════════════════════════════════════
          cat > src/video/11_video_builder.py << 'EOF_VIDEO'
          import sys, os
          sys.path.insert(0, "src")
          sys.path.insert(0, "src/utils")
          from importlib import import_module
          _h = import_module("19_helpers")
          run = _h.run
          from config import FPS
          
          def build_video(bg_file, voice_file, total, output="Final_FB_Story.mp4"):
              run(f'ffmpeg -y -i {bg_file} -framerate {FPS} '
                  f'-i story_frames/frame_%05d.png -i {voice_file} '
                  f'-filter_complex "[0:v][1:v]overlay=0:0:shortest=1,'
                  f'eq=contrast=1.08:brightness=0.02:saturation=1.12,'
                  f'vignette=PI/6,format=yuv420p[outv]" '
                  f'-map "[outv]" -map 2:a '
                  f'-c:v libx264 -preset veryfast -crf 17 -b:v 7M '
                  f'-c:a aac -b:a 192k -t {total:.2f} -movflags +faststart {output}')
              sz = os.path.getsize(output) / 1024 / 1024
              return {"file": output, "duration": f"{total:.2f}", "size": f"{sz:.2f}"}
          EOF_VIDEO
          echo "✅ 16 | 🎞️ Video builder ready"

      # ═══════════════════════════════════════════════════════════════
      # 13 | 🏭 COMPANY FACTORY — Uploaders
      # ═══════════════════════════════════════════════════════════════
      - name: "13|BuildUploaders"
        run: |
          # ═══════════════════════════════════════════════════════════
          # FILE 17 | ☁️ DRIVE WALA — src/uploaders/13_drive.py
          # ═══════════════════════════════════════════════════════════
          cat > src/uploaders/13_drive.py << 'EOF_DRIVE'
          import os, time, sys
          sys.path.insert(0, "src")
          sys.path.insert(0, "src/utils")
          from importlib import import_module
          _l = import_module("16_logger")
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          
          def upload_drive(path, prefix="Hadith_Story"):
              try:
                  creds = Credentials(None,
                      refresh_token=os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN"),
                      client_id=os.environ.get("GOOGLE_DRIVE_CLIENT_ID"),
                      client_secret=os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET"),
                      token_uri="https://oauth2.googleapis.com/token")
                  svc = build("drive", "v3", credentials=creds, cache_discovery=False)
                  meta = {"name": f"{prefix}_{int(time.time())}.mp4"}
                  fid = os.environ.get("DRIVE_STORY_FOLDER_ID")
                  if fid: meta["parents"] = [fid]
                  up = svc.files().create(body=meta,
                      media_body=MediaFileUpload(path, mimetype="video/mp4", resumable=True),
                      fields="id").execute()
                  did = up.get("id")
                  svc.permissions().create(fileId=did, body={"type": "anyone", "role": "reader"}).execute()
                  link = f"https://drive.google.com/file/d/{did}/view"
                  _l.R["drive"] = {"status": "ok", "link": link}
                  return link
              except Exception as e:
                  _l.R["drive"] = {"status": f"fail ({str(e)[:80]})"}
                  _l.log_err(f"Drive: {str(e)[:100]}")
                  return None
          EOF_DRIVE
          echo "✅ 17 | ☁️ Drive wala ready"

          # ═══════════════════════════════════════════════════════════
          # FILE 18 | 📱 FACEBOOK WALA — src/uploaders/14_facebook.py
          # ═══════════════════════════════════════════════════════════
          cat > src/uploaders/14_facebook.py << 'EOF_FB'
          import os, sys
          sys.path.insert(0, "src")
          sys.path.insert(0, "src/utils")
          from importlib import import_module
          _h = import_module("19_helpers")
          _l = import_module("16_logger")
          session = _h.session
          from config import META_TOKEN, SHOULD_POST_SOCIAL
          
          def upload_facebook(video_file):
              if not META_TOKEN or not SHOULD_POST_SOCIAL:
                  _l.R["fb"] = {"status": "skipped"}
                  return
              pt = META_TOKEN
              pid = os.environ.get("FACEBOOK_PAGE_ID", "").strip()
              r = {"page_id": pid or "-", "status": "initiated"}
              try:
                  if pid:
                      pt_resp = session.get(f"https://graph.facebook.com/v21.0/{pid}",
                          params={"fields": "access_token", "access_token": pt}, timeout=15).json()
                      page_token_actual = pt_resp.get("access_token", pt)
                      fs = os.path.getsize(video_file)
                      s = session.post(f"https://graph.facebook.com/v21.0/{pid}/video_stories",
                          data={"upload_phase": "start", "file_size": fs,
                                "access_token": page_token_actual}, timeout=30).json()
                      if s.get("error"):
                          r["status"] = f"fail: {s['error'].get('message','')[:80]}"
                      else:
                          vid, vurl = s.get("video_id"), s.get("upload_url")
                          if vid and vurl:
                              with open(video_file, "rb") as f:
                                  u = session.post(vurl,
                                      headers={"Authorization": f"OAuth {page_token_actual}",
                                               "offset": "0", "file_size": str(fs)},
                                      data=f.read(), timeout=180)
                              if u.status_code in (200, 201):
                                  fin = session.post(f"https://graph.facebook.com/v21.0/{pid}/video_stories",
                                      data={"upload_phase": "finish", "video_id": vid,
                                            "access_token": page_token_actual}, timeout=30).json()
                                  if fin.get("success") or fin.get("post_id"):
                                      r["status"] = "ok"; r["post_id"] = fin.get("post_id", "-")
                                  else: r["status"] = "fail (finish)"
                              else: r["status"] = f"fail (up {u.status_code})"
                          else: r["status"] = "fail (no video_id)"
                  else: r["status"] = "fail (no page)"
              except Exception as e:
                  r["status"] = f"fail ({str(e)[:60]})"
              _l.R["fb"] = r
          EOF_FB
          echo "✅ 18 | 📱 Facebook wala ready"

      # ═══════════════════════════════════════════════════════════════
      # 14 | 🏭 COMPANY FACTORY — The MANAGER (main.py)
      # ═══════════════════════════════════════════════════════════════
      - name: "14|BuildManager"
        run: |
          cat > src/01_main.py << 'EOF_MAIN'
          import os, sys, time, traceback
          sys.path.insert(0, "src")
          sys.path.insert(0, "src/utils")
          sys.path.insert(0, "src/fetchers")
          sys.path.insert(0, "src/ai")
          sys.path.insert(0, "src/voice")
          sys.path.insert(0, "src/video")
          sys.path.insert(0, "src/uploaders")
          from importlib import import_module
          from mutagen.mp3 import MP3
          
          def main():
              print("🏢 SAWAJ STUDIO — Company start!")
              
              # Load all departments
              _l = import_module("16_logger")
              _h = import_module("19_helpers")
              hadith_mod = import_module("03_hadith")
              bg_mod = import_module("04_background")
              amb_mod = import_module("05_ambience")
              tr_mod = import_module("06_translator")
              content_mod = import_module("07_content")
              tts_mod = import_module("08_tts")
              mix_mod = import_module("09_audio_mix")
              frames_mod = import_module("10_frame_renderer")
              video_mod = import_module("11_video_builder")
              drive_mod = import_module("13_drive")
              fb_mod = import_module("14_facebook")
              
              from config import VOICE_MIN, VOICE_MAX, INTRO_SEC, OUTRO_SEC
              
              _l.log("Start", "info")
              
              # STEP 1: Hadith
              hadith = hadith_mod.fetch_hadith()
              if not hadith.get("english"):
                  _l.log("Hadith", "fail"); _l.send_report("FAILED", "Hadith"); sys.exit(1)
              _l.log("Hadith", "ok", f"{hadith['collection']} #{hadith['number']}")
              
              # STEP 2: Hindi translate
              hindi = tr_mod.to_hindi(hadith["english"])
              _l.R["aic"] = _l.R.get("aic", {})
              hadith["hindi"] = hindi
              _l.log("Translate", "ok", f"{len(hindi)} chars")
              
              # STEP 3: AI content
              ai_data = content_mod.generate_content(hadith["english"], hadith.get("arabic", ""))
              _l.R["aic"] = ai_data
              _l.log("AI Content", "ok", ai_data.get("title", "-"))
              
              # STEP 4: TTS
              tts_text = f"{ai_data.get('intro','')} {hindi}".strip() or hadith["english"]
              if not tts_mod.generate_voice(tts_text, "s_raw.mp3"):
                  _l.log("TTS", "fail"); _l.send_report("FAILED", "TTS"); sys.exit(1)
              _l.log("TTS", "ok", _l.R["tts"].get("provider"))
              
              # STEP 5: Process voice
              tts_mod.process_voice("s_raw.mp3", "s_clean.mp3")
              vdur = MP3("s_clean.mp3").info.length
              if vdur < VOICE_MIN:
                  pad = VOICE_MIN - vdur
                  _h.run(f'ffmpeg -y -i s_clean.mp3 -af "apad=pad_dur={pad:.2f}" s_v.mp3')
                  vdur = MP3("s_v.mp3").info.length
              elif vdur > VOICE_MAX:
                  ex = min(vdur / VOICE_MAX, 1.15)
                  _h.run(f'ffmpeg -y -i s_clean.mp3 -af "atempo={ex:.4f}" s_v.mp3')
                  vdur = MP3("s_v.mp3").info.length
              else:
                  os.replace("s_clean.mp3", "s_v.mp3")
              _l.log("Audio", "ok", f"{vdur:.2f}s")
              
              # STEP 6: Ambience + Mix
              amb_mod.get_ambience(ai_data.get("ambience_query", "rain nature"))
              mix_mod.mix_audio("s_v.mp3", "ambience.mp3", "s_voice.mp3", vdur)
              _l.log("Mix", "ok")
              
              # STEP 7: Background
              bg = bg_mod.get_bg(ai_data.get("bg_queries"), vdur + INTRO_SEC + OUTRO_SEC)
              if not bg:
                  _l.log("BG", "fail"); _l.send_report("FAILED", "BG"); sys.exit(1)
              _l.log("BG", "ok", _l.R["bg"].get("source"))
              
              # STEP 8: Frames
              tf, total = frames_mod.render_frames(hadith, ai_data, hindi, vdur)
              _l.log("Frames", "ok", f"{tf} frames")
              
              # STEP 9: Video
              _l.R["video"] = video_mod.build_video(bg, "s_voice.mp3", total)
              _l.log("Video", "ok", f"{total:.2f}s | {_l.R['video']['size']}MB")
              
              # STEP 10: Upload
              drive_link = drive_mod.upload_drive("Final_FB_Story.mp4")
              _l.log("Drive", "ok" if drive_link else "fail", drive_link or "-")
              
              fb_mod.upload_facebook("Final_FB_Story.mp4")
              _l.log("Facebook", "ok" if _l.R["fb"].get("status") == "ok" else "skip",
                     _l.R["fb"].get("status", "-"))
              
              # Cleanup
              for f in ["s_raw.mp3", "s_clean.mp3", "s_v.mp3", "s_voice.mp3",
                        "amb_raw.mp3", "bgl.txt"]:
                  if os.path.exists(f):
                      try: os.remove(f)
                      except: pass
              import shutil
              shutil.rmtree("story_frames", ignore_errors=True)
              _l.log("Cleanup", "ok")
              
              _l.send_report("COMPLETED")
              print("🏢 Alhamdulillah! Company band.")
          
          if __name__ == "__main__":
              try: main()
              except SystemExit: raise
              except Exception as e:
                  print(traceback.format_exc())
                  import importlib
                  _l = import_module("16_logger")
                  _l.log_err(f"Fatal: {str(e)[:150]}")
                  try: _l.send_report("FAILED", f"Uncaught: {str(e)[:120]}")
                  except: pass
                  sys.exit(1)
          EOF_MAIN
          echo "✅ 19 | 🧑‍💼 Manager ready"

      # ═══════════════════════════════════════════════════════════════
      # 15 | 🏭 SHOW COMPANY STRUCTURE
      # ═══════════════════════════════════════════════════════════════
      - name: "15|ShowTree"
        run: |
          echo "🏢 COMPANY STRUCTURE:"
          echo "════════════════════════════════════════════════════════════"
          find src -type f -name "*.py" | sort
          echo "════════════════════════════════════════════════════════════"
          echo "📁 Assets:"
          ls -la assets/ 2>/dev/null || echo "(empty)"
          echo "════════════════════════════════════════════════════════════"
          echo "Total files:"
          find src -type f -name "*.py" | wc -l

      # ═══════════════════════════════════════════════════════════════
      # 16 | 🏭 RUN THE COMPANY
      # ═══════════════════════════════════════════════════════════════
      - name: "16|RunCompany"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          DRIVE_STORY_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_AI }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          UPLOAD_TO_SOCIAL: '${{ inputs.upload_to_social || github.event.inputs.upload_to_social }}'
          FONTS_DIR: ${{ env.DEPS_DIR }}/fonts
          DEPS_DIR: ${{ env.DEPS_DIR }}
          PIPER_DIR: ${{ env.DEPS_DIR }}/piper
        run: python3 src/01_main.py

      # ═══════════════════════════════════════════════════════════════
      # 17 | 📦 ARTIFACT
      # ═══════════════════════════════════════════════════════════════
      - name: "17|Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: fb-story-video
          path: Final_FB_Story.mp4
          retention-days: 5
          if-no-files-found: ignore

      # ═══════════════════════════════════════════════════════════════
      # 18 | 🧹 CLEANUP
      # ═══════════════════════════════════════════════════════════════
      - name: "18|Cleanup"
        if: always()
        run: |
          rm -f Final_FB_Story.mp4
          echo "Cache Hit: ${{ steps.master-cache.outputs.cache-hit }}"
