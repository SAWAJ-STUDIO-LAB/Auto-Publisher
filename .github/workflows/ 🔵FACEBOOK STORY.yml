name: "🔵 FACEBOOK STORY GENERATOR"

on:
  workflow_dispatch:
    inputs:
      upload_to_social:
        description: 'Upload to Facebook Story?'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '30 23 * * *' # Daily at 11:30 PM UTC

permissions:
  contents: write
  actions: write

concurrency:
  group: facebook-story
  cancel-in-progress: false

jobs:
  fb-story:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CACHE_VERSION: v13
      DEPS_DIR: ${{ github.workspace }}/.dependencies

    steps:
      - name: ✅ Checkout Public Repo
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          token: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}

      - name: 🧹 Auto Cache Cleanup
        if: always()
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CACHE_VERSION: ${{ env.CACHE_VERSION }}
        run: |
          if [ -f "CLEANUP_CACHE.py" ]; then
            python3 CLEANUP_CACHE.py
          else
            echo "⚠ CLEANUP_CACHE.py file nahi mili, cleanup step skip kiya gaya."
          fi

      - name: 🗂️ Restore Master Cache
        id: master-cache
        uses: actions/cache@v4
        timeout-minutes: 5
        with:
          path: |
            .dependencies
            ~/.cache/pip
          key: ${{ runner.os }}-fb-story-master-${{ env.CACHE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-fb-story-master-

      - name: 📁 Prepare System Directory Structure
        timeout-minutes: 1
        run: |
          mkdir -p "$DEPS_DIR"/{bin,fonts,libs,python-venv,logs}
          echo "DEPS_DIR=$DEPS_DIR" >> $GITHUB_ENV

      - name: 📥 Fetch Private Repo Code
        timeout-minutes: 10
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
        run: |
          set -e
          PRIVATE_REPO="SAWAJ-STUDIO-LAB/admin"

          if [ -z "$TOKEN_GITHUB" ]; then
            echo "❌ Error: TOKEN_GITHUB secret missing hai!"
            exit 1
          fi

          # Clone Private Repo Sparse Checkout
          GIT_TERMINAL_PROMPT=0 git clone --depth 1 --filter=blob:none --sparse \
            https://x-access-token:${TOKEN_GITHUB}@github.com/${PRIVATE_REPO}.git \
            temp_private_repo

          cd temp_private_repo
          git sparse-checkout set "Social media/Facebook"
          cd ..

          TARGET_DIR="Social media/Facebook/Facebook Story"
          mkdir -p "$TARGET_DIR"

          if [ -d "temp_private_repo/Social media/Facebook/Facebook Story" ]; then
            cp -r "temp_private_repo/Social media/Facebook/Facebook Story/"* "$TARGET_DIR/"
          fi

          rm -rf temp_private_repo

          # Verify Required Python Files
          echo "🔍 Verifying Python Files..."
          REQUIRED_FILES=("MAIN_00.py" "CONFIG_01.py" "UTILS_02.py" "FETCHERS_03.py" "VOICE_04.py" "RENDER_05.py" "UPLOAD_06.py")
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$TARGET_DIR/$file" ]; then
              echo "❌ Missing required file: $file"
              ls -la "$TARGET_DIR/"
              exit 1
            fi
          done
          echo "✅ Saari 7 Python files download aur verify ho gayi hain!"

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.11'

      - name: 🎬 Install FFmpeg
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            echo "⚙ Installing FFmpeg..."
            sudo apt-get update -q
            sudo apt-get install -y -q ffmpeg
          else
            echo "✅ FFmpeg pehle se installed hai"
          fi

      - name: 🔤 Setup Multilingual Fonts (Hindi, Arabic, English)
        timeout-minutes: 5
        run: |
          if [ -f "$DEPS_DIR/.fonts_ok" ] && [ "$(ls -A $DEPS_DIR/fonts 2>/dev/null | wc -l)" -ge 3 ]; then
            echo "✅ Custom fonts cache se restore ho gaye"
          else
            mkdir -p "$DEPS_DIR/fonts"
            declare -A FONTS=(
              ["NotoSans-Bold.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf"
              ["NotoSansDevanagari-Bold.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf"
              ["NotoNaskhArabic-Bold.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf"
            )
            for name in "${!FONTS[@]}"; do
              wget -q --timeout=30 "${FONTS[$name]}" -O "$DEPS_DIR/fonts/$name" || true
            done
            touch "$DEPS_DIR/.fonts_ok"
          fi
          
          echo "FONTS_DIR=$DEPS_DIR/fonts" >> $GITHUB_ENV

      - name: 🐍 Install Python Dependencies
        timeout-minutes: 5
        run: |
          VENV="$DEPS_DIR/python-venv"
          if [ -f "$VENV/.installed" ] && "$VENV/bin/python" -c "import edge_tts, PIL, requests" 2>/dev/null; then
            echo "✅ Python libraries cache se restore ho gayi hain"
          else
            echo "📦 Installing Python Packages..."
            rm -rf "$VENV"
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --upgrade pip --quiet
            "$VENV/bin/pip" install --no-cache-dir requests edge-tts Pillow
            touch "$VENV/.installed"
          fi
          echo "$VENV/bin" >> $GITHUB_PATH

      - name: 🚀 Run Main Pipeline & Telegram Verification
        timeout-minutes: 15
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          UPLOAD_TO_SOCIAL: ${{ inputs.upload_to_social || github.event.inputs.upload_to_social }}
          FONTS_DIR: ${{ env.DEPS_DIR }}/fonts
          DEPS_DIR: ${{ env.DEPS_DIR }}
        run: |
          cd "Social media/Facebook/Facebook Story"
          python3 MAIN_00.py

      - name: 📤 Upload Video Artifact
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        if: always()
        with:
          name: fb-story-video
          path: Social media/Facebook/Facebook Story/Final_FB_Story.mp4
          retention-days: 5
          if-no-files-found: ignore

      - name: 🧹 Cleanup Temp Files
        if: always()
        timeout-minutes: 1
        run: |
          rm -rf "Social media"
          rm -f Final_FB_Story.mp4
