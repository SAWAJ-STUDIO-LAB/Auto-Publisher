# ============================================================
# FILE:      generate_structure.yml
# PATH:      .github/workflows/generate_structure.yml
# PURPOSE:   Build 6 platform folders (story, short, long)
# NOTE:      Facebook Story folder is PRESERVED
# ============================================================

name: "🛠️ Generate Folder Structure"

on:
  workflow_dispatch:
    inputs:
      wipe_old:
        description: 'Wipe old structure (except facebook/story_video)?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-structure:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # STEP 1: SAFE WIPE — Keep facebook/story_video safe
      # --------------------------------------------------------
      - name: 🗑️ Wipe Old (Preserve facebook/story_video)
        if: ${{ inputs.wipe_old == true }}
        run: |
          echo "→ Preserving facebook/story_video/"
          mkdir -p /tmp/preserve
          cp -r social_media/facebook/story_video /tmp/preserve/ 2>/dev/null || true

          echo "→ Wiping social_media/"
          rm -rf social_media/ || true

          echo "→ Deleting old workflows (keeping generator + facebook_story)"
          find .github/workflows -type f -name "*.yml" \
            ! -name "generate_structure.yml" \
            ! -name "facebook_story.yml" \
            -delete || true

          echo "→ Restoring facebook/story_video/"
          mkdir -p social_media/facebook
          cp -r /tmp/preserve/story_video social_media/facebook/ 2>/dev/null || true

          echo "✅ Safe wipe complete"

      # --------------------------------------------------------
      # STEP 2: CREATE SHARED MARKERS
      # --------------------------------------------------------
      - name: 🏗️ Root Markers
        run: |
          mkdir -p social_media/facebook
          mkdir -p social_media/instagram
          mkdir -p social_media/youtube

          touch social_media/__init__.py
          touch social_media/facebook/__init__.py
          touch social_media/instagram/__init__.py
          touch social_media/youtube/__init__.py

      # --------------------------------------------------------
      # STEP 3: FACEBOOK SHORT VIDEO
      # --------------------------------------------------------
      - name: 📁 Create facebook/short_video
        run: |
          BASE="social_media/facebook/short_video"
          mkdir -p "$BASE"
          touch "$BASE/__init__.py"
          touch "$BASE/requirements.txt"
          touch "$BASE/env.example"
          touch "$BASE/.gitignore"
          touch "$BASE/README.md"
          touch "$BASE/Makefile"
          touch "$BASE/pyproject.toml"

          # A_core
          mkdir -p "$BASE/A_core"
          touch "$BASE/A_core/__init__.py"
          for f in A1_config A2_logger A3_telegram A4_utils A5_base_pipeline; do
            touch "$BASE/A_core/$f.py"
          done

          # B_graphics
          mkdir -p "$BASE/B_graphics"
          touch "$BASE/B_graphics/__init__.py"
          for f in B1_fonts B2_text_wrap B3_sparkles B4_progress_bar B5_badge B6_bullets B7_watermark B8_arabesque B9_god_rays B10_star_field B11_ember B12_vignette; do
            touch "$BASE/B_graphics/$f.py"
          done

          # C_content
          mkdir -p "$BASE/C_content"
          touch "$BASE/C_content/__init__.py"
          for f in C1_hadith C2_ai_provider C3_translator C4_tts C5_music C6_background C7_logo_processor C8_thumbnail; do
            touch "$BASE/C_content/$f.py"
          done
          # Short-specific
          touch "$BASE/C_content/C9_hashtags.py"
          touch "$BASE/C_content/C10_cover.py"

          # D_video
          mkdir -p "$BASE/D_video"
          touch "$BASE/D_video/__init__.py"
          for f in D1_intro D2_main_content D3_outro D4_frames D5_transition D6_composer; do
            touch "$BASE/D_video/$f.py"
          done

          # E_audio
          mkdir -p "$BASE/E_audio"
          touch "$BASE/E_audio/__init__.py"
          for f in E1_voice_ducking E2_sfx E3_mastering; do
            touch "$BASE/E_audio/$f.py"
          done

          # F_upload
          mkdir -p "$BASE/F_upload"
          touch "$BASE/F_upload/__init__.py"
          touch "$BASE/F_upload/F1_drive.py"
          touch "$BASE/F_upload/F2_upload_short.py"

          # G_entry
          mkdir -p "$BASE/G_entry"
          touch "$BASE/G_entry/__init__.py"
          touch "$BASE/G_entry/G1_short_pipeline.py"
          touch "$BASE/G_entry/G2_run_short.py"

          # H_tests
          mkdir -p "$BASE/H_tests"
          touch "$BASE/H_tests/__init__.py"
          for f in H1_conftest H2_test_short H3_test_media H4_test_render; do
            touch "$BASE/H_tests/$f.py"
          done

          # Output
          mkdir -p "$BASE/output/temp" "$BASE/output/final"
          touch "$BASE/output/temp/.gitkeep"
          touch "$BASE/output/final/.gitkeep"

          echo "✅ facebook/short_video done"

