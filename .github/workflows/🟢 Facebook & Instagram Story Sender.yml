name: "🟢 Facebook & Instagram Story Sender"

on:
  workflow_dispatch:
    inputs:
      upload_to_social:
        description: 'Upload to Social Media (FB + IG Story)?'
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '30 23 * * *'   # 5:00 AM IST

permissions:
  contents: write
  actions: write

concurrency:
  group: morning-story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Custom Fonts
        id: cache-fonts
        uses: actions/cache@v4
        with:
          path: ~/.fonts
          key: ${{ runner.os }}-custom-fonts

      - name: Install System Setup (FFmpeg)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto fonts-noto-core fonts-noto-extra fonts-noto-ui-core fonts-dejavu-core fonts-noto-color-emoji fontconfig

      - name: Download Custom Fonts
        if: steps.cache-fonts.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.fonts
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf" -O ~/.fonts/NotoSans-Regular.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf" -O ~/.fonts/NotoSans-Bold.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf" -O ~/.fonts/NotoSansDevanagari-Regular.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf" -O ~/.fonts/NotoSansDevanagari-Bold.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf" -O ~/.fonts/NotoNaskhArabic-Regular.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf" -O ~/.fonts/NotoNaskhArabic-Bold.ttf || true

      - name: Install Python Packages & Refresh Fonts
        run: |
          fc-cache -f -v
          pip install --no-cache-dir requests edge-tts mutagen Pillow google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run Story Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          DRIVE_STORY_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_AI }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          UPLOAD_TO_SOCIAL: ${{ inputs.upload_to_social || github.event.inputs.upload_to_social }}
        run: |
          python3 << 'PYEOF'
          import os, re, time, random, subprocess, requests, shutil
          from mutagen.mp3 import MP3
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          session = requests.Session()
          retry = Retry(total=5, backoff_factor=1.5, status_forcelist=[429,500,502,503,504])
          session.mount("https://", HTTPAdapter(max_retries=retry))

          TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          TG_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")
          META_TOKEN = os.environ.get("FACEBOOK_INSTAGRAM_META_TOKEN", "").strip()

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          upload_social_input = str(os.environ.get("UPLOAD_TO_SOCIAL", "")).lower() == "true"
          should_post_social = (event_name == "schedule") or upload_social_input or (event_name == "workflow_dispatch")

          api_status = {"AI": {}, "TTS": {}, "Music": {}, "Background": {}, "Translation": {}, "Hadith": {}, "Drive": {}, "Facebook Story": {}, "Instagram Story": {}}

          def send_tg(msg):
              if TG_TOKEN and TG_CHAT_ID:
                  try:
                      session.post(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage", json={"chat_id": TG_CHAT_ID, "text": msg, "parse_mode": "HTML", "disable_web_page_preview": True}, timeout=12)
                  except: pass
              print(msg)

          def run_cmd(cmd):
              print(f"[CMD] {cmd[:140]}...")
              subprocess.run(cmd, shell=True, check=True)

          def sanitize(t):
              if not t: return ""
              t = re.sub(r'[\u200b-\u200f\ufeff\u202a-\u202e]', '', str(t))
              return t.replace('"', '').replace("'", '').replace('\n', ' ').strip()

          def report_api_status():
              lines = ["📊 <b>API STATUS REPORT (Story)</b>\n"]
              for section, status in api_status.items():
                  if not status: continue
                  lines.append(f"<b>{section}:</b>")
                  for name, result in status.items():
                      icon = "✅" if result == "success" else "❌" if "failed" in str(result) else "⏸️"
                      lines.append(f"  {icon} {name} → {result}")
              send_tg("\n".join(lines))

          send_tg("📘 <b>MORNING STORY STARTED</b>\n🕐 Story Pipeline Active")

          def call_ai(prompt, max_tokens=400, task="general"):
              providers = []
              if os.environ.get("OPENROUTER_API_KEY"):
                  providers.append(("OpenRouter", "https://openrouter.ai/api/v1/chat/completions", {"Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}"}, "openai/gpt-4o-mini"))
              if os.environ.get("GROQ_API_KEY"):
                  providers.append(("Groq", "https://api.groq.com/openai/v1/chat/completions", {"Authorization": f"Bearer {os.environ['GROQ_API_KEY']}"}, "llama-3.3-70b-versatile"))
              if os.environ.get("GEMINI_API_KEY"):
                  providers.append(("Gemini", None, None, None))

              for name, url, headers, model in providers:
                  try:
                      if name == "Gemini":
                          r = session.post(f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={os.environ['GEMINI_API_KEY']}", json={"contents": [{"parts": [{"text": prompt}]}]}, timeout=40)
                          if r.status_code == 200:
                              api_status["AI"][f"{name}({task})"] = "success"
                              return r.json()["candidates"][0]["content"]["parts"][0]["text"].strip()
                      else:
                          payload = {"model": model, "messages": [{"role": "user", "content": prompt}], "temperature": 0.7, "max_tokens": max_tokens}
                          r = session.post(url, headers={**headers, "Content-Type": "application/json"}, json=payload, timeout=40)
                          if r.status_code == 200:
                              api_status["AI"][f"{name}({task})"] = "success"
                              return r.json()["choices"][0]["message"]["content"].strip()
                  except Exception as e:
                      api_status["AI"][f"{name}({task})"] = f"failed ({str(e)[:35]})"
              return None

          def deepl(text):
              key = os.environ.get("DEEPL_API_KEY")
              if not key: return None
              try:
                  r = session.post("https://api-free.deepl.com/v2/translate", headers={"Authorization": f"DeepL-Auth-Key {key}"}, data={"text": text, "target_lang": "HI"}, timeout=25)
                  if r.status_code == 200:
                      api_status["Translation"]["DeepL"] = "success"
                      return r.json()["translations"][0]["text"]
              except: pass
              return None

          def gen_tts(text, outfile):
              text = sanitize(text)
              try:
                  tmp = outfile + ".txt"
                  open(tmp, "w", encoding="utf-8").write(text)
                  run_cmd(f'edge-tts --file "{tmp}" --write-media "{outfile}" --voice hi-IN-MadhurNeural --rate=-7% --pitch=-2Hz --volume=+8%')
                  if os.path.exists(tmp): os.remove(tmp)
                  api_status["TTS"]["edge-tts"] = "success"
                  return True
              except:
                  api_status["TTS"]["edge-tts"] = "failed"
                  return False

          def download(url, path):
              try:
                  r = session.get(url, timeout=35)
                  if r.status_code == 200 and len(r.content) > 12000:
                      open(path, "wb").write(r.content)
                      return True
              except: pass
              return False

          def get_music():
              MUSIC_VOL = 0.22
              for u in [
                  "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=soft-ambient-112191.mp3",
                  "https://cdn.pixabay.com/download/audio/2022/03/24/audio_4f3b5c5e3d.mp3?filename=peaceful-background-112194.mp3"
              ]:
                  if download(u, "music_raw.mp3"):
                      run_cmd(f'ffmpeg -y -i music_raw.mp3 -af "volume={MUSIC_VOL},afade=t=in:st=0:d=2,afade=t=out:st=90:d=5" -t 110 music_soft.mp3')
                      api_status["Music"]["Pixabay-CDN"] = "success"
                      return
              run_cmd(f'ffmpeg -y -f lavfi -i "sine=frequency=110:duration=110" -af "afade=t=in:st=0:d=2.5,afade=t=out:st=100:d=6,volume=0.12" music_soft.mp3')
              api_status["Music"]["Generated-Sine"] = "success (fallback)"

          def get_bg(dur):
              out = "bg.mp4"
              c0 = f"{random.randint(10,30):02x}{random.randint(8,25):02x}{random.randint(25,55):02x}"
              c1 = f"{random.randint(10,30):02x}{random.randint(8,25):02x}{random.randint(25,55):02x}"
              run_cmd(f'ffmpeg -y -f lavfi -i "gradients=s=1080x1920:c0=0x{c0}:c1=0x{c1}:speed=0.006" -t {dur:.2f} -c:v libx264 -preset veryfast {out}')
              api_status["Background"]["Generated-Gradient"] = "success"
              return out

          def upload_drive(path, prefix):
              try:
                  creds = Credentials(None, refresh_token=os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN"), client_id=os.environ.get("GOOGLE_DRIVE_CLIENT_ID"), client_secret=os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET"), token_uri="https://oauth2.googleapis.com/token")
                  service = build("drive", "v3", credentials=creds, cache_discovery=False)
                  meta = {"name": f"{prefix}_{int(time.time())}.mp4"}
                  folder_id = os.environ.get("DRIVE_STORY_FOLDER_ID")
                  if folder_id: meta["parents"] = [folder_id]
                  up = service.files().create(body=meta, media_body=MediaFileUpload(path, mimetype="video/mp4", resumable=True), fields="id").execute()
                  did = up.get("id")
                  service.permissions().create(fileId=did, body={"type": "anyone", "role": "reader"}).execute()
                  link = f"https://drive.google.com/file/d/{did}/view"
                  direct = f"https://drive.google.com/uc?export=download&id={did}"
                  api_status["Drive"]["Google Drive"] = "success"
                  send_tg(f"✅ Drive: {link}")
                  return link, direct
              except Exception as e:
                  api_status["Drive"]["Google Drive"] = f"failed ({str(e)[:50]})"
                  return None, None

          def fetch_hadith():
              return {"collection": "Sahih al-Bukhari", "number": "1", "english": "The reward of deeds depends upon the intentions.", "arabic": "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ"}

          h = fetch_hadith()
          hindi = deepl(h['english']) or call_ai(f"Is English Hadith ka soft Hindi tarjuma: {h['english']}", task="hindi") or "अमल का दारोमदार नीयतों पर है।"
          hindi = sanitize(re.sub(r'^```.*?```', '', hindi, flags=re.DOTALL))

          gen_tts(f"हदीस शरीफ। {hindi}", "s_raw.mp3")
          run_cmd('ffmpeg -y -i s_raw.mp3 -af "atempo=0.88,loudnorm=I=-16:TP=-1.5:LRA=11,volume=1.35" s_v.mp3')
          d1 = MP3("s_v.mp3").info.length
          voice_dur = d1

          get_music()
          fade = max(voice_dur - 3.0, 1.0)
          run_cmd(f'ffmpeg -y -i s_v.mp3 -i music_soft.mp3 -filter_complex "[1:a]volume=0.20,afade=t=in:st=0:d=2,afade=t=out:st={fade:.2f}:d=3[bg];[0:a][bg]amix=inputs=2:duration=first:dropout_transition=2[aout]" -map "[aout]" -c:a libmp3lame -b:a 192k s_voice.mp3')

          bg = get_bg(voice_dur + 3.5)
          fps = 25
          total = 1.5 + voice_dur + 1.7
          os.makedirs("s_frames", exist_ok=True)
          font_big = ImageFont.load_default()

          for fi in range(int(total * fps)):
              img = Image.new("RGBA", (1080, 1920), (0,0,0,0))
              draw = ImageDraw.Draw(img)
              draw.text((540, 960), "SAWAJ STUDIO - Story", fill=(255,255,255,255), font=font_big, anchor="mm")
              img.save(f"s_frames/frame_{fi:05d}.png")

          final = "Final_Story.mp4"
          run_cmd(f'ffmpeg -y -i {bg} -framerate {fps} -i s_frames/frame_%05d.png -i s_voice.mp3 -filter_complex "[0:v][1:v]overlay=0:0:shortest=1,format=yuv420p[outv]" -map "[outv]" -map 2:a -c:v libx264 -preset veryfast -crf 17 -c:a aac -b:a 192k -t {total:.2f} -movflags +faststart {final}')
          
          drive_link, direct = upload_drive(final, "Story")

          if META_TOKEN and should_post_social:
              page_token = META_TOKEN
              page_id = os.environ.get("FACEBOOK_PAGE_ID", "").strip()
              if page_id:
                  try:
                      f_size = os.path.getsize(final)
                      start = session.post(f"https://graph.facebook.com/v21.0/{page_id}/video_stories", data={"upload_phase": "start", "file_size": f_size, "access_token": page_token}, timeout=30).json()
                      v_id, v_url = start.get("video_id"), start.get("upload_url")
                      if v_id and v_url:
                          with open(final, "rb") as f:
                              up_res = session.post(v_url, headers={"Authorization": f"OAuth {page_token}", "offset": "0", "file_size": str(f_size)}, data=f.read(), timeout=180)
                          if up_res.status_code in (200, 201):
                              finish = session.post(f"https://graph.facebook.com/v21.0/{page_id}/video_stories", data={"upload_phase": "finish", "video_id": v_id, "access_token": page_token}, timeout=30).json()
                              if finish.get("success") or finish.get("post_id"):
                                  api_status["Facebook Story"]["Upload"] = "success"
                                  send_tg("✅ <b>Facebook Story Published Successfully!</b>")
                  except Exception as e:
                      send_tg(f"❌ FB Story Exception: {e}")

          report_api_status()
          send_tg("🎉 <b>STORY WORKFLOW COMPLETE</b>")
          PYEOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: morning-story
          path: Final_Story.mp4
          retention-days: 5
          if-no-files-found: ignore
