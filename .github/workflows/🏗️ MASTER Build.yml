            ["social_media/facebook/long_video"]="long"
            ["social_media/instagram/story_video"]="story"
            ["social_media/instagram/short_video"]="short"
            ["social_media/youtube/short_video"]="short"
            ["social_media/youtube/long_video"]="long"
          )

