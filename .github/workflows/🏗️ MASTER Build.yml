            TYPE="${mapping[$DST]}"
            [ -f "$SRC/G_entry/G1_story_pipeline.py" ] && \
              cp "$SRC/G_entry/G1_story_pipeline.py" "$DST/G_entry/G1_${TYPE}_pipeline.py" || true
