          echo "$FB_CONFIG" > social_media/facebook/short_video/A_core/A1_config.py
          echo "$FB_CONFIG" > social_media/facebook/long_video/A_core/A1_config.py

          # ===== IG STORY + IG SHORT (IG business) =====
