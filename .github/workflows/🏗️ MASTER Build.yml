          cp social_media/youtube/short_video/F_upload/F2_upload_short.py social_media/youtube/long_video/F_upload/F2_upload_long.py
          echo "✅ YT Upload"

      # ====================================================
      # STEP 11: CREATE WORKFLOWS (BASE64 SAFE)
      # ====================================================
      - name: 📄 Create Workflows (base64 decoded)
        run: |
          set -e
          mkdir -p .github/workflows

          # ---- INSTAGRAM STORY ----
          cat > /tmp/ig_story.b64 << 'B64'
          
B64
          base64 -d /tmp/ig_story.b64 > .github/workflows/instagram_story.yml

          echo "✅ Instagram Story workflow created"

      # ====================================================
      # STEP 12: SHOW + COMMIT
      # ====================================================
      - name: 🌳 Show Tree
        run: |
          echo "==== FOLDERS ===="
          find social_media -type d | sort | head -30
          echo ""
          echo "==== WORKFLOWS ===="
          ls .github/workflows/
          echo ""
          echo "==== TOTAL FILES ===="
          find social_media -type f | wc -l

      - name: 🚀 Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: master build — 6 platforms + files + workflows" || exit 0
          git push
