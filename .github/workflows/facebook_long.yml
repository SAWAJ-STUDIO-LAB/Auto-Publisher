# ============================================================
# 📄 FILE:      diagnose_long.yml
# 📁 PATH:      .github/workflows/diagnose_long.yml
# 🎯 PURPOSE:   Diagnose Facebook Long Video files
# ⚡ TRIGGER:   Manual
# ============================================================

name: "🔍 Diagnose Long Video"


on:
  workflow_dispatch:


permissions:
  contents: read


jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ───────── Step 1: Checkout ─────────
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}

      # ───────── Step 2: Show full tree ─────────
      - name: 🌳 Show Full Tree
        run: |
          echo "============================================"
          echo "📁 FULL REPO STRUCTURE"
          echo "============================================"
          find . -type f -not -path './.git/*' | sort | head -200
          echo ""
          echo "============================================"
          echo "📁 LONG VIDEO FOLDER"
          echo "============================================"
          find social_media/facebook/long_video -type f 2>/dev/null | sort || echo "❌ FOLDER MISSING"

      # ───────── Step 3: Check specific files ─────────
      - name: 🔍 Check Critical Files
        run: |
          echo "============================================"
          echo "🔍 CHECKING CRITICAL FILES"
          echo "============================================"
          echo ""

          BASE="social_media/facebook/long_video"

          # Check main folders
          for folder in A_core B_graphics C_content D_video E_audio F_upload G_entry H_tests output; do
            if [ -d "$BASE/$folder" ]; then
              count=$(find "$BASE/$folder" -type f | wc -l)
              echo "✅ $folder/ — $count files"
            else
              echo "❌ $folder/ — MISSING"
            fi
          done

          echo ""
          echo "============================================"
          echo "🔍 CRITICAL FILES CHECK"
          echo "============================================"
          echo ""

          # Check entry point
          if [ -f "$BASE/G_entry/G2_run_long.py" ]; then
            echo "✅ G_entry/G2_run_long.py — EXISTS"
            echo "   Size: $(wc -l < $BASE/G_entry/G2_run_long.py) lines"
          else
            echo "❌ G_entry/G2_run_long.py — MISSING"
          fi

          # Check pipeline
          if [ -f "$BASE/G_entry/G1_long_pipeline.py" ]; then
            echo "✅ G_entry/G1_long_pipeline.py — EXISTS"
            echo "   Size: $(wc -l < $BASE/G_entry/G1_long_pipeline.py) lines"
          else
            echo "❌ G_entry/G1_long_pipeline.py — MISSING"
          fi

          # Check config
          if [ -f "$BASE/A_core/A1_config.py" ]; then
            echo "✅ A_core/A1_config.py — EXISTS"
          else
            echo "❌ A_core/A1_config.py — MISSING"
          fi

          # Check __init__ files
          echo ""
          echo "============================================"
          echo "📦 __init__.py CHECK"
          echo "============================================"
          for folder in "" A_core B_graphics C_content D_video E_audio F_upload G_entry H_tests; do
            if [ -z "$folder" ]; then
              f="$BASE/__init__.py"
              name="(root)"
            else
              f="$BASE/$folder/__init__.py"
              name="$folder"
            fi

            if [ -f "$f" ]; then
              echo "✅ $name/__init__.py"
            else
              echo "❌ $name/__init__.py — MISSING"
            fi
          done

      # ───────── Step 4: Try to run pipeline ─────────
      - name: 🚀 Test Run Pipeline
        run: |
          echo "============================================"
          echo "🚀 TEST RUN"
          echo "============================================"
          cd social_media/facebook/long_video || exit 1

          echo ""
          echo "Current directory: $(pwd)"
          echo ""
          echo "Testing Python import..."
          echo ""

          # Check Python syntax
          python3 -c "import sys; sys.path.insert(0, '.'); print('✅ Python OK')" || true

          # Try importing modules
          echo ""
          echo "Testing imports:"
          python3 << 'PYEOF'
          import sys
          sys.path.insert(0, '.')

          # Test A_core
          try:
              from A_core.A1_config import Config
              print("✅ A_core.A1_config — OK")
          except Exception as e:
              print(f"❌ A_core.A1_config — {str(e)[:80]}")

          # Test A2_logger
          try:
              from A_core.A2_logger import log
              print("✅ A_core.A2_logger — OK")
          except Exception as e:
              print(f"❌ A_core.A2_logger — {str(e)[:80]}")

          # Test G_entry
          try:
              from G_entry.G2_run_long import main
              print("✅ G_entry.G2_run_long — OK")
          except Exception as e:
              print(f"❌ G_entry.G2_run_long — {str(e)[:120]}")
          PYEOF

      # ───────── Step 5: Show working directory ─────────
      - name: 📂 Verify Working Directory
        run: |
          echo "============================================"
          echo "📂 WORKING DIRECTORY CHECK"
          echo "============================================"
          echo ""
          echo "Repo root: $(pwd)"
          echo ""
          echo "Looking for: social_media/facebook/long_video/"
          echo ""
          if [ -d "social_media/facebook/long_video" ]; then
            echo "✅ Folder exists"
            echo ""
            ls -la social_media/facebook/long_video/
          else
            echo "❌ Folder does NOT exist"
          fi
