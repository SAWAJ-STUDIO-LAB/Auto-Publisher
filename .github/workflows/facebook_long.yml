# ============================================================
# 📄 FILE:      facebook_long.yml
# 📁 PATH:      .github/workflows/facebook_long.yml
# 🎯 PURPOSE:   Facebook Long Video generation (daily)
# ⏰ SCHEDULE:  7:30 PM IST (14:00 UTC)
# ============================================================

name: "🎥 Facebook Long Video"


# ─────────────────────────────────────────────────────────────
# ① TRIGGERS
# ─────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      upload_to_social:
        description: 'Upload to Facebook?'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '0 14 * * *'   # 7:30 PM IST


# ─────────────────────────────────────────────────────────────
# ② PERMISSIONS
# ─────────────────────────────────────────────────────────────
permissions:
  contents: write
  actions: write


# ─────────────────────────────────────────────────────────────
# ③ CONCURRENCY
# ─────────────────────────────────────────────────────────────
concurrency:
  group: facebook-long
  cancel-in-progress: false


# ─────────────────────────────────────────────────────────────
# ④ JOBS
# ─────────────────────────────────────────────────────────────
jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # ───────── Step 1: Checkout ─────────
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}

      # ───────── Step 2: Setup Python ─────────
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ───────── Step 3: Cache pip ─────────
      - name: 📦 Cache Python Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-tools

      # ───────── Step 4: Cache fonts ─────────
      - name: 🔤 Cache Custom Fonts
        id: cache-fonts
        uses: actions/cache@v4
        with:
          path: ~/.fonts
          key: ${{ runner.os }}-custom-fonts

      # ───────── Step 5: Install FFmpeg + Fonts ─────────
      - name: 🛠️ Install FFmpeg & Fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto fonts-noto-core fonts-noto-extra fonts-noto-ui-core fonts-dejavu-core fonts-noto-color-emoji fontconfig

      # ───────── Step 6: Download custom fonts ─────────
      - name: ⬇️ Download Custom Fonts
        if: steps.cache-fonts.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.fonts
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf" -O ~/.fonts/NotoSans-Regular.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf" -O ~/.fonts/NotoSans-Bold.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf" -O ~/.fonts/NotoSansDevanagari-Regular.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf" -O ~/.fonts/NotoSansDevanagari-Bold.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf
