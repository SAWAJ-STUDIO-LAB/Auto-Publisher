name: Delete Files and Folders

on:
  workflow_dispatch:
    inputs:
      delete_all:
        description: '⚠️️ Check karein agar sab kuch ek saath delete karna hai'
        required: false
        type: boolean
        default: false
      del_assets:
        description: 'Delete assets folder'
        required: false
        type: boolean
        default: false
      del_docs:
        description: 'Delete docs folder'
        required: false
        type: boolean
        default: false
      del_output:
        description: 'Delete output folder'
        required: false
        type: boolean
        default: false
      del_platforms:
        description: 'Delete platforms folder'
        required: false
        type: boolean
        default: false
      del_scripts:
        description: 'Delete scripts folder'
        required: false
        type: boolean
        default: false
      del_src:
        description: 'Delete src folder'
        required: false
        type: boolean
        default: false
      del_temp:
        description: 'Delete temp folder'
        required: false
        type: boolean
        default: false
      del_tests:
        description: 'Delete tests folder'
        required: false
        type: boolean
        default: false
      del_dockerignore:
        description: 'Delete .dockerignore file'
        required: false
        type: boolean
        default: false
      del_gitignore:
        description: 'Delete .gitignore file'
        required: false
        type: boolean
        default: false
      del_makefile:
        description: 'Delete Makefile'
        required: false
        type: boolean
        default: false
      del_readme:
        description: 'Delete README.md'
        required: false
        type: boolean
        default: false
      del_logo:
        description: 'Delete logo.png'
        required: false
        type: boolean
        default: false
      del_pyproject:
        description: 'Delete pyproject.toml'
        required: false
        type: boolean
        default: false
      del_requirements:
        description: 'Delete requirements.txt'
        required: false
        type: boolean
        default: false

jobs:
  delete-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Token
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Delete Selected Files and Folders
        run: |
          echo "Processing deletion..."

          if [ "${{ inputs.delete_all }}" == "true" ]; then
            echo "Deleting all files and folders (keeping .github)..."
            find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.github' -exec rm -rf {} +
          else
            if [ "${{ inputs.del_assets }}" == "true" ]; then rm -rf assets; echo "Deleted assets"; fi
            if [ "${{ inputs.del_docs }}" == "true" ]; then rm -rf docs; echo "Deleted docs"; fi
            if [ "${{ inputs.del_output }}" == "true" ]; then rm -rf output; echo "Deleted output"; fi
            if [ "${{ inputs.del_platforms }}" == "true" ]; then rm -rf platforms; echo "Deleted platforms"; fi
            if [ "${{ inputs.del_scripts }}" == "true" ]; then rm -rf scripts; echo "Deleted scripts"; fi
            if [ "${{ inputs.del_src }}" == "true" ]; then rm -rf src; echo "Deleted src"; fi
            if [ "${{ inputs.del_temp }}" == "true" ]; then rm -rf temp; echo "Deleted temp"; fi
            if [ "${{ inputs.del_tests }}" == "true" ]; then rm -rf tests; echo "Deleted tests"; fi
            if [ "${{ inputs.del_dockerignore }}" == "true" ]; then rm -rf .dockerignore; echo "Deleted .dockerignore"; fi
            if [ "${{ inputs.del_gitignore }}" == "true" ]; then rm -rf .gitignore; echo "Deleted .gitignore"; fi
            if [ "${{ inputs.del_makefile }}" == "true" ]; then rm -rf Makefile; echo "Deleted Makefile"; fi
            if [ "${{ inputs.del_readme }}" == "true" ]; then rm -rf README.md; echo "Deleted README.md"; fi
            if [ "${{ inputs.del_logo }}" == "true" ]; then rm -rf logo.png; echo "Deleted logo.png"; fi
            if [ "${{ inputs.del_pyproject }}" == "true" ]; then rm -rf pyproject.toml; echo "Deleted pyproject.toml"; fi
            if [ "${{ inputs.del_requirements }}" == "true" ]; then rm -rf requirements.txt; echo "Deleted requirements.txt"; fi
          fi

      - name: Commit and Push Changes
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.TOKEN_GITHUB }}@github.com/${{ github.repository }}.git
          git status
          git add -A
          git commit -m "Automated deletion of selected files/folders" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
