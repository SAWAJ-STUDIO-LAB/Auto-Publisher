# ============================================================
# FILE:      generate_structure.yml
# PATH:      .github/workflows/generate_structure.yml
# PURPOSE:   Delete old structure + rebuild new 63-file layout
# USAGE:     Manual trigger from GitHub Actions tab
# ============================================================

name: "🛠️ Generate Folder Structure"

on:
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: 'Type DELETE to confirm wiping old structure'
        required: true
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-structure:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # STEP 1: Checkout Repository
      # --------------------------------------------------------
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # STEP 2: Confirm Delete
      # --------------------------------------------------------
      - name: ⚠️ Confirm Deletion
        run: |
          if [ "${{ inputs.confirm_delete }}" != "DELETE" ]; then
            echo "❌ Confirmation failed. Please type DELETE in the input."
            exit 1
          fi
          echo "✅ Confirmed. Proceeding to wipe old structure."

      # --------------------------------------------------------
      # STEP 3: Delete Old Structure (Safe)
      # --------------------------------------------------------
      - name: 🗑️ Delete Old Structure
        run: |
          echo "→ Deleting social_media/"
          rm -rf social_media/ || true

          echo "→ Deleting old workflows (keeping this one)"
          find .github/workflows -type f -name "*.yml" \
            ! -name "generate_structure.yml" \
            -delete || true

          echo "→ Deleting root-level old files (if any)"
          rm -f social_media 2>/dev/null || true

          echo "✅ Old structure wiped."

      # --------------------------------------------------------
      # STEP 4: Create New Structure
      # --------------------------------------------------------
      - name: 🏗️ Create New Folder Structure
        run: |
          set -e

          # ====================================================
          # ROOT PACKAGE MARKERS
          # ====================================================
          mkdir -p social_media/facebook/story_video
          touch social_media/__init__.py
          touch social_media/facebook/__init__.py
          touch social_media/facebook/story_video/__init__.py

          BASE="social_media/facebook/story_video"

          # ====================================================
          # ROOT-LEVEL FILES
          # ====================================================
          touch "$BASE/requirements.txt"
          touch "$BASE/env.example"
          touch "$BASE/.gitignore"
          touch "$BASE/README.md"
          touch "$BASE/Makefile"
          touch "$BASE/pyproject.toml"
          # NOTE: logo.png is NOT touched — user uploads it manually

          # ====================================================
          # A_core/
          # ====================================================
          mkdir -p "$BASE/A_core"
          touch "$BASE/A_core/__init__.py"
          touch "$BASE/A_core/A1_config.py"
          touch "$BASE/A_core/A2_logger.py"
          touch "$BASE/A_core/A3_telegram.py"
          touch "$BASE/A_core/A4_utils.py"
          touch "$BASE/A_core/A5_base_pipeline.py"

          # ====================================================
          # B_graphics/
          # ====================================================
          mkdir -p "$BASE/B_graphics"
          touch "$BASE/B_graphics/__init__.py"
          touch "$BASE/B_graphics/B1_fonts.py"
          touch "$BASE/B_graphics/B2_text_wrap.py"
          touch "$BASE/B_graphics/B3_sparkles.py"
          touch "$BASE/B_graphics/B4_progress_bar.py"
          touch "$BASE/B_graphics/B5_badge.py"
          touch "$BASE/B_graphics/B6_bullets.py"
          touch "$BASE/B_graphics/B7_watermark.py"
          touch "$BASE/B_graphics/B8_arabesque.py"
          touch "$BASE/B_graphics/B9_god_rays.py"
          touch "$BASE/B_graphics/B10_star_field.py"
          touch "$BASE/B_graphics/B11_ember.py"
          touch "$BASE/B_graphics/B12_vignette.py"

          # ====================================================
          # C_content/
          # ====================================================
          mkdir -p "$BASE/C_content"
          touch "$BASE/C_content/__init__.py"
          touch "$BASE/C_content/C1_hadith.py"
          touch "$BASE/C_content/C2_ai_provider.py"
          touch "$BASE/C_content/C3_translator.py"
          touch "$BASE/C_content/C4_tts.py"
          touch "$BASE/C_content/C5_music.py"
          touch "$BASE/C_content/C6_background.py"
          touch "$BASE/C_content/C7_logo_processor.py"
          touch "$BASE/C_content/C8_thumbnail.py"

          # ====================================================
          # D_video/
          # ====================================================
          mkdir -p "$BASE/D_video"
          touch "$BASE/D_video/__init__.py"
          touch "$BASE/D_video/D1_intro.py"
          touch "$BASE/D_video/D2_main_content.py"
          touch "$BASE/D_video/D3_outro.py"
          touch "$BASE/D_video/D4_frames.py"
          touch "$BASE/D_video/D5_transition.py"
          touch "$BASE/D_video/D6_composer.py"

          # ====================================================
          # E_audio/
          # ====================================================
          mkdir -p "$BASE/E_audio"
          touch "$BASE/E_audio/__init__.py"
          touch "$BASE/E_audio/E1_voice_ducking.py"
          touch "$BASE/E_audio/E2_sfx.py"
          touch "$BASE/E_audio/E3_mastering.py"

          # ====================================================
          # F_upload/
          # ====================================================
          mkdir -p "$BASE/F_upload"
          touch "$BASE/F_upload/__init__.py"
          touch "$BASE/F_upload/F1_drive.py"
          touch "$BASE/F_upload/F2_upload_story.py"

          # ====================================================
          # G_entry/
          # ====================================================
          mkdir -p "$BASE/G_entry"
          touch "$BASE/G_entry/__init__.py"
          touch "$BASE/G_entry/G1_story_pipeline.py"
          touch "$BASE/G_entry/G2_run_story.py"

          # ====================================================
          # H_tests/
          # ====================================================
          mkdir -p "$BASE/H_tests"
          touch "$BASE/H_tests/__init__.py"
          touch "$BASE/H_tests/H1_conftest.py"
          touch "$BASE/H_tests/H2_test_story.py"
          touch "$BASE/H_tests/H3_test_media.py"
          touch "$BASE/H_tests/H4_test_render.py"

          # ====================================================
          # OUTPUT FOLDERS
          # ====================================================
          mkdir -p "$BASE/output/temp" "$BASE/output/final"
          touch "$BASE/output/temp/.gitkeep"
          touch "$BASE/output/final/.gitkeep"

          # ====================================================
          # GITHUB WORKFLOWS
          # ====================================================
          mkdir -p .github/workflows
          touch .github/workflows/facebook_story.yml

          echo "✅ New structure created."

      # --------------------------------------------------------
      # STEP 5: Show Tree (Verify)
      # --------------------------------------------------------
      - name: 🌳 Show New Structure
        run: |
          echo "============================================"
          echo "📁 NEW FOLDER STRUCTURE"
          echo "============================================"
          find social_media .github -type f | sort

      # --------------------------------------------------------
      # STEP 6: Commit & Push
      # --------------------------------------------------------
      - name: 🚀 Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: wipe old + rebuild 63-file structure (A→H)" || exit 0
          git push
