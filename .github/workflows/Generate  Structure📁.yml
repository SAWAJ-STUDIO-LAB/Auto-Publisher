name: Generate Folder Structure

on:
  workflow_dispatch:

jobs:
  build-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}

      - name: Generate Platform Directory Structure
        run: |
          # 1. GitHub Workflows Directory
          mkdir -p .github/workflows
          
          # Only valid workflows for each platform
          workflows=(
            "facebook_story.yml"
            "facebook_short.yml"
            "facebook_long.yml"
            "instagram_story.yml"
            "instagram_short.yml"
            "youtube_short.yml"
            "youtube_long.yml"
          )
          for wf in "${workflows[@]}"; do
            touch ".github/workflows/$wf"
          done

          # 2. Root Social Media Directory
          mkdir -p social_media
          touch social_media/__init__.py

          # 3. Platform & Content Type Mapping (Path : Type : Extra_Files)
          modules=(
            "facebook/story_video:story:stickers.py"
            "facebook/short_video:short:hashtags.py cover.py"
            "facebook/long_video:long:thumbnail.py chapters.py"
            "instagram/story_video:story:stickers.py"
            "instagram/short_video:short:hashtags.py cover.py"
            "youtube/short_video:short:hashtags.py"
            "youtube/long_video:long:thumbnail.py chapters.py seo.py playlist.py"
          )

          # Common python files for all modules
          common_files=(
            "config.py" "logger.py" "session.py" "telegram.py" "utils.py"
            "hadith.py" "ai_provider.py" "translator.py" "tts.py" "music.py"
            "background.py" "logo.py" "subtitles.py" "frames.py" "composer.py" "drive.py"
          )

          # 4. Generate Files and Output Folders
          for mod in "${modules[@]}"; do
            IFS=':' read -r path type extra_shared <<< "$mod"
            base="social_media/$path"

            # Create Output Directories
            mkdir -p "$base/output/temp" "$base/output/final"
            touch "$base/output/temp/.gitkeep" "$base/output/final/.gitkeep"

            # Create Platform __init__.py
            platform_dir=$(dirname "$base")
            touch "$platform_dir/__init__.py"

            # Module Config & Root Setup
            touch "$base/__init__.py" "$base/requirements.txt" "$base/env.example" "$base/.gitignore"
            touch "$base/README.md" "$base/Makefile" "$base/pyproject.toml"

            # Common Python modules
            for file in "${common_files[@]}"; do
              touch "$base/$file"
            done

            # Module-specific Extra files
            for ex_file in $extra_shared; do
              touch "$base/$ex_file"
            done

            # Pipelines, Uploaders, Runners
            touch "$base/base_pipeline.py" "$base/${type}_pipeline.py"
            touch "$base/upload_${type}.py"
            touch "$base/run_${type}.py"

            # Tests
            touch "$base/test_${type}.py" "$base/test_media.py" "$base/test_render.py" "$base/conftest.py"
          done

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update folder structure to match exact platform capabilities" || exit 0
          git push
