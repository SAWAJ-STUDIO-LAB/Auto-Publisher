name: Combine all-in-one Send repo

on:
  workflow_dispatch:

jobs:
  bundle-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Combine All Files into Single File
        run: |
          python -c '
          import os

          output_file = "all_code_combined.txt"

          # Sirf zaroori cheezein ignore hongi, .github/ aur .yml files ab include ho jayengi
          IGNORE_DIRS = {".git", "__pycache__", "node_modules", "venv", "env"}
          IGNORE_FILES = {output_file, "package-lock.json", "yarn.lock"}

          with open(output_file, "w", encoding="utf-8") as outfile:
              outfile.write("# ==============================================\n")
              outfile.write("# CONSOLIDATED SINGLE CODEBASE FILE\n")
              outfile.write("# ALL REPOSITORY FILES (INCLUDING YML) COMBINED\n")
              outfile.write("# ==============================================\n\n")

              all_files = []
              for root, dirs, files in os.walk("."):
                  # .github ab ignore nahi hoga
                  dirs[:] = [d for d in dirs if d not in IGNORE_DIRS and not (d.startswith(".") and d != ".github")]
                  for file in sorted(files):
                      if file not in IGNORE_FILES:
                          all_files.append(os.path.join(root, file))

              all_files.sort()

              success_count = 0
              for filepath in all_files:
                  relative_path = os.path.relpath(filepath, ".")
                  outfile.write(f"\n# " + "="*70 + "\n")
                  outfile.write(f"# ORIGINAL FILE: {relative_path}\n")
                  outfile.write(f"# " + "="*70 + "\n\n")
                  try:
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as infile:
                          outfile.write(infile.read())
                          outfile.write("\n\n")
                      success_count += 1
                  except Exception as e:
                      outfile.write(f"# [Skipped/Binary or Unreadable file]: {e}\n\n")

          print(f"Successfully combined {success_count} files into {output_file}")
          '

      - name: Send Combined File to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Error: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is missing!"
            exit 1
          fi

          curl -s -F chat_id="$TELEGRAM_CHAT_ID" \
               -F document=@all_code_combined.txt \
               -F caption="📦 All project files (including YML) combined!" \
               https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument
