# ============================================================
# 📄 FILE:      clean_cache.yml
# 📁 PATH:      .github/workflows/clean_cache.yml
# 🎯 PURPOSE:   Clean caches + old runs — TICK MARK MODE
# ⚡ TRIGGER:   Manual only
# ============================================================

name: "🧹 Clean Caches (Safe)"


# ─────────────────────────────────────────────────────────────
# ① TRIGGER — Workflow dispatch with inputs
# ─────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      # ① TICK MARK — Delete confirm karo
      confirm:
        description: '✅ Tick karo — Delete caches + old runs'
        required: true
        type: boolean
        default: false

      # ② KITNE DIN PURANE RUNS
      days_old:
        description: '📅 Delete runs older than N days (30, 60, 90)'
        required: false
        type: string
        default: '30'


# ─────────────────────────────────────────────────────────────
# ② PERMISSIONS
# ─────────────────────────────────────────────────────────────
permissions:
  contents: write
  actions: write


# ─────────────────────────────────────────────────────────────
# ③ JOBS
# ─────────────────────────────────────────────────────────────
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ───────── Step 1: Checkout ─────────
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}

      # ───────── Step 2: Check tick mark ─────────
      - name: 🔍 Verify Tick Mark
        run: |
          if [ "${{ inputs.confirm }}" != "true" ]; then
            echo "❌ Tick mark nahi lagaya — workflow cancel"
            echo ""
            echo "👉 Dobara run karo aur TICK lagao"
            exit 1
          fi
          echo "✅ Tick mark confirmed"
          echo ""
          echo "Settings:"
          echo "  - Delete caches: YES"
          echo "  - Delete runs older than: ${{ inputs.days_old }} days"

      # ───────── Step 3: Install GitHub CLI ─────────
      - name: 🔧 Install GitHub CLI
        run: |
          type -p gh || (
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
            sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg && \
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg && \
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
            sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null && \
            sudo apt-get update && \
            sudo apt-get install gh -y
          )

      # ───────── Step 4: BEFORE state ─────────
      - name: 📊 BEFORE — Count
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}
        run: |
          echo "============================================"
          echo "📊 BEFORE CLEANUP"
          echo "============================================"
          echo ""
          echo "Caches:"
          gh cache list --repo ${{ github.repository }} --limit 200 2>/dev/null | wc -l || echo "0"
          echo ""
          echo "Workflow runs:"
          gh run list --repo ${{ github.repository }} --limit 500 2>/dev/null | wc -l || echo "0"
          echo "============================================"

      # ───────── Step 5: Delete all caches ─────────
      - name: 🗑️ Delete All Caches
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}
        run: |
          echo "============================================"
          echo "🧹 DELETING ALL CACHES"
          echo "============================================"
          echo ""
          gh cache delete --all --repo ${{ github.repository }} || true
          echo ""
          echo "✅ All caches deleted"

      # ───────── Step 6: Delete old runs ─────────
      - name: 🗑️ Delete Runs Older Than ${{ inputs.days_old }} Days
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}
        run: |
          DAYS=${{ inputs.days_old }}
          echo "============================================"
          echo "🧹 DELETING RUNS OLDER THAN $DAYS DAYS"
          echo "============================================"
          echo ""

          # Calculate cutoff date
          CUTOFF=$(date -d "$DAYS days ago" -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Cutoff date: $CUTOFF"
          echo ""

          # Get all runs older than cutoff
          gh api "repos/${{ github.repository }}/actions/runs?per_page=100&created=<${CUTOFF}" \
            --paginate -q '.workflow_runs[] | "\(.id) \(.name) \(.created_at)"' 2>/dev/null > /tmp/old_runs.txt || true

          total=$(wc -l < /tmp/old_runs.txt)
          echo "Found $total runs to delete"
          echo ""

          count=0
          while read line; do
            if [ -n "$line" ]; then
              run_id=$(echo "$line" | awk '{print $1}')
              run_name=$(echo "$line" | awk '{print $2" "$3" "$4}')
              if [ -n "$run_id" ]; then
                if gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" 2>/dev/null; then
                  count=$((count + 1))
                  echo "  ✅ Deleted: $run_id — $run_name"
                else
                  echo "  ⚠️ Skipped: $run_id"
                fi
              fi
            fi
          done < /tmp/old_runs.txt

          echo ""
          echo "✅ Total deleted: $count runs"

      # ───────── Step 7: AFTER state ─────────
      - name: 📊 AFTER — Count
        if: always()
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}
        run: |
          echo "============================================"
          echo "📊 AFTER CLEANUP"
          echo "============================================"
          echo ""
          echo "Remaining caches:"
          gh cache list --repo ${{ github.repository }} --limit 200 2>/dev/null | wc -l || echo "0"
          echo ""
          echo "Remaining workflow runs:"
          gh run list --repo ${{ github.repository }} --limit 500 2>/dev/null | wc -l || echo "0"
          echo "============================================"

      # ───────── Step 8: Summary ─────────
      - name: 📋 Summary
        if: always()
        run: |
          echo "============================================"
          echo "🎉 CLEANUP COMPLETE"
          echo "============================================"
          echo ""
          echo "✓ All caches deleted"
          echo "✓ Runs older than ${{ inputs.days_old }} days deleted"
          echo "✓ Recent runs PRESERVED (history safe)"
          echo "✓ Storage freed"
          echo ""
          echo "Next workflow runs will rebuild caches"
          echo "(1-2 min extra on first run)"
          echo "============================================"
