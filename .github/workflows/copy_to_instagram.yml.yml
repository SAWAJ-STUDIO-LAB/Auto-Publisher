# ============================================================
# FILE:      copy_to_all.yml
# PATH:      .github/workflows/copy_to_all.yml
# PURPOSE:   Copy common files from FB Story to 6 platforms
# NOTE:      Temporary — delete after use
# ============================================================

name: "📋 Copy to All Platforms"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}

      - name: 📋 Copy Common Files
        run: |
          set -e

          SRC="social_media/facebook/story_video"

          # Targets
          TARGETS=(
            "social_media/facebook/short_video:short"
            "social_media/facebook/long_video:long"
            "social_media/instagram/story_video:story"
            "social_media/instagram/short_video:short"
            "social_media/youtube/short_video:short"
            "social_media/youtube/long_video:long"
          )

          for entry in "${TARGETS[@]}"; do
            DST="${entry%%:*}"
            TYPE="${entry##*:}"

            echo "→ Copying to $DST ($TYPE)"

            # A_core (except A1_config)
            for f in __init__ A2_logger A3_telegram A4_utils A5_base_pipeline; do
              cp "$SRC/A_core/$f.py" "$DST/A_core/" 2>/dev/null || true
            done

            # B_graphics (all)
            cp -r "$SRC/B_graphics/." "$DST/B_graphics/" 2>/dev/null || true

            # C_content (only common C1-C8)
            for f in __init__ C1_hadith C2_ai_provider C3_translator C4_tts C5_music C6_background C7_logo_processor C8_thumbnail; do
              cp "$SRC/C_content/$f.py" "$DST/C_content/" 2>/dev/null || true
            done

            # D_video (all)
            cp -r "$SRC/D_video/." "$DST/D_video/" 2>/dev/null || true

            # E_audio (all)
            cp -r "$SRC/E_audio/." "$DST/E_audio/" 2>/dev/null || true

            # F_upload (only F1)
            cp "$SRC/F_upload/__init__.py" "$DST/F_upload/" 2>/dev/null || true
            cp "$SRC/F_upload/F1_drive.py" "$DST/F_upload/" 2>/dev/null || true

            # G_entry — skip (renamed per type)

            # H_tests (only common)
            for f in __init__ H1_conftest H3_test_media H4_test_render; do
              cp "$SRC/H_tests/$f.py" "$DST/H_tests/" 2>/dev/null || true
            done

            # Root files
            cp "$SRC/requirements.txt" "$DST/" 2>/dev/null || true
            cp "$SRC/.gitignore" "$DST/" 2>/dev/null || true
            cp "$SRC/Makefile" "$DST/" 2>/dev/null || true

            # G_entry pipeline (renamed)
            cp "$SRC/G_entry/G1_story_pipeline.py" "$DST/G_entry/G1_${TYPE}_pipeline.py" 2>/dev/null || true
            cp "$SRC/G_entry/G2_run_story.py" "$DST/G_entry/G2_run_${TYPE}.py" 2>/dev/null || true
          done

          echo "✅ Common files copied to all platforms"

      - name: 🚀 Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: copy common files to all platforms" || exit 0
          git push
