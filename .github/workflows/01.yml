          def get_bg(queries,dur):
              DK="eq=contrast=1.10:brightness=0.02:saturation=1.12,vignette=PI/5"
              clips=[]
              pk=os.environ.get("PEXELS_API_KEY")
              if pk:
                  for q in queries:
                      try:
                          r=session.get(f"https://api.pexels.com/videos/search?query={q}&orientation=portrait&per_page=6",
                              headers={"Authorization":pk},timeout=14)
                          if r.status_code==200 and r.json().get("videos"):
                              v=random.choice(r.json()["videos"])
                              files=sorted(v.get("video_files",[]),key=lambda x:x.get("width",0),reverse=True)
                              if files and dl(files[0]["link"],f"tmp_{len(clips)}.mp4"):
                                  clips.append(f"tmp_{len(clips)}.mp4")
                                  if len(clips)>=2: break
                      except: continue
              if not clips:
                  for i,u in enumerate(random.sample(MIXKIT,len(MIXKIT))):
                      if dl(u,f"tmp_mix_{i}.mp4"): clips.append(f"tmp_mix_{i}.mp4"); break
              if not clips:
                  log_err("BG failed"); send_report("FAILED","BG failed"); sys.exit(1)
              if len(clips)>=2:
                  d_e=dur/len(clips)
                  for i,c in enumerate(clips):
                      run(f'ffmpeg -y -stream_loop -1 -i {c} -vf "scale=1200:2140:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z=\'min(zoom+0.0004,1.06)\':d=1:x=\'iw/2-(iw/zoom/2)\':y=\'ih/2-(ih/zoom/2)\':s=1080x1920,setsar=1,{DK}" -t {d_e:.2f} -an -c:v libx264 -preset veryfast -crf 18 bg_{i}.mp4')
                  with open("bgl.txt","w") as f:
                      for i in range(len(clips)): f.write(f"file 'bg_{i}.mp4'\n")
                  run('ffmpeg -y -f concat -safe 0 -i bgl.txt -c copy bg.mp4')
                  R["bg"]={"source":"Multi","status":"ok"}; R["plat"]["bg"]="Multi-Source"
              else:
                  run(f'ffmpeg -y -stream_loop -1 -i {clips[0]} -vf "scale=1200:2140:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z=\'min(zoom+0.0004,1.06)\':d=1:x=\'iw/2-(iw/zoom/2)\':y=\'ih/2-(ih/zoom/2)\':s=1080x1920,setsar=1,{DK}" -t {dur:.2f} -an -c:v libx264 -preset veryfast -crf 18 bg.mp4')
                  R["bg"]={"source":"Single","status":"ok"}; R["plat"]["bg"]="Single"
              return "bg.mp4"

