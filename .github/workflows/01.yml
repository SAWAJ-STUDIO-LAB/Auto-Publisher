def add_respect_prophet(t):
    if not t: return t
    for p, r in [
        (r'\b(Prophet|Rasul|Rasool|Messenger of Allah|Nabi)\b(?!\s*ﷺ)', r'\1 ﷺ'),
        (r'पैगंबर(?!\s*ﷺ)', 'पैगंबर ﷺ'),
        (r'नबी(?!\s*ﷺ)', 'नबी ﷺ'),
        (r'रसूल(?!\s*ﷺ)', 'रसूल ﷺ'),
    ]:
        t = re.sub(p, r, t)
    return t

def add_respect_allah(t):
    if not t: return t
    t = re.sub(r'अल्लाह(?!\s*(तआला|SWT|ﷻ))', 'अल्लाह तआला', t)
    t = re.sub(r'\bAllah\b(?!\s*(SWT|ﷻ|\(SWT\)))', 'Allah (SWT)', t)
    return t

