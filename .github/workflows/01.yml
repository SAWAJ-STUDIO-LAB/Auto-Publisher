# TELEGRAM REPORT
# ═══════════════════════════════════════════════════════════════════════════
def _ic(s):
    s = str(s).lower()
    return "✅" if ("ok" in s or "success" in s) else \
           "❌" if "fail" in s else \
           "⏸️" if any(k in s for k in ["hold","skip","not set"]) else \
           "⚠️" if "warn" in s else "•"

def build_msg(status="COMPLETED", note=""):
    dur = int(time.time()-RUN_START)
    L = ["🕌 <b>ISLAMIC HADITH STORY</b>","━━━━━━━━━━━━━━━"]
    L.append(f"{'🎉' if status=='COMPLETED' else '⚠️' if status=='PARTIAL' else '❌'} <b>{status}</b>")
    if note: L.append(f"📝 {note}")
    L.append(f"⏱️ {dur//60}m {dur%60}s | ⚙️ {event_name or 'manual'}")
    L.append("\n🌐 <b>PLATFORMS</b>")
    for k, v in R["plat"].items(): L.append(f"  • {k.title()}: <b>{v}</b>")
    if R["hadith_tier"]: L.append(f"\n📚 <b>TIER</b>: {R['hadith_tier']}")
    es = R["es"]
    L.append("\n😊 <b>EMOJI & COLOR</b>")
    L.append(f"  ✅ Font: {'loaded ✓' if es['font'] else 'dots'}")
    L.append(f"  ✅ Path: {es.get('emoji_path','-')[:55]}")
    L.append(f"  ✅ Emojis: {es['words']} | Dots: {es['dots']}")
    L.append(f"  ✅ Palette: <b>{es['palette']}</b>")
    if R["aic"]:
        L.append("\n🤖 <b>AI CONTENT</b>")
        for k in ["hook","intro","title","emotion","narrator","outro_cta"]:
            if R["aic"].get(k): L.append(f"  ✅ {k}: <b>{R['aic'][k]}</b>")
    h = R["hadith"]
    if h:
        L.append(f"\n📖 <b>{h.get('collection','-')}</b> #{h.get('number','-')}")
    if R["video"]:
        L.append(f"\n🎬 <b>VIDEO</b>: {R['video'].get('duration','-')}s")
    if R["drive"]:
        L.append(f"\n☁️ <b>DRIVE</b>: {_ic(R['drive'].get('status',''))}")
        if R["drive"].get("link"): L.append(f"  {R['drive']['link']}")
    if R["fb"]: L.append(f"\n📱 <b>FB</b>: {_ic(R['fb'].get('status',''))}")
    if R["warnings"]:
        L.append("\n⚠️ <b>WARN</b>")
        for w in R["warnings"][:5]: L.append(f"  • {w}")
    if R["errors"]:
        L.append("\n❌ <b>ERR</b>")
        for e in R["errors"][:5]: L.append(f"  • {e}")
    m = "\n".join(L)
    return m[:3950]+"…" if len(m) > 4000 else m

def build_wc():
    L = ["🔍 <b>WORD CONFIRMATION</b>","━━━━━━━━━━━━━━━",""]
    secs = [("hook","🎯 HOOK"),("hindi","📖 HINDI"),("english","📚 ENGLISH"),
            ("arabic","🕌 ARABIC"),("cta","📣 CTA"),("tags","🏷️ TAGS")]
    total = 0
    for k, lb in secs:
        ws = R["wc"].get(k, [])
        if not ws: continue
        L.append(f"{lb} ({len(ws)})")
        for w in ws: L.append(f"  {w}")
        L.append(""); total += len(ws)
    L.append("━━━━━━━━━━━━━━━")
    L.append(f"✅ <b>Total: {total} words</b>")
    msgs, cur = [], ""
    for line in L:
        if len(cur)+len(line)+1 > 3800: msgs.append(cur); cur = line
        else: cur += ("\n" if cur else "") + line
    if cur: msgs.append(cur)
    return msgs

def send_report(status="COMPLETED", note=""):
    msg = build_msg(status, note)
    print("="*60); print(msg[:2000]); print("="*60)
    if TG_TOKEN and TG_CHAT_ID:
        try:
            session.post(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                json={"chat_id": TG_CHAT_ID, "text": msg,
                      "parse_mode": "HTML", "disable_web_page_preview": True},
                timeout=20)
        except Exception as e: print(f"[TG] {e}")
        try:
            for wc in build_wc():
                time.sleep(0.5)
                session.post(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                    json={"chat_id": TG_CHAT_ID, "text": wc,
                          "parse_mode": "HTML", "disable_web_page_preview": True},
                    timeout=20)
        except Exception as e: print(f"[TG-WC] {e}")

