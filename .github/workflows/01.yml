def islamic_pattern(img, op=0.05):
    try:
        p = Image.new("RGBA",(W,H),(0,0,0,0)); pd = ImageDraw.Draw(p)
        gold = (212,175,55,int(255*op))
        for x in range(0,W,120):
            for y in range(0,H,120):
                s = 30
                pd.polygon([(x,y-s),(x+s,y),(x,y+s),(x-s,y)], outline=gold)
                pd.polygon([(x-s*0.7,y-s*0.7),(x+s*0.7,y-s*0.7),
                            (x+s*0.7,y+s*0.7),(x-s*0.7,y+s*0.7)], outline=gold)
        return Image.alpha_composite(img,p)
    except Exception: return img

def particles(img, fi, cnt, pal):
    try:
        p = Image.new("RGBA",(W,H),(0,0,0,0)); pd = ImageDraw.Draw(p)
        random.seed(42)
        for i in range(cnt):
            px = (random.randint(0,W)+fi*random.choice([1,2,-1,-2]))%W
            py = (random.randint(0,H)-fi*random.choice([1,2,3]))%H
            sz = random.randint(2,5); a = random.randint(60,160)
            c = tuple(pal["primary"]) if i%2==0 else tuple(pal["glow"])
            pd.ellipse([px,py,px+sz,py+sz], fill=c+(a,))
        return Image.alpha_composite(img,p)
    except Exception: return img

def border(img, pal):
    try:
        b = Image.new("RGBA",(W,H),(0,0,0,0)); bd = ImageDraw.Draw(b)
        bd.rectangle([6,6,W-6,H-6], outline=tuple(pal["primary"])+(200,), width=4)
        bd.rectangle([14,14,W-14,H-14], outline=tuple(pal["glow"])+(80,), width=1)
        return Image.alpha_composite(img,b)
    except Exception: return img

def progress_dots(img, prog, pal, cnt=9):
    try:
        l = Image.new("RGBA",(W,H),(0,0,0,0)); ld = ImageDraw.Draw(l)
        tw = cnt*22; sx = (W-tw)//2; y = H-42
        for i in range(cnt):
            cx = sx+i*22+8
            if (i/cnt) < prog:
                ld.ellipse([cx-7,y-7,cx+7,y+7], fill=tuple(pal["accent"])+(255,))
            else:
                ld.ellipse([cx-5,y-5,cx+5,y+5], fill=(80,65,40,160))
        return Image.alpha_composite(img,l)
    except Exception: return img

def ref_card(img, coll, num, hj, pal):
    try:
        if not coll and not num: return img
        c = Image.new("RGBA",(W,H),(0,0,0,0)); cd = ImageDraw.Draw(c)
        try:
            fs = ImageFont.truetype(os.path.expanduser("~/.fonts/NotoSans-Bold.ttf"), 22)
            fxs = ImageFont.truetype(os.path.expanduser("~/.fonts/NotoSans-Regular.ttf"), 18)
        except Exception: fs = fxs = ImageFont.load_default()
        cw = 340; ch = 80
        cx = W-cw-30; cy = 30
        cd.rounded_rectangle([cx,cy,cx+cw,cy+ch], radius=12,
            fill=(15,10,5,220), outline=tuple(pal["primary"])+(255,), width=2)
        cd.text((cx+15,cy+12), coll, fill=tuple(pal["glow"])+(255,), font=fs)
        cd.text((cx+15,cy+40), f"#{num}", fill=tuple(pal["text"])+(220,), font=fxs)
        if hj:
            cd.text((cx+15,cy+60), hj[:30],
                    fill=tuple(pal["secondary"])+(220,), font=fxs)
        return Image.alpha_composite(img,c)
    except Exception: return img

def title_chip(img, title, pal):
    try:
        if not title: return img
        c = Image.new("RGBA",(W,H),(0,0,0,0)); cd = ImageDraw.Draw(c)
        try:
            fnt = ImageFont.truetype(os.path.expanduser("~/.fonts/NotoSans-Bold.ttf"), 26)
        except Exception: fnt = ImageFont.load_default()
        text = f"* {title}"
        bb = cd.textbbox((0,0), text, font=fnt)
        cw = min((bb[2]-bb[0])+40, W-400); ch = 52
        cd.rounded_rectangle([30,30,30+cw,30+ch], radius=26,
            fill=(15,10,5,220), outline=tuple(pal["primary"])+(255,), width=2)
        cd.text((50,43), text, fill=tuple(pal["glow"])+(255,), font=fnt)
        return Image.alpha_composite(img,c)
    except Exception: return img

def apply_emotion(img, em):
    try:
        oa = img.split()[3]; rgb = img.convert("RGB")
        if em == "tawbah":
            rgb = ImageEnhance.Color(rgb).enhance(0.88)
            rgb = Image.blend(rgb, Image.new("RGB",rgb.size,(0,0,40)), 0.10)
        elif em == "shukr":
            rgb = ImageEnhance.Color(rgb).enhance(1.10)
        elif em == "khushu":
            rgb = ImageEnhance.Color(rgb).enhance(0.92)
            rgb = Image.blend(rgb, Image.new("RGB",rgb.size,(30,20,40)), 0.08)
        r = rgb.convert("RGBA"); r.putalpha(oa); return r
    except Exception: return img

