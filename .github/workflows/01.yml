# MAIN
# ═══════════════════════════════════════════════════════════════════════════
def main():
    print("🕌 Islamic Hadith Story — tri-lingual line upgrade...")
    load_tools()
    log("Start", "info", RUN_START_STR)

    eok = emoji_ok()
    R["es"]["font"] = eok
    log("Emoji", "ok" if eok else "warn",
        f"from {R['es'].get('emoji_path','-')[:50]}" if eok else "dots fallback")

    h = fetch_hadith()
    if not h.get("english"):
        log("Hadith", "fail"); send_report("FAILED", "Hadith"); sys.exit(1)
    log("Hadith", "ok", f"{h['collection']} #{h['number']}")

    hindi = deepl(h["english"]) or call_ai(
        f"Is English Hadith ka natural Hindi tarjuma likho. Complete.\n\n{h['english']}",
        task="hindi") or ""
    hindi = sanitize(re.sub(r"^```.*?```", "", hindi, flags=re.DOTALL))
    hindi = add_respect_prophet(add_respect_allah(hindi))
    h["hindi"] = hindi
    h["translation_by"] = "DeepL" if R["trans"].get("DeepL") == "ok" else "AI"

    aic = ai_gen_everything(h["english"], h.get("arabic", ""))
    R["aic"] = aic
    for k in ["hook","intro","title","category","emotion","narrator",
              "quran_ref","quran_arabic","outro_main","outro_cta","hashtags"]:
        h[k] = aic.get(k, "")

    palette = aic["palette"]
    R["es"]["palette"] = palette.get("name", "custom")
    log("Palette (AI)", "ok", palette.get("name", "-"))

    conf_words("hook", h.get("hook", ""))
    conf_words("hindi", hindi)
    conf_words("english", h.get("english", ""))
    conf_words("arabic", h.get("arabic", ""))
    conf_words("cta", h.get("outro_cta", ""))
    conf_list("tags", h.get("hashtags", []))

    tts_text = f"{h['intro']} {hindi}".strip() or h["english"]
    if not gen_tts(tts_text, "s_raw.mp3"):
        log("TTS", "fail"); send_report("FAILED", "TTS"); sys.exit(1)
    log("TTS", "ok", R["tts"].get("provider"))

    process_voice("s_raw.mp3", "s_clean.mp3")
    vdur = MP3("s_clean.mp3").info.length
    if vdur < VOICE_MIN:
        pad = VOICE_MIN - vdur
        run(f'ffmpeg -y -i s_clean.mp3 -af "apad=pad_dur={pad:.2f}" s_v.mp3')
        vdur = MP3("s_v.mp3").info.length
    elif vdur > VOICE_MAX:
        ex = min(vdur/VOICE_MAX, 1.15)
        run(f'ffmpeg -y -i s_clean.mp3 -af "atempo={ex:.4f}" s_v.mp3')
        vdur = MP3("s_v.mp3").info.length
    else:
        os.replace("s_clean.mp3", "s_v.mp3")
    R["tts"]["duration"] = f"{vdur:.2f}"
    log("Audio", "ok", f"{vdur:.2f}s")

    get_ambience(aic.get("ambience_query", "rain nature"))
    fade = max(vdur - 3.0, 1.0)
    mix = (f"[0:a]volume=1.6,acompressor=threshold=-20dB:ratio=4:attack=5:"
           f"release=150,dynaudnorm=f=200:g=15:p=0.9,"
           f"loudnorm=I=-14:TP=-1.0:LRA=9[v];"
           f"[1:a]volume=0.14,afade=t=in:st=0:d=3,"
           f"afade=t=out:st={fade:.2f}:d=4[a];"
           f"[v]asplit=2[vm][vs];"
           f"[a][vs]sidechaincompress=threshold=0.05:ratio=8:attack=10:"
           f"release=400[ad];"
           f"[vm][ad]amix=inputs=2:duration=first:normalize=0[o]")
    run(f'ffmpeg -y -i s_v.mp3 -i ambience.mp3 -filter_complex "{mix}" '
        f'-map "[o]" -c:a libmp3lame -b:a 192k s_voice.mp3')
    log("Mix", "ok")

    bg = get_bg(aic.get("bg_queries", SAFE_BG_QUERIES[:3]),
                vdur + INTRO_SEC + OUTRO_SEC)
    log("BG", "ok", R["bg"].get("source"))

    has_logo = make_logo()
    log("Logo", "ok" if has_logo else "skip")

    fonts_dir = os.path.expanduser("~/.fonts")
    hj = hijri()
    if hj: log_enh(f"Hijri: {hj}")

    intro, outro = INTRO_SEC, OUTRO_SEC
    total = min(intro + vdur + outro, 65.0)
    os.makedirs("story_frames", exist_ok=True)

    try:
        F = {
            "big": ImageFont.truetype(f"{fonts_dir}/NotoSans-Bold.ttf", 78),
            "s": ImageFont.truetype(f"{fonts_dir}/NotoSans-Bold.ttf", 48),
            "tiny": ImageFont.truetype(f"{fonts_dir}/NotoSans-Regular.ttf", 32),
            "hook": ImageFont.truetype(f"{fonts_dir}/NotoSansDevanagari-Bold.ttf", 82),
            "hi": ImageFont.truetype(f"{fonts_dir}/NotoSansDevanagari-Bold.ttf", 42),
            "ar": ImageFont.truetype(f"{fonts_dir}/NotoNaskhArabic-Bold.ttf", 48),
            "en": ImageFont.truetype(f"{fonts_dir}/NotoSans-Bold.ttf", 34),
            "bism": ImageFont.truetype(f"{fonts_dir}/NotoNaskhArabic-Bold.ttf", 54),
            "ameen": ImageFont.truetype(f"{fonts_dir}/NotoNaskhArabic-Bold.ttf", 68),
        }
    except Exception:
        d = ImageFont.load_default()
        F = {k: d for k in ["big","s","tiny","hook","hi","ar","en","bism","ameen"]}

    lw, lh = 220, 95
    mx_x, mx_y = W - lw, H - lh
    fps = FPS
    tf = int(total * fps)
    print(f"[FRAMES] {tf}...")
    GS = {"w": 0, "d": 0}

    hindi_words = sanitize(hindi).split()
    arabic_words = sanitize_ar(h.get("arabic","")).split()
    english_words = sanitize(h.get("english","")).split()
    max_words = max(len(hindi_words), len(arabic_words), len(english_words))
    word_dur = vdur / max(1, max_words)

    for fi in range(tf):
        t = fi / fps
        prog = fi / tf
        img = Image.new("RGBA", (W, H), (0, 0, 0, 0))
        draw = ImageDraw.Draw(img)

        # INTRO
        if t < intro:
            mt = t
            if mt < 0.8:
                ba = int(255 * min(1.0, mt/0.3))
                try:
                    bb = draw.textbbox((0,0), BISMILLAH_ARABIC, font=F["bism"])
                    draw.text((W//2-(bb[2]-bb[0])//2, int(H*0.18)),
                              BISMILLAH_ARABIC,
                              fill=tuple(palette["glow"])+(ba,), font=F["bism"])
                except Exception: pass
            if h["hook"]:
                partial = reveal(h["hook"], mt-0.3, 0.25)
                if partial:
                    try:
                        bb = draw.textbbox((0,0), partial, font=F["hook"])
                        draw.text((W//2, int(H*0.45)), partial,
                                  fill=tuple(palette["text"])+(255,),
                                  font=F["hook"], anchor="mm")
                    except Exception: pass
            ba = int(220 * min(1.0, mt/0.5))
            draw.text((W//2, int(H*0.68)), BRAND_NAME,
                      fill=tuple(palette["primary"])+(ba,), font=F["s"], anchor="mm")

        # MAIN
        elif t < intro + vdur:
            mt = t - intro
            if has_logo:
                try:
                    lg = Image.open("avatar.png").convert("RGBA").resize(
                        (lw,lh), Image.Resampling.LANCZOS)
                    x = abs((int(mt*200)+60)%(2*mx_x)-mx_x)
                    y = abs((int(mt*150)+120)%(2*mx_y)-mx_y)
                    img.paste(lg, (x,y), lg)
                    draw = ImageDraw.Draw(img)
                except Exception: pass

            word_idx = int(mt / word_dur)
            cur_hi = hindi_words[word_idx] if word_idx < len(hindi_words) else ""
            cur_ar = arabic_words[word_idx] if word_idx < len(arabic_words) else ""
            cur_en = english_words[word_idx] if word_idx < len(english_words) else ""

            local_t = mt - (word_idx * word_dur)
            fa = min(1.0, local_t / 0.3)
            alpha_val = int(255 * fa)

            img = draw_trilingual_line(img, cur_hi, cur_ar, cur_en,
                                        palette, F, alpha=alpha_val)
            draw = ImageDraw.Draw(img)

            word_prog = mt / vdur

        # OUTRO
        else:
            ot = t - (intro + vdur)
            if h["outro_main"]:
                try:
                    gl = Image.new("RGBA",(W,H),(0,0,0,0))
                    ImageDraw.Draw(gl).text((W//2, int(H*0.34)), h["outro_main"],
                        fill=tuple(palette["primary"])+(100,), font=F["big"], anchor="mm")
                    gl = gl.filter(ImageFilter.GaussianBlur(18))
                    img = Image.alpha_composite(img, gl)
                    draw = ImageDraw.Draw(img)
                    draw.text((W//2, int(H*0.34)), h["outro_main"],
                              fill=tuple(palette["text"])+(255,),
                              font=F["big"], anchor="mm")
                except Exception: pass
            if h["outro_cta"]:
                try:
                    bb = draw.textbbox((0,0), h["outro_cta"], font=F["s"])
                    draw.text((W//2, int(H*0.44)), h["outro_cta"],
                              fill=tuple(palette["text"])+(255,),
                              font=F["s"], anchor="mm")
                except Exception: pass
            draw.text((W//2, int(H*0.52)), BRAND_HANDLE,
                      fill=tuple(palette["primary"])+(255,), font=F["tiny"], anchor="mm")
            draw.text((W//2, int(H*0.60)), aic.get("sadaqah_cta","सदक़ा जारिया है"),
                      fill=tuple(palette["secondary"])+(240,), font=F["tiny"], anchor="mm")
            tags_t = "  ".join(h["hashtags"][:4])
            if tags_t:
                draw.text((W//2, int(H*0.78)), tags_t,
                          fill=tuple(palette["secondary"])+(220,),
                          font=F["tiny"], anchor="mm")
            if ot >= outro - 1.2:
                aa = int(255 * min(1.0, (ot-(outro-1.2))/0.6))
                try:
                    bb = draw.textbbox((0,0), AMEEN_ARABIC, font=F["ameen"])
                    draw.text((W//2-(bb[2]-bb[0])//2, int(H*0.90)), AMEEN_ARABIC,
                              fill=tuple(palette["glow"])+(aa,), font=F["ameen"])
                except Exception: pass

        # UNIVERSAL
        img = islamic_pattern(img, 0.05)
        if intro <= t < intro + vdur:
            cnt = int(20 + 15*abs(math.sin((t-intro)*2)))
            img = particles(img, fi, cnt, palette)
        if t >= intro*0.5:
            img = ref_card(img, h["collection"], h["number"], hj, palette)
        if intro <= t < intro + vdur and h["title"]:
            img = title_chip(img, h["title"], palette)
        img = progress_dots(img, word_prog if intro <= t < intro+vdur else prog, palette)
        img = border(img, palette)
        img = apply_emotion(img, h["emotion"])
        img.save(f"story_frames/frame_{fi:05d}.png")

    R["es"]["words"] = GS["w"]; R["es"]["dots"] = GS["d"]
    log("Frames", "ok", f"{tf}")

    # FINAL RENDER
    final = "Final_FB_Story.mp4"
    run(f'ffmpeg -y -i {bg} -framerate {fps} '
        f'-i story_frames/frame_%05d.png -i s_voice.mp3 '
        f'-filter_complex "[0:v][1:v]overlay=0:0:shortest=1,'
        f'eq=contrast=1.08:brightness=0.02:saturation=1.12,'
        f'vignette=PI/6,format=yuv420p[outv]" '
        f'-map "[outv]" -map 2:a '
        f'-c:v libx264 -preset veryfast -crf 17 -b:v 7M '
        f'-c:a aac -b:a 192k -t {total:.2f} -movflags +faststart {final}')
    sz = os.path.getsize(final)/1024/1024
    R["video"] = {"file": final, "duration": f"{total:.2f}", "size": f"{sz:.2f}"}
    log("Video", "ok", f"{total:.2f}s | {sz:.2f}MB")

    drive_link = upload_drive(final, "Hadith_Story")
    log("Drive", "ok" if drive_link else "fail", drive_link or "-")

    if META_TOKEN and should_post_social:
        pt = META_TOKEN
        pid = os.environ.get("FACEBOOK_PAGE_ID", "").strip()
        r = {"page_id": pid or "-", "status": "initiated"}
        try:
            if pid:
                pt_resp = session.get(f"https://graph.facebook.com/v21.0/{pid}",
                    params={"fields": "access_token", "access_token": pt},
                    timeout=15).json()
                page_token_actual = pt_resp.get("access_token", pt)
                fs = os.path.getsize(final)
                s = session.post(
                    f"https://graph.facebook.com/v21.0/{pid}/video_stories",
                    data={"upload_phase": "start", "file_size": fs,
                          "access_token": page_token_actual},
                    timeout=30).json()
                if s.get("error"):
                    r["status"] = f"fail: {s['error'].get('message','')[:80]}"
                else:
                    vid, vurl = s.get("video_id"), s.get("upload_url")
                    if vid and vurl:
                        with open(final, "rb") as f:
                            u = session.post(vurl,
                                headers={"Authorization": f"OAuth {page_token_actual}",
                                         "offset": "0", "file_size": str(fs)},
                                data=f.read(), timeout=180)
                        if u.status_code in (200, 201):
                            fin = session.post(
                                f"https://graph.facebook.com/v21.0/{pid}/video_stories",
                                data={"upload_phase": "finish", "video_id": vid,
                                      "access_token": page_token_actual},
                                timeout=30).json()
                            if fin.get("success") or fin.get("post_id"):
                                r["status"] = "ok"; r["post_id"] = fin.get("post_id","-")
                            else: r["status"] = "fail (finish)"
                        else: r["status"] = f"fail (up {u.status_code})"
                    else: r["status"] = "fail (no video_id)"
            else: r["status"] = "fail (no page)"
        except Exception as e: r["status"] = f"fail ({str(e)[:60]})"
        R["fb"] = r
        log("FB Story", "ok" if r["status"]=="ok" else "fail", r["status"])
    else:
        R["fb"] = {"status": "skipped"}; log("FB","skip","manual")

    for f in ["s_raw.mp3","s_clean.mp3","s_v.mp3","s_voice.mp3",
              "amb_raw.mp3","bgl.txt","cat.txt"]:
        if os.path.exists(f):
            try: os.remove(f)
            except Exception: pass
    for i in range(5):
        for f in [f"tmp_{i}.mp4", f"bg_{i}.mp4", f"tmp_mix_{i}.mp4"]:
            if os.path.exists(f):
                try: os.remove(f)
                except Exception: pass
    shutil.rmtree("story_frames", ignore_errors=True)
    log("Cleanup", "ok")

    status = "COMPLETED" if not R["errors"] else "PARTIAL"
    send_report(status)
    print("🕌 Alhamdulillah. Done.")

if __name__ == "__main__":
    try:
        main()
    except SystemExit:
        raise
    except Exception as e:
        print(traceback.format_exc())
        log_err(f"Fatal: {str(e)[:150]}")
        try: send_report("FAILED", f"Uncaught: {str(e)[:120]}")
        except Exception: pass
        sys.exit(1)
