name: "Facebook Story 01"

on:
  workflow_dispatch:
    inputs:
      upload_to_social:
        description: "Upload to Facebook Story?"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "30 23 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: facebook-story
  cancel-in-progress: false

jobs:
  generate-story:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CACHE_VERSION: v11
      DEPS_DIR: ${{ github.workspace }}/.dependencies

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            .dependencies
            \~/.cache/pip
          key: \( {{ runner.os }}-fb-story- \){{ env.CACHE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-fb-story-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Tools
        run: |
          mkdir -p "$DEPS_DIR"/{bin,fonts,piper,python-venv}

          if [ -f "$DEPS_DIR/.ffmpeg_ok" ]; then
            echo "Using cached FFmpeg"
            sudo cp "$DEPS_DIR/bin/"* /usr/local/bin/ 2>/dev/null || true
            sudo chmod +x /usr/local/bin/* 2>/dev/null || true
          else
            sudo apt-get update -q
            sudo apt-get install -y -q ffmpeg sox espeak-ng libsox-fmt-all \
              fonts-noto fonts-noto-core fonts-dejavu-core fontconfig
            cp $(which ffmpeg) $(which ffprobe) $(which sox) "$DEPS_DIR/bin/" || true
            cp $(which espeak-ng) "$DEPS_DIR/bin/" || true
            touch "$DEPS_DIR/.ffmpeg_ok"
          fi

      - name: Setup Python Packages
        run: |
          VENV="$DEPS_DIR/python-venv"
          if [ ! -f "$VENV/.installed" ]; then
            python -m venv "$VENV"
            "$VENV/bin/pip" install --upgrade pip --quiet
            "$VENV/bin/pip" install --no-cache-dir \
              requests edge-tts mutagen Pillow \
              google-api-python-client google-auth-httplib2 google-auth-oauthlib
            touch "$VENV/.installed"
          fi
          echo "$VENV/bin" >> $GITHUB_PATH

      - name: Download Fonts
        run: |
          if [ ! -f "$DEPS_DIR/.fonts_ok" ]; then
            mkdir -p "$DEPS_DIR/fonts"
            BASE="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf"
            wget -q "$BASE/NotoSans/NotoSans-Regular.ttf" -O "$DEPS_DIR/fonts/NotoSans-Regular.ttf" || true
            wget -q "$BASE/NotoSans/NotoSans-Bold.ttf" -O "$DEPS_DIR/fonts/NotoSans-Bold.ttf" || true
            wget -q "$BASE/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf" -O "$DEPS_DIR/fonts/NotoSansDevanagari-Bold.ttf" || true
            wget -q "$BASE/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf" -O "$DEPS_DIR/fonts/NotoNaskhArabic-Bold.ttf" || true
            touch "$DEPS_DIR/.fonts_ok"
          fi
          mkdir -p \~/.fonts
          cp "$DEPS_DIR/fonts/"*.ttf \~/.fonts/ 2>/dev/null || true
          fc-cache -f > /dev/null 2>&1 || true

      - name: Download Piper Models
        run: |
          P="$DEPS_DIR/piper"
          if [ ! -f "$P/.installed" ]; then
            mkdir -p "$P"
            BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main"
            wget -q "$BASE/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx" -O "$P/hi_IN-pratham-medium.onnx" || true
            wget -q "$BASE/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx.json" -O "$P/hi_IN-pratham-medium.onnx.json" || true
            touch "$P/.installed"
          fi
          echo "PIPER_DIR=$P" >> $GITHUB_ENV

      - name: Create Python Script
        run: |
          mkdir -p scripts
          cat > scripts/story_video.py << 'PYEOF'
          #!/usr/bin/env python3
          """
          Islamic Hadith Story Generator
          Vertical 3-line stack (No Box)
          """

          import os
          import re
          import time
          import random
          import subprocess
          import requests
          import shutil
          import sys
          import json
          import math
          import traceback
          from datetime import datetime
          from mutagen.mp3 import MP3
          from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageEnhance
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          # ────────────────────────────────────────────────
          # Session
          # ────────────────────────────────────────────────
          session = requests.Session()
          session.mount("https://", HTTPAdapter(max_retries=Retry(
              total=5, backoff_factor=1.5,
              status_forcelist=[429, 500, 502, 503, 504]
          )))

          # ────────────────────────────────────────────────
          # Environment
          # ────────────────────────────────────────────────
          TG_TOKEN   = os.environ.get("TELEGRAM_BOT_TOKEN")
          TG_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")
          META_TOKEN = os.environ.get("FACEBOOK_INSTAGRAM_META_TOKEN", "").strip()
          DEPS_DIR   = os.environ.get("DEPS_DIR", os.path.expanduser("\~/.dependencies"))
          PIPER_DIR  = os.environ.get("PIPER_DIR", os.path.join(DEPS_DIR, "piper"))

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          should_post = (event_name == "schedule") or (
              str(os.environ.get("UPLOAD_TO_SOCIAL", "")).lower() == "true"
          )

          # ────────────────────────────────────────────────
          # Constants
          # ────────────────────────────────────────────────
          RUN_START = time.time()
          FPS, INTRO_SEC, OUTRO_SEC = 25, 3.5, 5.0
          W, H = 1080, 1920
          VIDEO_MIN, VIDEO_MAX = 35.0, 62.0
          VOICE_MIN = VIDEO_MIN - 3.2
          VOICE_MAX = VIDEO_MAX - 3.2

          BRAND_NAME   = "SAWAJ STUDIO"
          BRAND_HANDLE = "@SawajStudio"
          BISMILLAH    = "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ"
          AMEEN        = "آمین ثم آمین"

          BOOKS = [
              {"eng": "eng-bukhari",  "ara": "ara-bukhari",  "name": "सहीह अल-बुख़ारी", "max": 7563},
              {"eng": "eng-muslim",   "ara": "ara-muslim",   "name": "सहीह मुस्लिम",    "max": 3032},
              {"eng": "eng-abudawud", "ara": "ara-abudawud", "name": "सुनन अबू दाऊद",   "max": 5274},
              {"eng": "eng-tirmidhi", "ara": "ara-tirmidhi", "name": "जामी अत-तिर्मिज़ी", "max": 3956},
              {"eng": "eng-nasai",    "ara": "ara-nasai",    "name": "सुनन अन-नसाई",    "max": 5758},
              {"eng": "eng-ibnmajah", "ara": "ara-ibnmajah", "name": "सुनन इब्न माजा",  "max": 4341},
              {"eng": "eng-malik",    "ara": "ara-malik",    "name": "मुवत्ता मलिक",    "max": 1858},
          ]

          FB_PALETTE = {
              "name": "Royal Gold",
              "primary":   [212, 175, 55],
              "secondary": [255, 220, 120],
              "text":      [255, 245, 220],
              "accent":    [255, 200, 80],
              "glow":      [255, 220, 120],
          }

          COLOR_POOL = [
              (255, 100, 150), (80, 180, 255), (100, 220, 100),
              (255, 200, 60),  (200, 140, 240), (255, 150, 80),
              (140, 200, 255), (255, 130, 200), (150, 220, 180),
              (255, 180, 100),
          ]

          # ────────────────────────────────────────────────
          # Helpers
          # ────────────────────────────────────────────────
          def color_for_word(word):
              h = 0
              for c in str(word):
                  h = (h * 31 + ord(c)) & 0xFFFFFFFF
              return COLOR_POOL[h % len(COLOR_POOL)]

          def sanitize(text):
              if not text:
                  return ""
              text = re.sub(r'[\u200b-\u200f\ufeff\u202a-\u202e]', '', str(text))
              text = re.sub(r'[\U0001F000-\U0001FFFF\u2600-\u27BF\u2B00-\u2BFF\uFE00-\uFE0F]', '', text)
              return text.replace('"', '').replace("'", '').replace('\n', ' ').strip()

          def sanitize_ar(text):
              if not text:
                  return ""
              return re.sub(r'[\u200b-\u200e\ufeff\u202a-\u202e]', '', str(text)).replace('\n', ' ').strip()

          def run(cmd, timeout=None):
              print(f"[CMD] {cmd[:100]}...")
              subprocess.run(cmd, shell=True, check=True, timeout=timeout)

          def download(url, path, min_size=12000):
              try:
                  r = session.get(url, timeout=35)
                  if r.status_code == 200 and len(r.content) > min_size:
                      with open(path, "wb") as f:
                          f.write(r.content)
                      return True
              except Exception:
                  pass
              return False

          def add_respect(text):
              if not text:
                  return text
              text = re.sub(r'\b(Prophet|Rasul|Rasool|Messenger of Allah|Nabi)\b(?!\s*ﷺ)', r'\1 ﷺ', text)
              text = re.sub(r'पैगंबर(?!\s*ﷺ)', 'पैगंबर ﷺ', text)
              text = re.sub(r'नबी(?!\s*ﷺ)', 'नबी ﷺ', text)
              text = re.sub(r'रसूल(?!\s*ﷺ)', 'रसूल ﷺ', text)
              text = re.sub(r'अल्लाह(?!\s*(तआला|SWT|ﷻ))', 'अल्लाह तआला', text)
              text = re.sub(r'\bAllah\b(?!\s*(SWT|ﷻ|\(SWT\)))', 'Allah (SWT)', text)
              return text

          # ────────────────────────────────────────────────
          # Report
          # ────────────────────────────────────────────────
          R = {
              "errors": [], "warnings": [], "hadith": {}, "tts": {},
              "bg": {}, "drive": {}, "fb": {}, "video": {}, "plat": {}
          }

          def log(step, status="ok", detail=""):
              icon = {"ok": "✅", "fail": "❌", "warn": "⚠️", "info": "ℹ️", "skip": "⏸️"}.get(status, "•")
              print(f"{icon} {step} — {detail}")

          def log_err(msg):
              R["errors"].append(str(msg)[:200])
              print(f"[ERR] {msg}")

          def send_report(status="COMPLETED", note=""):
              duration = int(time.time() - RUN_START)
              lines = [
                  "🕌 <b>ISLAMIC HADITH STORY</b>",
                  "━━━━━━━━━━━━━━━",
                  f"{'🎉' if status == 'COMPLETED' else '❌'} <b>{status}</b>",
              ]
              if note:
                  lines.append(f"📝 {note}")
              lines.append(f"⏱️ {duration // 60}m {duration % 60}s")

              if R.get("hadith"):
                  h = R["hadith"]
                  lines.append(f"\n📖 <b>{h.get('collection', '-')}</b> #{h.get('number', '-')}")

              if R.get("video"):
                  v = R["video"]
                  lines.append(f"\n🎬 {v.get('duration', '-')}s | {v.get('size', '-')}MB")

              if R.get("drive") and R["drive"].get("link"):
                  lines.append(f"\n☁️ {R['drive']['link']}")

              if R.get("errors"):
                  lines.append("\n❌ Errors:")
                  for e in R["errors"][:3]:
                      lines.append(f"  • {e}")

              msg = "\n".join(lines)[:3900]

              print("=" * 50)
              print(msg)
              print("=" * 50)

              if TG_TOKEN and TG_CHAT_ID:
                  try:
                      session.post(
                          f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                          json={"chat_id": TG_CHAT_ID, "text": msg, "parse_mode": "HTML"},
                          timeout=20
                      )
                  except Exception as e:
                      print(f"[TG] {e}")

          # ────────────────────────────────────────────────
          # AI
          # ────────────────────────────────────────────────
          def call_ai(prompt, max_tokens=1000):
              providers = []
              if os.environ.get("OPENROUTER_API_KEY"):
                  providers.append(("OpenRouter", "https://openrouter.ai/api/v1/chat/completions",
                                    os.environ["OPENROUTER_API_KEY"], "openai/gpt-4o-mini"))
              if os.environ.get("GROQ_API_KEY"):
                  providers.append(("Groq", "https://api.groq.com/openai/v1/chat/completions",
                                    os.environ["GROQ_API_KEY"], "llama-3.3-70b-versatile"))
              if os.environ.get("GEMINI_API_KEY"):
                  providers.append(("Gemini", None, os.environ["GEMINI_API_KEY"], None))

              for name, url, key, model in providers:
                  try:
                      if name == "Gemini":
                          r = session.post(
                              f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={key}",
                              json={"contents": [{"parts": [{"text": prompt}]}],
                                    "generationConfig": {"responseMimeType": "application/json"}},
                              timeout=60
                          )
                          if r.status_code == 200:
                              return r.json()["candidates"][0]["content"]["parts"][0]["text"].strip()
                      else:
                          r = session.post(url, headers={
                              "Authorization": f"Bearer {key}",
                              "Content-Type": "application/json"
                          }, json={
                              "model": model,
                              "messages": [{"role": "user", "content": prompt}],
                              "temperature": 0.9,
                              "max_tokens": max_tokens,
                              "response_format": {"type": "json_object"}
                          }, timeout=60)
                          if r.status_code == 200:
                              return r.json()["choices"][0]["message"]["content"].strip()
                  except Exception as e:
                      print(f"[AI] {name} failed: {e}")
              return None

          def parse_json(text):
              if not text:
                  return None
              text = re.sub(r'^```(?:json)?\s*', '', text.strip())
              text = re.sub(r'\s*```$', '', text)
              match = re.search(r'\{.*\}', text, re.DOTALL)
              if match:
                  try:
                      return json.loads(match.group(0))
                  except Exception:
                      pass
              return None

          # ────────────────────────────────────────────────
          # TTS
          # ────────────────────────────────────────────────
          def tts_edge(text, out):
              voices = ["hi-IN-MadhurNeural", "ur-IN-SalmanNeural", "en-IN-PrabhatNeural"]
              for voice in voices:
                  try:
                      tmp = out + ".txt"
                      with open(tmp, "w", encoding="utf-8") as f:
                          f.write(text)
                      if os.path.exists(out):
                          os.remove(out)
                      subprocess.run(
                          f'edge-tts --file "{tmp}" --write-media "{out}" --voice {voice} --rate=-10% --pitch=-2Hz',
                          shell=True, check=True, timeout=120
                      )
                      if os.path.exists(tmp):
                          os.remove(tmp)
                      if os.path.exists(out) and os.path.getsize(out) > 3000:
                          return True, voice
                  except Exception:
                      continue
              return False, "edge failed"

          def tts_piper(text, out):
              model = os.path.join(PIPER_DIR, "hi_IN-pratham-medium.onnx")
              if not os.path.exists(model):
                  return False, "no model"
              try:
                  tmp = out + ".wav"
                  subprocess.run(
                      f'echo "{text}" | piper --model "{model}" --output_file "{tmp}" --length_scale 1.08',
                      shell=True, check=True, timeout=90
                  )
                  if os.path.exists(tmp) and os.path.getsize(tmp) > 5000:
                      run(f'ffmpeg -y -i "{tmp}" -c:a libmp3lame -b:a 128k "{out}"')
                      os.remove(tmp)
                      if os.path.exists(out) and os.path.getsize(out) > 3000:
                          return True, "piper"
              except Exception:
                  pass
              return False, "piper failed"

          def generate_tts(text, out):
              text = sanitize(text)
              if not text:
                  return False
              for name, fn in [("edge", tts_edge), ("piper", tts_piper)]:
                  ok, detail = fn(text, out)
                  if ok:
                      R["tts"] = {"provider": name, "detail": detail}
                      R["plat"]["tts"] = name
                      return True
              return False

          # ────────────────────────────────────────────────
          # Hadith
          # ────────────────────────────────────────────────
          def fetch_hadith():
              bases = [
                  "https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1",
                  "https://raw.githubusercontent.com/fawazahmed0/hadith-api/1"
              ]
              recent = []
              try:
                  if os.path.exists("recent_hadiths.json"):
                      with open("recent_hadiths.json") as f:
                          recent = json.load(f)
              except Exception:
                  pass

              for _ in range(40):
                  book = random.choice(BOOKS)
                  num = random.randint(1, max(1, book["max"] - 50))
                  key = f"{book['eng']}:{num}"
                  if key in recent[-25:]:
                      continue

                  for base in bases:
                      try:
                          r = session.get(f"{base}/editions/{book['eng']}/{num}.json", timeout=12)
                          if r.status_code != 200:
                              continue
                          data = r.json().get("hadiths", [])
                          if not data:
                              continue
                          eng = sanitize(data[0].get("text", ""))
                          if not (150 <= len(eng) <= 700):
                              continue

                          ara = ""
                          try:
                              ar = session.get(f"{base}/editions/{book['ara']}/{num}.json", timeout=10)
                              if ar.status_code == 200:
                                  ad = ar.json().get("hadiths", [])
                                  if ad:
                                      ara = sanitize(ad[0].get("text", ""))
                          except Exception:
                              pass

                          recent.append(key)
                          recent = recent[-40:]
                          try:
                              with open("recent_hadiths.json", "w") as f:
                                  json.dump(recent, f)
                          except Exception:
                              pass

                          result = {
                              "collection": book["name"],
                              "number": str(data[0].get("hadithnumber") or num),
                              "english": eng,
                              "arabic": ara,
                          }
                          R["hadith"] = result
                          R["plat"]["hadith"] = book["eng"]
                          return result
                      except Exception:
                          continue

              # Fallback
              result = {
                  "collection": "Sahih al-Bukhari",
                  "number": "1",
                  "english": "The reward of deeds depends upon the intentions.",
                  "arabic": "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ",
              }
              R["hadith"] = result
              return result

          # ────────────────────────────────────────────────
          # Vertical 3-line Stack (No Box)
          # ────────────────────────────────────────────────
          def draw_trilingual(img, hindi, arabic, english, palette, fonts, alpha=255):
              try:
                  draw = ImageDraw.Draw(img)
                  x_dot = int(W * 0.08)
                  x_text = int(W * 0.13)
                  base_y = int(H * 0.48)
                  gap = 110

                  lines = [
                      (hindi,   fonts["hi"], base_y - gap, 16),
                      (arabic,  fonts["ar"], base_y,       18),
                      (english, fonts["en"], base_y + gap, 14),
                  ]

                  for word, font, y, radius in lines:
                      if not word:
                          continue
                      color = color_for_word(word)

                      # Dot
                      draw.ellipse(
                          [x_dot - radius, y - radius, x_dot + radius, y + radius],
                          fill=color + (alpha,)
                      )

                      # Shadow
                      for dx, dy in [(-3,-3),(3,-3),(-3,3),(3,3),(0,-3),(0,3),(-3,0),(3,0)]:
                          draw.text((x_text + dx, y + dy), word,
                                    fill=(0, 0, 0, int(200 * alpha / 255)),
                                    font=font, anchor="lm")

                      # Main text
                      draw.text((x_text, y), word,
                                fill=tuple(palette["text"]) + (alpha,),
                                font=font, anchor="lm")
                  return img
              except Exception as e:
                  print(f"[DRAW] {e}")
                  return img

          # ────────────────────────────────────────────────
          # Main
          # ────────────────────────────────────────────────
          def main():
              print("🕌 Starting Islamic Hadith Story Generator...")
              log("Start", "info", datetime.utcnow().strftime("%d-%b-%Y %H:%M UTC"))

              # 1. Fetch Hadith
              hadith = fetch_hadith()
              if not hadith.get("english"):
                  log("Hadith", "fail")
                  send_report("FAILED", "Hadith empty")
                  sys.exit(1)
              log("Hadith", "ok", f"{hadith['collection']} #{hadith['number']}")

              # 2. Hindi Translation
              hindi = call_ai(
                  f"Is English Hadith ka natural Hindi tarjuma likho. Complete only.\n\n{hadith['english']}"
              ) or hadith["english"]
              hindi = add_respect(sanitize(hindi))
              hadith["hindi"] = hindi

              # 3. AI Content
              ai_prompt = f"""You are an Islamic short-video creator.
          Hadith: "{hadith['english'][:300]}"
          Return ONLY valid JSON:
          {{
            "hook": "Hindi curiosity hook 4-6 words",
            "intro": "3-5 word Hindi",
            "outro_cta": "CTA 3-6 words Hindi",
            "emotion": "calm",
            "bg_queries": ["mosque night empty", "desert sunrise", "islamic pattern"],
            "ambience_query": "gentle rain nature",
            "color_palette": {{
              "name": "Royal Gold",
              "primary": [212,175,55],
              "secondary": [255,220,120],
              "text": [255,245,220],
              "accent": [255,200,80],
              "glow": [255,220,120]
            }},
            "hashtags": ["#Hadith","#Sunnah","#Islam","#Quran","#SawajStudio"]
          }}"""
              ai_data = parse_json(call_ai(ai_prompt, 1200)) or {}

              palette = ai_data.get("color_palette", FB_PALETTE)
              if not isinstance(palette, dict) or "primary" not in palette:
                  palette = FB_PALETTE

              hook = add_respect(sanitize(ai_data.get("hook", "क्या आप जानते हैं?")))
              intro = add_respect(sanitize(ai_data.get("intro", "")))
              cta = add_respect(sanitize(ai_data.get("outro_cta", "इस हदीस को 3 दोस्तों को भेजें।")))
              emotion = ai_data.get("emotion", "calm")
              bg_queries = ai_data.get("bg_queries", ["mosque night empty", "desert sunrise"])
              ambience_q = ai_data.get("ambience_query", "gentle rain nature")
              hashtags = ai_data.get("hashtags", ["#Hadith", "#Sunnah", "#Islam", "#Quran"])

              # 4. TTS
              tts_text = f"{intro} {hindi}".strip() or hadith["english"]
              if not generate_tts(tts_text, "s_raw.mp3"):
                  log("TTS", "fail")
                  send_report("FAILED", "TTS failed")
                  sys.exit(1)
              log("TTS", "ok", R["tts"].get("provider"))

              # Voice processing
              run('ffmpeg -y -i s_raw.mp3 -af "highpass=f=100,lowpass=f=11000,acompressor=threshold=-20dB:ratio=4,loudnorm=I=-14:TP=-1.0,volume=1.3" s_clean.mp3')
              vdur = MP3("s_clean.mp3").info.length

              if vdur < VOICE_MIN:
                  pad = VOICE_MIN - vdur
                  run(f'ffmpeg -y -i s_clean.mp3 -af "apad=pad_dur={pad:.2f}" s_v.mp3')
                  vdur = MP3("s_v.mp3").info.length
              elif vdur > VOICE_MAX:
                  tempo = min(vdur / VOICE_MAX, 1.15)
                  run(f'ffmpeg -y -i s_clean.mp3 -af "atempo={tempo:.4f}" s_v.mp3')
                  vdur = MP3("s_v.mp3").info.length
              else:
                  os.replace("s_clean.mp3", "s_v.mp3")
              log("Audio", "ok", f"{vdur:.1f}s")

              # 5. Ambience
              run('ffmpeg -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 90 -c:a libmp3lame -b:a 128k ambience.mp3')
              fade = max(vdur - 3, 1)
              run(f'ffmpeg -y -i s_v.mp3 -i ambience.mp3 -filter_complex "[0:a]volume=1.5[v];[1:a]volume=0.12,afade=t=in:st=0:d=2,afade=t=out:st={fade:.1f}:d=3[a];[v][a]amix=inputs=2:duration=first[o]" -map "[o]" -c:a libmp3lame -b:a 192k s_voice.mp3')

              # 6. Background (simple solid + gradient for reliability)
              total = min(INTRO_SEC + vdur + OUTRO_SEC, 65)
              run(f'ffmpeg -y -f lavfi -i "color=c=0x1a1208:s=1080x1920:d={total}" -vf "format=yuv420p" -c:v libx264 -preset veryfast -crf 18 bg.mp4')
              log("BG", "ok", "generated")

              # 7. Fonts
              fonts_dir = os.path.expanduser("\~/.fonts")
              try:
                  fonts = {
                      "big":  ImageFont.truetype(f"{fonts_dir}/NotoSans-Bold.ttf", 72),
                      "s":    ImageFont.truetype(f"{fonts_dir}/NotoSans-Bold.ttf", 46),
                      "tiny": ImageFont.truetype(f"{fonts_dir}/NotoSans-Regular.ttf", 30),
                      "hook": ImageFont.truetype(f"{fonts_dir}/NotoSansDevanagari-Bold.ttf", 76),
                      "hi":   ImageFont.truetype(f"{fonts_dir}/NotoSansDevanagari-Bold.ttf", 52),
                      "ar":   ImageFont.truetype(f"{fonts_dir}/NotoNaskhArabic-Bold.ttf", 60),
                      "en":   ImageFont.truetype(f"{fonts_dir}/NotoSans-Bold.ttf", 40),
                      "bism": ImageFont.truetype(f"{fonts_dir}/NotoNaskhArabic-Bold.ttf", 54),
                      "ameen":ImageFont.truetype(f"{fonts_dir}/NotoNaskhArabic-Bold.ttf", 68),
                  }
              except Exception:
                  default = ImageFont.load_default()
                  fonts = {k: default for k in ["big","s","tiny","hook","hi","ar","en","bism","ameen"]}

              # 8. Render Frames
              os.makedirs("story_frames", exist_ok=True)
              total_frames = int(total * FPS)
              hindi_words   = sanitize(hindi).split()
              arabic_words  = sanitize_ar(hadith.get("arabic", "")).split()
              english_words = sanitize(hadith["english"]).split()
              max_words = max(len(hindi_words), len(arabic_words), len(english_words), 1)
              word_dur = vdur / max_words

              print(f"[FRAMES] Rendering {total_frames} frames...")

              for fi in range(total_frames):
                  t = fi / FPS
                  img = Image.new("RGBA", (W, H), (0, 0, 0, 0))
                  draw = ImageDraw.Draw(img)

                  # INTRO
                  if t < INTRO_SEC:
                      mt = t
                      if mt < 0.9:
                          alpha = int(255 * min(1.0, mt / 0.35))
                          try:
                              bbox = draw.textbbox((0, 0), BISMILLAH, font=fonts["bism"])
                              draw.text(((W - (bbox[2] - bbox[0])) // 2, int(H * 0.18)),
                                        BISMILLAH, fill=tuple(palette["glow"]) + (alpha,),
                                        font=fonts["bism"])
                          except Exception:
                              pass

                      if hook:
                          words = sanitize(hook).split()
                          show = max(0, min(len(words), int((mt - 0.3) / 0.25) + 1))
                          partial = " ".join(words[:show])
                          if partial:
                              for dx, dy in [(-3,-3),(3,-3),(-3,3),(3,3)]:
                                  draw.text((W//2 + dx, int(H*0.45) + dy), partial,
                                            fill=(0,0,0,180), font=fonts["hook"], anchor="mm")
                              draw.text((W//2, int(H*0.45)), partial,
                                        fill=tuple(palette["text"]) + (255,),
                                        font=fonts["hook"], anchor="mm")

                      alpha = int(220 * min(1.0, mt / 0.5))
                      draw.text((W//2, int(H*0.68)), BRAND_NAME,
                                fill=tuple(palette["primary"]) + (alpha,),
                                font=fonts["s"], anchor="mm")

                  # MAIN - Vertical Stack
                  elif t < INTRO_SEC + vdur:
                      mt = t - INTRO_SEC
                      idx = int(mt / word_dur)
                      cur_hi = hindi_words[idx] if idx < len(hindi_words) else ""
                      cur_ar = arabic_words[idx] if idx < len(arabic_words) else ""
                      cur_en = english_words[idx] if idx < len(english_words) else ""

                      local_t = mt - (idx * word_dur)
                      fade = min(1.0, local_t / 0.25)
                      alpha = int(255 * fade)

                      img = draw_trilingual(img, cur_hi, cur_ar, cur_en, palette, fonts, alpha)

                  # OUTRO
                  else:
                      ot = t - (INTRO_SEC + vdur)
                      try:
                          draw.text((W//2, int(H*0.34)), "Fi Amanillah",
                                    fill=tuple(palette["text"]) + (255,),
                                    font=fonts["big"], anchor="mm")
                          draw.text((W//2, int(H*0.46)), cta,
                                    fill=tuple(palette["text"]) + (255,),
                                    font=fonts["s"], anchor="mm")
                          draw.text((W//2, int(H*0.56)), BRAND_HANDLE,
                                    fill=tuple(palette["primary"]) + (255,),
                                    font=fonts["tiny"], anchor="mm")
                          tags = "  ".join(hashtags[:4])
                          draw.text((W//2, int(H*0.82)), tags,
                                    fill=tuple(palette["secondary"]) + (220,),
                                    font=fonts["tiny"], anchor="mm")
                      except Exception:
                          pass

                      if ot >= OUTRO_SEC - 1.2:
                          aa = int(255 * min(1.0, (ot - (OUTRO_SEC - 1.2)) / 0.6))
                          try:
                              bbox = draw.textbbox((0, 0), AMEEN, font=fonts["ameen"])
                              draw.text(((W - (bbox[2] - bbox[0])) // 2, int(H * 0.90)),
                                        AMEEN, fill=tuple(palette["glow"]) + (aa,),
                                        font=fonts["ameen"])
                          except Exception:
                              pass

                  img.save(f"story_frames/frame_{fi:05d}.png")

              log("Frames", "ok", str(total_frames))

              # 9. Final Video
              final = "Final_FB_Story.mp4"
              run(f'ffmpeg -y -i bg.mp4 -framerate {FPS} -i story_frames/frame_%05d.png -i s_voice.mp3 '
                  f'-filter_complex "[0:v][1:v]overlay=0:0:shortest=1,format=yuv420p[outv]" '
                  f'-map "[outv]" -map 2:a -c:v libx264 -preset veryfast -crf 17 -b:v 6M '
                  f'-c:a aac -b:a 192k -t {total:.2f} -movflags +faststart {final}')

              size_mb = os.path.getsize(final) / 1024 / 1024
              R["video"] = {"duration": f"{total:.1f}", "size": f"{size_mb:.1f}"}
              log("Video", "ok", f"{total:.1f}s | {size_mb:.1f}MB")

              # 10. Google Drive (optional)
              try:
                  if all([os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN"),
                          os.environ.get("GOOGLE_DRIVE_CLIENT_ID"),
                          os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET")]):
                      creds = Credentials(
                          None,
                          refresh_token=os.environ["GOOGLE_DRIVE_REFRESH_TOKEN"],
                          client_id=os.environ["GOOGLE_DRIVE_CLIENT_ID"],
                          client_secret=os.environ["GOOGLE_DRIVE_CLIENT_SECRET"],
                          token_uri="https://oauth2.googleapis.com/token"
                      )
                      service = build("drive", "v3", credentials=creds, cache_discovery=False)
                      meta = {"name": f"Hadith_Story_{int(time.time())}.mp4"}
                      folder = os.environ.get("DRIVE_STORY_FOLDER_ID")
                      if folder:
                          meta["parents"] = [folder]
                      uploaded = service.files().create(
                          body=meta,
                          media_body=MediaFileUpload(final, mimetype="video/mp4", resumable=True),
                          fields="id"
                      ).execute()
                      file_id = uploaded.get("id")
                      service.permissions().create(fileId=file_id, body={"type": "anyone", "role": "reader"}).execute()
                      link = f"https://drive.google.com/file/d/{file_id}/view"
                      R["drive"] = {"status": "ok", "link": link}
                      log("Drive", "ok", link)
              except Exception as e:
                  log("Drive", "skip", str(e)[:60])

              # Cleanup
              for f in ["s_raw.mp3", "s_clean.mp3", "s_v.mp3", "s_voice.mp3", "ambience.mp3", "bg.mp4"]:
                  if os.path.exists(f):
                      try:
                          os.remove(f)
                      except Exception:
                          pass
              shutil.rmtree("story_frames", ignore_errors=True)

              status = "COMPLETED" if not R["errors"] else "PARTIAL"
              send_report(status)
              print("🕌 Alhamdulillah. Done.")

          if __name__ == "__main__":
              try:
                  main()
              except SystemExit:
                  raise
              except Exception as e:
                  print(traceback.format_exc())
                  log_err(f"Fatal: {str(e)[:150]}")
                  send_report("FAILED", str(e)[:120])
                  sys.exit(1)
          PYEOF
          echo "Python script created successfully"

      - name: Run Generator
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          DRIVE_STORY_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          UPLOAD_TO_SOCIAL: ${{ inputs.upload_to_social }}
          DEPS_DIR: ${{ env.DEPS_DIR }}
          PIPER_DIR: ${{ env.DEPS_DIR }}/piper
        run: python scripts/story_video.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fb-story-video
          path: Final_FB_Story.mp4
          retention-days: 5
          if-no-files-found: ignore
