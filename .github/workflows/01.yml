# TRI-LINGUAL LINE DRAW
# ═══════════════════════════════════════════════════════════════════════════
def draw_trilingual_line(img, hindi_word, arabic_word, english_word, palette, fonts, alpha=255):
    try:
        d = ImageDraw.Draw(img)
        center_y = int(H * 0.55)
        col_x = [W * 0.18, W * 0.50, W * 0.82]
        items = [
            (hindi_word, fonts["hi"], col_x[0]),
            (arabic_word, fonts["ar"], col_x[1]),
            (english_word, fonts["en"], col_x[2]),
        ]
        for word, font, x in items:
            if not word: continue
            color = color_for_word(word)
            dot_r = 12
            d.ellipse(
                [x - 40 - dot_r, center_y - dot_r, x - 40 + dot_r, center_y + dot_r],
                fill=color + (alpha,))
            ef, eok = get_emoji_font(36)
            if eok:
                ec = emoji_for(word, _hash(word) % 100)
                try:
                    test = Image.new("RGBA", (100, 100), (0, 0, 0, 0))
                    ImageDraw.Draw(test).text((50, 50), ec,
                        fill=(255, 255, 255, 255), font=ef, anchor="mm")
                    bb = test.getbbox()
                    if bb and (bb[2]-bb[0]) > 15 and (bb[3]-bb[1]) > 15:
                        d.text((x - 40, center_y), ec,
                               fill=color + (alpha,), font=ef, anchor="mm")
                except Exception: pass
            d.text((x, center_y), word,
                   fill=tuple(palette["text"]) + (alpha,),
                   font=font, anchor="mm")
        return img
    except Exception as e:
        print(f"[TRI-LINE] {str(e)[:80]}")
        return img

