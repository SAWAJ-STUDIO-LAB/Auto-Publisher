    "\U0001F343","\U0001F31C",
]

def emoji_for(word, idx):
    wl = word.lower()
    kw = {
        "अल्लाह": "\U0001F54C", "allah": "\U0001F54C",
        "नबी": "\U0001F31F", "prophet": "\U0001F31F",
        "हदीस": "\U0001F4D6", "hadith": "\U0001F4D6",
        "दुआ": "\U0001F64F", "dua": "\U0001F64F",
        "ईमान": "\u2764", "iman": "\u2764",
        "जन्नत": "\u2728", "jannah": "\u2728",
        "नमाज़": "\U0001F54B", "namaz": "\U0001F54B",
        "रोज़ा": "\U0001F319", "roza": "\U0001F319",
        "सब्र": "\U0001F54A", "sabr": "\U0001F54A",
        "शुक्र": "\U0001F64C", "shukr": "\U0001F64C",
        "क़ुरआन": "\U0001F4D6", "quran": "\U0001F4D6",
    }
    for k, e in kw.items():
        if k in word or k in wl: return e
    return EMOJIS[idx % len(EMOJIS)]

def reveal(full, el, rate=0.28):
    """Word-by-word reveal synced with time."""
    ws = sanitize(full).split()
    if not ws: return ""
    n = max(0, min(len(ws), int(el / rate) + 1))
    return " ".join(ws[:n])

