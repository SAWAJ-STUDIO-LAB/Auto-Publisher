# ═══════════════════════════════════════════════════════════════════════════
# FACEBOOK STORY AUTOMATION WORKFLOW
# ─────────────────────────────────────────────────────────────────────────
# Purpose : Islamic Hadith Story Video Generate aur Upload karta hai.
# Trigger : Schedule (roz 5:00 AM IST / 23:30 UTC) ya Manual Dispatch
# Output  : Final_FB_Story.mp4 + Google Drive Link + Facebook Story Live
# ═══════════════════════════════════════════════════════════════════════════

name: "🔵 FACEBOOK STORY GENERATOR"

on:
  workflow_dispatch:
    inputs:
      upload_to_social:
        description: 'Upload to Facebook Story?'
        required: true
        type: boolean
        default: false

  schedule:
    - cron: '30 23 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: facebook-story
  cancel-in-progress: false

jobs:
  fb-story:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CACHE_VERSION: v6
      DEPS_DIR: ${{ github.workspace }}/.dependencies

    steps:
      # 1. Checkout Repository
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python 3.11
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Restore Master Dependencies Cache
      - name: 🗂️ Restore Master Dependencies Cache
        id: master-cache
        uses: actions/cache@v4
        with:
          path: |
            .dependencies
            ~/.cache/pip
            ~/.fonts
          key: ${{ runner.os }}-fb-story-master-${{ env.CACHE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-fb-story-master-

      # 4. Prepare Folders & System Tools
      - name: 🛠️ Install System Packages & Fonts
        run: |
          mkdir -p "$DEPS_DIR"/{bin,fonts,models,system-fonts,piper,logs}
          mkdir -p ~/.fonts

          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core fonts-noto-extra fonts-noto-ui-core fonts-noto-color-emoji

          # Download Noto Fonts for Hindi, Arabic, and Emoji support if not present
          if [ ! -f ~/.fonts/NotoSansDevanagari-Bold.ttf ]; then
            wget -q https://github.com/google/fonts/raw/main/ofl/notosansdevanagari/NotoSansDevanagari%5Bwdth%2Cwght%5D.ttf -O ~/.fonts/NotoSansDevanagari-Bold.ttf || true
          fi
          if [ ! -f ~/.fonts/NotoNaskhArabic-Bold.ttf ]; then
            wget -q https://github.com/google/fonts/raw/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf -O ~/.fonts/NotoNaskhArabic-Bold.ttf || true
          fi
          if [ ! -f ~/.fonts/NotoSans-Bold.ttf ]; then
            wget -q https://github.com/google/fonts/raw/main/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf -O ~/.fonts/NotoSans-Bold.ttf || true
          fi
          if [ ! -f ~/.fonts/NotoSans-Regular.ttf ]; then
            cp ~/.fonts/NotoSans-Bold.ttf ~/.fonts/NotoSans-Regular.ttf || true
          fi
          if [ ! -f ~/.fonts/NotoEmoji-Regular.ttf ]; then
            wget -q https://github.com/google/fonts/raw/main/ofl/notoemoji/NotoEmoji%5Bwght%5D.ttf -O ~/.fonts/NotoEmoji-Regular.ttf || true
          fi

          fc-cache -fv

      # 5. Install Python Libraries
      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mutagen pillow google-api-python-client google-auth-httplib2 google-auth-oauthlib edge-tts requests urllib3

      # 6. Generate Story_video.py script on-the-fly
      - name: 📝 Create Python Script (Story_video.py)
        run: |
          mkdir -p "Social media/Facebook"
          cat << 'EOF' > "Social media/Facebook/Story_video.py"
