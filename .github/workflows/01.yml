# ═══════════════════════════════════════════════════════════════════════════
# HIJRI DATE
# ═══════════════════════════════════════════════════════════════════════════
def hijri():
    try:
        d = datetime.utcnow()
        gy, gm, gd = d.year, d.month, d.day
        a = (14 - gm) // 12; y = gy + 4800 - a; m = gm + 12 * a - 3
        jdn = gd + (153 * m + 2) // 5 + 365 * y + y // 4 - y // 100 + y // 400 - 32045
        l = jdn - 1948440 + 10632; n = (l - 1) // 10631; l = l - 10631 * n + 354
        j = ((10985 - l) // 5316) * ((50 * l) // 17719) + (l // 5670) * ((43 * l) // 15238)
        l = l - ((30 - j) // 15) * ((17719 * j) // 50) - (j // 16) * ((15238 * j) // 43) + 29
        hm = (24 * l) // 709; hd = l - (709 * hm) // 24; hy = 30 * n + j - 30
        months = ["Muharram","Safar","Rabi al-Awwal","Rabi al-Thani",
                  "Jumada al-Awwal","Jumada al-Thani","Rajab","Shaban",
                  "Ramadan","Shawwal","Dhul Qadah","Dhul Hijjah"]
        mn = months[hm - 1] if 1 <= hm <= 12 else "?"
        return f"{hd} {mn} {hy} AH"
    except Exception: return ""

# ═══════════════════════════════════════════════════════════════════════════
# EMOJI FONT — ROBUST LOADER
# ═══════════════════════════════════════════════════════════════════════════
_EC = {}

def get_emoji_font(size=40):
    if size in _EC: return _EC[size]

    candidates = []
    candidates.append(os.path.expanduser("~/.fonts/NotoEmoji-Regular.ttf"))
    candidates.append(os.path.expanduser("~/.fonts/NotoEmoji-Bold.ttf"))
    if DEPS_DIR:
        candidates.append(os.path.join(DEPS_DIR, "fonts", "NotoEmoji-Regular.ttf"))
        candidates.append(os.path.join(DEPS_DIR, "fonts", "NotoEmoji-Bold.ttf"))
    candidates += [
        "/usr/share/fonts/truetype/noto/NotoEmoji-Regular.ttf",
        "/usr/share/fonts/truetype/noto/NotoEmoji-Bold.ttf",
        "/usr/share/fonts/truetype/noto-emoji/NotoEmoji-Regular.ttf",
        "/usr/share/fonts/noto-emoji/NotoEmoji-Regular.ttf",
    ]
    try:
        for pat in [
            os.path.expanduser("~/.fonts/*Emoji*.ttf"),
            os.path.expanduser("~/.fonts/*emoji*.ttf"),
            "/usr/share/fonts/**/*Emoji*.ttf",
            "/usr/share/fonts/**/*emoji*.ttf",
        ]:
            candidates += glob.glob(pat, recursive=True)
    except Exception: pass

    seen = set()
    uniq = []
    for p in candidates:
        if p and p not in seen:
            seen.add(p); uniq.append(p)

    print(f"[EMOJI] Testing {len(uniq)} paths")
    for p in uniq:
        if not os.path.exists(p): continue
        try:
            sz = os.path.getsize(p)
            if sz < 50000:
                print(f"[EMOJI] Too small ({sz}): {p}")
                continue
        except Exception: pass
        try:
            f = ImageFont.truetype(p, size)
            test_img = Image.new("RGBA", (100, 100), (0, 0, 0, 0))
            ImageDraw.Draw(test_img).text((50, 50), "\u2728",
                fill=(255, 255, 255, 255), font=f, anchor="mm")
            bbox = test_img.getbbox()
            if bbox and (bbox[2] - bbox[0]) > 10 and (bbox[3] - bbox[1]) > 10:
                _EC[size] = (f, True)
                R["es"]["emoji_path"] = p
                print(f"[EMOJI ✓] Loaded: {p} ({sz} bytes)")
                return (f, True)
            else:
                print(f"[EMOJI] Small render bbox={bbox}: {p}")
                _EC[size] = (f, True)
                R["es"]["emoji_path"] = p
                return (f, True)
        except Exception as e:
            print(f"[EMOJI ✗] {p}: {str(e)[:60]}")
            continue

    print(f"[EMOJI] Not found in {len(uniq)} paths")
    _EC[size] = (ImageFont.load_default(), False)
    return (ImageFont.load_default(), False)

def emoji_ok():
    try:
        font, loaded = get_emoji_font(60)
        if not loaded: return False
        ok = 0
        for ch in ["\u2728", "\u2764", "\U0001F54C", "\U0001F4D6"]:
            t = Image.new("RGBA", (100, 100), (0, 0, 0, 0))
            ImageDraw.Draw(t).text((50, 50), ch,
                fill=(255, 255, 255, 255), font=font, anchor="mm")
            bb = t.getbbox()
            if bb and (bb[2] - bb[0]) > 20 and (bb[3] - bb[1]) > 20:
                ok += 1
        return ok >= 2
    except Exception: return False

EMOJIS = [
    "\u2728","\u2B50","\u2764","\U0001F31F","\U0001F4AB","\U0001F54C",
    "\U0001F4D6","\U0001F64F","\U0001F31E","\U0001F319","\U0001F4A1",
