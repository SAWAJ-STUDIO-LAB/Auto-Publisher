# HADITH FETCH
# ═══════════════════════════════════════════════════════════════════════════
def fetch_hadith():
    bases = ["https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1",
             "https://raw.githubusercontent.com/fawazahmed0/hadith-api/1"]
    env_url = os.environ.get("HADITH_API_URL", "").strip()
    if env_url and "fawazahmed0" in env_url:
        bases.insert(0, env_url.rstrip("/"))
    recent = []
    try:
        if os.path.exists("recent_hadiths.json"):
            with open("recent_hadiths.json") as f: recent = json.load(f)
    except Exception: pass
    for attempt in range(50):
        book = random.choice(BOOKS)
        num = random.randint(1, max(1, book["max"] - 50))
        key = f"{book['eng']}:{num}"
        if key in recent[-30:]: continue
        for base in bases:
            try:
                url = f"{base}/editions/{book['eng']}/{num}.json"
                r = session.get(url, timeout=12)
                if r.status_code != 200: continue
                hs = r.json().get("hadiths", [])
                if not hs: continue
                eng = sanitize(hs[0].get("text", ""))
                if not (150 <= len(eng) <= 700): continue
                ara = ""
                try:
                    ar = session.get(f"{base}/editions/{book['ara']}/{num}.json",
                                    timeout=10)
                    if ar.status_code == 200:
                        ad = ar.json().get("hadiths", [])
                        if ad: ara = sanitize(ad[0].get("text",""))
                except Exception: pass
                recent.append(key); recent = recent[-50:]
                try:
                    with open("recent_hadiths.json","w") as f:
                        json.dump(recent, f)
                except Exception: pass
                R["hadith"] = {"collection": book["name"],
                    "number": str(hs[0].get("hadithnumber") or num),
                    "english": eng, "arabic": ara, "source": "fawazahmed0",
                    "attempts": attempt + 1, "chars": len(eng),
                    "grade": book.get("grade", "")}
                R["hadith_tier"] = "Tier 1 (fawazahmed0)"
                R["plat"]["hadith"] = f"fawazahmed0/{book['eng']}"
                print(f"[HADITH] {book['name']} #{num}")
                return R["hadith"]
            except Exception: continue
    log_warn("Hardcoded fallback")
    R["hadith"] = {"collection": "Sahih al-Bukhari", "number": "1",
        "english": "The reward of deeds depends upon the intentions.",
        "arabic": "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ",
        "source": "hardcoded", "attempts": 50, "chars": 60, "grade": "Sahih"}
    R["hadith_tier"] = "Tier 2 (hardcoded)"
    return R["hadith"]

