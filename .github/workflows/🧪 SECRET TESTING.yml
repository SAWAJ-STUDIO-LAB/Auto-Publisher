# ═══════════════════════════════════════════════════════════════════════════
# SECRET TESTING WORKFLOW
# ═══════════════════════════════════════════════════════════════════════════
# KAAM: Saare API keys aur secrets ko test karo.
#       Har service ko ping karo, status report banao.
#
# TRIGGER: Manual (GitHub Actions UI se)
# RUNTIME: ~30-60 seconds
# OUTPUT: Telegram par detailed report
# ═══════════════════════════════════════════════════════════════════════════

name: "🧪 SECRET TESTING"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ─────────────────────────────────────────────────────────────
      # STEP 1: Checkout
      # ─────────────────────────────────────────────────────────────
      - name: ✅ Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────
      # STEP 2: Python Setup
      # ─────────────────────────────────────────────────────────────
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ─────────────────────────────────────────────────────────────
      # STEP 3: Install dependencies
      # ─────────────────────────────────────────────────────────────
      - name: 📦 Install Dependencies
        run: |
          pip install --quiet requests

      # ─────────────────────────────────────────────────────────────
      # STEP 4: Run Secret Test
      # ─────────────────────────────────────────────────────────────
      - name: 🧪 Test All Secrets
        env:
          # ─── Telegram ───
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # ─── GitHub ───
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

          # ─── Google Drive ───
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GDRIVE_STORY_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}

          # ─── Facebook / Meta ───
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

          # ─── AI APIs ───
          OPENROUTER_API_KEY_AI: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY_AI: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY_AI: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY_AI: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY_AI: ${{ secrets.CEREBRAS_API_KEY_AI }}
          COHERE_API_KEY_AI: ${{ secrets.COHERE_API_KEY_AI }}
          HUGGINGFACE_API_KEY_AI: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

          # ─── Media ───
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}

          # ─── Extra ───
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

          # ─── Hadith ───
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
        run: |
          python3 << 'PYEOF'
import os, requests, json, time

# ─── Setup ───
TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
TG_CHAT = os.environ.get("TELEGRAM_CHAT_ID", "")

results = []
start_time = time.time()

def test(name, url, headers=None, method="GET", data=None):
    """Test a single API endpoint."""
    try:
        if method == "GET":
            r = requests.get(url, headers=headers or {}, timeout=15)
        else:
            r = requests.post(url, headers=headers or {}, data=data or {}, timeout=15)

        if r.status_code in [200, 201]:
            return True, r.status_code, "✅ Working"
        elif r.status_code in [401, 403]:
            return False, r.status_code, f"❌ Auth failed"
        elif r.status_code == 404:
            return False, r.status_code, f"❌ Not found"
        else:
            return False, r.status_code, f"⚠️ Status {r.status_code}"
    except Exception as e:
        return False, 0, f"❌ {str(e)[:50]}"

# ─── Test 1: Telegram ───
print("Testing Telegram...")
ok, code, msg = test("telegram",
    f"https://api.telegram.org/bot{TG_TOKEN}/getMe")
results.append(("Telegram Bot", "TELEGRAM_BOT_TOKEN", ok, msg))

# ─── Test 2: GitHub ───
print("Testing GitHub...")
gh = os.environ.get("TOKEN_GITHUB", "")
ok, code, msg = test("github",
    "https://api.github.com/user",
    headers={"Authorization": f"token {gh}"})
results.append(("GitHub API", "TOKEN_GITHUB", ok, msg))

# ─── Test 3: OpenRouter ───
print("Testing OpenRouter...")
or_key = os.environ.get("OPENROUTER_API_KEY_AI", "")
ok, code, msg = test("openrouter",
    "https://openrouter.ai/api/v1/models",
    headers={"Authorization": f"Bearer {or_key}"})
results.append(("OpenRouter", "OPENROUTER_API_KEY_AI", ok, msg))

# ─── Test 4: Groq ───
print("Testing Groq...")
gr_key = os.environ.get("GROQ_API_KEY_AI", "")
ok, code, msg = test("groq",
    "https://api.groq.com/openai/v1/models",
    headers={"Authorization": f"Bearer {gr_key}"})
results.append(("Groq", "GROQ_API_KEY_AI", ok, msg))

# ─── Test 5: Gemini ───
print("Testing Gemini...")
gm_key = os.environ.get("GEMINI_API_KEY_AI", "")
ok, code, msg = test("gemini",
    f"https://generativelanguage.googleapis.com/v1beta/models?key={gm_key}")
results.append(("Gemini", "GEMINI_API_KEY_AI", ok, msg))

# ─── Test 6: Mistral ───
print("Testing Mistral...")
mi_key = os.environ.get("MISTRAL_API_KEY_AI", "")
ok, code, msg = test("mistral",
    "https://api.mistral.ai/v1/models",
    headers={"Authorization": f"Bearer {mi_key}"})
results.append(("Mistral", "MISTRAL_API_KEY_AI", ok, msg))

# ─── Test 7: Cerebras ───
print("Testing Cerebras...")
ce_key = os.environ.get("CEREBRAS_API_KEY_AI", "")
ok, code, msg = test("cerebras",
    "https://api.cerebras.ai/v1/models",
    headers={"Authorization": f"Bearer {ce_key}"})
results.append(("Cerebras", "CEREBRAS_API_KEY_AI", ok, msg))

# ─── Test 8: Cohere ───
print("Testing Cohere...")
co_key = os.environ.get("COHERE_API_KEY_AI", "")
ok, code, msg = test("cohere",
    "https://api.cohere.ai/v1/models",
    headers={"Authorization": f"Bearer {co_key}"})
results.append(("Cohere", "COHERE_API_KEY_AI", ok, msg))

# ─── Test 9: HuggingFace ───
print("Testing HuggingFace...")
hf_key = os.environ.get("HUGGINGFACE_API_KEY_AI", "")
ok, code, msg = test("huggingface",
    "https://huggingface.co/api/whoami-v2",
    headers={"Authorization": f"Bearer {hf_key}"})
results.append(("HuggingFace", "HUGGINGFACE_API_KEY_AI", ok, msg))

# ─── Test 10: Jina ───
print("Testing Jina...")
jn_key = os.environ.get("JINA_API_KEY", "")
ok, code, msg = test("jina",
    "https://api.jina.ai/v1/embeddings",
    headers={"Authorization": f"Bearer {jn_key}"},
    method="POST",
    data={"input": ["test"], "model": "jina-embeddings-v2-base-en"})
results.append(("Jina AI", "JINA_API_KEY", ok, msg))

# ─── Test 11: Pexels ───
print("Testing Pexels...")
px_key = os.environ.get("PEXELS_API_KEY", "")
ok, code, msg = test("pexels",
    "https://api.pexels.com/v1/search?query=test&per_page=1",
    headers={"Authorization": px_key})
results.append(("Pexels", "PEXELS_API_KEY", ok, msg))

# ─── Test 12: Pixabay ───
print("Testing Pixabay...")
pb_key = os.environ.get("PIXABAY_API_KEY", "")
ok, code, msg = test("pixabay",
    f"https://pixabay.com/api/?key={pb_key}&q=test&per_page=3")
results.append(("Pixabay", "PIXABAY_API_KEY", ok, msg))

# ─── Test 13: Freesound ───
print("Testing Freesound...")
fs_key = os.environ.get("FREESOUND_API_KEY", "")
ok, code, msg = test("freesound",
    f"https://freesound.org/apiv2/search/text/?query=rain&token={fs_key}")
results.append(("Freesound", "FREESOUND_API_KEY", ok, msg))

# ─── Test 14: ElevenLabs ───
print("Testing ElevenLabs...")
el_key = os.environ.get("ELEVENLABS_API_KEY", "")
ok, code, msg = test("elevenlabs",
    "https://api.elevenlabs.io/v1/user",
    headers={"xi-api-key": el_key})
results.append(("ElevenLabs", "ELEVENLABS_API_KEY", ok, msg))

# ─── Test 15: DeepL ───
print("Testing DeepL...")
dl_key = os.environ.get("DEEPL_API_KEY", "")
ok, code, msg = test("deepl",
    "https://api-free.deepl.com/v2/usage",
    headers={"Authorization": f"DeepL-Auth-Key {dl_key}"})
results.append(("DeepL", "DEEPL_API_KEY", ok, msg))

# ─── Test 16: Google Drive Folder ID ───
print("Testing Google Drive Folder...")
gd_folder = os.environ.get("GDRIVE_STORY_VIDEO_FOLDER_ID", "")
if gd_folder:
    results.append(("GDrive Story Folder ID", "GDRIVE_STORY_VIDEO_FOLDER_ID", True, "✅ Present"))
else:
    results.append(("GDrive Story Folder ID", "GDRIVE_STORY_VIDEO_FOLDER_ID", False, "❌ Missing"))

# ─── Test 17: Facebook Page ID ───
print("Testing Facebook Page ID...")
fb_page = os.environ.get("FACEBOOK_PAGE_ID", "")
if fb_page:
    results.append(("Facebook Page ID", "FACEBOOK_PAGE_ID", True, "✅ Present"))
else:
    results.append(("Facebook Page ID", "FACEBOOK_PAGE_ID", False, "❌ Missing"))

# ─── Test 18: Hadith URL ───
print("Testing Hadith URL...")
hd_url = os.environ.get("HADITH_API_URL", "")
ok, code, msg = test("hadith",
    hd_url)
results.append(("Hadith API URL", "HADITH_API_URL", ok, msg))

# ─── Summary ───
total = len(results)
passed = sum(1 for r in results if r[2])
failed = total - passed
elapsed = time.time() - start_time

# ─── Build Telegram report ───
lines = [
    "⚡ <b>SAWAJSTUDIO SECRET TEST REPORT</b> ⚡",
    "━━━━━━━━━━━━━━━━━━━━━━",
    f"📊 <b>Total Tested:</b> {total}",
    f"🟢 <b>Working:</b> {passed}",
    f"🔴 <b>Failed:</b> {failed}",
    f"⏱ <b>Speed:</b> {elapsed:.2f}s",
    "━━━━━━━━━━━━━━━━━━━━━━",
    "",
]

for name, key, ok, msg in results:
    icon = "🟢" if ok else "🔴"
    lines.append(f"{icon} <b>{name}</b>")
    lines.append(f"   <code>{key}</code> — {msg}")
    lines.append("")

lines.append("━━━━━━━━━━━━━━━━━━━━━━")
if failed == 0:
    lines.append("✅ <b>ALL SYSTEMS OPERATIONAL</b> 🚀")
else:
    lines.append(f"⚠️ <b>{failed} SECRET(S) NEED ATTENTION</b>")

report = "\n".join(lines)

# ─── Print to console ───
print(report)

# ─── Send to Telegram ───
if TG_TOKEN and TG_CHAT:
    try:
        url = f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage"
        r = requests.post(url, data={
            "chat_id": TG_CHAT,
            "text": report,
            "parse_mode": "HTML",
        }, timeout=30)
        print(f"\n📱 Telegram sent: {r.status_code}")
    except Exception as e:
        print(f"❌ Telegram error: {e}")
else:
    print("⚠️ Telegram credentials missing")

# ─── Exit code ───
import sys
sys.exit(0 if failed == 0 else 1)
PYEOF

      # ─────────────────────────────────────────────────────────────
      # STEP 5: Summary
      # ─────────────────────────────────────────────────────────────
      - name: 📊 Summary
        if: always()
        run: |
          echo "✅ Secret testing complete!"
          echo "📱 Check Telegram for detailed report."
