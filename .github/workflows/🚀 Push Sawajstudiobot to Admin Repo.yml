name: 🚀 Push Sawajstudiobot to Admin Repo

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: '📝 Commit Message (Optional)'
        required: false
        default: '🤖 Auto-sync sawajstudiobot folder'

permissions:
  contents: write

jobs:
  sync-to-admin:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Current Repository
        uses: actions/checkout@v4

      - name: 🔍 Verify Source Folder
        run: |
          if [ ! -d "sawajstudiobot" ]; then
            echo "❌ Error: 'sawajstudiobot' folder nahi mila repository me!"
            exit 1
          fi
          echo "✅ 'sawajstudiobot' folder found successfully."

      - name: 📂 Sync and Push to Admin Repository
        env:
          GITHUB_SECRET_TOKEN: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}
          CUSTOM_COMMIT_MSG: ${{ inputs.commit_message }}
        run: |
          # Standard GitHub Actions Bot configuration
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "📥 Cloning target admin repository..."
          git clone https://x-access-token:${GITHUB_SECRET_TOKEN}@github.com/SAWAJ-STUDIO-LAB/admin.git admin-repo

          echo "🔄 Syncing files using rsync (Safe & Clean)..."
          mkdir -p admin-repo/sawajstudiobot
          
          # rsync uses fast & safe differential updates instead of rm -rf
          rsync -av --delete --exclude='.git' sawajstudiobot/ admin-repo/sawajstudiobot/

          cd admin-repo
          git add sawajstudiobot

          if git diff --cached --quiet; then
            echo "ℹ️ No changes detected in sawajstudiobot folder. Nothing to commit."
            echo "STATUS=no_changes" >> $GITHUB_ENV
          else
            git commit -m "$CUSTOM_COMMIT_MSG"
            git push origin main
            echo "✅ Successfully pushed sawajstudiobot to SAWAJ-STUDIO-LAB/admin!"
            echo "STATUS=success" >> $GITHUB_ENV
          fi

      - name: 📋 Summary Report
        if: always()
        run: |
          echo "### 🚀 Sync Status Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Folder:** \`sawajstudiobot\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Repo:** \`SAWAJ-STUDIO-LAB/admin\`" >> $GITHUB_STEP_SUMMARY
          if [ "$STATUS" = "success" ]; then
            echo "- **Result:** ✅ Successfully updated and pushed!" >> $GITHUB_STEP_SUMMARY
          elif [ "$STATUS" = "no_changes" ]; then
            echo "- **Result:** ℹ️ Already up to date (No new changes found)." >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Result:** ❌ Sync failed or canceled." >> $GITHUB_STEP_SUMMARY
          fi
